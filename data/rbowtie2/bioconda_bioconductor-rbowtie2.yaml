about:
  description: This package provides an R wrapper of the popular bowtie2 sequencing
    reads aligner and AdapterRemoval, a convenient tool for rapid adapter trimming,
    identification, and read merging. The package contains wrapper functions that
    allow for genome indexing and alignment to those indexes. The package also allows
    for the creation of .bam files via Rsamtools.
  doc_url: https://bioconductor.org/packages/3.23/bioc/html/Rbowtie2.html
  home: https://bioconductor.org/packages/3.23/bioc/html/Rbowtie2.html
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: /lib/R/share/licenses/GPL-3
  summary: An R Wrapper for Bowtie2 and AdapterRemoval.
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:rbowtie2
package:
  name: bioconductor-rbowtie2
  version: 2.18.0
requirements:
  build:
  - null
  - null
  - null
  - make
  host:
  - bioconductor-rsamtools >=2.26.0,<2.27.0
  - r-base
  - r-magrittr
  - libblas
  - liblapack
  - zlib
  - liblzma-devel
  run:
  - bioconductor-rsamtools >=2.26.0,<2.27.0
  - r-base
  - r-magrittr
source:
  patches:
  - 0001-Makefile.patch
  sha256: cffe3d8151c038a7246940797c1b6115e6909f3365e5d1c8750928bfb30a2fa7
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Rbowtie2_2.18.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/Rbowtie2/Rbowtie2_2.18.0.tar.gz
  - https://bioarchive.galaxyproject.org/Rbowtie2_2.18.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-rbowtie2/bioconductor-rbowtie2_2.18.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('Rbowtie2')"
