about:
  description: Minimac4 is a lower memory and more computationally efficient implementation
    of the genotype imputation algorithms in minimac/mininac2/minimac3.
  dev_url: https://github.com/statgen/Minimac4
  doc_url: https://genome.sph.umich.edu/wiki/Minimac4_Documentation
  home: https://github.com/statgen/Minimac4
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Computationally efficient genotype imputation.
build:
  number: 2
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:minimac4
package:
  name: minimac4
  version: 4.1.6
requirements:
  build:
  - make
  - cmake <4
  - pkg-config
  - null
  - null
  - null
  - python <3.14
  - cget
  host:
  - bcftools >=1.20
  - zlib
  - savvy ==2.2.0
  - xz
  run:
  - python <3.14
  - cget
source:
  sha256: 0bce8d6edbf5d5d944b19c4e36403d0bc1d18f2d6003d88e01086488c3eb9333
  url: https://github.com/statgen/Minimac4/archive/refs/tags/v4.1.6.tar.gz
test:
  commands:
  - minimac4 --help
  - minimac4 --version
