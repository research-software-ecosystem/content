about:
  home: https://github.com/instadeepai/winnow
  license: Apache-2.0
  license_file: LICENSE.md
  summary: Score calibration and false discovery estimation for de novo peptide sequencing.
build:
  entry_points:
  - winnow = winnow.scripts.main:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - biotools:winnow
  - doi:10.48550/arXiv.2509.24952
  recipe-maintainers:
  - BioGeek
  - JemmaLDaniel
package:
  name: winnow-fdr
  version: 2.0.0
requirements:
  host:
  - python >=3.10,<3.14
  - setuptools
  - pip
  run:
  - python >=3.10,<3.14
  - koinapy >=0.0.10
  - tomli >=2.2.1
  - typer >=0.15.2
  - instanovo >=1.1.4
  - huggingface_hub >=0.35.3
  - hydra-core >=1.3.2
  - matchms >=0.31.0
  - scikit-learn >=1.3.0
  - matplotlib-base >=3.7.0
  - pytorch >=2.6,<2.9
  - pytorch >=2.6,<2.8
  - safetensors >=0.7.0
  - polars >=1.39.3
  - biopython >=1.87
  - pyahocorasick >=2.3.1
source:
  sha256: 08835b95edefb478ad03ad8bb58968facee15d581e7e93cc8c89b9928ec89d15
  url: https://pypi.org/packages/source/w/winnow-fdr/winnow_fdr-2.0.0.tar.gz
test:
  commands:
  - winnow --help
  - python -c "from urllib.request import urlretrieve; urlretrieve('https://raw.githubusercontent.com/instadeepai/winnow/b4fd2e320922d9fa357c5a4766b25ad5f485b702/examples/example_data/spectra.mgf',
    'spectra.mgf')"
  - python -c "from urllib.request import urlretrieve; urlretrieve('https://raw.githubusercontent.com/instadeepai/winnow/b4fd2e320922d9fa357c5a4766b25ad5f485b702/examples/example_data/predictions.csv',
    'predictions.csv')"
  - winnow train dataset.spectrum_path_or_directory=spectra.mgf dataset.predictions_path=predictions.csv
    model_output_dir=models/new_model dataset_output_path=results/calibrated_dataset.csv
    calibrator.features.retention_time_feature.train_fraction=0.3 calibrator.features.retention_time_feature.min_train_points=2
    calibrator.hidden_dims="[32, 16]" calibrator.n_iter_no_change=100 calibrator.max_epochs=100
  - winnow predict calibrator.pretrained_model_name_or_path=models/new_model fdr_control.fdr_threshold=1.0
    dataset.spectrum_path_or_directory=spectra.mgf dataset.predictions_path=predictions.csv
  - test -f results/calibrated_dataset.csv
  - rm -rf models results spectra.mgf predictions.csv
  imports:
  - winnow
  requires:
  - python
