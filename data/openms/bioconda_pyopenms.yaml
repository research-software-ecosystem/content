about:
  dev_url: https://github.com/OpenMS/OpenMS
  doc_url: https://openms.readthedocs.io/en/latest
  home: https://github.com/OpenMS/OpenMS
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python bindings for OpenMS, an open-source software C++ library for LC-MS
    data management and analyses.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  identifiers:
  - biotools:openms
  - doi:10.1038/s41592-024-02197-7
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: pyopenms
  version: 3.5.0
requirements:
  build:
  - null
  - ninja
  - cmake
  host:
  - python
  - pip <25.3
  - setuptools <81
  - wheel
  - cython >=3.2
  - libopenms ==3.5.0
  - autowrap >=0.24.0,<0.25
  - libboost-headers
  - numpy >=2.0
  - pandas
  - matplotlib-base
  - pytest
  - eigen >=3.4.1
  - libarrow =21
  - libparquet
  run:
  - python
  - libopenms ==3.5.0
  - numpy >=2.0
  - pandas
  - matplotlib-base
source:
  sha256: 29ddff876b6f7e604edca962cbd2f57fe2467262db4b4f039aa43148589f2dbd
  url: https://github.com/OpenMS/OpenMS/releases/download/release%2F3.5.0/OpenMS-3.5.0.tar.gz
test:
  commands:
  - python -c "import pyopenms; print(pyopenms.__version__)"
