about:
  description: Functions that are needed by many other packages or which replace R
    functions.
  home: https://bioconductor.org/packages/3.23/bioc/html/Biobase.html
  license: Artistic-2.0
  summary: 'Biobase: Base functions for Bioconductor'
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:biobase
package:
  name: bioconductor-biobase
  version: 2.72.0
requirements:
  build:
  - null
  - null
  - make
  host:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - r-base
  - libblas
  - liblapack
  - zlib
  - liblzma-devel
  run:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - r-base
source:
  md5: b3b23749597ddfccf0daeee65d1ec8f8
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Biobase_2.72.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/Biobase/Biobase_2.72.0.tar.gz
  - https://bioarchive.galaxyproject.org/Biobase_2.72.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-biobase/bioconductor-biobase_2.72.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('Biobase')"
