about:
  dev_url: https://github.com/RECETOX/MSMetaEnhancer
  doc_url: https://msmetaenhancer.readthedocs.io
  home: https://github.com/RECETOX/MSMetaEnhancer
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: MSMetaEnhancer is a Python tool that adds more annotations (e.g. SMILES,
    InChI, CAS number) to MSP files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  identifiers:
  - biotools:msmetaenhancer
  - doi:10.21105/joss.04494
  recipe-maintainers:
  - xtrojak
  - martenson
  - hechth
package:
  name: msmetaenhancer
  version: 0.7.0
requirements:
  host:
  - python >=3.10,<3.14
  - uv-build >=0.13.5,<0.14
  - pip
  run:
  - python >=3.10,<3.14
  - matchms >=0.30.0
  - pandas >=2.2.1,<3.0
  - scipy >=1.12.0,<2.0
  - requests >=2.31.0,<3.0
  - aiohttp >=3.9.3,<4.0
  - asyncstdlib >=3.12.0,<4.0
  - frozendict >=2.4.0,<3.0
  - twine >=5.0.0,<6.0
  - tabulate >=0.9.0,<0.10.0
  - rdkit >=2024.3.5,<2025.0.0
  - multidict >=6.0.5,<7.0
  - aiocircuitbreaker >=2.0.0,<3.0
  - openpyxl >=3.1.2,<4.0
source:
  sha256: bd90875139f31b39dbcc078cebae2412aa114d7a51956227187148414335468d
  url: https://pypi.io/packages/source/m/msmetaenhancer/msmetaenhancer-0.7.0.tar.gz
test:
  imports:
  - MSMetaEnhancer
