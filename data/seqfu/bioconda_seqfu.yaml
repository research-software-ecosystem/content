about:
  description: 'A collection of utilities to work with FASTX (FASTA or FASTQ) files

    that accept gzipped input.

    Tools to interleave and deinterleave, to calculate stats, and extract

    portions of sequence datasets.

    '
  docs: https://corebio.info/seqfu_v1
  home: https://github.com/quadram-institute-bioscience/seqfu_v1
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: DNA sequence utilities.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:seqfu
  - doi:10.3390/bioengineering8050059
  recipe-maintainers:
  - telatin
package:
  name: seqfu
  version: 1.30.3
requirements:
  build:
  - null
  - null
  - null
  - nim >=2.2.0
  - make
  - pkg-config
  - coreutils
  host:
  - curl
  - pcre
  - zlib
  run:
  - pcre
source:
  sha256: fed295c65d16821cda7440e9a41035c9bf737d1c3c6e91ea306e58d08bdbb5bf
  url: https://github.com/quadram-institute-bioscience/seqfu_v1/archive/refs/tags/v1.30.3.tar.gz
test:
  commands:
  - seqfu
  - seqfu stats --help
  - seqfu --version
  - seqfu --version | grep '1.30.3'
