about:
  dev_url: https://rseqc.sourceforge.net
  doc_url: https://rseqc.sourceforge.net/#usage-information
  home: https://rseqc.sourceforge.net
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Quality control package for RNA-seq data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - biotools:rseqc
  - doi:10.1093/bioinformatics/bts356
package:
  name: rseqc
  version: 5.0.6
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools <82
  run:
  - python >=3.9
  - setuptools <82
  - r-base
  - bx-python
  - numpy
  - pybigwig
  - pysam
  - logomaker
source:
  sha256: b361a45ef4a9bb90e926d19abc7801b840897ccad4627f41750972d8cf18cad7
  url: https://pypi.org/packages/source/r/rseqc/rseqc-5.0.6.tar.gz
test:
  commands:
  - Rscript --help
  imports:
  - qcmodule
  - qcmodule.SAM
