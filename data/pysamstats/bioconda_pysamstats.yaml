about:
  details: 'A Python utility for calculating statistics against genome position based

    on sequence alignments from a SAM, BAM or CRAM file.

    '
  home: https://github.com/alimanfoo/pysamstats
  license: MIT
  license_file: LICENSE
  summary: Calculate read mapping stats from SAM/BAM/CRAM
build:
  number: 1
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:pysamstats
package:
  name: pysamstats
  version: 1.2.0
requirements:
  build:
  - null
  - null
  host:
  - python
  - pip
  - setuptools >=77
  - cython >=3.1
  - pysam >=0.24.1,<0.25
  run:
  - python
  - null
  - numpy >=2.0
  - pytables
source:
  sha256: 2913f0c18b35feb89196aaa50227290574fd4a8679d5e99e72eeadece91a8bcb
  url: https://github.com/alimanfoo/pysamstats/archive/refs/tags/v1.2.0.tar.gz
test:
  commands:
  - pysamstats --help
  imports:
  - pysamstats
  - pysamstats.opt
