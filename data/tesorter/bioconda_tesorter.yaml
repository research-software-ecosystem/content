about:
  description: 'TEsorter2 classifies transposable elements to Order, Superfamily and

    Clade from conserved protein domains, as TEsorter does, with faster

    in-process searches, a staged nail/HMMER/BATH cascade for degraded

    copies, multi-database reconciliation and a genome mode. The

    `TEsorter` command is the same program and accepts TEsorter''s

    arguments, so existing TEsorter commands run TEsorter2; `--legacy`

    runs TEsorter''s original single-database pipeline.

    '
  dev_url: https://github.com/KGerhardt/TEsorter2
  doc_url: https://github.com/KGerhardt/TEsorter2/blob/v2.0.0/README.md
  home: https://github.com/KGerhardt/TEsorter2
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Fast, divergence-robust classification of transposable elements from conserved
    protein domains (TEsorter2).
build:
  entry_points:
  - TEsorter = tesorter2.pipeline:main
  - TEsorter2 = tesorter2.pipeline:main
  - tesorter2 = tesorter2.pipeline:main
  - tesorter2-emit = tesorter2.emit:main
  - tesorter2-subset = tesorter2.subset:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  identifiers:
  - doi:10.1093/hr/uhac017
  - biotools:TEsorter
package:
  name: tesorter
  version: 2.0.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=61
  run:
  - python >=3.9
  - pyhmmer >=0.10
  - pyfastx
  - numpy
  - hmmer
  - rmblast
  - minimap2
  - nail
  - bath
source:
  sha256: 69045eabfc437b955d4302782dbfbcda8b63925bb978aab40d179e733d9f131a
  url: https://github.com/KGerhardt/TEsorter2/archive/refs/tags/v2.0.0.tar.gz
test:
  imports:
  - tesorter2
