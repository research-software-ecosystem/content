about:
  description: 'PLINK 1.9 is a whole-genome association analysis toolset, a faster
    and

    more scalable replacement for PLINK 1.07 working on .bed/.bim/.fam

    filesets.

    '
  dev_url: https://github.com/chrchang/plink-ng
  doc_url: https://www.cog-genomics.org/plink/1.9
  home: https://www.cog-genomics.org/plink/1.9
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: 1.9/LICENSE
  summary: Whole genome association analysis toolset (PLINK 1.9).
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1186/s13742-015-0047-8
  - biotools:plink
  - usegalaxy-eu:plink
package:
  name: plink
  version: '1.9'
requirements:
  build:
  - null
  - null
  - null
  - make
  host:
  - zlib
  - openblas
  run:
  - libopenblas
source:
  sha256: 07f74f8c588e9cdc95f60b3b665976852e27db1f188a3bb75ff5ff4cba075d9d
  url: https://github.com/chrchang/plink-ng/archive/refs/tags/v1.9.0.tar.gz
test:
  commands:
  - plink --version | grep "PLINK v1.9.0"
  - plink --dummy 200 500 --out dummy
  - plink --bfile dummy --maf 0.05 --freq --pca 2 --out out
  - test -s out.frq
  - test -s out.eigenvec
