about:
  dev_url: https://github.com/hhuili/abPOA
  home: https://github.com/hhuili/abPOA
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - include/simde/COPYING
  summary: TeloXplorer-maintained abPOA fork with 128-character ASCII alignment support
build:
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517
    -vvv
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1093/bioinformatics/btaa963
  - biotools:abpoa
  recipe-maintainers:
  - hhuili
package:
  name: telox-pyabpoa
  version: 1.5.6.post1
requirements:
  build:
  - null
  - null
  host:
  - python
  - pip
  - setuptools
  - cython
  - zlib
  run:
  - python
source:
  sha256: f8a96a6562b6a5e4026b1281a124ba79edfdb06a74184af7ebec6cd34e0aefef
  url: https://github.com/hhuili/abPOA/releases/download/v1.5.6.post1/telox_pyabpoa-1.5.6.post1.tar.gz
test:
  commands:
  - python -c "import telox_pyabpoa as p; a = p.msa_aligner(is_ascii=True); r = a.msa(['A@%Z',
    'A@%Z'], out_cons=True, out_msa=False); assert r.cons_seq == ['A@%Z']"
  imports:
  - telox_pyabpoa
