about:
  dev_url: https://github.com/broadinstitute/CellBender
  doc_url: https://cellbender.readthedocs.io/en/latest
  home: https://github.com/broadinstitute/CellBender
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A software package for eliminating technical artifacts from high-throughput
    single-cell RNA sequencing (scRNA-seq) data.
build:
  entry_points:
  - cellbender = cellbender.base_cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - biotools:CellBender
  - doi:10.1038/s41592-023-01943-7
  recipe-maintainers:
  - mencian
package:
  name: cellbender
  version: 0.4.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61.2
  - setuptools-git-versioning >=2.0
  run:
  - python >=3.10
  - numpy
  - scipy
  - pytables
  - pandas
  - pyro-ppl >=1.8.4
  - pytorch
  - matplotlib-base
  - anndata >=0.9
  - ipython
  - ipykernel
  - nbconvert
  - lxml-html-clean
  - psutil
  - dill >0.3.1
source:
  sha256: 4e25735f04047fffee68e7082c0471f89ffe0ac28a9f2a90481098503e07b40a
  url: https://github.com/broadinstitute/CellBender/archive/v0.4.0.tar.gz
test:
  commands:
  - cellbender --help
  imports:
  - cellbender
