about:
  description: Contains data and functions that define and allow translation between
    different chromosome sequence naming conventions (e.g., "chr1" versus "1"), including
    a function that attempts to place sequence names in their natural, rather than
    lexicographic, order.
  home: https://bioconductor.org/packages/3.23/bioc/html/GenomeInfoDb.html
  license: Artistic-2.0
  summary: Utilities for manipulating chromosome names, including modifying them to
    follow a particular naming style
build:
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
extra:
  identifiers:
  - biotools:genomeinfodb
  - doi:10.1038/nmeth.3252
  parent_recipe:
    name: bioconductor-genomeinfodb
    path: recipes/bioconductor-genomeinfodb
    version: 1.16.0
package:
  name: bioconductor-genomeinfodb
  version: 1.48.0
requirements:
  host:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-iranges >=2.46.0,<2.47.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - bioconductor-seqinfo >=1.2.0,<1.3.0
  - bioconductor-ucsc.utils >=1.8.0,<1.9.0
  - r-base
  run:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-iranges >=2.46.0,<2.47.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - bioconductor-seqinfo >=1.2.0,<1.3.0
  - bioconductor-ucsc.utils >=1.8.0,<1.9.0
  - r-base
source:
  md5: a2a1c79535a195453468244d738b17da
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/GenomeInfoDb_1.48.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/GenomeInfoDb/GenomeInfoDb_1.48.0.tar.gz
  - https://bioarchive.galaxyproject.org/GenomeInfoDb_1.48.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-genomeinfodb/bioconductor-genomeinfodb_1.48.0_src_all.tar.gz
test:
