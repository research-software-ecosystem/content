about:
  dev_url: https://github.com/deeptools/HiCExplorer
  doc_url: https://hicexplorer.readthedocs.io
  home: https://github.com/deeptools/HiCExplorer
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - cpp/THIRD_PARTY_NOTICES.md
  - cpp/third_party/spectra/LICENSE
  summary: Set of programs to process, analyze and visualize Hi-C and capture Hi-C
    data
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1093/nar/gky504
  - doi:10.1093/nar/gkaa220
  - doi:10.1093/gigascience/giac061
  - usegalaxy-eu:hicexplorer_hicplotviewpoint
  - biotools:hicexplorer
  recipe-maintainers:
  - joachimwolff
package:
  name: hicexplorer
  version: 4.0.0
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.24,<5
  - ninja >=1.11,<2
  host:
  - python
  - pip
  - scikit-build-core >=1.1,<2
  - pybind11 ==2.13.6
  - libboost-headers 1.85.*
  - eigen >=3.4,<3.5
  - hdf5 >=1.14.3,<1.15
  - blosc >=1.21.6,<1.22
  - zlib >=1.2.13,<2
  - htslib >=1.23.1,<1.25
  - libblas >=3.9,<4
  - libcblas >=3.9,<4
  - liblapack >=3.9,<4
  - libbigwig >=0.4.8,<0.5
  run:
  - python >=3.11,<3.13
  - numpy >=1.23,<3
  - scipy >=1.10,<2
  - matplotlib-base >=3.8,<4
  - intervaltree >=3.1,<4
  - pandas >=2.0,<3
  - unidecode >=1.3,<2
  - hicmatrix >=17,<18
  - c-blosc2 >=2.15,<3.4.1
  - hyperopt >=0.2.7,<0.4
  - python-graphviz >=0.20,<1
  - graphviz >=13,<15
source:
  sha256: 5f6cc2b7abe3d5d296a8853aad0be0bd4db5a137554a1e29d85bb7b46b0d9e23
  url: https://github.com/deeptools/HiCExplorer/archive/4.0.0.tar.gz
test:
  commands:
  - hicexplorer > /dev/null
  - hicInfo --version
  - hicBuildMatrix --version
  - hicCorrectMatrix --version
  - hicConvertFormat --version
  - hicFindTADs --version
  - hicDetectLoops --version
  - hicPlotMatrix --version
  - chicChicagoScores --version
  - hicHyperoptDetectLoops --help > /dev/null
  - test -d "${PREFIX}/share/hicexplorer/plot/hicexplorer_plot"
  imports:
  - hicexplorer
  - hicexplorer._hicx
  - tables
