about:
  dev_url: https://github.com/galaxyproject/galaxy
  doc_url: https://docs.galaxyproject.org
  home: https://galaxyproject.org
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Galaxy job execution runtime utilities.
build:
  entry_points:
  - galaxy-set-metadata=galaxy.metadata.set_metadata:set_metadata
  - galaxy-container-monitor=galaxy.job_execution.container_monitor:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - biotools:galaxy
  - doi:10.1093/nar/gky379
  recipe-maintainers:
  - bernt-matthias
  - natefoo
  - nsoranzo
package:
  name: galaxy-job-execution
  version: 26.1.1
requirements:
  host:
  - pip
  - python
  - setuptools
  - setuptools-scm >=8
  run:
  - python >=
  - galaxy-data >=26.1
  - galaxy-files >=26.1
  - galaxy-objectstore >=26.1
  - galaxy-tool-util >=26.1
  - galaxy-util >=26.1
  - markupsafe
  - sqlalchemy >=2.0,<2.1
source:
  sha256: fce91c1c8111ec97728104e749ed7ae3f190f9053f68b67ccbb0ef87ef30dce7
  url: https://pypi.io/packages/source/g/galaxy-job-execution/galaxy_job_execution-26.1.1.tar.gz
test:
  imports:
  - galaxy
  - galaxy.job_execution
  - galaxy.metadata
