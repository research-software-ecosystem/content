about:
  description: 'VarDictRust is an ultra-fast, memory-safe, idiomatic-Rust variant
    caller

    producing 100% parity against VarDictJava v1.8.3 across germline, somatic,

    and amplicon sequencing assays, scaling to deep whole-genome sequencing (WGS).

    '
  dev_url: https://github.com/palakpsheth/VarDictRust
  doc_url: https://github.com/palakpsheth/VarDictRust
  home: https://github.com/palakpsheth/VarDictRust
  license: MIT AND GPL-2.0-or-later
  license_family: GPL2
  license_file:
  - LICENSE
  - LICENSE-3RD-PARTY
  - THIRDPARTY.yml
  summary: Fast, memory-safe, idiomatic Rust rewrite of VarDictJava v1.8.3
build:
  binary_relocation: false
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1093/nar/gkw227
  - biotools:vardict
  recipe-maintainers:
  - palakpsheth
package:
  name: vardictrust
  version: 1.0.7
requirements:
  build:
  - null
  - null
  - null
  - make
  - cargo-bundle-licenses
source:
  sha256: dbe4ecc6dec2c8609fb9b327f34d92422895618b60a0eefa95e2ee79a95c3462
  url: https://github.com/palakpsheth/VarDictRust/archive/refs/tags/v1.0.7.tar.gz
test:
  commands:
  - vardictrust --version
  - vardictrust --help
