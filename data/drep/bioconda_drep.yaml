about:
  dev_url: https://github.com/MrOlm/drep
  doc_url: https://drep.readthedocs.io/en/latest
  home: https://github.com/MrOlm/drep
  license: MIT
  license_family: MIT
  summary: De-replication of microbial genomes assembled from multiple samples.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
extra:
  identifiers:
  - biotools:drep
  - usegalaxy-eu:drep_compare
  - usegalaxy-eu:drep_dereplicate
  - doi:10.1038/ismej.2017.126
package:
  name: drep
  version: 4.0.3
requirements:
  host:
  - python >=3
  - pip
  - setuptools
  run:
  - python >=3
  - numpy
  - pandas
  - seaborn-base
  - matplotlib-base
  - biopython
  - scikit-learn
  - tqdm
  - pytest
  - networkx
  - mummer4
  - mash
  - prodigal
  - fastani
  - checkm-genome
  - skani
source:
  sha256: 1e0aa0a870a70d5d1e4dc586977d37aeae3ec9106e77e4ad328266be86ad4b8e
  url: https://pypi.io/packages/source/d/drep/drep-4.0.3.tar.gz
test:
  commands:
  - dRep -h
  imports:
  - drep
