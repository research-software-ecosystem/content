about:
  dev_url: https://github.com/GoekeLab/xpore.git
  doc_url: https://xpore.readthedocs.io/en/latest/
  home: https://github.com/GoekeLab/xpore
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: xpore is a python package for Nanopore data analysis of differential RNA
    modifications.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  identifiers:
  - doi:10.1101/2020.06.18.160010
  - biotools:xpore
  recipe-maintainers:
  - artbio
package:
  name: xpore
  version: '2.2'
requirements:
  host:
  - pip
  - python
  - setuptools >=61.0
  run:
  - h5py >=2.10.0
  - numpy >=1.18.0
  - pandas >=0.25.3
  - pyensembl >=1.8.5
  - python
  - pyyaml
  - scipy >=1.4.1
  - ujson >=4.0.1
source:
  sha256: 8a068adcc91f0fd9eb8588ba0e73b183792278e67175db3c5b3dd9dcf58c13c8
  url: https://pypi.io/packages/source/x/xpore/xpore-2.2.tar.gz
test:
  commands:
  - xpore --help
  imports:
  - xpore
  - xpore.diffmod
  - xpore.scripts
  - xpore.utils
