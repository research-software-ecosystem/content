about:
  dev_url: https://github.com/nickjcroucher/gubbins
  doc_url: https://nickjcroucher.github.io/gubbins
  home: https://github.com/nickjcroucher/gubbins
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Rapid phylogenetic analysis of large samples of recombinant bacterial whole
    genome sequences using Gubbins.
build:
  entry_points:
  - run_gubbins.py = gubbins.run_gubbins:main
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1093/nar/gku1196
  - biotools:gubbins
  - usegalaxy-eu:gubbins
package:
  name: gubbins
  version: '3.5'
requirements:
  build:
  - make
  - null
  - null
  - null
  - libtool
  - autoconf
  - automake
  - autoconf-archive
  - pkg-config
  host:
  - python
  - pip
  - setuptools
  - scipy
  - dendropy >=5.0
  - biopython
  - numpy
  - numba
  - zlib
  run:
  - python
  - scipy
  - dendropy >=5.0
  - biopython
  - multiprocess
  - raxml >=8.2.12
  - iqtree >=3.0
  - rapidnj
  - raxml-ng >=2
  - fasttree >=2.1.10
  - veryfasttree
  - numpy
  - numba
  - ska2 >=0.3.0
  - r-argparser
  - r-magrittr
  - r-tidyverse
  - bioconductor-treeio
  - bioconductor-ggtree
  - r-aplot
  - r-patchwork
  - r-cowplot
  - r-rcolorbrewer
source:
  sha256: 2fb616172f80f7c7c208b200016249cad7d052c036485a0dc1aa0a5f02a43377
  url: https://github.com/nickjcroucher/gubbins/archive/refs/tags/v3.5.tar.gz
test:
  commands:
  - run_gubbins.py -h
