        commit_message: import WorkflowHub data
        branch: workflowhub-import-branch
        create_branch: true
  notify:
    # Runs whatever the importers did: a failure opens or updates the tracking
    # issue for that resource, and a success closes it again. Parallel to
    # merge-imports, so it neither delays nor depends on the merge.
    runs-on: ubuntu-latest
    needs:
      - biotools
      - openebench
      - bioconda
      - biii
      - biocontainers
      - galaxytool
      - debian-med
      - bioconductor
      - workflowhub
    if: always()
    permissions:
      # A job-level permissions map sets every scope it does not mention to
      # none, so each one the action needs is spelled out:
      #   issues   reading, opening, commenting on and closing the tracking
      #            issue, and creating its label
      #   actions  listing this workflow's runs, to tell whether a newer one
      #            has started. Without it that check is refused; the action
      #            carries on and says so in the job summary, but the
      #            stale-run guard is gone.
      # `contents` is not needed: there is no checkout, since the action
      # brings its own script.
      issues: write
      actions: read
    concurrency:
      # find-then-create is not atomic across runners, so serialise the
      # notifier: a manual dispatch overlapping the schedule would otherwise
      # let two runs open duplicate issues for the same outage.
      group: notify-upstream-failures
      cancel-in-progress: false
    steps:
      - name: report importer outcomes
        uses: research-software-ecosystem/utils/notify-upstream-failures@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # The keys are this job's `needs`, which the action matches against
          # its table of upstream resources. A job missing from that table is
          # reported as unprobed rather than passing unnoticed.
          job-results: ${{ toJSON(needs) }}
          workflow-file: import.yaml
  merge-imports:
    runs-on: ubuntu-latest
    needs:
      - biotools
      - openebench
      - bioconda
      - biii
      - biocontainers
      - galaxytool
      - debian-med
      - bioconductor
      - workflowhub
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Merge feature branches
        run: |
          git config --local user.email "tpe-bot@github.com"
          git config --local user.name "Tools Platform Ecosystem bot"
          head_before_merges=$(git rev-parse HEAD)
          merge_branch_if_exists() {
            local branch_name="$1"
            # Check if the branch exists on the remote repository
            if git ls-remote --exit-code --heads origin "$branch_name" &>/dev/null; then
              # The branch exists on the remote, so it can be safely merged
              git fetch origin "$branch_name"
              git merge "origin/$branch_name"
              echo "Merged $branch_name into the current branch."
            else
              # The branch does not exist on the remote
              echo "Branch $branch_name does not exist on the remote repository."
            fi
          }
          merge_branch_if_exists "biotools-import-branch"
          merge_branch_if_exists "openebench-import-branch"
          merge_branch_if_exists "bioconda-import-branch"
          merge_branch_if_exists "biii-import-branch"
          merge_branch_if_exists "biocontainers-import-branch"
          merge_branch_if_exists "galaxytool-import-branch"
          merge_branch_if_exists "debianmed-import-branch"
          merge_branch_if_exists "bioconductor-import-branch"
          merge_branch_if_exists "workflowhub-import-branch"
          # Push only if a merge actually moved HEAD. Comparing against
          # origin/master instead would read a master that advanced during the
          # run as evidence that something merged, and push the stale checkout.
          if [ "$(git rev-parse HEAD)" = "$head_before_merges" ]; then
            echo "Nothing merged, nothing to push."
          else
            # The merges above take a minute, and master can pick up a commit
            # in that time: the push is then rejected as non-fast-forward and
            # every merge is thrown away. Fold in whatever landed meanwhile and
            # try again, rather than failing the job and skipping everything
            # downstream of it. A conflict against master is not something a
            # retry can settle, so that still stops the job.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:master; then
                pushed=true
                break
              fi
              echo "Push $attempt rejected; master moved. Merging it and retrying."
              git fetch origin master
              if ! git merge --no-edit origin/master; then
                echo "::error::Merging master into the import merge conflicts; resolve it by hand."
                git merge --abort || true
                exit 1
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" != true ]; then
              echo "::error::master kept moving; giving up after 5 attempts."
              exit 1
            fi
          fi
  bioconductor-to-biotools:
    runs-on: ubuntu-latest
    needs:
      - merge-imports
    outputs:
      commit_hash: ${{ steps.commit-and-push-bioconductor-to-biotools.outputs.commit_hash }}
      files: ${{ steps.changed-biotools-files.outputs.files }}
    steps:
    - name: checkout contents repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
    - name: delete previous import branch
      run: |
        branch_name="bioconductor-to-biotools-branch"
        # Check if the branch exists on the remote repository
        if git rev-parse --verify --quiet "origin/$branch_name"; then
          # The branch exists, so it can be safely deleted
          git push origin --delete "$branch_name"
          echo "Branch $branch_name has been deleted."
        else
          # The branch does not exist
          echo "Branch $branch_name does not exist on the remote repository."
        fi
    - name: Create and checkout feature branch
      run: git checkout -b bioconductor-to-biotools-branch
    - name: run bioconductor to biotools conversion
      uses: research-software-ecosystem/utils/bioconductor-to-biotools@main
      with:
        repo-user: ${{ secrets.GITHUB_USER }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Collect changed biotools files
      id: changed-biotools-files
      run: |
        # Recorded before the commit step, while the tree is still dirty.
        # -uall so that files in newly created tool directories are listed
        # individually rather than collapsed into the directory.
        files=$(git status --porcelain=v1 -uall -- data/ \
                | sed 's/^...//' \
                | grep '\.biotools\.json$' \
                | tr '\n' ' ')
        echo "files=$files" >> "$GITHUB_OUTPUT"
        echo "$(echo $files | wc -w) changed .biotools.json file(s)."
    - name: Commit and Push Changes
      id: commit-and-push-bioconductor-to-biotools
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_user_name: Tools Platform Ecosystem bot
        commit_user_email: tpe-bot@github.com
        commit_author: Tools Platform Ecosystem bot <tpe-bot@github.com>
        commit_message: convert bioconductor to biotools format
        branch: bioconductor-to-biotools-branch
        create_branch: true
  merge-bioconductor:
    runs-on: ubuntu-latest
    needs:
      - bioconductor-to-biotools
    if: always()
    outputs:
      sha: ${{ steps.merge-bioconductor-branch.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Merge bioconductor-to-biotools branch
        id: merge-bioconductor-branch
        run: |
          git config --local user.email "tpe-bot@github.com"
          git config --local user.name "Tools Platform Ecosystem bot"
          head_before_merge=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin "bioconductor-to-biotools-branch" &>/dev/null; then
            git fetch origin "bioconductor-to-biotools-branch"
            git merge "origin/bioconductor-to-biotools-branch"
            echo "Merged bioconductor-to-biotools-branch into the current branch."
          else
            echo "Branch bioconductor-to-biotools-branch does not exist on the remote repository."
          fi
          # Push only if the merge above actually moved HEAD; see merge-imports.
          if [ "$(git rev-parse HEAD)" = "$head_before_merge" ]; then
            echo "Nothing merged, nothing to push."
          else
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  gh2biotools:
    # Pushes made with GITHUB_TOKEN do not start workflow runs, so the master
    # push above can never trigger biotools-gh2biotools.yml via `on: push`.
    # Call it directly instead, scoped to the files this run actually converted
    # — the merge commit also carries data imported *from* bio.tools, which
    # must not be pushed back.
    needs:
      - bioconductor-to-biotools
      - merge-bioconductor
    if: needs.bioconductor-to-biotools.outputs.files != ''
    uses: ./.github/workflows/biotools-gh2biotools.yml
    with:
      files: ${{ needs.bioconductor-to-biotools.outputs.files }}
      ref: ${{ needs.merge-bioconductor.outputs.sha }}
    secrets: inherit
  clean-branches:
    runs-on: ubuntu-latest
    needs:
      - merge-bioconductor
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Delete feature branches
        run: |
          git config --local user.email "tpe-bot@github.com"
          git config --local user.name "Tools Platform Ecosystem bot"
          delete_branch_if_exists() {
            local branch_name="$1"
            # Check if the branch exists on the remote repository
            if git ls-remote --exit-code --heads origin "$branch_name" &>/dev/null; then
              # The branch exists on the remote, so it can be deleted
              git push origin --delete "$branch_name"
              echo "Deleted $branch_name into the current branch."
            else
              # The branch does not exist on the remote
              echo "Branch $branch_name does not exist on the remote repository."
            fi
          }
          delete_branch_if_exists "biotools-import-branch"
          delete_branch_if_exists "openebench-import-branch"
          delete_branch_if_exists "bioconda-import-branch"
          delete_branch_if_exists "biii-import-branch"
          delete_branch_if_exists "biocontainers-import-branch"
          delete_branch_if_exists "galaxytool-import-branch"
          delete_branch_if_exists "debianmed-import-branch"
          delete_branch_if_exists "bioconductor-import-branch"
          delete_branch_if_exists "workflowhub-import-branch"
          delete_branch_if_exists "bioconductor-to-biotools-branch"
  build-dumps:
    # Build each aggregate dataset dump right after the imports have merged,
    # from the merged master, instead of on a separate 02:00 cron. Each matrix
    # job uploads its changed datasets/ files as an artifact; commit-dumps
    # lands them all in a single commit, so the dump jobs no longer race each
    # other (or the imports) pushing to master.
    runs-on: ubuntu-latest
    needs:
      - merge-bioconductor
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: biotools
            script: biotools_bioschemas_dump.py
          - source: bioconda
            script: bioconda_to_bioschemas.py
          - source: biocontainers
            script: biocontainers_to_bioschemas.py
          - source: debian
            script: debian_to_bioschemas.py
          - source: galaxy
            script: galaxy_to_bioschemas.py
          - source: galaxyworkflows
            script: galaxyworkflows_bioschemas_dump.py
          - source: workflowhub
            script: workflowhub_to_bioschemas.py
          - source: biii
    steps:
      - uses: actions/checkout@v7
        with:
          # The sha merge-bioconductor pushed; empty (job skipped or nothing
          # merged) falls back to the default branch.
          ref: ${{ needs.merge-bioconductor.outputs.sha }}
          path: content
      - uses: actions/checkout@v7
        with:
          repository: research-software-ecosystem/utils
          path: utils
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # ubuntu-latest (26.04) has no 3.9 build; 3.12 matches the importers.
          python-version: "3.12"
      - name: Install dependencies
        if: matrix.source != 'biii'
        run: pip install -r ${{ github.workspace }}/utils/bioschemas-gen/requirements.txt
      - name: Build ${{ matrix.source }} dump
        if: matrix.source != 'biii'
        run: |
          cd ${{ github.workspace }}/utils/bioschemas-gen
          python ${{ matrix.script }}
      - name: Install biii dependencies
        if: matrix.source == 'biii'
        run: pip install -r ${{ github.workspace }}/utils/biii-import/requirements.txt
      - name: Build biii dump
        if: matrix.source == 'biii'
        run: |
          cd ${{ github.workspace }}/utils/biii-import
          python biseEU_LD_export.py -td https://dev.biii.eurobioimaging.eu -dump
          mv datasets/bioschemas-biii-dump.ttl ${{ github.workspace }}/content/datasets/
      - name: Collect changed dataset files
        run: |
          cd ${{ github.workspace }}/content
          mkdir -p "${{ runner.temp }}/dump-artifact"
          git status --porcelain=v1 -uall -- datasets/ | sed 's/^...//' | while read -r f; do
            cp --parents "$f" "${{ runner.temp }}/dump-artifact/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dump-${{ matrix.source }}
          path: ${{ runner.temp }}/dump-artifact
          if-no-files-found: ignore
          retention-days: 7
  commit-dumps:
    runs-on: ubuntu-latest
    needs:
      - build-dumps
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Download dump artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dump-*
          merge-multiple: true
          path: .
      - name: Commit dataset dumps
        run: |
          git config --local user.email "tpe-bot@github.com"
          git config --local user.name "Tools Platform Ecosystem bot"
          # datasets/ is gitignored (dumps are published to GHCR); only the
          # legacy tracked .ttl files still get committed, so stage updates to
          # tracked files only — plain `git add datasets/` errors on the
          # ignored directory.
          git add -u datasets/
          if ! git commit -m "build dataset dumps on $(date)"; then
            echo "No dump changed, nothing to commit."
            exit 0
          fi
          # master can move while the dumps build (e.g. a manual push); the
          # dump commit only touches datasets/, so rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push $attempt rejected; master moved. Rebasing and retrying."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebasing the dump commit onto master conflicts; resolve it by hand."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::master kept moving; giving up after 5 attempts."
          exit 1
  report:
    needs:
      - commit-dumps
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/report.yml
    secrets: inherit
  publish-ghcr:
    # Regenerates the dumps itself from the merged master and publishes them
    # to GHCR; ordered after commit-dumps only so the tracked datasets/ files
    # and the published package describe the same week.
    needs:
      - commit-dumps
    if: always()
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/metadata-dumps-ghcr.yml
    secrets: inherit
