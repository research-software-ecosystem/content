name: Publish weekly metadata dumps to GHCR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: metadata-dumps-ghcr
  cancel-in-progress: false

jobs:
  build-and-publish-datasets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          path: content

      - uses: actions/checkout@v4
        with:
          repository: research-software-ecosystem/utils
          path: utils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r ${{ github.workspace }}/utils/bioschemas-gen/requirements.txt

      - name: Prepare datasets staging directory
        run: |
          # Publish only files generated by this run, not old tracked dumps.
          rm -rf "${{ github.workspace }}/content/datasets"
          mkdir -p "${{ github.workspace }}/content/datasets"

      - name: Record source revision
        run: echo "SOURCE_REVISION=$(git -C '${{ github.workspace }}/content' rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build aggregate metadata dumps
        run: |
          cd ${{ github.workspace }}/utils/bioschemas-gen
          for generator in *_dump.py; do
            python "$generator"
          done

      - name: Prepare datasets archive and checksums
        run: |
          artifact_dir="${{ runner.temp }}/content-datasets"
          mkdir -p "$artifact_dir"
          cd "${{ github.workspace }}/content"
          find datasets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > datasets/SHA256SUMS
          tar -czf "$artifact_dir/content-datasets.tar.gz" datasets
          cd "$artifact_dir"
          sha256sum content-datasets.tar.gz \
            > content-datasets.tar.gz.sha256

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish weekly datasets package and update latest
        env:
          PACKAGE: ghcr.io/research-software-ecosystem/content-datasets
        run: |
          week_tag="$(date -u +'%G-%V')"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cd "${{ runner.temp }}/content-datasets"

          oras push \
            --artifact-type application/vnd.research-software-ecosystem.content.datasets.v1 \
            --annotation "org.opencontainers.image.title=RSEc Content datasets" \
            --annotation "org.opencontainers.image.description=Weekly aggregate metadata dumps generated from content" \
            --annotation "org.opencontainers.image.created=$created" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=$SOURCE_REVISION" \
            "$PACKAGE:$week_tag" \
            content-datasets.tar.gz:application/gzip \
            content-datasets.tar.gz.sha256:text/plain

          oras copy "$PACKAGE:$week_tag" "$PACKAGE:latest"

          echo "Published $PACKAGE with tags $week_tag and latest"
