name: test .github/scripts

# The notifier is what reports that an import broke, so it should not be the
# one thing in the workflow with no tests. The suite is stdlib-only and
# offline, so it needs no dependencies and cannot fail because an upstream
# happens to be down.

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/import.yaml"
      - ".github/workflows/test-scripts.yml"
  push:
    branches: [master]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/import.yaml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The suite also checks that the probe table and import.yaml agree,
          # so it needs the workflows directory as well as the scripts.
          sparse-checkout: .github
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
