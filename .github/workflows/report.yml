name: generate Tools Platform Ecosystem contents report

on:
  # Runs weekly as a job of the import.yaml pipeline, after the imports and
  # dataset dumps have landed, so the report describes what this week's run
  # produced. workflow_dispatch stays for one-off manual runs.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contents-report
  cancel-in-progress: false

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        path: content
    - uses: actions/checkout@v7
      with:
        repository: research-software-ecosystem/utils
        path: utils
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install dependencies
      run:
        pip install -r ${{ github.workspace }}/utils/scripts/stats/requirements.txt
    - name: generate report
      run: |
        cd ${{ github.workspace }}/utils/scripts/stats
        python ecosystem.py ${{ github.workspace }}/content
    - name: commit new report
      run: |
        cd ${{ github.workspace }}/content
        git config --local user.email "tpe-bot@github.com"
        git config --local user.name "Tools Platform Ecosystem bot"
        cd report
        git add .
        if ! git commit -m "generate new contents report on $(date)"; then
          echo "nothing new to add, exiting"
          exit 0
        fi
        # master can move while the report builds; the commit only touches
        # report/, so rebase and retry instead of failing on a stale base.
        for attempt in 1 2 3 4 5; do
          if git push; then
            echo "successfully created new contents report"
            exit 0
          fi
          echo "Push $attempt rejected; master moved. Rebasing and retrying."
          git fetch origin master
          if ! git rebase origin/master; then
            echo "::error::Rebasing the report onto master conflicts; resolve it by hand."
            exit 1
          fi
          sleep $((attempt * 5))
        done
        echo "::error::master kept moving; giving up after 5 attempts."
        exit 1
