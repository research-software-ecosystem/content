name: dump bio.tools data in a single bioschemas file

on:
  # The weekly build runs as the build-dumps job of the import.yaml pipeline,
  # sequenced after the imports. This standalone workflow stays for one-off
  # manual runs only; note that it commits straight to master.
  workflow_dispatch:
    
jobs:
  build-bioschemas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          path: content

      - uses: actions/checkout@v7
        with:
          repository: research-software-ecosystem/utils
          path: utils

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ${{ github.workspace }}/utils/bioschemas-gen/requirements.txt

      - name: dump bio.tools data in a single bioschemas file
        run: |
          cd ${{ github.workspace }}/utils/bioschemas-gen
          python biotools_bioschemas_dump.py
          # mv ${{ github.workspace }}/utils/bioschemas-gen/bioschemas-dump.ttl ${{ github.workspace }}/content/datasets/

      - name: commit new data
        env:
          GITHUB_USER: ${{ secrets.GITHUB_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}/content/
          git config --local user.email "tpe-bot@github.com"
          git config --local user.name "Tools Platform Ecosystem bot"
          git add .
          if git commit -m "build bioschemas RDF dump on $(date)"; then
              # master can move while the dump builds (e.g. the bio.tools
              # auto-merge workflow): rebase and retry the push instead of
              # failing on a stale base, as import.yaml's jobs do. A real
              # conflict against master still stops the job.
              for attempt in 1 2 3 4 5; do
                  git fetch origin master
                  if ! git rebase origin/master; then
                      echo "::error::Rebasing the dump onto master conflicts; resolve it by hand."
                      git rebase --abort || true
                      exit 1
                  fi
                  if git push origin HEAD; then
                      echo "successfully created new data"
                      exit 0
                  fi
                  echo "Push $attempt rejected; master moved. Retrying."
                  sleep $((attempt * 5))
              done
              echo "::error::master kept moving; giving up after 5 attempts."
              exit 1
          else
              echo "nothing new to add, exiting"            
          fi
