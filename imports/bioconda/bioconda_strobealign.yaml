about:
  home: https://github.com/ksahlin/strobealign
  license: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Align short reads using dynamic seed size with strobemers
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - marcelm
package:
  name: strobealign
  version: 0.18.0
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: fe546df7b06a55578126376f108ea7c3445dbb14585c380eac221810450250de
  url: https://github.com/ksahlin/strobealign/archive/refs/tags/v0.18.0.tar.gz
test:
  commands:
  - strobealign --version | grep "0.18.0"
