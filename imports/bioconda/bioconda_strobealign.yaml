about:
  home: https://github.com/ksahlin/strobealign
  license: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Align short reads using dynamic seed size with strobemers
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - if [ $(uname -m) = x86_64 ]; then export RUSTFLAGS='-C target-cpu=x86-64-v2';
    fi
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - marcelm
package:
  name: strobealign
  version: 0.20.0
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 651439789346c297b58f7774db6242b475eac9d38e7f16894b5b9eb17296447b
  url: https://github.com/ksahlin/strobealign/archive/refs/tags/v0.20.0.tar.gz
test:
  commands:
  - strobealign --version | grep "0.20.0"
