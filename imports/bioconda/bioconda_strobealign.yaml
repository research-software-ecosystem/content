  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - marcelm
package:
  name: strobealign
  version: 0.19.0
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 076b80ac3d273e50dc7aa32a113a34d70feed06f32ddf8899a5106d0b1107357
  url: https://github.com/ksahlin/strobealign/archive/refs/tags/v0.19.0.tar.gz
test:
  commands:
  - strobealign --version | grep "0.19.0"
