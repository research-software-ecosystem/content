requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 97f3122f863cd78f075ada40a1a7bde41734035bfdc5eca2224900d4000630d0
  url: https://github.com/ksahlin/strobealign/archive/refs/tags/v0.19.1.tar.gz
test:
  commands:
  - strobealign --version | grep "0.19.1"
