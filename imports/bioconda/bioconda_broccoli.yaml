about:
  dev_url: https://github.com/rderelle/Broccoli
  doc_url: https://github.com/rderelle/Broccoli/blob/v2.0.1/README.md
  home: https://github.com/rderelle/Broccoli
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Orthology assignment combining phylogenetic and network analyses.
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - RUST_BACKTRACE=1 cargo install --no-track --locked --verbose --root "${PREFIX}"
    --path .
extra:
  additional-platforms:
  - osx-arm64
  identifiers:
  - doi:10.1093/molbev/msaa159
package:
  name: broccoli
  version: 2.0.1
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
  run:
  - diamond >=0.9.30
  - fasttree >=2.1.11
source:
  sha256: 7e251f79181e95e7832ebf89bd845ac31d0253acd9b856aa22dc2240d094c053
  url: https://github.com/rderelle/Broccoli/archive/v2.0.1.tar.gz
test:
  commands:
  - broccoli -help
  - diamond version
  - fasttree -expert
