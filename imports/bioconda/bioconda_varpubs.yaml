about:
  dev_url: https://github.com/koesterlab/varpubs
  home: https://github.com/koesterlab/varpubs
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tool for finding PubMed evidence on genetic variants and generating LLM-based
    summaries.
build:
  entry_points:
  - varpubs = varpubs.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - ilmaytas
  - fxwiegand
  - johanneskoester
package:
  name: varpubs
  version: 1.6.0
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  run:
  - python >=3.11
  - sqlmodel >=0.0.27
  - sqlalchemy >=2.0.39,<3
  - duckdb-engine >=0.15.0,<0.16
  - python-duckdb >=1.2.1,<2
  - typed-argument-parser >=1.10.1,<2
  - simple-parsing
  - openai >=1.97.0,<2
  - pubgator >=0.3,<0.4
  - cyvcf2 >=0.31.5
  - hgvs >=1.5.6,<2
source:
  sha256: c084f4aa778b7b845f10f039ebcccc1ea6bf98f631c7e464ff93c7a9549a3dd5
  url: https://github.com/koesterlab/varpubs/archive/refs/tags/v1.6.0.tar.gz
test:
  commands:
  - varpubs --help
  imports:
  - varpubs
