about:
  description: 'MagCluster is a specialized bioinformatics toolkit for identifying,

    annotating, and visualizing Magnetosome Gene Clusters (MGCs) in prokaryotic genomes.

    Version 1.0 removes external Prokka and BLAST dependencies, utilizing native

    Pyrodigal and PyHMMER with 92 curated HMM profiles and multi-locus synteny slicing.

    '
  dev_url: https://github.com/RunJiaJi/MagCluster
  doc_url: https://github.com/RunJiaJi/MagCluster#readme
  home: https://github.com/RunJiaJi/MagCluster
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE.txt
  summary: Fast, accurate, Prokka-free Magnetosome Gene Cluster (MGC) identification,
    classification, and visualization.
build:
  entry_points:
  - magcluster = magcluster.cli:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.1128/mra.01031-21
  recipe-maintainers:
  - RunJiaJi
package:
  name: magcluster
  version: 1.0.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61.0
  run:
  - python >=3.10
  - biopython >=1.80
  - pyrodigal >=3.0.0
  - pyhmmer >=0.10.1
  - typer >=0.16.0
  - rich >=13.0.0
  - pyyaml >=6.0
  - pygenomeviz >=1.0.0
  - clinker-py >=0.0.30
source:
  sha256: 986a77b07b4a2104d97f6be2ba7d1191a6e54bba059ec1217feedca2923e5f3d
  url: https://pypi.org/packages/source/m/magcluster/magcluster-1.0.1.tar.gz
test:
  commands:
  - magcluster --help
  - magcluster run --help
  - magcluster db --help
  imports:
  - magcluster
  - magcluster.core
  - magcluster.viz
  - magcluster.utils
