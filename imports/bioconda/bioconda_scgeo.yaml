about:
  description: ScGeo quantifies perturbation-associated geometry in single-cell representations,
    including sample-aware displacement, representation stability, local geometry,
    and geometry-dynamics agreement.
  dev_url: https://github.com/liuifrec/scgeo
  doc_url: https://github.com/liuifrec/scgeo/blob/main/docs/OVERVIEW.md
  home: https://github.com/liuifrec/scgeo
  license: MIT
  license_file: LICENSE
  summary: Geometry-aware analysis of single-cell representations
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  identifiers:
  - doi:10.1093/bioadv/vbag266
  recipe-maintainers:
  - liuifrec
package:
  name: scgeo
  version: 0.1.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.9
  - numpy
  - pandas
  - anndata
  - scipy
  - scikit-learn
  - matplotlib-base
  - plotly
source:
  sha256: 87928f91cd5ecbe06347e5ea9f290602030e0af2a7f7a3fd831daaf488cea175
  url: https://pypi.org/packages/source/s/scgeo/scgeo-0.1.0.tar.gz
test:
  commands:
  - python -c "import scgeo; assert scgeo.__version__ == '0.1.0'; assert callable(scgeo.tl.robust_shift)"
  imports:
  - scgeo
  - scgeo.tl
  - scgeo.pl
  - scgeo.pp
  - scgeo.get
  - scgeo.data
  - scgeo.bench
  requires:
  - pip
  - packaging
  source_files:
  - scripts/smoke_installation.py
