about:
  dev_url: https://github.com/MontgomeryLab/tinyRNA
  doc_url: https://github.com/MontgomeryLab/tinyRNA/blob/v1.6.0/README.md
  home: https://github.com/MontgomeryLab/tinyRNA
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.md
  summary: A precision counting tool for hierarchical classification and quantification
    of small RNA-seq reads. tiny-count is part of the tinyRNA analysis pipeline.
build:
  entry_points:
  - tiny = tiny.entry:main
  - tiny-config = tiny.rna.configuration:Configuration.main
  - tiny-collapse = tiny.rna.collapser:main
  - tiny-count = tiny.rna.counter.counter:main
  - tiny-plot = tiny.rna.plotter:main
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - tiny_count_only=1
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: tiny-count
  version: 1.6.0
requirements:
  build:
  - null
  - null
  host:
  - python
  - setuptools <82
  - cython
  - pip
  - pysam
  run:
  - python
  - setuptools <82
  - htseq
  - ruamel.yaml
source:
  sha256: 85e8a18dd03b804149151826056b85b1fe493a9ba3465273b96881074e798628
  url: https://github.com/MontgomeryLab/tinyRNA/archive/v1.6.0.tar.gz
test:
  commands:
  - tiny-count -h
