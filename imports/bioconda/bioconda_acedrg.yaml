about:
  description: 'ACEDRG is a tool for generating ligand and monosaccharide coordinates
    and

    restraint dictionaries for macromolecular crystallography. It is part of the

    Collaborative Computational Project Number 4 (CCP4) software suite.

    '
  dev_url: https://ccp4forge.rc-harwell.ac.uk/ccp4/acedrg
  doc_url: https://www2.mrc-lmb.cam.ac.uk/groups/murshudov/content/acedrg/acedrg.html
  home: https://www2.mrc-lmb.cam.ac.uk/groups/murshudov/content/acedrg/acedrg.html
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: 'ACEDRG: ligand/monosaccharide building and restraint generation tools
    from CCP4'
build:
  number: 0
  run_exports: null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1107/S2059798317000067
  recipe-maintainers:
  - eunos-1128
package:
  name: acedrg
  version: '331'
requirements:
  build:
  - null
  - null
  - cmake
  - grep
  - ninja
  - pkg-config
  - sed
  host:
  - python
  run:
  - gemmi
  - networkx
  - numpy
  - python
  - rdkit
  - servalcat
  - pdbecif
