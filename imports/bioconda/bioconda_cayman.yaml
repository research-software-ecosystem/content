about:
  dev_url: https://github.com/zellerlab/cayman
  home: https://github.com/zellerlab/cayman
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A command-line profiling tool for profiling CAZyme abundances in metagenomic
    datasets.
build:
  entry_points:
  - cayman = cayman.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517
    -vvv'
extra:
  identifiers:
  - doi:10.1101/2024.01.08.574624
  recipe-maintainers:
  - althonos
package:
  name: cayman
  version: 0.13.0
requirements:
  host:
  - python
  - pip
  - setuptools
  run:
  - python
  - bwa
  - pyhmmer >=0.12.0
  - gqlib >=2.14.3
  - numpy
  - pandas
  - pysam
source:
  sha256: c7863340d71da329969a73c5672714adde8b17a168f5da4c503426590763a0b0
  url: https://pypi.io/packages/source/c/cayman/cayman-0.13.0.tar.gz
test:
  commands:
  - cayman --help
  imports:
  - cayman
