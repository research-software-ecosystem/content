about:
  doc_url: https://github.com/caleblareau/mgatk/wiki
  home: https://github.com/caleblareau/mgatk
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Mitochondrial genome analysis toolkit.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - mencian
package:
  name: mgatk
  version: 0.9.0
requirements:
  host:
  - python >=3
  - pip
  - setuptools
  run:
  - python >=3
  - click
  - pysam
  - pytest
  - snakemake-minimal <8
  - pulp <2.8
  - biopython
  - numpy
  - pandas
  - optparse-pretty
  - regex
  - ruamel.yaml 0.16.12
  - openjdk
  - picard-slim
  - r-base
  - r-dplyr
  - r-data.table
  - r-matrix
  - bioconductor-genomicranges
  - bioconductor-summarizedexperiment
source:
  sha256: 59753127462ec3b2141a70eea81afd03cb5415abddfb29894ae651576b12ec8b
  url: https://pypi.io/packages/source/m/mgatk/mgatk-0.9.0.tar.gz
test:
  commands:
  - mgatk --help
  - mgatk-del-find --help
  - mgatk-del --help
  imports:
  - mgatk
