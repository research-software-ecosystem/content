about:
  description: The Seqinfo class stores the names, lengths, circularity flags, and
    genomes for a particular collection of sequences. These sequences are typically
    the chromosomes and/or scaffolds of a specific genome assembly of a given organism.
    Seqinfo objects are rarely used as standalone objects. Instead, they are used
    as part of higher-level objects to represent their seqinfo() component. Examples
    of such higher-level objects are GRanges, RangedSummarizedExperiment, VCF, GAlignments,
    etc... defined in other Bioconductor infrastructure packages.
  home: https://bioconductor.org/packages/3.23/bioc/html/Seqinfo.html
  license: Artistic-2.0
  summary: A simple S4 class for storing basic information about a collection of genomic
    sequences
build:
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
package:
  name: bioconductor-seqinfo
  version: 1.2.0
requirements:
  host:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-iranges >=2.46.0,<2.47.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - r-base
  run:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-iranges >=2.46.0,<2.47.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - r-base
source:
  md5: b6bda99a95704fab8638e7caaf4646e4
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Seqinfo_1.2.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/Seqinfo/Seqinfo_1.2.0.tar.gz
  - https://bioarchive.galaxyproject.org/Seqinfo_1.2.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-seqinfo/bioconductor-seqinfo_1.2.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('Seqinfo')"
