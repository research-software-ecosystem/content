about:
  dev_url: https://github.com/Kalan-Lab/zol
  doc_url: https://github.com/Kalan-Lab/zol/wiki
  home: https://github.com/Kalan-Lab/zol
  license: BSD-3-Clause
  license_family: BSD
  license_file: zol_folder/LICENSE
  summary: 'zol (& fai): large-scale targeted detection and evolutionary investigation
    of gene clusters.'
build:
  number: 1
  run_exports:
  - null
  script:
  - set -euxo pipefail
  - mkdir -p ${PREFIX}/bin
  - cd "${SRC_DIR}/zol_folder"
  - ' -m pip install ''gravis @ https://github.com/raufs/gravis/archive/refs/tags/v0.1.1.tar.gz#sha256=d8a8b09a23522ab746eea740adc05f22cb6a1d5190c1b64ee4f304e62b37268b''
    --no-deps --no-build-isolation -vv'
  - ' -m pip install . --no-deps --no-build-isolation -vvv'
  - export LDFLAGS=
  - ${CXX} -std=c++14 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/runRBH src/zol/orthologs/runRBH.cpp
  - ${CXX} -std=c++14 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/splitDiamondResults
    src/zol/orthologs/splitDiamondResults.cpp
  - ${CXX} -std=c++14 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/splitDiamondResultsForFai
    src/zol/splitDiamondResultsForFai.cpp
  - chmod +x "${PREFIX}/bin/runRBH" "${PREFIX}/bin/splitDiamondResults" "${PREFIX}/bin/splitDiamondResultsForFai"
  - export ZOL_DATA_PATH="${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}/db"
  - export ZOL_EXEC_PATH="${PREFIX}/bin"
  - mkdir -p "${ZOL_DATA_PATH}"
  - printf '%s\n' 'Default conda space for downloading annotation databases.' > "${ZOL_DATA_PATH}/README.txt"
  - mkdir -p "${PREFIX}/etc/conda/activate.d" "${PREFIX}/etc/conda/deactivate.d"
  - printf 'export ZOL_DATA_PATH=%s\nexport ZOL_EXEC_PATH=%s\n' "$ZOL_DATA_PATH" "$ZOL_EXEC_PATH"
    > "${PREFIX}/etc/conda/activate.d/zol.sh"
  - printf 'unset ZOL_DATA_PATH\nunset ZOL_EXEC_PATH\n' > "${PREFIX}/etc/conda/deactivate.d/zol.sh"
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  recipe-maintainers:
  - raufs
package:
  name: zol
  version: 1.7.0
requirements:
  build:
  - null
  - null
  host:
  - python
  - setuptools
  - pip
  run:
  - python >=3.10
  - pip
  - curl
  - setuptools
  - r-base
  - biopython
  - muscle =5.1
  - famsa >2
  - mcl
  - pal2nal >=14.1
  - hmmer >=3.0.0
  - fasttree
  - diamond =2.1.11
  - pyrodigal
  - prodigal
  - prodigal-gv
  - pyhmmer =0.11.4
  - libopenblas
  - pympler
  - pandas >=2.0
  - xlsxwriter >=3.0.3
  - scikit-learn
  - hyphy >=2.5.14
  - pomegranate >=1.0.0
  - r-ggplot2
  - r-cowplot
  - r-gggenes
  - r-gridextra
  - skani >=0.2.2
  - slclust
  - trimal
  - gzip
  - miniprot =0.13
  - miniprot >=0.13
  - bioconductor-ggtree
  - ete3
  - legacy-cgi
  - codoff >=1.2.3
  - colour
  - rich-argparse
  - tqdm
  - aiofile
  - aiohttp
  - peptides
source:
- folder: zol_folder
  sha256: f09d575f2386f109a5cbb30eda478f5cf27b8b8fbc74f727c2ac353ea0d0ea68
  url: https://github.com/Kalan-Lab/zol/archive/refs/tags/v1.7.0.tar.gz
test:
  commands:
  - zol -h
  imports:
  - gravis
