  - r-base
  - r-generics
source:
  md5: 6aa4beaff2e84c0ff9d155a346a66eaa
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/BiocGenerics_0.58.1.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/BiocGenerics/BiocGenerics_0.58.1.tar.gz
  - https://bioarchive.galaxyproject.org/BiocGenerics_0.58.1.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-biocgenerics/bioconductor-biocgenerics_0.58.1_src_all.tar.gz
test:
  commands:
  - $R -e "library('BiocGenerics')"
