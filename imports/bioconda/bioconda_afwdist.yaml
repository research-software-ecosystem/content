about:
  home: https://github.com/PathoGenOmics-Lab/afwdist
  license: GPL-3.0-only
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: A lightweight tool to calculate a pairwise distance metric based on fixed
    and non-fixed allele frequencies.
build:
  number: 0
  run_exports:
  - pin_subpackage(name, max_pin="x.x")
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install --no-track --locked --verbose --root "${PREFIX}" --path .
package:
  name: afwdist
  version: 1.0.1
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 1806f6938ffc9fe7d7137d3b2e4866cf1de4deedb5acfa996d8dac71a58e27cc
  url: https://github.com/PathoGenOmics-Lab/afwdist/archive/v1.0.1.tar.gz
test:
  commands:
  - afwdist --version
