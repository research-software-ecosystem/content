about:
  description: Provides delayed computation of a matrix of scaled and centered values.
    The result is equivalent to using the scale() function but avoids explicit realization
    of a dense matrix during block processing. This permits greater efficiency in
    common operations, most notably matrix multiplication.
  home: https://bioconductor.org/packages/3.23/bioc/html/ScaledMatrix.html
  license: GPL-3
  license_file: /lib/R/share/licenses/GPL-3
  summary: Creating a DelayedMatrix of Scaled and Centered Values
build:
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
package:
  name: bioconductor-scaledmatrix
  version: 1.20.0
requirements:
  host:
  - bioconductor-delayedarray >=0.38.2,<0.39.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - r-base
  - r-matrix
  run:
  - bioconductor-delayedarray >=0.38.2,<0.39.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - r-base
  - r-matrix
source:
  md5: 3fbab49713f88d421143f32981fafcc3
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/ScaledMatrix_1.20.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/ScaledMatrix/ScaledMatrix_1.20.0.tar.gz
  - https://bioarchive.galaxyproject.org/ScaledMatrix_1.20.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-scaledmatrix/bioconductor-scaledmatrix_1.20.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('ScaledMatrix')"
