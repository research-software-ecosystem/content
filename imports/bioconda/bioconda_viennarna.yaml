about:
  home: http://www.tbi.univie.ac.at/RNA/
  license: custom
  license_file: COPYING
  summary: ViennaRNA package -- RNA secondary structure prediction and comparison
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: viennarna
  version: 2.8.0
requirements:
  build:
  - make
  - null
  - null
  - null
  host:
  - pkgconfig
  - perl
  - python
  - zlib
  - mpfr
  - gsl
  - lapack
  - llvm-openmp
  run:
  - perl
  - python
  - llvm-openmp
source:
  patches:
  - fix_python_module_copy.patch
  - fix_clang_cannot_compile_this_static_initializer_yet.patch
  - fix_openmp_lib_darwin.patch
  sha256: 4d239d1ccb46400fcb46cf12894d1fb5975b327f91bb3d904bc4283cbe87d476
  url: https://www.tbi.univie.ac.at/RNA/download/sourcecode/2_8_x/ViennaRNA-2.8.0.tar.gz
test:
  commands:
  - RNAalifold --version
  - RNAeval    --version
  - RNAfold    --version
  - RNAplot    --version
  - RNAplfold  --version
  - RNAsubopt  --version
  - RNAlocmin  --version
  - kinwalker  --help >& /dev/null
  - python -c "import RNA"
  - perl -MRNA -e "print qq(ok\n)"
