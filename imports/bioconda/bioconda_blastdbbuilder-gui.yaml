about:
  home: https://github.com/asadprodhan/blastdbbuilder
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Graphical user interface for building customised BLASTn databases using
    blastdbbuilder (GUI).
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - asadprodhan
package:
  name: blastdbbuilder-gui
  version: 1.2.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=64
  run:
  - python >=3.9
  - blastdbbuilder >=1.1.0
  - customtkinter
source:
  sha256: 6c16a279185bec5b2a677349b4f87d3b7048bf789d7df8649d8762bfc7e3a422
  url: https://pypi.org/packages/source/b/blastdbbuilder-gui/blastdbbuilder_gui-1.2.0.tar.gz
test:
  imports:
  - blastdbbuilder_gui
