about:
  description: 'HyphAeon is a phylogenetic foundation model for neural inference of

    episodic positive selection (MEME), directional phenotype-genotype

    association (phylowas), and multi-scale epistatic sector mining (ESSM).

    Model weights are fetched from the Hugging Face Hub on first use.

    '
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'HyphAeon: A Deep-Time Phylogenetic Foundation Model for Multi-Scale Evolutionary,
    Structural, and Clinical Genomics'
build:
  entry_points:
  - hyphaeon = hyphaeon.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - d-callan
package:
  name: hyphaeon
  version: 0.4.1
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - hyphaeon-core >=0.4.0
  - biopython >=1.80
  - numpy >=1.22.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - networkx >=3.0
  - matplotlib-base >=3.5
source:
  sha256: 4e1a92bc050cac912c383da088138b0585b60003995d5b6206571165cb52e4a8
  url: https://pypi.org/packages/source/h/hyphaeon/hyphaeon-0.4.1.tar.gz
test:
  commands:
  - hyphaeon --version
  - hyphaeon --help
  - hyphaeon meme --help
  - hyphaeon phenotype --help
  - hyphaeon epistasis --help
  - python -c "from huggingface_hub import hf_hub_download; hf_hub_download('datamonkey/hyphaeon',
    'model.safetensors')"
  imports:
  - hyphaeon
