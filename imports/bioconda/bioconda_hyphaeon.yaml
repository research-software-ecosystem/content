about:
  description: 'HyphAeon is a phylogenetic foundation model for neural inference of

    episodic positive selection (MEME), directional phenotype-genotype

    association (phylowas), and multi-scale epistatic sector mining (ESSM).

    Model weights are fetched from the Hugging Face Hub on first use.

    '
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'HyphAeon: A Deep-Time Phylogenetic Foundation Model for Multi-Scale Evolutionary,
    Structural, and Clinical Genomics'
build:
  entry_points:
  - hyphaeon = hyphaeon.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - d-callan
package:
  name: hyphaeon
  version: 0.2.0
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - hyphaeon-core >=0.1.0
  - biopython >=1.80
  - numpy >=1.22.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - networkx >=3.0
  - matplotlib-base >=3.5
  - tn93 >=1.0.16
source:
  sha256: 41b06b4b68c4d3043ace74734a0e0854d3588135e9ba1cb81f03a91aff66e855
  url: https://pypi.org/packages/source/h/hyphaeon/hyphaeon-0.2.0.tar.gz
test:
  commands:
  - hyphaeon --version
  - hyphaeon --help
  - hyphaeon meme --help
  - hyphaeon phenotype --help
  - hyphaeon epistasis --help
  imports:
  - hyphaeon
