about:
  description: 'LiftOn is a homology-based genome-annotation lift-over tool. Given
    a reference

    genome and its annotation plus a target genome, it produces an annotation for

    the target by combining DNA-level alignment (Liftoff / minimap2) with

    protein-level alignment (miniprot) via a protein-maximization CDS-chaining

    algorithm and an ORF-rescue pass. It also ships a standalone GFF3 validator

    (gff3-validate).

    '
  dev_url: https://github.com/Kuanhao-Chao/LiftOn
  doc_url: https://khchao.com/LiftOn/
  home: https://github.com/Kuanhao-Chao/LiftOn
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Accurate homology-based genome-annotation lift-over combining DNA and protein
    alignment
build:
  entry_points:
  - lifton = lifton.lifton:main
  - gff3-validate = lifton.gff3_validator:_main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.1101/gr.279620.124
  recipe-maintainers:
  - Kuanhao-Chao
package:
  name: lifton
  version: 1.0.14
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61
  - wheel
  run:
  - python >=3.10
  - numpy >=1.22.0
  - biopython >=1.76
  - parasail-python >=1.2.4
  - intervaltree >=3.1.0
  - interlap >=0.2.6
  - networkx >=3.3
  - pyfaidx >=0.5.8
  - pysam >=0.19.1
  - gffutils >=0.10.1
  - ujson >=3.2.0
  - python-duckdb >=1.0,!=1.5.3,!=1.5.4
  - pyarrow >=14
  - mappy
  - minimap2
  - miniprot
source:
  sha256: dc5e48e481227a33d52cd141fb7ceca36465788a0c721d533848c30547aabffe
  url: https://pypi.org/packages/source/l/lifton/lifton-1.0.14.tar.gz
test:
  commands:
  - lifton -V
  - lifton -h
  - gff3-validate -h
  - minimap2 --version
  - miniprot --version
  - python -c "from lifton.native_bindings import is_mappy_available; assert is_mappy_available()"
  imports:
  - lifton
  - lifton.gffbase
  - lifton.native_bindings
  - mappy
