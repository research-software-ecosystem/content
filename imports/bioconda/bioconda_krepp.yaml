  summary: 'krepp: a k-mer-based maximum pseudo-likelihood method for estimating read
    distances and genome-wide phylogenetic placement.'
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1186/s13059-026-03999-y
  - doi:10.5281/zenodo.15466359
package:
  name: krepp
  version: 0.12.1
requirements:
  build:
  - make
  - null
  - null
  - pkg-config
  host:
  - zlib
  - libcurl
  - libgomp
  - llvm-openmp
  run:
  - libgomp
  - llvm-openmp
source:
  sha256: 0f1cc26ef4e0c1381767e3637f60c29b7e9653cd7828954bf5a2641a6f523145
  url: https://github.com/bo1929/krepp/releases/download/v0.12.1/krepp-v0.12.1.tar.gz
test:
  commands:
  - 'krepp --help 2>&1 | grep -F "krepp version: v0.12.1"'
  - test_dir=$(mktemp -d) && trap 'rm -rf -- "$test_dir"' EXIT && cd "$test_dir"
  - printf '%s\n' '>contig0' 'ATTACTATTTATAGGCATGAGTCTGGGCGCGCTTGCCAGCCAATAGATCGGTGGTCCGCCTAAGG'
    'GGCGGGGACGAACTACGGGCGAACTATAGATAGGCTTTGCATTGGTTTTTGTCATAAGGTCCAGT' 'GACTTTGTTCGTGCGGTAAGCCCGATGGGCACAGAGGACTCCCCGTACTCCGCGAGAATTCTTAGC'
    'TATA' '>contig1' 'GGTACAAACCGCCGGTTCTCCGGGTGCACATCTGCGGGTGCGGTACCCACTCGAGATACAGAGAT'
    'CCCAAATCCACGAACCATTTTCGATAGGGTTGTTGATGCTATTCAAGGGGCCCAGTTTAAATGGGT' 'CAGGACTCCGGTCAACCGCGTGTTAGGGATATCGCAGAAGACTGTTTACGTCTAACGTGAATGGTC'
    'GTA' > smoke.fa
  - krepp index -i smoke.fa -o smoke-index -k 19 -w 19 -h 9 -m 1 -r 0
  - krepp dist -i smoke-index -q smoke.fa --no-multi -o smoke.tsv
  - "LC_ALL=C awk -F '\\t' '$1 == \"contig0\" || $1 == \"contig1\" {\n  distance =\
    \ $3 + 0;\n  if (NF != 3 || $2 != $1 || $3 != sprintf(\"%.5f\", distance) || distance\
    \ < 0 || distance >= 0.01)\n    bad = 1;\n  if ($1 == \"contig0\") first++; else\
    \ second++;\n} END { exit (bad || first != 1 || second != 1) }' smoke.tsv"
