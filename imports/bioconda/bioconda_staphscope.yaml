about:
  description: 'StaphScope is a comprehensive bioinformatics tool for Staphylococcus
    aureus

    genomic analysis including MLST typing, spa typing, SCCmec analysis (CGE and

    RPet callers), capsule typing, agr typing, antimicrobial resistance detection,

    virulence factors, plasmid profiling, mobile genetic element profiling, and

    lineage prediction from whole genome sequencing data.

    '
  dev_url: https://github.com/bbeckley-hub/staphscope-typing-tool
  doc_url: https://github.com/bbeckley-hub/staphscope-typing-tool/blob/v2.0.0/README.md
  home: https://github.com/bbeckley-hub/staphscope-typing-tool
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Advanced Staphylococcus aureus Typing & Lineage Analysis Platform.
build:
  entry_points:
  - staphscope = staphscope.staphscope:main
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - bbeckley-hub
package:
  name: staphscope
  version: 2.0.0
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - pandas >=1.5.0
  - biopython >=1.80
  - psutil >=5.9.0
  - requests >=2.28.0
  - mlstdb >=1.3.0
  - tqdm >=4.64.0
  - click >=8.0.0
  - beautifulsoup4 >=4.11.0
  - lxml >=4.9.0
  - matplotlib-base >=3.5.0
  - seaborn-base >=0.12.0
  - scipy >=1.10.1
  - plotly >=5.10.0
  - abricate >=1.2.0
  - agrvate >=1.0.1
  - any2fasta
  - blast >=2.13.0
  - fastani >=1.3.0
  - diamond >=2.1.10
  - prodigal >=2.6.3
  - perl
  - perl-moo
  - perl-list-moreutils
  - perl-json
  - perl-lwp-protocol-https
  - perl-path-tiny
  - perl-data-dumper
  - perl-getopt-long
  - perl-file-which
  - staphscope-sccmec-data ==2.0.0
  - staphscope-mge-data ==2.0.0
source:
  sha256: ce1a4aac4df720157167a34b6799176bc3c3e6fc962cb856e31265da47cf0ccc
  url: https://github.com/bbeckley-hub/staphscope-typing-tool/archive/v2.0.0.tar.gz
test:
  commands:
  - staphscope --help
  - test -f $PREFIX/share/staphscope/modules/sccmec_module_cge/run_sccmec_batch.sh
  - test -f $PREFIX/share/staphscope/modules/mge_module/MGEFinder.py
