about:
  dev_url: https://github.com/MomentsLD/moments
  doc_url: https://momentsld.github.io/moments
  home: https://github.com/MomentsLD/moments
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Evolutionary inference using SFS and LD statistics.
build:
  number: 0
  run_exports:
  - null
  script:
  - export CFLAGS="${CFLAGS} -O3 -Wno-int-conversion -Wno-implicit-function-declaration"
  - rm -f moments/*.c moments/LD/*.c
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=1.7.0
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1534/genetics.117.200493
  - doi:10.1371/journal.pgen.1008204
  - doi:10.1093/molbev/msz265
package:
  name: moments
  version: 1.7.0
requirements:
  build:
  - null
  - null
  - pkg-config
  host:
  - python
  - pip
  - setuptools-scm
  - numpy
  - cython >=3.1
  run:
  - python
  - numpy
  - scipy >=1.3,<1.17
  - mpmath >=1.0,<1.4
  - demes >=0.2
source:
  patches:
  - setup.patch
  sha256: 6576b0940e7045f7f1043ca9f264910d91ea49befc830ce186e136dc5248bef1
  url: https://pypi.org/packages/source/m/moments-popgen/moments_popgen-1.7.0.tar.gz
test:
  imports:
  - moments
