about:
  description: 'gain-vep-annotator adds two annotators to GAIn: vep_full_annotator,
    which

    uses a local VEP cache, and vep_effect_annotator, which uses the reference

    genome and gene models of a GAIn Genomic Resource Repository. VEP runs in

    a Docker container.

    '
  dev_url: https://github.com/iossifovlab/gain
  doc_url: https://iossifovlab.com/gaindocs/annotation_infrastructure.html#vep-annotators
  home: https://github.com/iossifovlab/gain
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: GAIn plugin with annotators that run the Ensembl Variant Effect Predictor
    (VEP)
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - lchorbadjiev
  - iossifov
package:
  name: gain-vep-annotator
  version: 2026.11.1
requirements:
  host:
  - python 3.12
  - pip
  - hatchling
  - hatch-vcs
  run:
  - python >=3.12,<3.15
  - gain-core
source:
  sha256: 3c0443a8b699f84b85ee2f1d5454e1bb9afad408a7e517f445d32da5c93aa656
  url: https://pypi.org/packages/source/g/gain-vep-annotator/gain_vep_annotator-2026.11.1.tar.gz
test:
  commands:
  - python -c "import importlib.metadata as m; v = m.version('gain-vep-annotator');
    assert v == '2026.11.1', v"
  - python -c "from importlib.metadata import distribution as d; eps = [e for e in
    d('gain-vep-annotator').entry_points if e.group == 'console_scripts' or e.group.startswith('gain.')];
    [e.load() for e in eps]; assert eps; print(len(eps), 'entry points loaded')"
  - install_vep_cache --help
  - pip check
  requires:
  - python 3.12
  - pip
