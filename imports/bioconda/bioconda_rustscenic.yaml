about:
  dev_url: https://github.com/Ekin-Kahraman/rustscenic
  doc_url: https://ekin-kahraman.github.io/rustscenic/
  home: https://github.com/Ekin-Kahraman/rustscenic
  license: Apache-2.0
  license_file:
  - LICENSE
  - NOTICE
  - THIRDPARTY.yml
  summary: Rust and PyO3 implementation of SCENIC-style regulatory network analysis
build:
  number: 0
  run_exports:
  - null
  script: "export CARGO_BUILD_JOBS=\"${CPU_COUNT}\"\ncargo-bundle-licenses --format\
    \ yaml --output THIRDPARTY.yml\nexport MATURIN_PEP517_ARGS=\"--locked\"\n -m pip\
    \ install . --no-deps --no-build-isolation --no-cache-dir -vvv\n"
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - Ekin-Kahraman
package:
  name: rustscenic
  version: 0.5.1
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  host:
  - python >=3.10,<3.14
  - pip
  - maturin >=1.5,<2
  run:
  - python >=3.10,<3.14
  - numpy >=1.21
  - pandas >=1.5
  - pyarrow >=10
  - scipy >=1.8
  - anndata >=0.10
source:
  sha256: dec6166fb1236a313418895c67d2a2bf6a74c0ddaf94004a479c9244202c449f
  url: https://files.pythonhosted.org/packages/c0/ad/92d204ebffc04f9235521f5cf13ef3c3123009ad678657a6d7844c2e12d7/rustscenic-0.5.1.tar.gz
test:
  commands:
  - rustscenic --version | grep -Fx "rustscenic 0.5.1"
  imports:
  - rustscenic
  - rustscenic._rustscenic
