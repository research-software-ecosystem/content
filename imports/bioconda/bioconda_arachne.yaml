about:
  description: 'Arachne is a fork of Lariat that takes the best parts of lariat (speed,
    usability, not being C++)

    and marries it with the mapping performance of EMA. Because of this and other
    improvements and

    updates, Arachne output will be different from either Lariat or EMA output, presumably
    better.

    '
  dev_url: https://github.com/blinkseq/arachne
  doc_url: https://blinkseq.github.io/arachne
  home: https://github.com/blinkseq/arachne
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - gominibwa/minibwa/LICENSE.txt
  - library_licenses/
  summary: Linked-Read Aligner and successor to Lariat and EMA.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - pdimens
package:
  name: arachne
  version: 0.4.2
requirements:
  build:
  - null
  - null
  - null
  - go-licenses
  - make
  host:
  - libgomp
  - llvm-openmp
  - zlib
  run:
  - libgomp
  - llvm-openmp
  - minibwa >=0.7,<0.8
source:
  sha256: 36b4d387d4b5bcde07f35cdb7f42c178d6a6315d58589a058160e7f1176d3a29
  url: https://github.com/blinkseq/arachne/releases/download/0.4.2/arachne.0.4.2.tar.gz
test:
  commands:
  - arachne --version
