about:
  description: 'Arachne is a fork of Lariat that takes the best parts of lariat (speed,
    usability, not being C++)

    and marries it with the mapping performance of EMA. Because of this and other
    improvements and

    updates, Arachne output will be different from either Lariat or EMA output, presumably
    better.

    '
  dev_url: https://github.com/blinkseq/arachne
  doc_url: https://blinkseq.github.io/arachne
  home: https://github.com/blinkseq/arachne
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - gominibwa/minibwa/LICENSE.txt
  - library_licenses/
  summary: Linked-Read Alignment Tool and successor to Lariat.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - pdimens
package:
  name: arachne
  version: 0.4.1
requirements:
  build:
  - null
  - null
  - null
  - go-licenses
  - make
  host:
  - libgomp
  - llvm-openmp
  - zlib
  run:
  - libgomp
  - llvm-openmp
  - samtools >=1.23
  - minibwa >=0.7,<0.8
source:
  sha256: bf53cb7c1ef545b3abed0a41e68c205ebb3caaecf4161cf239c543a00a89d870
  url: https://github.com/blinkseq/arachne/releases/download/0.4.1/arachne.0.4.1.tar.gz
test:
  commands:
  - arachne --version
