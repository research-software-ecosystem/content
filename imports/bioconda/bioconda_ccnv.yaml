about:
  description: 'ccnv is an organism-agnostic bioinformatics toolkit for copy-number

    variation (CNV) detection in whole-genome sequencing (WGS) data at any

    coverage across constitutional germline and cell-free DNA prenatal (NIPT)

    workflows, building on within-sample reference normalization methodology.

    '
  dev_url: https://github.com/matthdsm/ccnv
  doc_url: https://matthdsm.github.io/ccnv/
  home: https://github.com/matthdsm/ccnv
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file:
  - LICENSE.md
  - THIRDPARTY.yml
  summary: Copy-number analysis for whole-genome sequencing
build:
  number: 0
  run_exports:
  - null
  script:
  - export CARGO_BUILD_JOBS="${CPU_COUNT}"
  - export CARGO_PROFILE_RELEASE_DEBUG=false
  - export CARGO_PROFILE_RELEASE_STRIP=symbols
  - export MATURIN_PEP517_ARGS="--locked"
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - matthdsm
package:
  name: ccnv
  version: 1.0.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  host:
  - python >=3.12,<3.14
  - pip
  - maturin >=1.8,<2.0
  run:
  - python >=3.12,<3.14
  - jinja2 >=3.1.6,<4
  - jsonschema >=4.20.0
  - numpy >=2.5,<3
  - polars >=2,<3
  - polars-runtime-compat
  - pyarrow >=26,<27
  - pyyaml >=6.0
  - ruptures >=1.1.10
  - scikit-learn >=1.9,<2
  - scipy >=1.18,<2
  - typer >=0.29
source:
  sha256: a18c3ce8b66de700d09de34b33dfb149be4cb12e41e1ba2142cf1867a45f462d
  url: https://github.com/matthdsm/ccnv/archive/refs/tags/v1.0.0.tar.gz
test:
  commands:
  - ccnv --help
  - ccnv extract --help
  - ccnv reference --help
  - ccnv ref-qc --help
  - ccnv predict --help
  imports:
  - ccnv
  - ccnv._core
