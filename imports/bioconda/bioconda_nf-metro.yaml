about:
  home: https://github.com/seqeralabs/nf-metro
  license: MIT
  license_file: LICENSE
  summary: Metromap-style pipeline workflow components
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - pinin4fjords
  - matthdsm
package:
  name: nf-metro
  version: 2.0.0
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  run:
  - python >=3.11
  - click >=8.0
  - drawsvg >=2.0
  - lark >=1.1
  - networkx >=3.0
  - pillow >=9.0
  - fonttools >=4.0
  - jsonschema >=4.0
source:
  sha256: ed143d81fb148ed405b3a05dc3663f4c4a32b39edfe36f10eea043364018107f
  url: https://pypi.io/packages/source/n/nf-metro/nf_metro-2.0.0.tar.gz
test:
  commands:
  - nf-metro --help
