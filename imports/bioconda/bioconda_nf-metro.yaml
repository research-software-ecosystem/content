about:
  home: https://github.com/seqeralabs/nf-metro
  license: MIT
  license_file: LICENSE
  summary: Metromap-style pipeline workflow components
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - pinin4fjords
  - matthdsm
package:
  name: nf-metro
  version: 2.1.0
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  run:
  - python >=3.11
  - av >=13
  - click >=8.0
  - drawsvg >=2.0
  - lark >=1.1
  - networkx >=3.0
  - pillow >=9.0
  - resvg-py >=0.5
  - fonttools >=4.0
  - jsonschema >=4.0
source:
  sha256: f415970b9c4b91629de0946a6eb1bf7826cde19a62ee80f6d83eb1cd6955e21e
  url: https://pypi.io/packages/source/n/nf-metro/nf_metro-2.1.0.tar.gz
test:
  commands:
  - nf-metro --help
