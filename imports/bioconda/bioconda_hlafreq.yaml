about:
  dev_url: https://github.com/Vaccitech/HLAfreq
  home: https://github.com/Vaccitech/HLAfreq
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Download and combine HLA frequency data from multiple studies.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - DAWells
package:
  name: hlafreq
  version: 1.0.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - bs4
  - matplotlib-base >=3.6.0
  - numpy >=1.24.0
  - pandas
  - pymc >=3
  - arviz <1.0
  - python >=3.10
  - requests
  - scipy >=1.10.0
source:
  sha256: b2eb767ad88e373b0a0d0a0c2bff348117e4455a0cb826434af7fab45a0ab33c
  url: https://pypi.io/packages/source/h/hlafreq/hlafreq-1.0.0.tar.gz
test:
  imports:
  - HLAfreq
  - HLAfreq.HLAfreq_pymc
