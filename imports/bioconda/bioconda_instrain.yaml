about:
  dev_url: https://github.com/MrOlm/inStrain
  home: https://github.com/MrOlm/inStrain
  license: MIT
  license_family: MIT
  summary: Calculation of strain-level metrics.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir'
package:
  name: instrain
  version: 1.12.0
requirements:
  host:
  - pip
  - python >=3.4
  - setuptools
  run:
  - python >=3.4
  - numpy
  - pandas >=0.25,!=1.1.3
  - seaborn-base
  - matplotlib-base
  - biopython
  - tqdm
  - pysam >=0.15
  - networkx
  - h5py
  - psutil
  - pytest
  - lmfit
source:
  sha256: 9ec0b2d58eef6639459df8860cf290d72432161e39cb80e58863888fabe45e32
  url: https://pypi.io/packages/source/i/instrain/instrain-1.12.0.tar.gz
test:
  commands:
  - inStrain profile --help
  - inStrain compare --help
  imports:
  - inStrain
