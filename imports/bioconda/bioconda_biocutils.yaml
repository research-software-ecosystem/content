about:
  home: https://github.com/biocpy/biocutils
  license: MIT
  license_file: LICENSE.txt
  summary: Miscellaneous utilities for BiocPy, mostly to mimic base functionality
    in R.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - SilenWang
package:
  name: biocutils
  version: 0.5.0
requirements:
  host:
  - python
  - hatchling
  - pip
  run:
  - python
  - numpy
source:
  sha256: e40c48153497ccf7a5d089d2389bfda0cba573f20ceecc4162864ed3aefa926d
  url: https://pypi.org/packages/source/b/biocutils/biocutils-0.5.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - biocutils
  requires:
  - pip
