about:
  home: https://github.com/biocpy/biocutils
  license: MIT
  license_file: LICENSE.txt
  summary: Miscellaneous utilities for BiocPy, mostly to mimic base functionality
    in R.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - SilenWang
package:
  name: biocutils
  version: 0.5.1
requirements:
  host:
  - python
  - hatchling
  - pip
  run:
  - python
  - numpy
source:
  sha256: c08b74cfb7fdaf166d1e3e2aba9942d7432864ecca62a3c3d5c7ded135efa127
  url: https://pypi.org/packages/source/b/biocutils/biocutils-0.5.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - biocutils
  requires:
  - pip
