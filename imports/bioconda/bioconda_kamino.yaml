about:
  dev_url: https://github.com/rderelle/kamino
  doc_url: https://github.com/rderelle/kamino/blob/2.4.2/README.md
  home: https://github.com/rderelle/kamino
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Tool for building phylogenomic datasets quickly and reproducibly.
build:
  number: 0
  run_exports:
  - null
  script:
  - export LDFLAGS="${LDFLAGS} -L${PREFIX}/lib"
  - export export CPPFLAGS="${CPPFLAGS} -I${PREFIX}/include"
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - RUST_BACKTRACE=1 cargo install --no-track --locked --verbose --root "${PREFIX}"
    --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: kamino
  version: 2.4.2
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: b03f63426f6b3901a7d3f64c80cfc7a0d5b1bf7c2b53c887f7e58f35feb7f128
  url: https://github.com/rderelle/kamino/archive/2.4.2.tar.gz
test:
  commands:
  - kamino -h
