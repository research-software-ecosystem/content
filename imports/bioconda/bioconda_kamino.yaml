about:
  dev_url: https://github.com/rderelle/kamino
  doc_url: https://github.com/rderelle/kamino/blob/2.1.1/README.md
  home: https://github.com/rderelle/kamino
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Tool for building phylogenomic datasets quickly and reproducibly.
build:
  number: 0
  run_exports:
  - null
  script:
  - export LDFLAGS="${LDFLAGS} -L${PREFIX}/lib"
  - export export CPPFLAGS="${CPPFLAGS} -I${PREFIX}/include"
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - RUST_BACKTRACE=1 cargo install --no-track --locked --verbose --root "${PREFIX}"
    --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: kamino
  version: 2.1.1
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 3f88e0f056deae31fabd1fb084a4ad34b3354a61ff4d5aa3fc9edf1a337985c1
  url: https://github.com/rderelle/kamino/archive/2.1.1.tar.gz
test:
  commands:
  - kamino -h
