about:
  description: 'janook implements the Animal Variant Classification Guidelines (AVCG,

    Boeykens et al. 2024), the veterinary counterpart of the ACMG/AMP

    guidelines. Given an evidence file recording which of the 23 criteria

    were met for a variant, it applies the guideline''s decision process

    and reports the classification with the rule that produced it, the

    criteria behind it, and full provenance.

    '
  home: https://github.com/janookgenomics/janook
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Classification of genetic variants in animals under the AVCG guidelines
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - itpragmatik
package:
  name: janook
  version: 9.0.0
requirements:
  run:
  - openjdk >=25
source:
  sha256: 4fa8a9bbcbe0bc2454e1c73a9c36356a4004e4be7314d63a5c7503368040de3b
  url: https://github.com/janookgenomics/janook/releases/download/v9.0.0/janook-9.0.0-dist.tar.gz
test:
  commands:
  - janook --version
  - janook explain PS5
  - 'printf "variant:\n  species: felis_catus\n  gene: TEST\n  transcript: T1\n  hgvs_c:
    c.1A>G\n  consequence: missense_variant\ncriteria:\n  PS1: {met: true}\n  PM1:
    {met: true}\n" > test-variant.yaml'
  - janook classify test-variant.yaml --brief
