about:
  description: 'Djinn lets you convert linked reads to a standard format, convert
    between platform-specific

    FASTQ formats, barcode styles, etc. It also provides a convenient method to upload
    linked-read

    data to NCBI that preserves barcode information, sort by barcode, and several
    other linked-read specific tools.

    '
  dev_url: https://github.com/blinkseq/djinn
  doc_url: https://blinkseq.github.io/djinn
  home: https://github.com/blinkseq/djinn
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Manipulate linked-read FASTQ and SAM/BAM data, along with other tools.
build:
  number: 0
  run_exports:
  - null
  script:
  - mkdir -p $PREFIX/bin
  - go build -ldflags "-X github.com/blinkseq/djinn/cmd.VERSION=${PKG_VERSION} -s
    -w" -o $PREFIX/bin/djinn
extra:
  recipe-maintainers:
  - pdimens
package:
  name: djinn
  version: '3.0'
requirements:
  build:
  - null
  - null
  - go-licenses
source:
  sha256: f874a934ba37162e874a852b18afa9dc1ae86e5755126bcaa02be0019f705a4b
  url: https://github.com/blinkseq/djinn/releases/download/3.0/djinn.3.0.tar.gz
test:
  commands:
  - djinn --version
