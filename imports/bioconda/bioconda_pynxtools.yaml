about:
  description: 'pynxtools converts experimental and characterization data from materials

    science into NeXus/HDF5 files, validates them, and serves as the NeXus

    parser of NOMAD. Format readers are separate plugins, such as pynxtools-spm.

    '
  dev_url: https://github.com/FAIRmat-NFDI/pynxtools
  doc_url: https://fairmat-nfdi.github.io/pynxtools/
  home: https://github.com/FAIRmat-NFDI/pynxtools
  license: Apache-2.0 AND LGPL-3.0-or-later AND MIT
  license_file:
  - LICENSES/Apache-2.0.txt
  - LICENSES/LGPL-3.0-or-later.txt
  - LICENSES/MIT.txt
  summary: Convert experimental data to NeXus/HDF5 files and validate them against
    NeXus application definitions.
build:
  entry_points:
  - pynx = pynxtools.cli:pynx
  - dataconverter = pynxtools.dataconverter.cli:convert
  - generate_eln = pynxtools.eln_mapper.cli:generate_eln
  - validate_nexus = pynxtools.dataconverter.cli:validate
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vvv
extra:
  recipe-maintainers:
  - RubelMozumder
package:
  name: pynxtools
  version: 0.16.0
requirements:
  host:
  - python 3.10
  - pip
  - setuptools >=78.1.1
  - setuptools-scm >=6.2
  run:
  - python >=3.10
  - click >=7.1.2
  - click-default-group
  - h5py >=3.6.0
  - hdf5plugin
  - python-blosc2
  - xarray >=0.20.2
  - pyyaml >=6.0
  - numpy
  - pandas >=1.3.2
  - ase >=3.19.0
  - mergedeep
  - importlib-metadata
  - lxml >=4.9.1
  - toposort >=1.10.0
  - anytree
  - pint
  - cachetools
  - structlog
  - jinja2
source:
  sha256: bcb761c3f962c84a9c52fca2c7fac62202d72a53c9c18c7dd8c66f1f6c793991
  url: https://pypi.org/packages/source/p/pynxtools/pynxtools-0.16.0.tar.gz
test:
  commands:
  - pip check
  - pynx --help
  - dataconverter --help
  - validate_nexus --help
  - generate_eln --help
  imports:
  - pynxtools
  - pynxtools.dataconverter
  - pynxtools.nexus
  requires:
  - python 3.10
  - pip
