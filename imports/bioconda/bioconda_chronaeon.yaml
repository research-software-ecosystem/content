about:
  description: "ChronAeon is the \"Radar\" component of the Aeon package family \u2014\
    \ rapidly\nscreens genomes, detects emerging clades, and infers origin dates using\n\
    molecular clock dating, phylodynamics, phylogeography, and multi-clock\ncommunity\
    \ deconvolution.\n"
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'ChronAeon: Ultra-Fast Molecular Clock Dating, Phylodynamics, and Genomic
    Surveillance'
build:
  entry_points:
  - chronaeon = chronaeon.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - d-callan
package:
  name: chronaeon
  version: 0.1.1
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - hyphaeon-core >=0.1.0
  - biopython >=1.80
  - numpy >=1.22.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - scikit-learn >=1.0
  - matplotlib-base >=3.5
  - tn93 >=1.0.16
  - networkx >=3.0
source:
  sha256: fa8af00ca4415960997b648af70f65846872ddbe17c7cdf05e3b48af63c38c15
  url: https://pypi.org/packages/source/c/chronaeon/chronaeon-0.1.1.tar.gz
test:
  commands:
  - chronaeon --version
  - chronaeon --help
  - chronaeon date --help
  - chronaeon autoclock --help
  imports:
  - chronaeon
