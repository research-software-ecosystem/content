about:
  description: "ChronAeon is the \"Radar\" component of the Aeon package family \u2014\
    \ rapidly\nscreens genomes, detects emerging clades, and infers origin dates using\n\
    molecular clock dating, phylodynamics, phylogeography, and multi-clock\ncommunity\
    \ deconvolution.\n"
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'ChronAeon: Ultra-Fast Molecular Clock Dating, Phylodynamics, and Genomic
    Surveillance'
build:
  entry_points:
  - chronaeon = chronaeon.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - d-callan
package:
  name: chronaeon
  version: 0.2.0
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - hyphaeon-core >=0.2.0
  - biopython >=1.80
  - numpy >=1.22.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - scikit-learn >=1.0
  - matplotlib-base >=3.5
  - tn93 >=1.0.16
  - networkx >=3.0
source:
  sha256: 830129a794e8ee240c203eff9a4e43ce379d5bf34a2c8bffef9c4818ceb8d60f
  url: https://pypi.org/packages/source/c/chronaeon/chronaeon-0.2.0.tar.gz
test:
  commands:
  - chronaeon --version
  - chronaeon --help
  - chronaeon date --help
  - chronaeon autoclock --help
  - python -c "from huggingface_hub import hf_hub_download; hf_hub_download('datamonkey/hyphaeon',
    'model.safetensors')"
  imports:
  - chronaeon
