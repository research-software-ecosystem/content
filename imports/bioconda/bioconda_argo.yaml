about:
  home: https://github.com/xinehc/argo
  license: MIT
  license_family: MIT
  summary: 'Argo: species-resolved profiling of antibiotic resistance genes in complex
    metagenomes through long-read overlapping'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - xinehc
package:
  name: argo
  version: 0.2.2
requirements:
  host:
  - pip
  - setuptools
  - python >=3.7
  run:
  - python >=3.7
  - diamond >=2.1.11
  - melon >=0.3.0
  - scikit-learn
source:
  sha256: 0e90fc989bb5b6011f810e8eae2c8187161be40ef889284bcd99f6eb3196d7e6
  url: https://github.com/xinehc/argo/archive/refs/tags/v0.2.2.tar.gz
test:
  commands:
  - argo -h
  imports:
  - argo
