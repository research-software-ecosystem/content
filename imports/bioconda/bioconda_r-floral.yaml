about:
  home: https://vdblab.github.io/FLORAL/
  license: GPL-3.0-or-later
  license_file:
  - /lib/R/share/licenses/GPL-3
  summary: Log-ratio Lasso regression for continuous, binary, and survival outcomes
    with (longitudinal) compositional features. See Fei and others (2024) <doi:10.1016/j.crmeth.2024.100899>.
build:
  merge_build_host: true
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
  script: R CMD INSTALL --build .
extra:
  recipe-maintainers:
  - funnell
package:
  name: r-floral
  version: 0.7.1
requirements:
  host:
  - r-ast2ast
  - r-base
  - r-rcpp >=1.0.9
  - r-rcpparmadillo
  - r-rcppprogress
  - r-caret
  - r-doparallel
  - r-dorng
  - r-dplyr
  - r-foreach
  - r-ggplot2
  - r-glmnet
  - r-msm
  - r-mvtnorm
  - bioconductor-phyloseq
  - r-reshape
  - bioconductor-survcomp
  - r-survival
  run:
  - r-ast2ast
  - r-base
  - r-rcpp >=1.0.9
  - r-rcpparmadillo
  - r-rcppprogress
  - r-caret
  - r-doparallel
  - r-dorng
  - r-dplyr
  - r-foreach
  - r-ggplot2
  - r-glmnet
  - r-msm
  - r-mvtnorm
  - bioconductor-phyloseq
  - r-reshape
  - bioconductor-survcomp
  - r-survival
source:
  sha256: 0b0b7465c90f8889a78b01a492193467830214c4b06b1ec99c6e0d3c0d719e33
  url: https://cran.r-project.org/src/contrib/FLORAL_0.7.1.tar.gz
test:
  commands:
  - $R -e "library('FLORAL')"
