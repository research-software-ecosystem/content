about:
  dev_url: https://github.com/Adamtaranto/deRIP2
  home: https://adamtaranto.github.io/deRIP2/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Predict ancestral sequence of fungal repeat elements by correcting for
    RIP-like mutations in multi-sequence DNA alignments.
build:
  entry_points:
  - derip2 = derip2.app:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - Adamtaranto
package:
  name: derip2
  version: 0.5.1
requirements:
  host:
  - python >=3.9
  - hatchling
  - hatch-vcs
  - pip
  run:
  - python >=3.9
  - biopython >1.80
  - click
  - ete4
  - iqtree
  - matplotlib-base
  - numpy
  - pandas
  - tqdm
source:
  sha256: 12fe00445adf2e5415a7c21cc76ba6bff2b87cb778ffcec78c0113fac4d841ec
  url: https://pypi.org/packages/source/d/derip2/derip2-0.5.1.tar.gz
test:
  commands:
  - pip check
  - derip2 --help
  - derip2 --version
  - derip2-spectra --version
  - derip2-spectra --help
  imports:
  - derip2
  requires:
  - pip
