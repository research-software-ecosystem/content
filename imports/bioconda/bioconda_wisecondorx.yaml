about:
  home: https://github.com/CenterForMedicalGeneticsGhent/wisecondorX
  license: Attribution-NonCommercial-ShareAlike CC BY-NC-SA
  summary: WIthin-SamplE COpy Number aberration DetectOR, including sex chromosomes
build:
  noarch: python
  number: 1
  run_exports:
  - null
  script: ' -m pip install . --no-deps -vv'
package:
  name: wisecondorx
  version: 1.3.3
requirements:
  host:
  - python >=3.10
  - setuptools
  run:
  - pandas >=3.0
  - pyarrow >=24
  - python >=3.10
  - pysam >=0.24
  - scipy >=1.17
  - scikit-learn >=1.9
  - numpy >=2.4
  - matplotlib-base >=3.10
  - r-jsonlite >=2
  - bioconductor-dnacopy >=1.86
  - typer
source:
  sha256: 2c6ce74934c635f33a187cf83f331b2f52d9f24151ac4884b554d914dcaf66a6
  url: https://github.com/CenterForMedicalGeneticsGhent/wisecondorX/archive/v1.3.3.tar.gz
test:
  commands:
  - WisecondorX --help
  - WisecondorX convert --help
  - WisecondorX gender --help
  - WisecondorX newref --help
  - WisecondorX predict --help
  imports:
  - wisecondorx
