about:
  dev_url: https://github.com/LucoDevro/CAGEcleaner
  doc_url: https://cagecleaner.readthedocs.io/en/stable
  home: https://github.com/LucoDevro/CAGEcleaner
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Redundancy removal for gene cluster mining hit sets
build:
  entry_points:
  - cagecleaner = cagecleaner.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir'
extra:
  identifiers:
  - doi:10.1101/2025.02.19.639057
  recipe-maintainers:
  - LucoDevro
  - mimitair
package:
  name: cagecleaner
  version: 1.6.0
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools
  run:
  - python >=3.12
  - biopython
  - cblaster ==1.4.0
  - pandas <3.0.0
  - ncbi-datasets-cli
  - skder >=1.3.4
  - gb-io
  - mmseqs2
  - networkx
source:
  sha256: 46e68b04274dde621c02e8afb9b94b40552257b152cefe3be6120b2f63288593
  url: https://pypi.org/packages/source/c/cagecleaner/cagecleaner-1.6.0.tar.gz
test:
  commands:
  - cagecleaner -h
