  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - pydantic >=2.12,<3
source:
  sha256: f42424ff6b84ebe795bf7dc10106cfe661f6439cb304a6698ad7445edad31858
  url: https://pypi.org/packages/source/g/grz-pydantic-models/grz_pydantic_models-4.2.0.tar.gz
test:
