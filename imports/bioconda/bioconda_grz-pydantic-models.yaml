  - pydantic >=2.12,<3
source:
  sha256: e4e8dff473505a02d137213fab4a42edeec00b186726ece8345ab4118873ef18
  url: https://pypi.org/packages/source/g/grz-pydantic-models/grz_pydantic_models-4.1.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - grz_pydantic_models
  requires:
  - pip
