about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_file: LICENSE
  summary: Pydantic models for the GRZ metadata schema
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - twrightsman
  - hoeze
package:
  name: grz-pydantic-models
  version: 4.1.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - pydantic >=2.12,<3
source:
  sha256: c53a0f28b0f4d70765f796b138c14ada070691afe490c47249cd2b9572d2aadd
  url: https://pypi.org/packages/source/g/grz-pydantic-models/grz_pydantic_models-4.1.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - grz_pydantic_models
  requires:
  - pip
