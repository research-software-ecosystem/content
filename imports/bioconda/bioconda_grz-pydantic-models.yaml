about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_file: LICENSE
  summary: Pydantic models for the GRZ metadata schema
build:
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - twrightsman
  - hoeze
package:
  name: grz-pydantic-models
  version: 4.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - pydantic >=2.12,<3
source:
  sha256: cdc603f18800251773324831dc54f1e494437f8931e2a2483bf6bf6a34abf0bb
  url: https://pypi.org/packages/source/g/grz-pydantic-models/grz_pydantic_models-4.0.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - grz_pydantic_models
  requires:
  - pip
