about:
  home: https://github.com/mgy520/SpatialQC
  license: MIT
  license_file: LICENSE
  summary: Spatial transcriptome quality control, generate HTML QC report, obtain
    filtered clean data
build:
  entry_points:
  - SpatialQC = SpatialQC.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - nilchia
  skip-lints:
  - cython_must_be_in_host
package:
  name: spatialqc
  version: 1.0.3.3
requirements:
  host:
  - python >=3.8,<3.9
  - pip
  run:
  - python >=3.8,<3.9
  - scanpy >=1.9.8
  - joblib >=1.4.2
  - plotly >=5.22.0
  - scrublet >=0.2.3
  - anndata2ri >=1.3.1
  - cython
source:
  sha256: 9fb4de7a836438546a7d05016c51a9db2a183f30a1c1b8ea2fbd9895e99c9eb6
  url: https://pypi.org/packages/source/S/SpatialQC/spatialqc-1.0.3.3.tar.gz
test:
  commands:
  - pip check
  - SpatialQC --help
  imports:
  - SpatialQC
  requires:
  - pip
  - python
