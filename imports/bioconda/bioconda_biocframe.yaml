about:
  home: https://github.com/BiocPy/biocframe
  license: MIT
  license_file: LICENSE.txt
  summary: Flexible dataframe representation to support nested structures.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: biocframe
  version: 0.8.1
requirements:
  host:
  - python >=3.9
  - hatchling
  - hatch-vcs
  - pip
  run:
  - python >=3.9
  - numpy >=1.26.0
  - biocutils >=0.3.3
source:
  sha256: 30c6d818c00b58eea2711ff5d871710572e3126d33766548c93477feaac30aa9
  url: https://pypi.org/packages/source/b/biocframe/biocframe-0.8.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - biocframe
  requires:
  - pip
