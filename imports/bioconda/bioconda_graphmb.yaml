about:
  home: https://github.com/MicrobialDarkMatter/GraphMB
  license: MIT
  license_file: LICENSE
  summary: GraphMB is a Metagenomic Binner developed for long-read assemblies, that
    takes advantage of graph machine learning algorithms and the assembly graph generated
    during assembly.
build:
  entry_points:
  - graphmb=graphmb.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv
extra:
  recipe-maintainers:
  - AndreLamurias
package:
  name: graphmb
  version: 0.2.6
requirements:
  host:
  - python >=3.8
  - setuptools >=58.0,<59.dev0
  - pip >=19,!=20.0,!=20.0.1,<21
  - wheel
  - sphinx_rtd_theme
  - twine
  run:
  - python
  - requests
  - networkx >=2.6.2
  - pytorch >=1.13.1
  - tensorflow >=2.12.1
  - tqdm >=4.66.3
  - mlflow >=2.8.1
  - importlib_resources
source:
  sha256: 234017e2b3182c67e45a03b2cd85b8752fc6f943e9a245ed4c0d42717018c0c2
  url: https://pypi.org/packages/source/g/graphmb/graphmb-0.2.6.tar.gz
test:
  commands:
  - graphmb --help
  imports:
  - graphmb
  requires:
  - pip
  - python
