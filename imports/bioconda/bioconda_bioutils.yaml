about:
  dev_url: https://github.com/biocommons/bioutils
  doc_url: https://github.com/biocommons/bioutils
  home: https://github.com/biocommons/bioutils
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: Miscellaneous simple bioinformatics utilities and lookup tables.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.6.2
extra:
  recipe-maintainers:
  - ohsu-comp-bio
package:
  name: bioutils
  version: 0.6.2
requirements:
  host:
  - pip
  - python >=3.11,<3.14
  - setuptools-scm
  run:
  - python >=3.11,<3.14
  - attrs
  - requests
  - urllib3 >=1.26,<2.dev0
source:
  sha256: 16dfdd03e3097ae40bc9fcc95e4ac91deb883aa27bca568ab45fd4fe5fb62da0
  url: https://pypi.org/packages/source/b/bioutils/bioutils-0.6.2.tar.gz
test:
  imports:
  - bioutils
