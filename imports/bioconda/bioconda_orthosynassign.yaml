about:
  description: 'orthoSynAssign (Ortholog Synteny Assignment Tool) is a Python tool
    to partition orthogroups into syntenic orthogroups (SOGs)

    of positional orthologs using synteny information inferred from genome annotation
    files (BED converted from GFF3/GTF). It is a

    Python re-implementation of OrthoRefine, addressing sample-matching and memory-usage
    issues in the original C++ tool, with

    core synteny analysis implemented in Rust for speed and efficiency.

    '
  dev_url: https://github.com/stajichlab/orthoSynAssign
  doc_url: https://orthosynassign.readthedocs.io/
  home: https://github.com/stajichlab/orthoSynAssign
  license: GPL-3.0-or-later
  license_family: GPL
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Ortholog Synteny Assignment Tool for analyzing OrthoFinder results with
    genome annotations
