about:
  description: 'FastNLR scans the six reading frames of an assembled plant genome
    for

    amino-acid motifs and assembles complete and partial NLR loci. It is

    implemented in Rust and provides multithreaded scanning, memory-mapped

    FASTA input, checkpoint resume, and multi-format output.

    '
  dev_url: https://github.com/CropCoder/FastNLR
  doc_url: https://cropcoder.github.io/FastNLR
  home: https://github.com/CropCoder/FastNLR
  license: GPL-3.0-only
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Fast, accurate NLR immune-receptor locus annotation for plant genomes.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - CropCoder
package:
  name: fastnlr
  version: 2.0.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 5eeab8c73a5af565b14215c6f0c5672c91386f48fe182cfc6c39ea8caf3e9364
  url: https://github.com/CropCoder/FastNLR/archive/refs/tags/v2.0.0.tar.gz
test:
  commands:
  - fastnlr --version
  - fastnlr --help
