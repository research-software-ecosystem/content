about:
  description: 'MetaCAT bins metagenome assemblies into microbial genomes and associates

    the resulting genomes and their variants with host traits. This package

    provides the core MetaCAT commands; the optional checkm2 and gtdbtk

    subcommands additionally require those tools (and their databases) to be

    installed and available on PATH.

    '
  doc_url: https://github.com/liu-congcong/MetaCAT/tree/main/Documentation
  home: https://github.com/liu-congcong/MetaCAT
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Metagenome Clustering and Association Tool
build:
  binary_relocation: false
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  identifiers:
  - doi:10.1038/s41564-026-02472-7
  notes: 'The FragGeneScan, hmmsearch and mash binaries vendored in the upstream

    wheel have been removed; the conda packages are used instead.'
  recipe-maintainers:
  - wwood
  skip-lints:
  - should_be_noarch_generic
package:
  name: metacat
  version: 1.0.6
requirements:
  host:
  - python >=3.10
  - pip
  run:
  - python >=3.10
  - fraggenescan
  - hmmer >=3.1
  - mash
  - matplotlib-base >=3.10.0
  - numpy
  - scipy >=1.11.0
  - scikit-learn
  - statsmodels
  - threadpoolctl
source:
- sha256: 9735dc47372e626e9e454efd0b069fb80d58ba93d49744b41f64f67e89eb2066
  url: https://github.com/liu-congcong/MetaCAT/releases/download/v1.0.6/metacat-1.0.6-py3-none-any.whl
- sha256: 3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986
  url: https://raw.githubusercontent.com/liu-congcong/MetaCAT/v1.0.6/LICENSE
test:
  commands:
  - MetaCAT --version
  - MetaCAT seed --help
  - FragGeneScan 2>&1 | grep -q USAGE
  - hmmsearch -h > /dev/null
  - mash --version > /dev/null
  imports:
  - MetaCAT
