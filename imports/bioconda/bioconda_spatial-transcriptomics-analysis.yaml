about:
  description: 'ASTA runs an ensemble clustering, annotation and LLM-agent pipeline
    on

    Stereo-seq cell-bin GEF files. It provides the asta-* commands

    (asta-run, asta-watch, asta-saw, ...). The SAW FASTQ-to-GEF tool from

    STOmics is not included; asta-saw finds and runs an existing install.

    '
  dev_url: https://github.com/wandreopoulos/agentic_spatial_transcriptomics_analysis
  doc_url: https://github.com/wandreopoulos/agentic_spatial_transcriptomics_analysis/blob/v1.0.1/README.md
  home: https://github.com/wandreopoulos/agentic_spatial_transcriptomics_analysis
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Autonomous spatial transcriptomics analysis pipeline for Stereo-seq data
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: '$PYTHON -m pip install . -vv --no-deps --no-build-isolation

    mkdir -p "$PREFIX/share/asta"

    cp -r deploy "$PREFIX/share/asta/deploy"

    cp AI_AGENT_DEPLOY.md README.md "$PREFIX/share/asta/"

    '
extra:
  identifiers:
  - doi:10.64898/2026.08.10.743848
  recipe-maintainers:
  - pratham-rajesh
  - wandreopoulos
  - TimsPotatoChips
  - cpollett
  - maggieeez111
package:
  name: spatial-transcriptomics-analysis
  version: 1.0.1
requirements:
  host:
  - python 3.11
  - pip
  - setuptools >=68
  run:
  - python >=3.11
  - h5py >=3.14.0
  - matplotlib-base >=3.9.4
  - numpy >=2.0.2
  - openai >=2.43.0,<4
  - pandas >=2.3.3
  - scikit-learn >=1.6.1
  - scipy >=1.13.1
  - seaborn >=0.13.2
  - umap-learn >=0.5.12
  - watchdog >=6.0.0,<7
source:
  sha256: cf11fdfdd67daf2f786d268b5e8e2fb8521cb1cade1d257f0eed7cbdebbf972d
  url: https://github.com/wandreopoulos/agentic_spatial_transcriptomics_analysis/archive/refs/tags/v1.0.1.tar.gz
test:
  commands:
  - asta-baseline --help
  - asta-ensemble --help
  - asta-annotate --help
  - asta-agent --help
  - asta-run --help
  - asta-watch --help
  - asta-watch-launchd --help
  - asta-saw --help
  - command -v asta-notify
  - timeout 120 asta-watch --once --path "$(mktemp -d)"
  - test -f "$PREFIX/share/asta/README.md"
  - test -d "$PREFIX/share/asta/deploy"
  - pip check
  imports:
  - asta
  requires:
  - python 3.11
  - pip
