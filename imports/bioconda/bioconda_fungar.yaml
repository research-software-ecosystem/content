about:
  description: 'FUNGAR is a Bash pipeline for detecting antifungal resistance mutations

    directly from metagenomic short reads using DIAMOND and curated mutation databases.

    '
  dev_url: https://github.com/resgen-br/fungar
  home: https://github.com/resgen-br/fungar
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'FUNGAR: antifungal resistance detection pipeline.'
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: fungar
  version: 2.0.3
requirements:
  host:
  - python >=3.6
  run:
  - python >=3.6
  - pandas
  - diamond >=2.1.24,<2.2
source:
  sha256: d5600263e3dbbc43e5d60765e2cfbdc70bf23e42146b506029111af8970ab72d
  url: https://github.com/resgen-br/fungar/archive/refs/tags/v2.0.3.tar.gz
test:
  commands:
  - fungar --help
  - fungar_report.py --help
