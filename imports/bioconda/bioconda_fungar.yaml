about:
  description: 'FUNGAR is a Bash pipeline for detecting antifungal resistance mutations

    directly from metagenomic short reads using DIAMOND and curated mutation databases.

    '
  dev_url: https://github.com/resgen-br/fungar
  home: https://github.com/resgen-br/fungar
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'FUNGAR: antifungal resistance detection pipeline.'
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: fungar
  version: 2.0.1
requirements:
  host:
  - python >=3.6
  run:
  - python >=3.6
  - pandas
  - diamond >=2.1.24,<2.2
source:
  sha256: 5627f9121947f1fa8cdeb07b6ff222569fae30c09a962647b4c1c5782c86e524
  url: https://github.com/resgen-br/fungar/archive/refs/tags/v2.0.1.tar.gz
test:
  commands:
  - fungar --help
  - fungar_report.py --help
