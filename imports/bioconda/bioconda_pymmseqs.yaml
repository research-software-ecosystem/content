about:
  doc_url: https://github.com/heispv/pymmseqs/wiki
  home: https://github.com/heispv/pymmseqs
  license: MIT
  license_file: LICENSE
  summary: Python wrapper for MMseqs2
build:
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - prototaxites
package:
  name: pymmseqs
  version: 1.2.0
requirements:
  host:
  - python >=3.10
  - poetry-core
  - pip
  run:
  - python >=3.10
  - pyyaml >=6.0.1,<7.0.0
  - numpy >=1.22.4
  - pandas >=2.2.2
source:
  sha256: 9c29ee1327dd58656f166887aab466c7cf29f673037dc612edacb056a178f212
  url: https://pypi.org/packages/source/p/pymmseqs/pymmseqs-1.2.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - pymmseqs
  requires:
  - pip
  - python
