about:
  dev_url: https://github.com/raufs/skDER
  home: https://github.com/raufs/skDER
  license: BSD-3-Clause license
  license_family: BSD
  license_file: LICENSE
  summary: 'skDER & CiDDER: efficient & high-resolution dereplication methods for
    microbial genomes'
build:
  number: 0
  run_exports:
  - null
  script:
  - set -euxo pipefail
  - ' -m pip install . --no-deps --no-build-isolation -vvv'
  - mkdir -p ${PREFIX}/bin
  - export LDFLAGS=
  - ${CXX} -std=c++11 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/skDERsum src/skDER/skDERsum.cpp
  - ${CXX} -std=c++11 -Wl,-headerpad_max_install_names -o ${PREFIX}/bin/skDERcore
    src/skDER/skDERcore.cpp
  - chmod +x ${PREFIX}/bin/skDERcore
  - chmod +x ${PREFIX}/bin/skDERsum
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - raufs
package:
  name: skder
  version: 1.3.9
requirements:
  build:
  - null
  - null
  host:
  - python
  - setuptools
  - pip
  - wget
  run:
  - python >=3.11
  - biopython
  - setuptools
  - skani
  - wget
  - numpy
  - seaborn
  - matplotlib-base
  - python-igraph
  - pandas
  - pyrodigal
  - cd-hit
  - aiofile
  - aiohttp
  - tqdm
  - diamond >=2.1.11
source:
  sha256: d76ddbe3cc73412942e3dc4808cf260c6bef7d9a1f6973df166838c7712f7894
  url: https://github.com/raufs/skDER/archive/refs/tags/v1.3.9.tar.gz
test:
  commands:
  - skder -h
