about:
  description: 'Vaxrank selects mutated peptides for therapeutic personalized cancer

    vaccines, ranking candidates by a combination of predicted MHC binding

    affinity, RNA expression support and manufacturability.

    '
  dev_url: https://github.com/openvax/vaxrank
  home: https://github.com/openvax/vaxrank
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Ranked vaccine peptides for personalized cancer immunotherapy
build:
  entry_points:
  - vaxrank = vaxrank.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - jonasscheid
package:
  name: vaxrank
  version: 1.4.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  run:
  - python >=3.9
  - six
  - numpy >=1.14.0
  - pandas
  - pyensembl >=1.5.0
  - varcode >=0.5.9
  - isovar >=1.1.1
  - mhctools >=1.5.0
  - roman
  - jinja2
  - pypandoc
  - shellinford >=0.3.4
  - xlrd
  - xlsxwriter
  - xvfbwrapper
  - future >=0.16.0
  - astropy
  - setuptools <82
source:
  patches:
  - drop-removed-jinja2-autoescape-extension.patch
  - lazy-pdfkit-import.patch
  sha256: 0a287076eae0542a26fd0131848b230c803714de3ff5ba14d9add0e8d7c99be7
  url: https://pypi.org/packages/source/v/vaxrank/vaxrank-1.4.0.tar.gz
test:
  commands:
  - vaxrank --help
  imports:
  - vaxrank
  - vaxrank.manufacturability
