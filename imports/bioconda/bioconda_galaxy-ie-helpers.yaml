about:
  dev_url: https://github.com/bgruening/galaxy_ie_helpers
  home: https://github.com/bgruening/galaxy_ie_helpers
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Helper scripts to work with Galaxy's Interactive Environments.
build:
  entry_points:
  - get = galaxy_ie_helpers.cli:get
  - put = galaxy_ie_helpers.cli:put
  - get_user_history = galaxy_ie_helpers.cli:get_user_history
  - gx-get = galaxy_ie_helpers.cli:get
  - gx-put = galaxy_ie_helpers.cli:put
  - gx-get-user-history = galaxy_ie_helpers.cli:get_user_history
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: galaxy-ie-helpers
  version: 0.3.0
requirements:
  host:
  - python >=3.10
  - setuptools
  - pip
  run:
  - python >=3.10
  - bioblend
source:
  sha256: 20ae6e187f42c96cc29022b540618cd3bb58a999cec7927836e3c0860be60c55
  url: https://files.pythonhosted.org/packages/source/g/galaxy-ie-helpers/galaxy_ie_helpers-0.3.0.tar.gz
test:
  commands:
  - put --help
  - get --help
  imports:
  - galaxy_ie_helpers
