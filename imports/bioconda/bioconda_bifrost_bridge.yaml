about:
  description: 'bifrost_bridge converts outputs from multiple bioinformatics QC tools
    into

    normalized TSV files and can combine them into a single QC table.

    '
  dev_url: https://github.com/ssi-dk/bifrost_bridge
  home: https://github.com/ssi-dk/bifrost_bridge
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Normalize bioinformatics QC tool outputs into TSV summaries
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - PovilasMat
package:
  name: bifrost_bridge
  version: 0.9.2
requirements:
  host:
  - python >=3.11,<3.15
  - pip
  - hatchling
  run:
  - python >=3.11,<3.15
  - pandas >=2.3.3,<4
  - pyyaml >=6.0.3,<7
source:
  sha256: 2bd9eb2b81acd1390fb4dbd25af6aef76c8476d3a7bae11b5ac5bd17f1b320e1
  url: https://pypi.io/packages/source/b/bifrost_bridge/bifrost_bridge-0.9.2.tar.gz
test:
  commands:
  - bridge_mlst --help
  - bridge_fastp --help
  - bridge_quast --help
  - bridge_plasmidfinder --help
  - bridge_amrfinderplus --help
  - bridge_bracken --help
  - bridge_pmlst --help
  - bridge_rmlst --help
  - bridge_shovill --help
  - bridge_ssiamb --help
  - bridge_qc --help
  imports:
  - bifrost_bridge
