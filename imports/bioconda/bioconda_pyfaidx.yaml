about:
  dev_url: https://github.com/mdshw5/pyfaidx
  doc_url: https://pypi.org/project/pyfaidx
  home: https://github.com/mdshw5/pyfaidx
  license: BSD
  license_family: BSD
  license_file: LICENSE
  summary: 'pyfaidx: efficient pythonic random access to fasta subsequences'
build:
  entry_points:
  - faidx = pyfaidx.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.9.2.3
extra:
  identifiers:
  - biotools:pyfaidx
  - doi:10.7287/peerj.preprints.970v1
package:
  name: pyfaidx
  version: 0.9.2.3
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools-scm
  run:
  - python >=3.7
  - six
  - setuptools
  - packaging
  - pyvcf3
  - biopython
  - importlib-metadata
source:
  sha256: 27c7caf72ef2c4d3f3b8e8557526621b81e4edc0bee3f37af10bcfb59c10dbbb
  url: https://files.pythonhosted.org/packages/10/b6/9b9ea1ed086ef5f73f968566312ce44002ecfa4c17d9d2cc6a5d61ce946f/pyfaidx-0.9.2.3.tar.gz
test:
  commands:
  - faidx --help
  imports:
  - pyfaidx
