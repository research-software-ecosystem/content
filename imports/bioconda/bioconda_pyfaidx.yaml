about:
  dev_url: https://github.com/mdshw5/pyfaidx
  doc_url: https://pypi.org/project/pyfaidx
  home: https://github.com/mdshw5/pyfaidx
  license: BSD
  license_family: BSD
  license_file: LICENSE
  summary: 'pyfaidx: efficient pythonic random access to fasta subsequences'
build:
  entry_points:
  - faidx = pyfaidx.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.9.1
extra:
  identifiers:
  - biotools:pyfaidx
  - doi:10.7287/peerj.preprints.970v1
package:
  name: pyfaidx
  version: 0.9.1
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools-scm
  run:
  - python >=3.7
  - six
  - setuptools
  - packaging
  - pyvcf3
  - biopython
  - importlib-metadata
source:
  sha256: d84fa3bc90d48211101b509934431b00c0ac32de6513f7f348b90687135cc6ef
  url: https://files.pythonhosted.org/packages/1a/80/2037536971993928cc1cc3ae0b1cdb9723028c143a40b0f981aa92ba3045/pyfaidx-0.9.1.tar.gz
test:
  commands:
  - faidx --help
  imports:
  - pyfaidx
