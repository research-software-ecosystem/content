about:
  description: 'insilicoPCR finds the products of PCR and qPCR assays (primer pairs,
    with or without

    a probe) in genome assemblies (FASTA) and in raw Illumina reads (FASTQ), with
    BLAST+

    and BBTools, and reports every product with its size, mismatches and position.
    It runs

    on the command line (insilicoPCR -i <input> -p <primers> -o <output>) or in a
    window

    (insilicoPCR without arguments).

    '
  dev_url: https://github.com/duceppemo/insilicoPCR
  doc_url: https://github.com/duceppemo/insilicoPCR/wiki
  home: https://github.com/duceppemo/insilicoPCR
  license: MIT AND GPL-2.0-only WITH Classpath-exception-2.0 AND Apache-2.0
  license_family: MIT
  license_file:
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - third_party/OpenJFX/LICENSE
  - third_party/OpenJFX/ASSEMBLY_EXCEPTION
  summary: In silico PCR and qPCR of primer and probe assays on genome assemblies
    and raw sequencing reads.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  recipe-maintainers:
  - duceppemo
  skip-lints:
  - should_be_noarch_generic
package:
  name: insilicopcr
  version: 1.0.2
requirements:
  run:
  - openjdk >=25
  - blast >=2.17.0
  - bbmap >=40.04,<41
source:
  sha256: e113f455895eb8597c1ebfa07e658e31ed5c1660efe374c892a61cee99ea038f
  url: https://github.com/duceppemo/insilicoPCR/releases/download/v1.0.2/insilicoPCR-1.0.2-linux-x64-no-runtime.zip
test:
  commands:
  - insilicoPCR --version
