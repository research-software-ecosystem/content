about:
  dev_url: https://github.com/MDU-PHL/ngmaster
  doc_url: https://github.com/MDU-PHL/ngmaster/blob/master/README.md
  home: https://github.com/MDU-PHL/ngmaster
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: In silico multi-antigen sequence typing for N. gonorrhoeae (NG-MAST and
    NG-STAR).
build:
  entry_points:
  - ngmaster = ngmaster.run_ngmaster:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir'
extra:
  recipe-maintainers:
  - stroehleina
  - kristyhoran
package:
  name: ngmaster
  version: 2.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - biopython
  - mlst
  - mlstdb >=1.2.0
  - requests
  - bs4
  - certifi >=2023.7.22
  - idna >=3.15
  - requests >=2.33.0
  - urllib3 >=2.7.0
source:
  sha256: a7435e91bcb02a051117cb3d4d9871cdb4317ec49d2bfdcd3c1f0ad139bcdad9
  url: https://github.com/MDU-PHL/ngmaster/archive/refs/tags/v2.1.0.tar.gz
test:
  commands:
  - PYTHON_GIL=1 ngmaster --help
  - PYTHON_GIL=1 ngmaster --test
  imports:
  - ngmaster
