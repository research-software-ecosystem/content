about:
  description: The Zarr specification defines a format for chunked, compressed, N-dimensional
    arrays.  It's design allows efficient access to subsets of the stored array, and
    supports both local and cloud storage systems.  Rarr aims to implement this specification
    in R with minimal reliance on an external tools or libraries.
  home: https://bioconductor.org/packages/3.23/bioc/html/Rarr.html
  license: MIT + file LICENSE
  license_file: LICENSE
  summary: Read Zarr Files in R
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
package:
  name: bioconductor-rarr
  version: 2.0.1
requirements:
  build:
  - null
  - null
  - null
  - automake
  - make
  host:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-delayedarray >=0.38.2,<0.39.0
  - r-base
  - r-curl
  - r-jsonlite
  - r-lifecycle
  - r-paws.storage
  - r-r.utils
  - libblas
  - liblapack
  - zlib
  - liblzma-devel
  run:
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-delayedarray >=0.38.2,<0.39.0
  - r-base
  - r-curl
  - r-jsonlite
  - r-lifecycle
  - r-paws.storage
  - r-r.utils
source:
  md5: e6134d0401e2aa2cf7fc37533da398bc
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Rarr_2.0.1.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/Rarr/Rarr_2.0.1.tar.gz
  - https://bioarchive.galaxyproject.org/Rarr_2.0.1.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-rarr/bioconductor-rarr_2.0.1_src_all.tar.gz
test:
  commands:
  - $R -e "library('Rarr')"
