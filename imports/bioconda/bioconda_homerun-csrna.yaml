about:
  dev_url: https://github.com/thomasmnguyen/homerun-csrna
  doc_url: https://thomasmnguyen.dev/homerun/
  home: https://thomasmnguyen.dev/homerun/
  license: MIT
  license_file: LICENSE
  summary: csRNA-seq pipeline
build:
  entry_points:
  - homerun = homerun.pipeline:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
package:
  name: homerun-csrna
  version: 1.0.0
requirements:
  host:
  - python >=3.9
  - setuptools >=61.0
  - pip
  run:
  - python >=3.9
  - pandas >=2.0
  - numpy >=1.24
  - matplotlib-base >=3.7
  - seaborn >=0.12
  - reportlab >=4.0
  - samtools
  - homer
  - skewer
  - star
  - hisat2
source:
  sha256: 85e9332ef8991daaa7ea0c1c928860443f663fcf9fcd5fe0a0cac82282f4a5ff
  url: https://pypi.org/packages/source/h/homerun-csRNA/homerun_csrna-1.0.0.tar.gz
test:
  commands:
  - pip check
  - homerun --help
  imports:
  - homerun
  requires:
  - pip
  - python
