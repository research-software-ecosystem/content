about:
  dev_url: https://github.com/thomasmnguyen/homerun-csrna
  doc_url: https://thomasmnguyen.dev/homerun
  home: https://thomasmnguyen.dev/homerun
  license: MIT
  license_file: LICENSE
  summary: csRNA-seq pipeline
build:
  entry_points:
  - homerun = homerun.pipeline:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
package:
  name: homerun-csrna
  version: 1.1.0
requirements:
  host:
  - python >=3.9
  - setuptools >=61.0
  - pip
  run:
  - python >=3.9
  - pandas >=2.0
  - numpy >=1.24
  - matplotlib-base >=3.7
  - openpyxl
  - seaborn-base >=0.12
  - reportlab >=4.0
  - samtools
  - homer
  - skewer
  - star
  - hisat2
source:
  sha256: 91692751957e07bfcfd21d2318496ca17335a846155430d4a69790c07e73714f
  url: https://pypi.org/packages/source/h/homerun-csRNA/homerun_csrna-1.1.0.tar.gz
test:
  commands:
  - pip check
  - homerun --help
  imports:
  - homerun
