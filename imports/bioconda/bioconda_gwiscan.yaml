about:
  description: 'GWIscan is a pipeline for the genome-wide identification and annotation
    of gene

    families and superfamilies which combines BLAST, profile hidden Markov models,

    and InterProScan. It runs in family, superfamily, or architecture modes, on a

    single proteome or across multiple species.

    '
  dev_url: https://github.com/beavenmanjengwa/gwiscan
  home: https://github.com/beavenmanjengwa/gwiscan
  license: MIT
  license_file: LICENSE
  summary: Genome-wide identification and annotation pipeline for gene families or
    superfamilies
build:
  entry_points:
  - gwiscan = gwiscan.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - beavenmanjengwa
package:
  name: gwiscan
  version: 1.0.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.10
  - biopython >=1.80
  - pandas >=1.5
  - openpyxl >=3.1
  - requests >=2.28
  - pyyaml >=6.0
  - setuptools
  - hmmer
  - diamond
  - seqkit
  - mafft
  - clipkit
  - iqtree
  - meme
  - weblogo
  - r-base
  - r-ggplot2
  - r-dplyr
  - r-tidyr
source:
  sha256: 8f1a18c922aa49856b9d89494b35bc65ee626c3ff74dbce06135630558df2ecd
  url: https://github.com/beavenmanjengwa/gwiscan/archive/refs/tags/v1.0.1.tar.gz
test:
  commands:
  - gwiscan --help
  - gwiscan --version
  imports:
  - gwiscan
