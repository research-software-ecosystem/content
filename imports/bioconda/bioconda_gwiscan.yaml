about:
  description: 'GWIscan is a pipeline for the genome-wide identification and annotation
    of gene

    families. It combines BLAST, profile hidden Markov models, and InterProScan for

    identification. It runs in family, multi-family, or architecture modes, on a

    single proteome or across multiple species.

    '
  dev_url: https://github.com/beavenmanjengwa/gwiscan
  home: https://github.com/beavenmanjengwa/gwiscan
  license: MIT
  license_file: LICENSE
  summary: GWIscan is a pipeline for the genome-wide identification and annotation
    of gene families.
build:
  entry_points:
  - gwiscan = gwiscan.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - beavenmanjengwa
package:
  name: gwiscan
  version: 1.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.10
  - biopython >=1.80
  - pandas >=1.5
  - openpyxl >=3.1
  - requests >=2.28
  - pyyaml >=6.0
  - setuptools
  - hmmer
  - diamond
  - seqkit
  - mafft
  - clipkit
  - iqtree
  - meme
  - weblogo
  - r-base
  - r-ggplot2
  - r-dplyr
  - r-tidyr
source:
  sha256: 05b4168c989da8238177f85005c82463d7f3782a2630d8194e3c13fd256d043a
  url: https://github.com/beavenmanjengwa/gwiscan/archive/refs/tags/v1.1.0.tar.gz
test:
  commands:
  - gwiscan --help
  - gwiscan --version
  imports:
  - gwiscan
