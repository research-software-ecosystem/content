about:
  description: "GWIscan takes a user-defined gene family, searches a proteome by both\
    \ BLAST-based homology and profile HMM, \nconfirms candidates by family signature,\
    \ and provides detailed in silico annotation. It operates in three modes\n(family,\
    \ multi-family, and architecture) and runs on a single proteome or across multiple\
    \ species.\n"
  dev_url: https://github.com/beavenmanjengwa/gwiscan
  home: https://github.com/beavenmanjengwa/gwiscan
  license: MIT
  license_file: LICENSE
  summary: GWIscan is a pipeline for the genome-wide identification and in silico
    characterization of gene families.
build:
  entry_points:
  - gwiscan = gwiscan.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - beavenmanjengwa
package:
  name: gwiscan
  version: 1.2.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.10
  - biopython >=1.80
  - pandas >=1.5
  - openpyxl >=3.1
  - requests >=2.28
  - pyyaml >=6.0
  - setuptools
  - hmmer
  - diamond
  - seqkit
  - mafft
  - clipkit
  - iqtree
  - meme
  - weblogo
  - r-base
  - r-ggplot2
  - r-dplyr
  - r-tidyr
source:
  sha256: b31a002d0975abf11264a9b0d9643d089c31b681fb90b7527e240d4de5a82cb1
  url: https://github.com/beavenmanjengwa/gwiscan/archive/refs/tags/v1.2.0.tar.gz
test:
  commands:
  - gwiscan --help
  - gwiscan --version
  imports:
  - gwiscan
