about:
  description: 'spearfish maps long RNA-seq reads (ONT cDNA, ONT direct RNA, PacBio)
    to a transcriptome.

    For each read it reports every compatible transcript, the read''s position on
    it, and its

    score difference from the best candidate, for EM quantification with oarfish.

    '
  dev_url: https://github.com/COMBINE-lab/spearfish
  doc_url: https://combine-lab.github.io/spearfish/
  home: https://combine-lab.github.io/spearfish/
  license: BSD-3-Clause
  license_family: BSD
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Fast long-read RNA-seq mapping to a transcriptome with locally consistent
    parsing
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - rob-p
package:
  name: spearfish
  version: 0.3.2
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: bb4bf4a1aa6177d751858288c2ca6907f0b0c80bfa3525ffeb56dc944460ea6d
  url: https://github.com/COMBINE-lab/spearfish/archive/refs/tags/v0.3.2.tar.gz
test:
  commands:
  - spearfish --version
  - spearfish doctor
