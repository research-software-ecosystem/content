about:
  description: 'spearfish maps long RNA-seq reads (ONT cDNA, ONT direct RNA, PacBio)
    to a transcriptome.

    For each read it reports every compatible transcript, the read''s position on
    it, and its

    score difference from the best candidate, for EM quantification with oarfish.

    '
  dev_url: https://github.com/COMBINE-lab/spearfish
  doc_url: https://combine-lab.github.io/spearfish/
  home: https://combine-lab.github.io/spearfish/
  license: BSD-3-Clause
  license_family: BSD
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Fast long-read RNA-seq mapping to a transcriptome with locally consistent
    parsing
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - rob-p
package:
  name: spearfish
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 5a3ee790ce25d20ef326e8a24ccee1b66a417126efbd1a75190f1d68e7c92dd1
  url: https://github.com/COMBINE-lab/spearfish/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - spearfish --version
  - spearfish doctor
