about:
  description: 'fasta2genotype converts the per-sample haplotype FASTA file written
    by the

    Stacks populations program (Stacks 1 and 2) into input files for

    population-genetic software, including Structure, Genepop, Arlequin,

    migrate-n, G-PhoCS, PHYLIP, TreeMix, LFMM, DIYABC, BayeScan, samBada and

    GenAlEx, with optional quality filters.

    '
  dev_url: https://github.com/paulmaier/fasta2genotype
  doc_url: https://github.com/paulmaier/fasta2genotype#readme
  home: https://github.com/paulmaier/fasta2genotype
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Convert Stacks haplotype FASTA files into input for population-genetic
    software.
build:
  entry_points:
  - fasta2genotype = fasta2genotype:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.1111/evo.13868
  recipe-maintainers:
  - paulmaier
package:
  name: fasta2genotype
  version: 2.0.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  run:
  - python >=3.9
source:
  sha256: 5773bccbf53daf15289090291936067c5bfd52f991fb7592731380efbb5f23a4
  url: https://pypi.org/packages/source/f/fasta2genotype/fasta2genotype-2.0.0.tar.gz
test:
  commands:
  - fasta2genotype --help
  - fasta2genotype --version
  imports:
  - fasta2genotype
