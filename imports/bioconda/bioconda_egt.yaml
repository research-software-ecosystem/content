about:
  dev_url: https://github.com/conchoecia/egt
  doc_url: https://github.com/conchoecia/egt
  home: https://github.com/conchoecia/egt
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Evolutionary Genome Topology: chromosome-evolution analysis toolkit for
    metazoan genomes using reciprocal-best-hits data.'
build:
  entry_points:
  - egt = egt.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vv --no-deps --no-build-isolation'
extra:
  identifiers:
  - pypi:egt
  - doi:10.1126/sciadv.adz5561
  recipe-maintainers:
  - conchoecia
package:
  name: egt
  version: 0.2.5
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib-base
  - networkx
  - pillow
  - umap-learn
  - datashader
  - holoviews
  - scikit-image
  - colorcet
  - bokeh
  - ete4
  - snakemake-minimal >=7,<9
  - pyyaml
source:
  sha256: 019375814c2e1e024e416ae2d3b5cc89c31268b33c635ab4d6bcc2932a0798f7
  url: https://files.pythonhosted.org/packages/2c/26/9737d2fd448bd912ba033fd74c91f249a2061792c6da45fda7037c54f6ef/egt-0.2.5.tar.gz
test:
  commands:
  - egt --help
  imports:
  - egt
