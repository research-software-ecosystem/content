about:
  dev_url: https://github.com/conchoecia/egt
  doc_url: https://github.com/conchoecia/egt
  home: https://github.com/conchoecia/egt
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Evolutionary Genome Topology: chromosome-evolution analysis toolkit for
    metazoan genomes using reciprocal-best-hits data.'
build:
  entry_points:
  - egt = egt.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vv --no-deps --no-build-isolation'
extra:
  identifiers:
  - pypi:egt
  - doi:10.1126/sciadv.adz5561
  recipe-maintainers:
  - conchoecia
package:
  name: egt
  version: 0.2.6
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib-base
  - networkx
  - pillow
  - umap-learn
  - datashader
  - holoviews
  - scikit-image
  - colorcet
  - bokeh
  - ete4
  - snakemake-minimal >=7,<9
  - pyyaml
source:
  sha256: e62b9f9d00d148f0fd1f2ff28a99879c227a438d82abc31bdfcea0596b2612a5
  url: https://files.pythonhosted.org/packages/8b/6c/78657de1115563d0e08150265d330762a1f90704c170f09fd1eefde9e3d8/egt-0.2.6.tar.gz
test:
  commands:
  - egt --help
  imports:
  - egt
