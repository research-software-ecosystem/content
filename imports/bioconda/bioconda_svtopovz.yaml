about:
  dev_url: https://github.com/PacificBiosciences/HiFi-SVTopo
  home: https://github.com/PacificBiosciences/HiFi-SVTopo
  license: Pacific Biosciences Software License Agreement
  summary: 'Complex structural variant visualization for HiFi sequencing data: plotting
    tool.'
build:
  entry_points:
  - svtopovz = svtopovz.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install SVTopoVz/ --no-deps --no-build-isolation --no-cache-dir'
extra:
  recipe-maintainers:
  - jbelyeu
package:
  name: svtopovz
  version: 0.3.1
requirements:
  host:
  - pip
  - python >=3.10
  - cython >=3.0.10
  - setuptools
  run:
  - python >=3.10
  - matplotlib-base >=3.8.4
  - numpy ==1.26.4
  - scikit-image >=0.24.0
  - Jinja2 ==3.1.5
  - tqdm ==4.67.1
  - pytest ==8.3.5
source:
  sha256: 80f5bd9b91a9b285a67e6644d361b889ae27ab20c25525b2e26fb72fe66b6d6b
  url: https://github.com/PacificBiosciences/SVTopo/archive/refs/tags/v0.3.1.tar.gz
test:
  commands:
  - svtopovz --version
  - svtopovz --help
