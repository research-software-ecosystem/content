about:
  description: 'AlphaBase provides foundational data structures and utilities for

    mass spectrometry-based proteomics in the AlphaPept ecosystem.

    '
  dev_url: https://github.com/MannLabs/alphabase
  doc_url: https://alphabase.readthedocs.io/en/latest
  home: https://github.com/MannLabs/alphabase
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: An infrastructure Python package of the AlphaX ecosystem.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - jonasscheid
package:
  name: alphabase
  version: 1.10.0
requirements:
  host:
  - python >=3.9
  - setuptools
  - pip
  run:
  - python >=3.9
  - numba
  - numpy
  - pandas
  - h5py
  - contextlib2
  - python-xxhash
  - biopython
  - tqdm
  - regex
  - pyarrow
  - pyahocorasick
  - pyteomics
  - pyyaml
  - lxml
  - rdkit
  - certifi
source:
  sha256: 9adf37c0c7a458ec74408d72a7c8ad863ab79cebace3236606ce88a93d1b49ce
  url: https://pypi.org/packages/source/a/alphabase/alphabase-1.10.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - alphabase
