about:
  dev_url: https://github.com/openvax/pyensembl
  home: https://github.com/openvax/pyensembl
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Python interface to ensembl reference genome metadata.
build:
  entry_points:
  - pyensembl = pyensembl.shell:run
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - wget https://files.pythonhosted.org/packages/30/94/3a66a2643773fc1f89a9b896d8b072121e8a24261a2e74b7fbf9abe37c29/datacache-1.26.0.tar.gz
  - tar -xvzf datacache-1.26.0.tar.gz
  - cd datacache-1.26.0
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  - cd ../
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: pyensembl
  version: 2.31.1
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  - wget
  - tar
  run:
  - python >=3.9
  - typechecks >=0.0.2
  - memoized-property >=1.0.2
  - tinytimer
  - gtfparse >=2.9.0
  - serializable
  - numpy >=2.0.0
  - pyfaidx >=0.8.1
  - filelock >=3.24,<5.0.0
  - filelock >=3.12,<4.0.0
  - pandas >=0.15
  - six >=1.9.0
  - pylint >=1.4.4
  - python-dateutil >=2.5.0
  - platformdirs >=3.0
  - requests >=2.5.1
  - tqdm >=4.64
source:
  sha256: a217d32c5dfef5c1c8052b32289e7e3c3c29f689d416fdac23d562d1d99f7568
  url: https://pypi.org/packages/source/p/pyensembl/pyensembl-2.31.1.tar.gz
test:
  commands:
  - pyensembl --help
  imports:
  - pyensembl
