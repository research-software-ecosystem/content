about:
  home: https://trinotate.github.io/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Trinotate is a comprehensive annotation suite designed for automatic functional
    annotation of transcriptomes, particularly de novo assembled transcriptomes, from
    model or non-model organisms
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  identifiers:
  - biotools:trinotate
  - usegalaxy-eu:trinotate
package:
  name: trinotate
  version: 4.0.5
requirements:
  host:
  - perl
  - perl-app-cpanminus
  - perl-module-build
  - perl-dbi
  - perl-dbd-sqlite
  - perl-file-find-rule
  run:
  - perl
  - sqlite
  - perl-app-cpanminus
  - perl-module-build
  - perl-dbi
  - perl-dbd-sqlite
  - perl-cgi
  - blast
  - hmmer
  - perl-file-find-rule
  - wget
  - diamond
  - infernal
source:
  sha256: 947248b45f2d82af1cd4c899a5e24b0b0b9dda4bf7bb8c137d4a504a18c16a2e
  url: https://github.com/Trinotate/Trinotate/archive/refs/tags/Trinotate-v4.0.5.tar.gz
test:
  commands:
  - Trinotate --help 2>&1 | grep "Trinotate --db <sqlite.db>"
  - test -n "${TRINOTATE_HOME}" && test -x "${TRINOTATE_HOME}/util/Trinotate_report_writer.pl"
  - perl "${TRINOTATE_HOME}/util/admin/util/init_Trinotate_sqlite_db.pl" --sqlite
    test.sqlite
  - Trinotate --db test.sqlite --report > report.tsv 2> report.err || true
  - grep -q "Transcript table in test.sqlite is empty" report.err
  - gunzip -c "${TRINOTATE_HOME}/testing/input_data/Trinity.fasta.gz" > Trinity.fasta
  - gunzip -c "${TRINOTATE_HOME}/testing/input_data/Trinity.fasta.gene_to_trans_map.gz"
    > gene_trans_map
  - gunzip -c "${TRINOTATE_HOME}/testing/input_data/Trinity.fasta.transdecoder.pep.gz"
    > transdecoder.pep
  - Trinotate --db test.sqlite --init --gene_trans_map gene_trans_map --transcript_fasta
    Trinity.fasta --transdecoder_pep transdecoder.pep
  - Trinotate --db test.sqlite --report --pfam_cutoff DNC > report.tsv
  - head -1 report.tsv | grep transcript_id
  - test $(grep -c TRINITY_ report.tsv) -gt 600
