about:
  description: 'vepyr (VEP Yielding Performant Results) is a Python interface to a
    Rust

    reimplementation of Ensembl''s Variant Effect Predictor, built on Apache

    Arrow and DataFusion. It converts Ensembl VEP caches to Parquet and

    annotates variants through a streaming engine, returning Polars LazyFrames

    or annotated VCF files.

    '
  dev_url: https://github.com/biodatageeks/vepyr
  doc_url: https://biodatageeks.org/vepyr/
  home: https://github.com/biodatageeks/vepyr
  license: Apache-2.0
  license_family: Apache
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Rust-powered Ensembl VEP variant annotation for Python
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  recipe-maintainers:
  - mwiewior
package:
  name: vepyr
  version: 0.6.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
  - cmake
  - make
  - pkg-config
  - git
  - cross-python_
  host:
  - python
  - pip
  - maturin >=1.0,<2.0
  run:
  - python
  - pyarrow >=18.0
  - polars >=1.37.1
  - tqdm >=4.60
source:
  sha256: 7a28e6bc6f25d550e46765df0a94a7ca27a4a3d3e77ca778da0940d0c7a7a7ad
  url: https://pypi.org/packages/source/v/vepyr/vepyr-0.6.0.tar.gz
test:
  commands:
  - pip check
  - vepyr --version
  - vepyr annotate --help
  - python -c "import vepyr; assert vepyr.__version__ == '0.6.0'; targets = vepyr.supported_vep_targets();
    assert targets; assert all(t.get('vepyr_version') == '0.6.0' for t in targets);
    assert {t.get('cache_version') for t in targets} == {'115', '116'}; print('compiled
    VEP targets passed')"
  - python -c "import tempfile; from pathlib import Path; from vepyr._core import
    vcf_contigs; tmp = tempfile.TemporaryDirectory(); vcf = Path(tmp.name) / 'smoke.vcf';
    vcf.write_text('##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\n1\t101\t.\tA\tG\t.\tPASS\t.\n2\t202\t.\tC\tT\t.\tPASS\t.\n');
    contigs = tuple(sorted(vcf_contigs(str(vcf)))); assert contigs == ('1', '2'),
    contigs; tmp.cleanup(); print('native VCF scan passed')"
  imports:
  - vepyr
  - vepyr._core
  requires:
  - pip
