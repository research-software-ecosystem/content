about:
  dev_url: https://github.com/pjbriggs/nebulizer
  doc_url: https://nebulizer.readthedocs.io/en/latest/
  home: https://github.com/pjbriggs/nebulizer
  license: AFL-3.0
  license_file: LICENSE
  summary: Command-line utilities to help with managing users, data libraries and
    tools in a Galaxy instance
build:
  entry_points:
  - nebulizer = nebulizer.cli:nebulizer
  noarch: python
  number: 0
  run_exports:
  - null
  script: python setup.py install --single-version-externally-managed --record=record.txt
package:
  name: nebulizer
  version: 0.7.2
requirements:
  host:
  - python
  - setuptools
  run:
  - python
  - bioblend
  - mako
  - click <=6.7
source:
  sha256: 049fe95c84e8fe4cc7e299061d84ce7fbb9660e3234749a1f832de2348951d51
  url: https://github.com/pjbriggs/nebulizer/archive/v0.7.2.tar.gz
test:
  commands:
  - nebulizer --help
