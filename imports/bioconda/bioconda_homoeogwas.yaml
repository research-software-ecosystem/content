about:
  description: 'HomoeoGWAS partitions additive genetic variance by subgenome with
    multi-kernel REML and

    leave-one-chromosome-out association scans, and tests predefined homoeolog groups
    for

    pairwise interaction with an encoding-robust omnibus statistic and experiment-wide

    bootstrap minimum-P error control. It provides a command-line interface, a Python
    API and

    a Model Context Protocol server for AI assistants.

    '
  dev_url: https://github.com/Shipeng-Yang/HomoeoGWAS
  doc_url: https://shipeng-yang.github.io/HomoeoGWAS
  home: https://github.com/Shipeng-Yang/HomoeoGWAS
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Subgenome-aware mixed-model GWAS and homoeolog interaction analysis for
    allopolyploids
build:
  entry_points:
  - homoeogwas = homoeogwas_launcher:main
  - homoeogwas-mcp = homoeogwas.mcp_server:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - Shipeng-Yang
package:
  name: homoeogwas
  version: 2.2.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61
  run:
  - python >=3.10
  - numpy >=1.24
  - scipy >=1.10
  - pandas >=2.0
  - scikit-learn >=1.3
  - matplotlib-base >=3.7
  - bed-reader >=1.0
  - pyyaml >=6.0
  - pydantic >=2.5
  - joblib >=1.3
  - threadpoolctl >=3.1
  - pysam >=0.22
  - mcp >=1.0,<2
source:
  sha256: b17ef4b8a7ae4cb59b7a8fd63b66453ad86516c330367f27ef4e89506cea7773
  url: https://pypi.org/packages/source/h/homoeogwas/homoeogwas-2.2.0.tar.gz
test:
  commands:
  - homoeogwas --help
  - homoeogwas interact --help
  - python -c "import homoeogwas; assert homoeogwas.__version__ == '2.2.0'"
  imports:
  - homoeogwas
  - homoeogwas.interact
  - homoeogwas.omnib_family
  - homoeogwas.mcp_server
