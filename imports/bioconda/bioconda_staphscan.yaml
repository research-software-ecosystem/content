about:
  doc_url: https://staphscan.readthedocs.io/en/latest
  home: https://github.com/riccabolla/StaphSCAN
  license: MIT
  license_file: LICENSE
  summary: A tool for Staphylococcus aureus analysis.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - riccabolla
package:
  name: staphscan
  version: 0.4.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - pandas
  - biopython >=1.78
  - blast
  - mash >=2.0
  - rauth
  - requests
source:
  sha256: 3c63690b9d21a63ca4d05e84278bf0df1a2644c09fe26b142d47e8dad6d07c2f
  url: https://github.com/riccabolla/StaphSCAN/archive/refs/tags/v0.4.1.tar.gz
test:
  commands:
  - staphscan --help
