about:
  description: 'CompareM2 runs fourteen analysis tools over a set of microbial assemblies

    and renders one self-contained HTML report: assembly statistics,

    completeness, taxonomy, annotation, AMR genes, sequence types, ANI, a

    pangenome, phylogenies and draft metabolic models.

    '
  dev_url: https://github.com/cmkobel/CompareM2
  doc_url: https://comparem2.readthedocs.io
  home: https://github.com/cmkobel/CompareM2
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Rapid microbial genomes-to-report pipeline
build:
  entry_points:
  - comparem2 = comparem2.cli:main
  - cm2 = comparem2.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.1093/bioinformatics/btaf517
  recipe-maintainers:
  - cmkobel
package:
  name: comparem2
  version: 3.0.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools >=77
  run:
  - python >=3.11
  - snakemake-minimal >=9,<10
  - snakemake-executor-plugin-slurm
  - snakemake-executor-plugin-cluster-generic
  - textual
  - conda
source:
  sha256: f7644b3a6fdb774584d4f5246e59c43bd31dea3b572f191e3f27267afd5d05df
  url: https://github.com/cmkobel/CompareM2/archive/refs/tags/v3.0.0.tar.gz
test:
  commands:
  - comparem2 --version
  - comparem2 --help
  - cm2 --help
  imports:
  - comparem2
