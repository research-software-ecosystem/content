about:
  description: 'TesserACT assembles bacterial genomes from paired-end Illumina reads
    with one command,

    `tesseract -1 R1.fq.gz -2 R2.fq.gz -o OUTDIR`. It checks the reads before assembling,

    builds de Bruijn graphs over a ladder of k-mer sizes, resolves repeats with read
    pairs,

    writes verified circular replicons, and checks every output, with a plain-language
    summary.

    Optional organism models (`tesseract models download`, then `--organism NAME`)
    lay the

    chromosome out from the conserved gene order of closed genomes of the same species.

    '
  dev_url: https://github.com/iowa69/TesserACT
  doc_url: https://github.com/iowa69/TesserACT/blob/v1.6.2/README.md
  home: https://github.com/iowa69/TesserACT
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: De novo assembler for bacterial isolates from paired-end Illumina reads,
    with optional organism models.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - iowa69
package:
  name: tesseract-assembler
  version: 1.6.2
requirements:
  build:
  - null
  - null
  - make
  host:
