about:
  description: 'TesserACT assembles bacterial isolates from paired-end Illumina reads.
    It builds a de

    Bruijn graph over a ladder of k-mer sizes, simplifies it, resolves repeats with

    paired-end information, closes gaps and polishes the result, in C++17 with no

    dependencies beyond a compiler, zlib and pthreads.


    Where a repeat is longer than a sequencing fragment there is no paired evidence
    to

    settle it, and TesserACT stops rather than guessing. Supplying a genus model built
    from

    closed genomes of the same organism lets it settle those junctions from independent

    evidence instead. Measured on 666 Klebsiella pneumoniae isolates that each have
    a closed

    reference genome, with leave-cluster-out models so no test genome is in its own
    panel:

    higher genome fraction and fewer mismatches per 100 kb than SPAdes, longer NGA50,
    at the

    cost of slightly more redundant sequence and slightly more misassemblies.


    With a model carrying a plasmid panel it also labels every contig chromosomal,
    plasmid

    or unknown, groups the contigs of one plasmid, and marks contigs whose two ends
    join as

    complete replicons. Pre-built Klebsiella models are attached to the GitHub releases.

    '
