about:
  doc_url: https://ylab-hi.github.io/ScanMST/
  home: https://github.com/ylab-hi/ScanMST
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A multi-segment transcript caller for long-read transcriptome sequencing
    data
build:
  number: 0
  run_exports:
  - null
  script: "export HTSLIB_ROOT=\"$PREFIX\"\nexport SCANMST_EMBED_RPATH=ON\n# Force\
    \ Ninja explicitly: scikit-build-core's generator auto-detection\n# does not reliably\
    \ find the build-prefix `ninja` on bioconda's Linux CI\n# runner and silently\
    \ falls back to \"Unix Makefiles\", which then fails\n# with CMAKE_MAKE_PROGRAM/compilers\
    \ not set (no `make` dep, and cmake's\n# own EnableLanguage compiler probe never\
    \ runs the conda compiler wrappers\n# in that path). Local conda-build runs didn't\
    \ hit this because ninja was\n# already resolved via the ambient PATH there.\n\
    export CMAKE_GENERATOR=Ninja\n -m pip install . -vv --no-deps --no-build-isolation\n"
  skip: true
extra:
  recipe-maintainers:
  - dolittle007
package:
  name: scanmst
  version: 0.1.9
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.18
  - ninja
  host:
  - python
  - pip
  - scikit-build-core >=0.10
  - pybind11 >=2.12,<4
  - htslib ==1.20
  - zlib >=1.2.13,<1.3.0a0
  run:
  - python
  - htslib ==1.20
  - pysam ==0.22.0
  - htseq ==2.0.5
  - numpy ==1.26.4
  - biopython >=1.81,<2
  - pyfaidx >=0.8.1,<0.9
  - psutil >=7.0.0,<8
  - loguru >=0.7.0,<0.8
  - rich >=14.0.0,<15
  - networkx >=3.2,<4
  - pyabpoa >=1.5.3,<2
  - alignparse >=0.7.1,<0.8
  - matplotlib-base >=3.9,<4
  - intervaltree >=3.1.0,<4
  - joblib >=1.5.0,<2
  - pyyaml >=6,<7
  - requests >=2.31,<3
source:
  sha256: 27b0f827533cddffd702f2e33997645587d4d5368647580a01d732df11fbb7b5
  url: https://pypi.io/packages/source/s/scanmst/scanmst-0.1.9.tar.gz
test:
  commands:
  - scanmst --version
  imports:
  - scanmst
  - scanmst.cppext
