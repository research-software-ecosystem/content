about:
  description: 'RhizAeon is a Rust-backed scanner for detecting and characterizing

    recombination events in nucleotide sequence alignments. It projects

    alignment columns onto a phylo-attention force field, screens candidate

    recombinant taxa, verifies tracts under Fisher/Poisson significance

    floors, and can emit JSON summaries plus standalone HTML dashboards.

    '
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'RhizAeon: Phylo-Attention Force Field Recombination Scanner'
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
