about:
  doc_url: https://www.parallelpython.com
  home: https://www.parallelpython.com
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Parallel and distributed programming for Python.
build:
  entry_points:
  - ppserver = pp.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
package:
  name: pp
  version: 1.7.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
source:
  sha256: 523bec6bdd8fa3c1297b36373ea96762ae378c231e73ad0bb94a89ef2a322452
  url: https://files.pythonhosted.org/packages/source/p/pp/pp-1.7.0.tar.gz
test:
  commands:
  - ppserver --help
  imports:
  - pp
