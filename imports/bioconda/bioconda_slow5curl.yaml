about:
  description: slow5curl is a command line tool for fetching reads from remote BLOW5
    files, which is built on top of slow5lib and libcurl.
  dev_url: https://github.com/BonsonW/slow5curl
  doc_url: https://bonsonw.github.io/slow5curl
  home: https://github.com/BonsonW/slow5curl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tool for accessing remote BLOW5 files.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: slow5curl
  version: 0.3.1
requirements:
  build:
  - make
  - null
  - null
  host:
  - zlib
  - wget
  - curl
  run:
  - curl
source:
  sha256: 4846f2a6c4ed26c344ec372e6eb1ec0cfcce1da7bd2d7d967e63b9ad97a89224
  url: https://github.com/BonsonW/slow5curl/releases/download/v0.3.1/slow5curl-v0.3.1-release.tar.gz
test:
  commands:
  - slow5curl --help
  - slow5curl --version
