about:
  description: 'hapiq downloads datasets from scientific repositories (GEO, SRA, Ensembl,

    Human Cell Atlas, CELLxGENE Discover, BioStudies, ExperimentHub, Hugging

    Face, 10x Genomics, figshare, Zenodo and plain URLs) and records provenance for
    each download: metadata, per-file SHA-256

    checksums and the hapiq version, in a hapiq.json witness file. It can

    share a content-addressed download cache between machines on a LAN.

    '
  dev_url: https://github.com/btraven00/hapiq
  doc_url: https://github.com/btraven00/hapiq#readme
  home: https://github.com/btraven00/hapiq
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - library_licenses/
  summary: Download scientific datasets with provenance tracking
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - btraven00
package:
  name: hapiq
  version: 0.1.4
requirements:
  build:
  - null
  - null
  - go-licenses
source:
  sha256: 0834b59dc1a9ddd93979823907f659512bbac143674123c2e3978cbb9dbaf645
  url: https://github.com/btraven00/hapiq/archive/refs/tags/v0.1.4.tar.gz
test:
  commands:
  - hapiq --help
  - hapiq download --help
  - hapiq version | grep -F "0.1.4"
