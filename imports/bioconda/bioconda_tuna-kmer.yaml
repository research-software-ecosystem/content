about:
  description: "tuna counts k-mers in FASTA/FASTQ files (plain or gzipped) using a\n\
    streaming superkmer-partitioning pipeline.  This conda build supports\nk \u2208\
    \ {21, 31, 51, 63, 127} with common odd minimizer lengths.\n"
  home: https://github.com/vicLeva/tuna
  license: MIT
  summary: Streaming k-mer counter built on superkmer partitioning
build:
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - vicLeva
package:
  name: tuna-kmer
  version: 1.5.0
requirements:
  build:
  - null
  - null
  - cmake >=3.17
  - make
  host:
  - zlib
  run:
  - libgcc-ng
  - libstdcxx-ng
  - __osx >=11.0
