about:
  description: 'ECMSD detects and taxonomically classifies mitochondrial sequences

    from high-throughput sequencing data using minimap2 alignment and RMUS scoring.

    '
  dev_url: https://github.com/capoony/ECMSD
  home: https://github.com/capoony/ECMSD
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Efficient Comprehensive Mitochondrial Sequence Detection Pipeline
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - capoony
  - SarahSaadain
package:
  name: ecmsd
  version: 1.3.3
requirements:
  run:
  - minimap2
  - bbmap
  - r-base
  - r-tidyverse
  - r-gridextra
  - r-data.table
  - pigz
  - wget
  - python >=3.6
  - numpy
source:
  sha256: 5f7a2fc9795cf52db73f51e12eb53b4993399e059631beb870d9244c7c9ed0cd
  url: https://github.com/capoony/ECMSD/archive/refs/tags/v1.3.3.tar.gz
test:
  commands:
  - ECMSD --version
  - ECMSD --help
