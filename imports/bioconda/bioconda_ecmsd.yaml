about:
  description: 'ECMSD detects and taxonomically classifies mitochondrial sequences

    from high-throughput sequencing data using minimap2 alignment and RMUS scoring.

    '
  dev_url: https://github.com/capoony/ECMSD
  home: https://github.com/capoony/ECMSD
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Efficient Comprehensive Mitochondrial Sequence Detection Pipeline
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - capoony
  - SarahSaadain
package:
  name: ecmsd
  version: 1.3.1
requirements:
  run:
  - minimap2
  - bbmap
  - r-base
  - r-tidyverse
  - r-gridextra
  - r-data.table
  - pigz
  - wget
  - python >=3.6
  - numpy
source:
  sha256: f10d90d4cd6a85169477b6d095fc7ad78c21c2dc1216a425e45ccc81fad5037a
  url: https://github.com/capoony/ECMSD/archive/refs/tags/v1.3.1.tar.gz
test:
  commands:
  - ECMSD --version
  - ECMSD --help
