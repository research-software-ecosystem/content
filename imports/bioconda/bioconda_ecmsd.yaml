about:
  description: 'ECMSD detects and taxonomically classifies mitochondrial sequences

    from high-throughput sequencing data using minimap2 alignment and RMUS scoring.

    '
  dev_url: https://github.com/capoony/ECMSD
  home: https://github.com/capoony/ECMSD
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Efficient Comprehensive Mitochondrial Sequence Detection Pipeline
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - capoony
  - SarahSaadain
package:
  name: ecmsd
  version: 1.3.0
requirements:
  run:
  - minimap2
  - bbmap
  - r-base
  - r-tidyverse
  - r-gridextra
  - r-data.table
  - pigz
  - wget
  - python >=3.6
  - numpy
source:
  sha256: 23ab72b68601af9da741b12f78215f498efa00b6f8d1372ee6b1b8ba8433d799
  url: https://github.com/capoony/ECMSD/archive/refs/tags/v1.3.0.tar.gz
test:
  commands:
  - ECMSD --version
  - ECMSD --help
