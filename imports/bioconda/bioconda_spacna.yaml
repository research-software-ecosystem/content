about:
  description: "SpaCNA (Spatial DNA Copy Number Analysis) is a toolkit for spatial\
    \ DNA\nsequencing. It supports spatial and bulk DNA alignment, CNV-based spatial\n\
    clustering, SPI lineage analysis, RNA\u2013DNA multi-omics helpers, bundled\n\
    1 Mb genomic references, and the `spacna` command-line entry point.\n"
  dev_url: https://github.com/liuyang-zhao/SpaCNA
  doc_url: https://github.com/liuyang-zhao/SpaCNA/blob/main/README.md
  home: https://github.com/liuyang-zhao/SpaCNA
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "SpaCNA \u2014 spatial DNA CNV, SPI lineage, and RNA\u2013DNA multi-omics\
    \ toolkit"
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  notes: 'After install, set genome paths via SPACNA_* environment variables (see

    README). Sample barcodes are not shipped; download from GitHub.

    R entry point: source("scripts/R/spacna.R") after `cd $(spacna path)`.

    Generate non-1Mb references with: spacna gen-reference --species human --bin-size
    500kb --mode bins'
  recipe-maintainers:
  - liuyang-zhao
package:
  name: spacna
  version: 0.1.1
requirements:
  run:
  - python >=3.8,<3.13
  - numpy
  - pandas
  - matplotlib-base
  - pysam
  - natsort
  - biopython
  - pigz
  - parallel
  - bowtie2
  - samtools
  - bedtools
  - fastp
  - seqkit
  - umi_tools
  - trim-galore
  - mosdepth
  - ucsc-bigwigaverageoverbed
  - r-base >=4.2
  - r-data.table
  - r-matrix
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-fnn
  - r-patchwork
  - r-cluster
  - r-rtsne
  - r-viridis
  - r-fields
  - r-hexbin
  - r-ape
source:
  sha256: b2ecd962e752d72e43185f9c8efa3593a692377e122c2b47e1e6d92252259948
  url: https://github.com/liuyang-zhao/SpaCNA/archive/refs/tags/v0.1.1.tar.gz
test:
  commands:
  - spacna help
  - spacna path
  - test -d "$(spacna path)/scripts"
  - test -d "$(spacna path)/reference"
  - test -x "$(spacna path)/bin/spacna" || test -x "${PREFIX}/bin/spacna"
  - python -c "import pysam, natsort, pandas, numpy"
