about:
  description: 'fg-sra is a high-performance toolkit for converting NCBI SRA archives.

    `fg-sra tosam` replaces sam-dump, writing SAM, BAM, FASTA, or FASTQ with

    multi-threaded processing, genomic region filtering, quality score

    quantization, and reference caching. `fg-sra fastq` writes FASTQ in spot

    order with mates paired, and `fg-sra info` describes an archive''s kind,

    totals, qualities, read names, and read layout.

    '
  dev_url: https://github.com/fg-labs/fg-sra
  doc_url: https://github.com/fg-labs/fg-sra/blob/v0.2.0/README.md
  home: https://github.com/fg-labs/fg-sra
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: High-performance SRA-to-SAM/BAM/FASTQ converter.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - nh13
  - tfenne
package:
  name: fg-sra
  version: 0.2.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
  - cmake
  - make
  - patch
  - pkg-config
  - clang
  - libclang
  - flex
  - bison
source:
  sha256: aad46ba2b86c25133a79f38955946517f4f736acacfdbe5a86b7a821aca9ee01
  url: https://github.com/fg-labs/fg-sra/releases/download/v0.2.0/fg-sra-buildable-src-0.2.0.tar.gz
test:
