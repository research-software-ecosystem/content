about:
  dev_url: https://github.com/duceppemo/HashBrown
  doc_url: https://github.com/duceppemo/HashBrown/wiki
  home: https://github.com/duceppemo/HashBrown
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Long-read, short-read and hybrid bacterial genome assembly pipeline
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: hashbrown
  version: 1.1.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - psutil >=5.9
  - jinja2 >=3.1
  - matplotlib-base >=3.7
  - flye >=2.9
  - shasta >=0.11
  - medaka >=2.0
  - porechop >=0.2.4
  - filtlong >=0.2.1
  - seqtk >=1.4
  - skesa >=2.5
  - spades >=3.15
  - fastp >=0.23
  - bwa >=0.7.17
  - polypolish >=0.6
  - pypolca >=0.3
  - samtools >=1.17
  - minimap2 >=2.26
  - quast >=5.2
  - mosdepth >=0.3
  - seqkit >=2.5
  - mummer4 >=4.0.0rc1
  - gnuplot >=5.4
  - bandage >=0.8.1
  - weasyprint >=60
source:
  sha256: bc736b1631c9409383b6d7537e15e04508affcdec0714f5cdf7b360f760a7c9a
  url: https://github.com/duceppemo/HashBrown/archive/refs/tags/v1.1.1.tar.gz
test:
  commands:
  - hashbrown --help
  - hashbrown --version
