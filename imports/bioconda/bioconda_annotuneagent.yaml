about:
  dev_url: https://github.com/leelieber2025/AnnoTuneAgent
  doc_url: https://annotuneagent.readthedocs.io
  home: https://github.com/leelieber2025/AnnoTuneAgent
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Cluster-level cell-type annotation from a marker score and a name model.
build:
  entry_points:
  - annotuneagent = annotuneagent.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - leelieber2025
package:
  name: annotuneagent
  version: 0.1.8
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61
  - wheel
  run:
  - python >=3.10
  - anndata >=0.11.3
  - numpy >=1.23
  - pandas >=1.4
  - scipy >=1.7
  - scanpy >=1.10
  - python-igraph >=0.10
  - scikit-misc >=0.1.4
  - numba >=0.57
  - scikit-learn >=1.1
  - matplotlib-base >=3.6
  - pyyaml >=6
source:
  sha256: 96295d28009d8ff65c3103351a055df0db3b8ea528b61f5e2ecb931dd758d7e0
  url: https://pypi.org/packages/source/a/annotuneagent/annotuneagent-0.1.8.tar.gz
test:
  commands:
  - annotuneagent --help
  imports:
  - annotuneagent
