about:
  description: 'eskaks computes pairwise dN/dS from codon-aligned FASTA sequences
    and per-gene

    pN/pS, neutrality statistics and nucleotide diversity from a VCF together with
    a

    reference FASTA and a GFF3 annotation. It is written in Rust and ships a

    self-contained HTML report.

    '
  dev_url: https://github.com/PathoGenOmics-Lab/eskaks
  doc_url: https://pathogenomics-lab.github.io/eskaks/
  home: https://github.com/PathoGenOmics-Lab/eskaks
  license: GPL-3.0-only
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Fast pairwise dN/dS and per-gene pN/pS for molecular evolution and selection
    analysis
build:
  number: 0
  run_exports:
  - null
  script:
  - export LZMA_API_STATIC=1
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  categories:
  - Genomics
  - Variant Analysis
  identifiers:
  - doi:10.5281/zenodo.21992154
  recipe-maintainers:
  - paururo
  - PathoGenOmics-Lab
package:
  name: eskaks
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: f55e58cd55a28cb31b10de8c1ff103f6e7edf189769f452efd6c7bbc84c97f63
  url: https://github.com/PathoGenOmics-Lab/eskaks/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - eskaks --version | grep '0.1.0'
  - eskaks --help
  - eskaks fasta --help
  - eskaks vcf --help
  - eskaks --demo
