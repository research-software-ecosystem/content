about:
  dev_url: https://github.com/TheBrownLab/PhyloFisher
  doc_url: https://thebrownlab.github.io/phylofisher-pages
  home: https://github.com/TheBrownLab/PhyloFisher
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A package for the creation, analysis, and visualization of eukaryotic phylogenomic
    datasets.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv'
package:
  name: phylofisher
  version: 1.3.0
requirements:
  host:
  - python =3.7.10
  - pip
  run:
  - biopython
  - ete3
  - matplotlib-base
  - pandas
  - pyqt
  - python =3.7.10
  - hmmer =3.3
  - diamond =2.0.15
  - fasttree =2.1.10
  - mafft =7.525
  - trimal =1.4.1
  - blast
  - cd-hit =4.8.1
  - dist_est =1.1
  - astral-tree =5.7.8
  - snakemake-minimal =6.1
source:
  sha256: b23f7745160bab1ff5146c7179855ef95a5ce2491827eb3fa754415d826e9b6f
  url: https://github.com/TheBrownLab/PhyloFisher/archive/refs/tags/v1.3.0.tar.gz
test:
  imports:
  - phylofisher
  - phylofisher.utilities
