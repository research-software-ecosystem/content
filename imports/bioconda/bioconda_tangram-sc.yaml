about:
  description: 'Tangram is a deep learning algorithm for mapping single-cell (or single-nucleus)
    gene expression data onto spatial gene expression data.

    The single-cell dataset and the spatial dataset should be collected from the same
    anatomical region/tissue type, ideally from a biological replicate, and need to
    share a set of genes.

    '
  dev_url: https://github.com/broadinstitute/Tangram
  home: https://github.com/broadinstitute/Tangram
  license: BSD-3-Clause
  license_family: BSD
  license_file:
  - LICENSE.md
  summary: Spatial alignment of single cell transcriptomic data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - nilchia
package:
  name: tangram-sc
  version: 1.0.4
requirements:
  host:
  - python >=3.8.5
  - pip
  - setuptools
  run:
  - python >=3.8.5
  - pytorch
  - pandas
  - numpy
  - scipy <2
  - matplotlib-base
  - seaborn
  - scanpy
  - scikit-learn
  - tqdm
source:
  sha256: 6ced24573e288fa01a8070e3c7600058de51296bac1702515db87c310da6ac13
  url: https://files.pythonhosted.org/packages/source/t/tangram-sc/tangram-sc-1.0.4.tar.gz
test:
  commands:
  - pip check
  imports:
  - tangram
  requires:
  - pip
  - python
