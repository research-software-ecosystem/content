about:
  doc_url: https://semibin.readthedocs.io/en/latest/
  home: https://github.com/BigDataBiology/SemiBin
  license: MIT
  license_family: MIT
  summary: Metagenomic binning with siamese neural networks
build:
  entry_points:
  - SemiBin2=SemiBin.main:main2
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install --no-deps --no-build-isolation . -vvv
extra:
  identifiers:
  - doi:10.1038/s41467-022-29843-y
  - doi:10.1093/bioinformatics/btad209
  - biotools:semibin
  recipe-maintainers:
  - luispedro
  - psj1997
package:
  name: semibin
  version: 2.6.0
requirements:
  host:
  - pip
  - python >=3.11
  - setuptools >=77
  run:
  - numpy
  - pandas >=3
  - python >=3.11
  - python-igraph
  - pyyaml
  - requests
  - scikit-learn
  - coloredlogs
  - argcomplete
  - pytorch >=2.4
  - tqdm
  - bedtools
  - hmmer
  - numexpr
  - prodigal
  - samtools
  - safetensors
source:
  sha256: 0369b38a9151391eb7531e4b640e7ef04e6177f3a02cd701ad40ff46bd5621ca
  url: https://pypi.io/packages/source/S/SemiBin/semibin-2.6.0.tar.gz
test:
  commands:
  - SemiBin2 --help
  - SemiBin2 check_install
  imports:
  - SemiBin
