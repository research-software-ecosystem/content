about:
  dev_url: https://github.com/logsdon-lab/NucFlag
  doc_url: https://github.com/logsdon-lab/NucFlag/wiki
  home: https://github.com/logsdon-lab/NucFlag
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: NucFlag misassembly identifier.
build:
  entry_points:
  - nucflag = nucflag.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - koisland
package:
  name: nucflag
  version: 1.0.1
requirements:
  host:
  - python >=3.11
  - setuptools
  - pip
  run:
  - python >=3.11
  - matplotlib-base >=3.8.3
  - numpy >=1.26.4
  - polars >=1.6.0
  - python-intervaltree >=3.2.1
  - py_nucflag >=0.1.9
  - pybigwig >=0.3.25
  - pyideogram >=0.1.0
source:
  sha256: 61de011797d00f11e321955343fcab56b1d5b9ffb1d3cdd18e790952578f78b8
  url: https://pypi.org/packages/source/n/nucflag/nucflag-1.0.1.tar.gz
test:
  commands:
  - nucflag --help
  imports:
  - nucflag
