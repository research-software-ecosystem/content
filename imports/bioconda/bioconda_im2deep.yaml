about:
  dev_url: https://github.com/compomics/im2deep
  home: https://github.com/compomics/im2deep
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Framework for prediction of collisional cross-section of peptides.
build:
  entry_points:
  - im2deep=im2deep.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - CompOmics
  - rodvrees
package:
  name: im2deep
  version: 2.0.2
requirements:
  host:
  - pip
  - python >=3.11
  - uv-build
  run:
  - python >=3.11
  - click >=8,<9
  - deeplc >=4.0.0b1,<5
  - psm-utils >=1.5.1,<2
  - pandas >=1.5,<3
  - numpy >=1.25,<3
  - rich >=13,<15
  - pytorch >=2.6.0,<3
  - lightning >=2.1,<3
source:
  sha256: 53bd587ddfe1d7bf3b3a7054a7bad513d636265d515a8619752b2af1af033b89
  url: https://pypi.io/packages/source/i/im2deep/im2deep-2.0.2.tar.gz
test:
  imports:
  - im2deep
