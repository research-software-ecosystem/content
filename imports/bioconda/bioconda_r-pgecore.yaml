about:
  description: 'Provides R functions and command-line interfaces for malaria genomics
    analysis, including wrappers for specialised tools with shared TSV formats. Use
    cases include complexity of infection (COI), allele frequency and  prevalence
    estimators, filters, and format converters.

    '
  dev_url: https://github.com/PlasmoGenEpi/PGEcore
  doc_url: https://plasmogenepi.github.io/PGEcore
  home: https://github.com/PlasmoGenEpi/PGEcore
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: R tools for malaria genomics analysis.
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - kathrynmurie
package:
  name: r-pgecore
  version: 0.2.0
requirements:
  build:
  - null
  - null
  host:
  - r-base >=4.1.0
  - r-dplyr
  - r-optparse
  - r-purrr
  - r-readr
  - r-rlang
  - r-stringr
  - r-tibble
  - r-tidyr
  - r-validate
  run:
  - r-base >=4.1.0
  - r-dplyr
  - r-optparse
  - r-purrr
  - r-readr
  - r-rlang
  - r-stringr
  - r-tibble
  - r-tidyr
  - r-validate
source:
  sha256: 6b9d55ce3674b4551a90f29cd15b2edfc480bfe1d53021e54eb9b93b45259c75
  url: https://github.com/PlasmoGenEpi/PGEcore/archive/refs/tags/v0.2.0.tar.gz
test:
  commands:
  - $R -e "library('PGEcore')"
