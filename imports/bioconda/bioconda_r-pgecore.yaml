about:
  description: 'Provides R functions and command-line interfaces for malaria genomics
    analysis, including wrappers for specialised tools, shared TSV formats, complexity
    of infection (COI), allele frequency and prevalence estimators, filters, and format
    converters.

    '
  doc_url: https://plasmogenepi.github.io/PGEcore/
  home: https://github.com/PlasmoGenEpi/PGEcore
  license: MIT
  license_file: LICENSE
  summary: R tools for malaria genomics analysis
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
extra:
  recipe-maintainers:
  - kathrynmurie
package:
  name: r-pgecore
  version: 0.1.0
requirements:
  build:
  - null
  - null
  host:
  - r-base >=4.1.0
  - r-dplyr
  - r-optparse
  - r-purrr
  - r-readr
  - r-rlang
  - r-stringr
  - r-tibble
  - r-tidyr
  - r-validate
  run:
  - r-base >=4.1.0
  - r-dplyr
  - r-optparse
  - r-purrr
  - r-readr
  - r-rlang
  - r-stringr
  - r-tibble
  - r-tidyr
  - r-validate
source:
  sha256: 14f5caadaf20f87d2174563a3889fb7fff6fb9381f92d38ce692bda62e0f8eab
  url: https://github.com/PlasmoGenEpi/PGEcore/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - $R -e "library('PGEcore')"
