about:
  dev_url: https://github.com/gagneurlab/NMD-Scanner
  doc_url: https://github.com/gagneurlab/NMD-Scanner/blob/v1.0.0/README.md
  home: https://github.com/gagneurlab/NMD-Scanner
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A simple scanner package for NMD
build:
  entry_points:
  - nmd-scanner = nmd_scanner.cli:main_cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - Hoeze
package:
  name: nmd-scanner
  version: 1.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - pandas
  - numpy
  - pyfaidx
  - biopython
  - tqdm >=4.66.5,<5
  - polars >=1.44
  - polars-bio >=0.36.1,<0.37
  - pyarrow >=23.0.1
  - onnxruntime >=1.23.2
source:
  sha256: ebaaa6a509b52b1c277ceaaee89889bdc01b437e19839f14d7624475209b6698
  url: https://pypi.org/packages/source/n/nmd-scanner/nmd_scanner-1.0.0.tar.gz
test:
  commands:
  - pip check
  - nmd-scanner --help
  imports:
  - nmd_scanner
  requires:
  - pip
