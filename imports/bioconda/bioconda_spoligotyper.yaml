about:
  description: 'spoligotyper finds the 43 spacers of the direct repeat (DR) locus
    of Mycobacterium tuberculosis complex

    genomes in sequencing reads (fastq) or assemblies (fasta) with Seal from BBTools,
    and reports the

    spoligotype as binary, octal and hexadecimal codes, and as an SB number from the
    Mbovis.org database.

    '
  dev_url: https://github.com/duceppemo/spoligotyper
  doc_url: https://github.com/duceppemo/spoligotyper/wiki
  home: https://github.com/duceppemo/spoligotyper
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: In silico spoligotyping of Mycobacterium tuberculosis complex genomes from
    reads or assemblies
build:
  entry_points:
  - spoligotyper = spoligotyper.cli:main
  - spoligotyper-download-sit = spoligotyper.sitdb:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.5281/zenodo.22926160
  recipe-maintainers:
  - duceppemo
package:
  name: spoligotyper
  version: 0.9.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10
  - bbmap >=38.0
  - reportlab >=4.0
source:
  sha256: 9df43e689b625a9587a70a6c8045f91851afd68ad5082746b2ca1aed7cd35d59
  url: https://github.com/duceppemo/spoligotyper/archive/refs/tags/v0.9.0.tar.gz
test:
  commands:
  - spoligotyper --version
  - spoligotyper --help
  - spoligotyper-download-sit --help
  - seal.sh --version
  - spoligotyper -r1 "$(python -c 'from spoligotyper.spoligotype import SPACERS_FASTA;
    print(SPACERS_FASTA)')" -o test_out -t 1 | grep 777777777777771
  - test -s test_out/spoligo_spacers_spoligotyping.pdf
  - rm -rf test_out
  imports:
  - spoligotyper
