about:
  description: 'ADAMIXTURE is an ultra-fast ancestry estimation and genetic clustering
    tool

    designed to scale model-based admixture analysis to biobank-scale datasets

    (hundreds of thousands of individuals and SNPs). It combines fast randomized SVD,

    alternating least squares (ALS) initialization, and adaptive first-order/quasi-Newton

    optimization (SQP + ZAL QN / Adam-accelerated EM).

    '
  dev_url: https://github.com/AI-sandbox/ADAMIXTURE
  doc_url: https://github.com/AI-sandbox/ADAMIXTURE
  home: https://github.com/AI-sandbox/ADAMIXTURE
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'ADAMIXTURE: Adaptive First-Order Optimization for Biobank-Scale Ancestry
    Inference'
build:
  entry_points:
  - adamixture = adamixture.entry:main
  - adamixture-plot = adamixture.plot_entry:main
  - adamixture-project = adamixture.project_entry:main
  - adamixture-supervised = adamixture.supervised_entry:main
  number: 0
  run_exports:
  - null
  script:
  - export SETUPTOOLS_SCM_PRETEND_VERSION=1.9.6
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  skip: true
extra:
  identifiers:
  - doi:10.1093/bioinformatics/btag236
  recipe-maintainers:
  - joansaurina
package:
  name: adamixture
  version: 1.9.6
requirements:
  build:
  - null
  - null
  - llvm-openmp
  - libgomp
  host:
  - python
  - pip
  - setuptools >=61.0
  - setuptools_scm >=6.2
  - cython >=3.0.0
  - numpy >=2.0.0
  - llvm-openmp
  - libgomp
  run:
  - python >=3.10
  - numpy >=2.0.0
  - matplotlib-base >=3.8.0
  - configargparse >=1.7.0
  - zstandard >=0.25.0
source:
  sha256: 81b35ab928a22feaee4d1d1929b4b87b31f3ea1deade59e00dd63d3865709ad1
  url: https://pypi.org/packages/source/a/adamixture/adamixture-1.9.6.tar.gz
test:
  commands:
  - adamixture --help
  - adamixture-plot --help
  - adamixture-project --help
  - adamixture-supervised --help
  imports:
  - adamixture
  - adamixture.src.utils_c.cython.br_qn
  - adamixture.src.utils_c.cython.sqp
  - adamixture.src.utils_c.cython.tools
  requires:
  - pip
