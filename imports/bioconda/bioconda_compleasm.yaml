about:
  dev_url: https://github.com/huangnengCSU/compleasm
  home: https://github.com/huangnengCSU/compleasm
  license: Apache-2.0
  license_file: LICENSE
  summary: 'Compleasm: a faster and more accurate reimplementation of BUSCO'
build:
  entry_points:
  - compleasm=compleasm:main
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - huangnengCSU
package:
  name: compleasm
  version: 0.2.9
requirements:
  host:
  - pip
  - python >=3.9
  - setuptools
  run:
  - python >=3.9
  - pandas
  - hmmer
  - miniprot >=0.11
  - sepp
  - dendropy <4.6.0
source:
  sha256: f82f8d33c4d644381830dcb61c19a5b68f78f0d465201ccfe3e8d8446afc0429
  url: https://github.com/huangnengCSU/compleasm/archive/refs/tags/v0.2.9.tar.gz
test:
  commands:
  - compleasm --help
