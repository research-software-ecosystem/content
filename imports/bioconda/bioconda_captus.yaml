about:
  dev_url: https://github.com/edgardomortiz/Captus
  doc_url: https://edgardomortiz.github.io/captus.docs
  home: https://github.com/edgardomortiz/Captus
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.txt
  summary: 'Captus: Assembly of Phylogenomic Datasets from High-Throughput Sequencing
    data.'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - sed -i.bak 's|find_packages|find_namespace_packages|' setup.py
  - rm -rf *.bak
  - ln -sf "${PREFIX}/lib/libbz2.so.1.0" "${PREFIX}/lib/libbz2.so.1"
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
extra:
  identifiers:
  - doi:10.1101/2023.10.27.564367
package:
  name: captus
  version: 1.6.6
requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  - zlib
  run:
  - python >=3.6
  - bbmap
  - clipkit
  - falco
  - fastqc
  - mafft
  - megahit >=1.2.9
  - megahit =1.2.9=hfbae3c0_0
  - mmseqs2
  - muscle >=5
  - pandas >=2.1.0
  - perl-bioperl-core
  - perl-yaml
  - pigz
  - plotly
  - salmon >=1.10.0
  - tqdm
  - vsearch
source:
  sha256: 2aa7da8afb805cb3a24c75abef3509e8d5b74af345c40bb3c2c55c67f83d6e5e
  url: https://github.com/edgardomortiz/Captus/archive/v1.6.6.tar.gz
test:
  commands:
  - captus_assembly --help
  - captus --help
  - captus_design --help
  - captusd --help
  - concatenate_alignments --help
  - most_common_target_per_locus --help
  - new_targets_from_alignments --help
  - phylo_commands --help
