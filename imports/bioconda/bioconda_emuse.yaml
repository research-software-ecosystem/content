about:
  home: https://github.com/kclinmicro/emuse
  license: MIT
  license_file:
  - LICENSE
  - THIRD_PARTY_LICENSES.txt
  summary: Report generator for the TRANA 16S rRNA taxonomic profiling pipeline
build:
  entry_points:
  - emuse = emuse.make_report:main
  noarch: python
  number: 0
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - rannick
  skip-lints:
  - missing_run_exports
package:
  name: emuse
  version: 1.1.0
requirements:
  host:
  - python >=3.11
  - setuptools >=64
  - pip
  run:
  - python >=3.11
  - jinja2
  - pandas
  - pyyaml
  - pysam
source:
  sha256: e39b35c84e84d02d3140198a6dadfdb74c70da95ea434f333bc3ce2b9816f68c
  url: https://github.com/kclinmicro/emuse/archive/v1.1.0.tar.gz
test:
  commands:
  - pip check
  - emuse --help
  imports:
  - emuse
  requires:
  - pip
