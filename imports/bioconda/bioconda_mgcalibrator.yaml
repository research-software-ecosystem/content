about:
  description: 'MGCalibrator converts sequencing-derived coverage information into
    absolute

    abundances (number of copies) using the DNA mass of each sample and the number

    of sequenced bases. Input can be BAM files, SingleM output together with the raw

    FASTQ files, or Sylph output (.sylphmpa) together with the raw FASTQ files.

    '
  dev_url: https://github.com/NimroddeWit/MGCalibrator
  doc_url: https://github.com/NimroddeWit/MGCalibrator/blob/v1.1.0/README.md
  home: https://github.com/NimroddeWit/MGCalibrator
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Calibrate metagenomic coverage (BAM, SingleM or Sylph output) to absolute
    abundances using DNA input mass.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.64898/2026.02.26.708180
  recipe-maintainers:
  - NimroddeWit
package:
  name: mgcalibrator
  version: 1.1.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.9
  - pandas >=1.5
  - numpy >=1.24
  - pysam >=0.20
  - samtools
  - coverm
source:
  sha256: 0c5ddd7db185095674280bbf70576a3175c2b9136cbbd705d102e9e576337d43
  url: https://github.com/NimroddeWit/MGCalibrator/archive/refs/tags/v.1.1.0.tar.gz
test:
  commands:
  - mgcalibrator --help
  - mgcalibrator --version
  imports:
  - MGCalibrator
