about:
  home: https://oompa.r-forge.r-project.org
  license: Apache-2.0
  license_family: APACHE
  summary: 'Defines the classes used for "class discovery" problems in the OOMPA project
    (<http://oompa.r-forge.r-project.org/>). Class discovery primarily consists of
    unsupervised clustering methods with attempts to assess their statistical significance. '
build:
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
package:
  name: r-classdiscovery
  version: 3.4.11
requirements:
  host:
  - r-base
  - bioconductor-biobase
  - r-cluster
  - r-mclust
  - r-oompabase >=3.0.1
  - r-oompadata
  run:
  - r-base
  - bioconductor-biobase
  - r-cluster
  - r-mclust
  - r-oompabase >=3.0.1
  - r-oompadata
source:
  sha256: 6bf279bb29ce8bdb1f369f9a9be6c2fbd73128827bd56442877a541642de438f
  url:
  - /src/contrib/ClassDiscovery_3.4.11.tar.gz
  - /src/contrib/Archive/ClassDiscovery/ClassDiscovery_3.4.11.tar.gz
test:
  commands:
  - $R -e "library('ClassDiscovery')"
