about:
  home: https://github.com/schneebergerlab/plotsr
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Visualiser for structural annotations between multiple genomes
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --ignore-installed -vvv'
extra:
  recipe-maintainers:
  - mnshgl0110
package:
  name: plotsr
  version: 1.2.0
requirements:
  host:
  - python
  - pip
  - setuptools
  - numpy
  run:
  - python
  - numpy >=1.21
  - matplotlib-base >=3.3
  - pandas >=1.2.4
source:
  sha256: e0937de4dcbd76caab08ec15fd25fc8794714e85b984b71d55af6144db978295
  url: https://github.com/schneebergerlab/plotsr/archive/v1.2.0.tar.gz
test:
  commands:
  - plotsr --version
