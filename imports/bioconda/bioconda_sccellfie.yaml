about:
  home: https://github.com/earmingol/scCellFie
  license: MIT
  license_file: LICENSE.txt
  summary: A tool for inferring metabolic activities from single-cell and spatial
    transcriptomics
build:
  noarch: python
  number: 2
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - nilchia
package:
  name: sccellfie
  version: 0.6.3
requirements:
  host:
  - python 3.9
  - pip
  run:
  - python >=3.9
  - scanpy
  - numpy
  - pandas
  - cobra
  - tqdm
  - scipy
  - anndata
  - squidpy
  - networkx
  - geopandas
  - esda
  - matplotlib-base <3.9
  - seaborn
  - glasbey
  - scikit-misc
source:
  sha256: 45426544231e499b4fd689837d6edd1384df250c90710597ac830c236b375c37
  url: https://pypi.org/packages/source/s/sccellfie/sccellfie-0.6.3.tar.gz
test:
  commands:
  - pip check
  imports:
  - sccellfie
  requires:
  - pip
