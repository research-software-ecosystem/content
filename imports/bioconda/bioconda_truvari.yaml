about:
  dev_url: https://github.com/ACEnglish/truvari
  doc_url: https://github.com/acenglish/truvari/wiki
  home: https://github.com/ACEnglish/truvari
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Structural variant comparison tool for VCFs.
build:
  entry_points:
  - truvari = truvari.__main__:main
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517
    -vvv
package:
  name: truvari
  version: 5.5.0
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools
  run:
  - python >=3.12
  - python-edlib >=1.3.9
  - intervaltree >=3.2.1
  - joblib >=1.6.0
  - numpy >=2.5.3
  - rich >=15.0.0
  - pandas >=3.0.5
  - psutil >=7.2.2
  - pyabpoa >=1.5.6
  - pyarrow >=25.0.0
  - pysam >=0.24.1
  - pytabix >=0.1
  - pywfa >=0.5.1
  - mafft >=7.515
source:
  sha256: 58aa2dc02de37597ba57ae18a2b32c662157e0e03d65f584a5b75e525a402d50
  url: https://pypi.org/packages/source/t/truvari/truvari-5.5.0.tar.gz
test:
  commands:
  - truvari --help
  imports:
  - truvari
