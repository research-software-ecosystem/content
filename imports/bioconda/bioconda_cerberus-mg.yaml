about:
  description: "Cerberus is an opinionated all-in-one host-decontamination pipeline\
    \ that\nproduces three outputs from a single run: a paired-end assembly-ready\n\
    FASTQ pair (conservative \u2014 a pair is dropped only when both mates map to\n\
    the host), a single merged FASTQ for taxonomic profiling (aggressive \u2014 the\n\
    pair is dropped as soon as either mate maps), and a privacy-scrubbed\noutput for\
    \ public release, from which host reads are removed by three\nmechanisms in series:\
    \ a Kraken2 host database, a bbduk human k-mer pass,\nand minimap2 alignment against\
    \ a masked T2T-CHM13v2.0 + HLA reference.\n\nBecause all three mechanisms derive\
    \ from the same reference assemblies,\nCerberus reports the measured residual\
    \ host removal per mechanism rather\nthan asserting that no host reads remain.\
    \ Every run writes an HTML report\nwith the resolved parameters, per-stage read\
    \ accounting and verification\nof each output file.\n\nWorks on Illumina paired-end\
    \ short reads, ONT long reads, and PacBio\nHiFi/CLR, autotuning its parameters\
    \ from a prescan of the input.\n"
  dev_url: https://github.com/iowa69/cerberus
  doc_url: https://github.com/iowa69/cerberus
  home: https://github.com/iowa69/cerberus
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Three-headed host removal for metagenomic data: assembly, profiling and
    privacy-scrubbed outputs from one run.'
build:
  entry_points:
  - cerberus = cerberus.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  identifiers:
  - doi:10.5281/zenodo.20258069
  recipe-maintainers:
  - iowa69
package:
  name: cerberus-mg
  version: 0.2.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - tqdm >=4.66
  - fastp >=0.24
  - fastplong >=0.2
  - minimap2 >=2.28
  - bowtie2 >=2.5
  - bbmap >=39.0
  - kraken2 >=2.1.3
  - samtools >=1.20
  - zstd >=1.5
  - pigz
  - aria2
  - winnowmap >=2.03
source:
  sha256: 2670716c8fd0bf1c5150fef813373054b6700172c36851bc0f97f75ca61ac7fb
  url: https://github.com/iowa69/cerberus/archive/refs/tags/v0.2.1.tar.gz
test:
  commands:
  - cerberus --version
  - cerberus --help
  - cerberus --help-all
  imports:
  - cerberus
