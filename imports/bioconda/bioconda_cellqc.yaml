about:
  description: "A Snakemake pipeline for quality control of single-cell RNA-Seq data.\
    \ From\nCell Ranger output it runs ambient RNA correction (SoupX or DecontX),\n\
    filtering on UMI count, detected genes and mitochondrial percentage,\ndoublet\
    \ detection (DoubletFinder and/or scDblFinder), and a nuclear-fraction\nstatistic\
    \ from the Cell Ranger BAM. Per sample it writes a cleaned .h5ad\nwith its .obs\
    \ and .var as TSVs, plus a cohort metrics.csv, an HTML report\nand a PDF slide\
    \ deck.\n\nDoubletFinder is GitHub-only and cannot be a conda dependency. Either\n\
    install it after this package:\n\n    Rscript -e \"remotes::install_github('chris-mcginnis-ucsf/DoubletFinder',\
    \ upgrade=FALSE)\"\n\nor set doublet.run: [scdblfinder] and doublet.decider: scdblfinder\
    \ in the\nconfig, which needs nothing beyond this package.\n"
  home: https://github.com/lijinbio/cellqc
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Cellqc standardizes the quality control of single-cell RNA-Seq (scRNA)
    data to render clean feature count matrices.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  recipe-maintainers:
  - lijinbio
package:
  name: cellqc
  version: 0.3.2
requirements:
  host:
  - pip
  - python
  - setuptools >=77
  run:
  - python >=
  - click
  - snakemake-minimal >=8
  - jinja2
  - pandas
  - pyyaml
  - numpy
  - scipy
  - h5py
  - matplotlib-base
  - scanpy
  - anndata
  - pysam
  - tectonic
  - r-base >=4.4
  - r-seurat >=5
  - r-seuratobject >=5
  - r-matrix
  - r-soupx >=1.6.2
  - r-ggplot2
  - bioconductor-dropletutils
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-zellkonverter
  - bioconductor-scdblfinder
  - bioconductor-celda
  - r-remotes
  - r-rocr
  - r-fields
  - r-kernsmooth
source:
  sha256: 1e1e69c08fb5a6065a6278b68c7e63b1ac5750e7a96fbb592ad074f5d01b1204
  url: https://pypi.io/packages/source/c/cellqc/cellqc-0.3.2.tar.gz
test:
  commands:
  - cellqc --help
  imports:
  - cellqc
  - cellqc.qcutil
  - cellqc.reportdata
