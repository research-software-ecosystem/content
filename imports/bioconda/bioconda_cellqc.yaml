about:
  description: 'A Snakemake pipeline for quality control of single-cell RNA-Seq data.
    From

    Cell Ranger output it runs ambient RNA correction (SoupX or DecontX),

    filtering on UMI count, detected genes and mitochondrial percentage,

    doublet detection (DoubletFinder and/or scDblFinder), and a nuclear-fraction

    statistic from the Cell Ranger BAM. Per sample it writes a cleaned .h5ad

    with its .obs and .var as TSVs, plus a cohort metrics.csv, an HTML report

    and a PDF slide deck.

    '
  home: https://github.com/lijinbio/cellqc
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Cellqc standardizes the quality control of single-cell RNA-Seq (scRNA)
    data to render clean feature count matrices.
build:
  noarch: python
  number: 1
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  recipe-maintainers:
  - lijinbio
package:
  name: cellqc
  version: 0.3.6
requirements:
  host:
  - pip
  - python
  - setuptools >=77
  run:
  - python >=
  - click
  - snakemake-minimal >=8
  - jinja2
  - pandas
  - pyyaml
  - numpy
  - scipy
  - h5py
  - matplotlib-base
  - scanpy
  - anndata
  - pysam
  - tectonic
  - r-base >=4.4
  - r-seurat >=5
  - r-seuratobject >=5
  - r-matrix
  - r-soupx >=1.6.2
  - r-ggplot2
  - bioconductor-dropletutils
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-zellkonverter
  - bioconductor-scdblfinder
  - bioconductor-celda
  - r-doubletfinder >=2.0.6
source:
  sha256: 4106ed727110c3b66c93d16cf454b2055f5144d1b78a82269058326927759e20
  url: https://pypi.io/packages/source/c/cellqc/cellqc-0.3.6.tar.gz
test:
  commands:
  - cellqc --help
  imports:
  - cellqc
  - cellqc.qcutil
  - cellqc.reportdata
