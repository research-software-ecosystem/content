about:
  description: 'FAIR-bioHeaders embed provenance metadata in reference genome FASTA
    and GFA

    files (the FHR header). These tools convert between JSON, YAML, JSON-LD,

    HTML microdata and embedded FASTA/GFA headers, validate metadata against

    the schema, attach and strip headers, and verify the SHA-512/256 file

    checksum. They also read, write and verify the draft headers for protein

    FASTA (FHP) and GFF3 annotations (FHGFF3). bioheaders assess checks how

    FAIR the header of a FASTA, GFF3, VCF, GFA or other text file is.

    Plain and gzip/bgzip-compressed files are streamed with bounded memory.

    Formerly published on PyPI as fhr; the fhr-* commands are kept.

    '
  dev_url: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools
  doc_url: https://fhref.org/FAIR-bioHeaders-Specification/
  home: https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: Validate and convert FAIR-bioHeaders metadata for genome FASTA and GFA
    (FHR), protein FASTA (FHP) and GFF3 (FHGFF3).
build:
  entry_points:
  - bioheaders = bioheaders.cli:main
  - fhr-convert = bioheaders.cli:convert_main
  - fhr-validate = bioheaders.cli:validate_main
  - fhr-fasta-strip = bioheaders.cli:fasta_strip_main
  - fhr-fasta-combine = bioheaders.cli:fasta_combine_main
  - fhr-fasta-validate = bioheaders.cli:fasta_validate_main
  - fhr-gfa-strip = bioheaders.cli:gfa_strip_main
  - fhr-gfa-combine = bioheaders.cli:gfa_combine_main
  - fhr-gfa-validate = bioheaders.cli:gfa_validate_main
  - fhr-gff3-strip = bioheaders.cli:gff3_strip_main
  - fhr-gff3-combine = bioheaders.cli:gff3_combine_main
  - fhr-gff3-validate = bioheaders.cli:gff3_validate_main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - biotools:fair-bioheaders
  - doi:10.1093/bib/bbae122
  - doi:10.5281/zenodo.6762547
  recipe-maintainers:
  - adamjohnwright
package:
  name: fair-bioheaders
  version: 0.9.0
requirements:
  host:
  - python 3.11.*
  - pip
  - poetry-core >=1.0.0
  run:
  - python >=3.11
  - jsonschema-with-format >=4.21.1,<5
  - pyyaml >=6.0.1,<7
  - pyld >=3.3
source:
  sha256: 02206c4d98c132e329685167616036c167645df7f828d5d27b22297d322ff80f
  url: https://pypi.org/packages/source/f/fair-bioheaders/fair_bioheaders-0.9.0.tar.gz
test:
  commands:
  - python -m pip check
  - bioheaders --version
  - bioheaders validate --help
  - bioheaders assess --help
  - fhr-convert --version
  - fhr-validate --help
  - fhr-fasta-combine --help
  - fhr-fasta-strip --help
  - fhr-fasta-validate --help
  - fhr-gfa-combine --help
  - fhr-gfa-strip --help
  - fhr-gfa-validate --help
  - fhr-gff3-combine --help
  - fhr-gff3-strip --help
  - fhr-gff3-validate --help
  - printf '{"schema":"https://w3id.org/fair-bioheaders/fhr/v0.4.0","schemaVersion":"2.0","genome":"test","taxon":{"name":"Homo
    sapiens","uri":"https://identifiers.org/taxonomy:9606"},"version":"1","metadataAuthor":[{"name":"A"}],"assemblyAuthor":[{"name":"B"}],"dateCreated":"2024-01-01","masking":"unknown","checksum":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
    > test.fhr.json
  - printf '>s1\nACGT\n' > test.fasta
  - bioheaders validate test.fhr.json
  - bioheaders combine test.fhr.json test.fasta -o test.fhr.fasta
  - bioheaders verify test.fhr.fasta
  - bioheaders convert test.fhr.json test.fhr.jsonld
  - python -c "import json;d=json.load(open('test.fhr.jsonld'));c=d.pop('@context');json.dump({'@context':c,'@graph':[d]},open('graph.jsonld','w'))"
  - bioheaders validate graph.jsonld
  imports:
  - bioheaders
  - bioheaders.cli
  - fhr
  requires:
  - python 3.11
  - pip
