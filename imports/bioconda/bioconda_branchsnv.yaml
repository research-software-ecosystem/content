about:
  description: 'BRANCHSNV is a dependency-free Python command-line tool that reports

    strict clade-exclusive nucleotide markers separately from substitutions

    reconstructed on selected edges of rooted phylogenetic trees.

    '
  dev_url: https://github.com/RhysWhite/branchsnv
  home: https://github.com/RhysWhite/branchsnv
  license: MIT
  license_file: LICENSE
  summary: Separates clade-exclusive markers from branch-reconstructed substitutions
    in rooted phylogenies.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vv
extra:
  recipe-maintainers:
  - RhysWhite
package:
  name: branchsnv
  version: 0.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.10
source:
  sha256: 76d0e3d9a6c2f4e43770815be5b0a7d441241944cffd81524991a04815e27750
  url: https://github.com/RhysWhite/branchsnv/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - branchsnv --help
  - branchsnv --version
  imports:
  - branchsnv
