  - python
  - lark >=1.0.0
source:
  sha256: 2c51970d3729437400e3e7f63f3aa146a154784ea466702e1c6f5345e726ae7a
  url: https://pypi.org/packages/source/m/mutalyzer_hgvs_parser/mutalyzer_hgvs_parser-0.5.0.tar.gz
