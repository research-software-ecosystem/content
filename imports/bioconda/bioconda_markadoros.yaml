about:
  home: https://github.com/sanger-tol/markadoros/
  license: MIT
  license_file: LICENSE
  summary: Markadoros is a tool for the identification and assembly of barcode genes
    in raw sequencing data.
build:
  entry_points:
  - markadoros = markadoros:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - prototaxites
package:
  name: markadoros
  version: 1.2.1
requirements:
  host:
  - python >=3.11
  - hatchling
  - pip
  run:
  - python >=3.11
  - biopython >=1.86
  - click >=8.3.1
  - python-isal >=1.8.0
  - jsonschema >=4.26.0
  - loguru >=0.7.3
  - pandas >=2.3.3
  - polars >=1.39.3
  - pymmseqs >=1.1.0
  - pysam >=0.23.3
  - requests >=2.33.1
  - hifiasm >=0.21.0
  - mmseqs2 >=18.8cc5c
  - spades >=4.0.0
source:
  sha256: a739be55ed1a67b2b90ee9ffa1cf0385c7560c256fb97bfa38a6c1d5d7c721db
  url: https://pypi.org/packages/source/m/markadoros/markadoros-1.2.1.tar.gz
test:
  commands:
  - markadoros --help
  imports:
  - markadoros
  requires:
  - pip
  - python
