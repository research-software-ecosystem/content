about:
  home: https://github.com/wlsong/PyLipID
  license: MIT
  license_file: LICENSE.txt
  summary: PyLipID - A Python Library For Lipid Interaction Analysis
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - jaidevjoshi83
package:
  name: pylipid
  version: 1.6.1
requirements:
  host:
  - python >=3.6,<4.0
  - pip
  - setuptools
  run:
  - python >=3.6,<4.0
  - mdtraj
  - numpy >=1.20
  - pandas
  - matplotlib-base >=3.3.3
  - networkx
  - scipy
  - python-louvain
  - logomaker
  - statsmodels
  - scikit-learn
  - p-tqdm
  - kneebow
  - netcdf4
source:
  sha256: 01578958657c0f1d4cc5437855db7bae9c19708cc40ad3e99ef93edb9dc71641
  url: https://pypi.io/packages/source/P/PyLipID/pylipid-1.6.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - pylipid
  requires:
  - pip
