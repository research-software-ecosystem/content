about:
  home: https://github.com/labgem/PanGBank-api
  license: CeCiLL-2.1
  license_family: OTHER
  license_file: LICENCE
  summary: API for managing the PanGBank pangenome database, including a CLI to add
    pangenomes to the database.
build:
  entry_points:
  - pangbank_db = pangbank_api.manage_db.pangbank_db:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - JeanMainguy
package:
  name: pangbank-api
  version: 0.6.0
requirements:
  host:
  - python >=3.10,<3.14
  - setuptools
  - wheel
  - pip
  run:
  - python >=3.10,<3.14
  - sqlmodel >=0.0.32
  - typer >=0.15.1
  - pyyaml >=6.0.2
  - packaging >=24
  - pydantic-settings >=2.12.0
  - httpx >=0.28.1
source:
  sha256: a62403cc020662dc8557cdc88c985660a1ba0a4d199e3f326e02fd1be7cc1af3
  url: https://github.com/labgem/PanGBank-api/archive/0.6.0.tar.gz
test:
  commands:
  - pip check
  - pangbank_db --help
  imports:
  - pangbank_api
  requires:
  - pip
