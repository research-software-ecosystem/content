about:
  home: https://github.com/akikuno/cstag-cli
  license: MIT
  license_file: LICENSE
  summary: Command line interface of cstag to manipulate the minimap2's CS tag
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv
extra:
  recipe-maintainers:
  - akikuno
package:
  name: cstag-cli
  version: 1.0.1
requirements:
  host:
  - python >=3.7,<4.0
  - poetry-core >=1.0.0
  - pip
  run:
  - python >=3.7.0,<4.0.0
  - pysam >=0.19.0
  - cstag >=0.6.2
source:
  sha256: 48aeaa28e5f90141ee8edd8ebc3673697526fed6da3af593cf753454e4f1ab0c
  url: https://pypi.io/packages/source/c/cstag-cli/cstag_cli-1.0.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - cstag_cli
  requires:
  - pip
