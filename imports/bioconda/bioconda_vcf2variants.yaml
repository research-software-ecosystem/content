about:
  home: https://github.com/varda/varda2_preprocessing
  license: MIT
  license_family: MIT
  summary: Convert vcf files to varda variant files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --ignore-installed --no-deps -vv
extra:
  recipe-maintainers:
  - marksantcroos
package:
  name: vcf2variants
  version: '1.4'
requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  run:
  - python >=3.6
  - pysam
source:
  sha256: a592bc420a0b21d19abf3d95285a52f768b428342a959bd357e5a2c922b9891e
  url: https://pypi.io/packages/source/v/vcf2variants/vcf2variants-1.4.tar.gz
test:
  commands:
  - vcf2variants -h
  imports:
  - vcf2variants
