  - ldak 2>&1 | grep "LDAK - Software for obtaining Linkage Disequilibrium Adjusted
    Kinships"
  - ldak 2>&1 | grep "Version 6 "
  - ldak --help 2>&1 | grep "Here is a list of main arguments"
