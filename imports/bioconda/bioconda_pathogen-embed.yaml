about:
  home: https://github.com/blab/pathogen-embed
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Create reduced dimension embeddings for pathogen sequences
build:
  entry_points:
  - pathogen-distance = pathogen_embed.__main__:run_distance
  - pathogen-embed = pathogen_embed.__main__:run_embed
  - pathogen-cluster = pathogen_embed.__main__:run_cluster
  noarch: python
  number: 1
  run_exports:
  - null
  script: ' -m pip install . --no-deps --ignore-installed -vv'
extra:
  recipe-maintainers:
  - huddlej
package:
  name: pathogen-embed
  version: 4.0.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - numpy >=1,<3
  - pandas >=1.2.0,<4
  - biopython >=1.83,<2
  - scikit-learn >=1.3,<2
  - umap-learn >=0.5.0,<1
  - numba <1
  - matplotlib-base >=3,<4
  - hdbscan >=0.8.36,<1
source:
  sha256: d894a793660809b056c5b6c6659a4577f26e97818fa1ffdc1109ae3dd0b27d2a
  url: https://pypi.io/packages/source/p/pathogen-embed/pathogen_embed-4.0.0.tar.gz
test:
  commands:
  - pathogen-distance --help
  - pathogen-embed --help
  - pathogen-cluster --help
