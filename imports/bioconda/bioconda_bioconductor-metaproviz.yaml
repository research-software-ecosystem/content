about:
  description: MetaProViz can analyse standard metabolomics and exometabolomics data
    (CoRe). It performs pre-processing including feature filtering, missing value
    imputation, normalisation and outlier detection. It performs functional analysis
    including differential metabolite analysis (DMA), clustering based on regulatory
    rules (MCA) and contains different visualisation methods to extract biological
    interpretable graphs and saves them in a publication ready format.
  home: https://github.com/saezlab/MetaProViz
  license: BSD_3_clause + file LICENSE
  license_file: LICENSE
  summary: METabolomics pre-PRocessing, functiOnal analysis and VIZualisation
