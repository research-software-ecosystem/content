about:
  home: https://github.com/AmpliconSuite
  license: BSD 2-Clause License (AmpliconSuite-pipeline and AmpliconClassifier), BSD
    3-Clause License (BFBArchitect), and University of California Software License
    (AmpliconArchitect). Please see https://github.com/AmpliconSuite/AmpliconSuite-pipeline
    for more details on licenses.
  summary: An end-to-end workflow for focal amplification analysis with AmpliconArchitect.
build:
  noarch: python
  number: 0
  run_exports:
  - null
package:
  name: ampliconsuite
  version: 1.6.1
requirements:
  build:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.9
  - bwa
  - clarabel >=0.11.1,<0.12
  - cnvkit >=0.9.10
  - coin-or-cbc
  - curl
  - Flask
  - future
  - intervaltree
  - matplotlib-base
  - mscorefonts
  - numpy
  - pandas
  - pulp >=2.8
  - pysam >=0.23.3
  - samtools >=1.21
  - scipy
  - bedtools
source:
- sha256: 7a95d4bd6f1eead65842c524e4626ad8cb769178239c46cdef02f5387a374e88
  url: https://github.com/AmpliconSuite/AmpliconSuite-pipeline/archive/v1.6.1.tar.gz
- folder: ampliconarchitectlib
  sha256: 9767b7694a75145037804c5d1d87238aec644134b600e9247de45aa238d22b3a
  url: https://github.com/AmpliconSuite/AmpliconArchitect/archive/v1.6.r1.tar.gz
- folder: ampliconclassifierlib
  sha256: 451049912bf65fa65081da0fda8fa8bad4c834105ff6f0a8d0735b2153a046cf
  url: https://github.com/AmpliconSuite/AmpliconClassifier/archive/v2.0.0.tar.gz
- folder: bfbarchitectlib
  patches:
  - bfba-conda-solvers.patch
  sha256: 704ddd69756d9bb1414191dcce19bc2114d2b146660d17ff3bd8deb8f6fab94f
  url: https://github.com/AmpliconSuite/BFBArchitect/archive/v1.0.1.tar.gz
test:
  commands:
  - python3 $(which AmpliconSuite-pipeline.py) -v
  - python3 $(which GroupedAnalysisAmpSuite.py) -v
  - python3 $(which amplicon_classifier.py) -v
  - python3 $(which feature_similarity.py) -h
  - python3 $(which make_results_table.py) -h
  - BFBArchitect.py --version
  - python3 -c "import bfbarchitect; assert bfbarchitect.__version__ == '1.0.1'"
  - python3 -c "from importlib.metadata import requires; assert any(r.lower().startswith('gurobipy')
    for r in requires('BFBArchitect'))"
  - python3 -c "from importlib.metadata import version; assert version('AmpliconClassifier')
    == '2.0.0'"
  - python3 -c "from pulp import COIN_CMD; assert COIN_CMD().available()"
  - python3 -c "from bfbarchitect.BFBSolver import reconstruct_BFB_cbc; sequence,
    objective = reconstruct_BFB_cbc([2], [0], [0], 1, max_time=30, max_threads=1);
    assert sequence and objective is not None"
  imports:
  - paalib
  - ampliconarchitectlib
  - ampclasslib
  - bfbarchitect
