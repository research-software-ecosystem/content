    (AmpliconArchitect). Please see https://github.com/AmpliconSuite/AmpliconSuite-pipeline
    for more details on licenses.
  summary: An end-to-end workflow for focal amplification analysis with AmpliconArchitect.
build:
  noarch: python
  number: 0
  run_exports:
  - null
package:
  name: ampliconsuite
  version: 1.6.2
requirements:
  build:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.9
  - bwa
  - clarabel >=0.11.1,<0.12
  - cnvkit >=0.9.10
  - coin-or-cbc
  - curl
  - Flask
  - future
  - intervaltree
  - matplotlib-base
  - mscorefonts
  - numpy
  - pandas
  - pulp >=2.8
  - pysam >=0.23.3
  - samtools >=1.21
  - scipy
  - bedtools
source:
- sha256: 366a9112061097b6c197573a4bf86805c09ca8c1920c7ff4b00557ee3299acb5
  url: https://github.com/AmpliconSuite/AmpliconSuite-pipeline/archive/v1.6.2.tar.gz
- folder: ampliconarchitectlib
  sha256: a7a2867a0f3af2684e3828225de8d06225934a579c2c2629cc9538ffb94fcf25
  url: https://github.com/AmpliconSuite/AmpliconArchitect/archive/v1.6.r2.tar.gz
- folder: ampliconclassifierlib
  sha256: 8959275db29e58976ff24fcf37b8342d6567da80044092ffd311126442028993
  url: https://github.com/AmpliconSuite/AmpliconClassifier/archive/v2.0.1.tar.gz
- folder: bfbarchitectlib
  sha256: 0fd5e8094ecc22170eb1868da32078fa7dbdcec01607200adaf5025832538f2c
  url: https://github.com/AmpliconSuite/BFBArchitect/archive/v1.0.2.tar.gz
test:
  commands:
  - python3 $(which AmpliconSuite-pipeline.py) -v
  - python3 $(which GroupedAnalysisAmpSuite.py) -v
  - python3 $(which amplicon_classifier.py) -v
  - python3 $(which feature_similarity.py) -h
  - python3 $(which make_results_table.py) -h
  - BFBArchitect.py --version
  - python3 -c "import bfbarchitect; assert bfbarchitect.__version__ == '1.0.2'"
  - python3 -c "from importlib.metadata import requires; assert any(r.lower().startswith('gurobipy')
    for r in requires('BFBArchitect'))"
  - python3 -c "from importlib.metadata import version; assert version('AmpliconClassifier')
    == '2.0.1'"
  - python3 -c "from pulp import COIN_CMD; assert COIN_CMD().available()"
  - python3 -c "from bfbarchitect.BFBSolver import reconstruct_BFB_cbc; sequence,
    objective = reconstruct_BFB_cbc([2], [0], [0], 1, max_time=30, max_threads=1);
    assert sequence and objective is not None"
  imports:
  - paalib
  - ampliconarchitectlib
  - ampclasslib
  - bfbarchitect
