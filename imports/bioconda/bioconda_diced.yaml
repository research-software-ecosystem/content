about:
  doc_url: https://diced.readthedocs.io
  home: https://github.com/althonos/diced
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: COPYING
  summary: Rust re-implementation of the MinCED algorithm to Detect Instances of CRISPRs
    in Environmental Data.
build:
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517
    -vvv'
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - pentamorfico
package:
  name: diced
  version: 0.1.3
requirements:
  build:
  - null
  - null
  host:
  - python
  - pip
  - maturin
  run:
  - python
source:
  patches:
  - fix-cargo-toml-lib-section.patch
  sha256: 06784e6f52e6eeb926973383d9edb7508d4e6a59bce336b157e0e1bf3e4658d4
  url: https://pypi.io/packages/source/d/diced/diced-0.1.3.tar.gz
test:
  commands:
  - python -m unittest -vv diced.tests
  imports:
  - diced
  requires:
  - biopython
