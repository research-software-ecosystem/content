about:
  dev_url: https://github.com/ygidtu/trackplot
  doc_url: https://trackplot.readthedocs.io/en/latest
  home: https://github.com/ygidtu/trackplot
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The trackplot is a tool for visualizing various next-generation sequencing
    (NGS) data, including DNA-seq, RNA-seq, single-cell RNA-seq and full-length sequencing
    datasets.
build:
  entry_points:
  - trackplot = trackplot.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - ygidtu
package:
  name: trackplot
  version: 0.7.1
requirements:
  host:
  - python >=3.11,<3.14
  - pip
  - setuptools >=65.0
  run:
  - python >=3.11,<3.14
  - adjusttext >=1.3.0
  - cairocffi >=1.7.1
  - click >=8.2.1
  - click-option-group >=0.5.7
  - filetype >=1.2.0
  - flask >=3.1.1
  - hicmatrix >=17.2
  - loguru >=0.7.3
  - matplotlib-base >=3.10.3
  - numpy >=2.3.0
  - pandas >=2.3.0
  - pybigwig >=0.3.24
  - pysam >=0.23.3
  - requests >=2.32.4
  - scipy >=1.15.3
  - seaborn-base >=0.13.2
  - xmltodict >=0.15.0
source:
  sha256: 6697bea5cc3e0511bb1c701eb1a5bff000586c967b7c5a838a8b24adbf9612c6
  url: https://pypi.org/packages/source/t/trackplot/trackplot-0.7.1.tar.gz
test:
  commands:
  - trackplot --help
  imports:
  - trackplot
