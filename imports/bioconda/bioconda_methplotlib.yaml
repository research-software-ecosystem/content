about:
  home: https://github.com/wdecoster/methplotlib
  license: MIT
  license_family: MIT
  summary: Plot nucleotide modification data from nanopore sequencing
build:
  entry_points:
  - methplotlib=methplotlib.methplotlib:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - wdecoster
package:
  name: methplotlib
  version: 0.23.2
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  run:
  - python >=3.9
  - numpy >=1.14.3
  - pandas >=0.23.4
  - plotly >=4.9.0
  - pyranges >=0.0.77
  - fisher >=0.1.9
  - scikit-learn
  - pyfaidx
  - biopython
  - pysam
source:
  sha256: d6a108c8b713d7dfcfa59c690315764b683d1205da24c8798113d42622d2d81f
  url: https://pypi.io/packages/source/m/methplotlib/methplotlib-0.23.2.tar.gz
test:
  commands:
  - methplotlib --help
  imports:
  - methplotlib
