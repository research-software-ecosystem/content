about:
  dev_url: https://github.com/DessimozLab/fold_tree
  doc_url: https://github.com/DessimozLab/fold_tree/blob/v1.1.1/README.md
  home: https://github.com/DessimozLab/fold_tree
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Foldtree creates phylogenetic trees from protein structures using Foldseek.
build:
  entry_points:
  - foldtree = foldtree.foldtree:cli
  - pyfoldtree = foldtree.pyfoldtree:main
  - apisearch = foldtree.foldseek_remote_search:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.1038/s41594-025-01649-8
package:
  name: foldtree
  version: 1.1.1
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools
  run:
  - python >=3.7
  - click
  - snakemake-minimal <8
  - biopython
  - foldseek
  - toytree
  - numpy
  - pandas
  - quicktree
  - python-wget
  - requests
  - scipy
  - ujson
source:
  sha256: fe0ce8da00b215265000df2f2eeb647ff2e7911395835188630425417695dda7
  url: https://github.com/DessimozLab/fold_tree/archive/refs/tags/v1.1.1.tar.gz
test:
  commands:
  - foldtree --help
  - foldtree --version
