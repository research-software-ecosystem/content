about:
  dev_url: https://github.com/BfArM-MVH/grz-tools
  doc_url: https://github.com/BfArM-MVH/grz-tools/blob/grzctl-v5.1.1/packages/grzctl/README.md
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_family: MIT
  summary: Control CLI for GRZ administrators.
build:
  entry_points:
  - grzctl = grzctl.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - hoeze
  - tedil
package:
  name: grzctl
  version: 5.1.1
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - requests >=2.32.3,<3
  - grz-common >=4.0.1,<5
  - grz-db >=4.0.1,<5
  - textual >=5.3,<6
source:
  sha256: e1b653c8320cf1961a5e1a9d1b33072db4d6c7a1b4ed582f4e66b3ec2237e1db
  url: https://pypi.org/packages/source/g/grzctl/grzctl-5.1.1.tar.gz
test:
  commands:
  - pip check
  - grzctl --help
  imports:
  - grzctl
  requires:
  - pip
