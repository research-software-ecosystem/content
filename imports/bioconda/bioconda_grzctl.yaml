about:
  dev_url: https://github.com/BfArM-MVH/grz-tools
  doc_url: https://github.com/BfArM-MVH/grz-tools/blob/grzctl-v4.0.0/packages/grz-cli/README.md
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_family: MIT
  summary: Control CLI for GRZ administrators.
build:
  entry_points:
  - grzctl = grzctl.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - hoeze
  - tedil
package:
  name: grzctl
  version: 4.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - requests >=2.32.3,<3
  - grz-db >=3,<4
  - grz-cli >=2,<3
  - textual >=5.3,<6
source:
  sha256: 119a26f187ab9eaebf810a357fa4355b69ebd3bc2ddcb07b29f1e7922f4e1901
  url: https://pypi.org/packages/source/g/grzctl/grzctl-4.0.0.tar.gz
test:
  commands:
  - pip check
  - grzctl --help
  imports:
  - grzctl
  requires:
  - pip
