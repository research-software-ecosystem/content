about:
  dev_url: https://github.com/BfArM-MVH/grz-tools
  doc_url: https://github.com/BfArM-MVH/grz-tools/blob/grzctl-v5.0.0/packages/grzctl/README.md
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_family: MIT
  summary: Control CLI for GRZ administrators.
build:
  entry_points:
  - grzctl = grzctl.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - hoeze
  - tedil
package:
  name: grzctl
  version: 5.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - requests >=2.32.3,<3
  - grz-common >=4,<5
  - grz-db >=4,<5
  - textual >=5.3,<6
source:
  sha256: 791e20f2dce4b7f0bb0ea51aa84d758fa677bdfcfcf736daecc1a1721d64dd89
  url: https://pypi.org/packages/source/g/grzctl/grzctl-5.0.0.tar.gz
test:
  commands:
  - pip check
  - grzctl --help
  imports:
  - grzctl
  requires:
  - pip
