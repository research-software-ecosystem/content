about:
  dev_url: https://github.com/museomics/its-fun-2-map
  home: https://github.com/museomics/its-fun-2-map
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Extraction and validation of fungal ITS barcodes from museum specimen genome
    skims
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vvv
extra:
  recipe-maintainers:
  - rvosa
  - SchistoDan
package:
  name: its-fun-2-map
  version: 1.0.1
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools >=77
  run:
  - python >=3.12
  - pandas
  - numpy
  - scipy
  - biopython
  - openpyxl
  - pgzip
  - rpy2
  - seqpy-tools >=0.1.2
  - r-base >=4.5
  - r-jsonlite
  - fastp
  - seqkit
  - bwa
  - samtools
  - bbmap
  - spades
  - blast
source:
  sha256: bf95faaa854a805cf12749e5c4ffa217023a7d566e9dc19558dec507bec80f77
  url: https://pypi.org/packages/source/i/its-fun-2-map/its_fun_2_map-1.0.1.tar.gz
test:
  commands:
  - itsfun-qc --help
  - itsfun-refs --help
  - itsfun-map --help
  - itsfun-summary --help
  imports:
  - its_fun_2_map
