about:
  description: MobiOrigin assigns bacterial DNA fragments to chromosome, plasmid,
    phage, or an explicit unclassified state and provides optional biological annotation
    and deterministic visualization. Frozen models and biological databases are installed
    separately with cryptographic verification.
  dev_url: https://github.com/Raza-pl/MobiOrigin
  doc_url: https://github.com/Raza-pl/MobiOrigin#readme
  home: https://github.com/Raza-pl/MobiOrigin
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Sequence-and-marker classification of bacterial replicons
build:
  entry_points:
  - mobiorigin = mobiorigin.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - Raza-pl
package:
  name: mobiorigin
  version: 0.1.7
requirements:
  host:
  - python >=3.10,<3.12
  - pip
  - poetry-core
  run:
  - python >=3.10,<3.12
  - pytorch >=2.0,<2.6
  - numpy >=1.24
  - pyrodigal >=3.0
  - diamond >=2.1
  - ncbi-amrfinderplus >=4.2.7
source:
  sha256: bcaf3d530916f5afb492a8f70c12edb892110f515f73b705a90a099451667844
  url: https://pypi.io/packages/source/m/mobiorigin/mobiorigin-0.1.7.tar.gz
test:
  commands:
  - mobiorigin --help
  - mobiorigin doctor --software-only
  - diamond version
  - amrfinder --version
  imports:
  - mobiorigin
