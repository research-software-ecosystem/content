about:
  dev_url: https://github.com/OlmLab/ZipStrain
  doc_url: https://olmlab.github.io/ZipStrain/plugins/
  home: https://github.com/OlmLab/ZipStrain
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Native multithreaded profiling backend for ZipStrain.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - parsaghadermarzi
  skip-lints:
  - version_constraints_missing_whitespace
package:
  name: zipstrain-rust-profiler
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - make
  - pkg-config
  - clangdev
  - libclang
  - cargo-bundle-licenses
  host:
  - python >=3.12
  - pip
  - maturin >=1.8,<2
  - zlib
  run:
  - python >=3.12
  - zipstrain >=1.2.0,<2
  - polars >=1.34,<2
  - pyarrow >=22,<23
source:
  sha256: a132addffea8039a934da9d33e733d48edb04e09fb1eb1a2e2db8f662f77fc55
  url: https://pypi.org/packages/source/z/zipstrain-rust-profiler/zipstrain_rust_profiler-0.1.0.tar.gz
test:
  commands:
  - command -v zipstrain-rust-profiler
  - python -c "from zipstrain.profile_backends import load_backend; assert load_backend('rust_profiler').API_VERSION
    == 1"
  imports:
  - zipstrain_rust_profiler
  requires:
  - pytest
  source_files:
  - tests/data
  - tests/test_profile_parity.py
