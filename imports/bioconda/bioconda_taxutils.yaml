about:
  home: https://github.com/SwabSeq/taxutils
  license: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Utilities for working with NCBI taxonomic data.
build:
  number: 0
  run_exports:
  - null
  script:
  - export DYLD_FALLBACK_LIBRARY_PATH="${BUILD_PREFIX}/lib:${PREFIX}/lib${DYLD_FALLBACK_LIBRARY_PATH:+:${DYLD_FALLBACK_LIBRARY_PATH}}"
  - (cd rust && cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml)
  - ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  authors:
  - William O'Brien
  recipe-maintainers:
  - wgobrien
package:
  name: taxutils
  version: 1.1.6
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  host:
  - python
  - pip
  - setuptools >=68
  - setuptools-rust >=1.9
  - wheel
  run:
  - python
  - numpy
  - pandas
source:
  sha256: 5bba7863ecfbe6434299d34c2053aec6c083c8d9bce35ef28872d538bc6c6707
  url: https://pypi.io/packages/source/t/taxutils/taxutils-1.1.6.tar.gz
test:
  commands:
  - taxutils --help
  - python -c "from taxutils import backend_info; assert backend_info().get('selected')
    == 'rust'"
  imports:
  - taxutils
