about:
  dev_url: https://github.com/icbi-lab/scirpy
  home: https://scirpy.scverse.org/en/latest
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Scanpy extension for analyzing single-cell T-cell and B-cell receptor
    (TCR/BCR) sequencing data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - cd "scirpy-0.26.1"
  - ' -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.1101/2020.04.10.035865
  recipe-maintainers:
  - grst
package:
  name: scirpy
  version: 0.26.1
requirements:
  host:
  - python >=3.12
  - hatchling
  - hatch-vcs
  - pip
  run:
  - python >=3.12
  - adjusttext >=0.7
  - airr >=1.6.1
  - anndata >=0.9
  - awkward >=2.1.0
  - python-igraph >0.10.1|<0.10.0
  - joblib >=1.3.1
  - logomaker !=0.8.5
  - mudata >=0.3
  - networkx >=2.5
  - numba >=0.60
  - numpy >=1.17.0
  - pandas >=2.3
  - pooch >=1.7.0
  - python-levenshtein
  - scanpy >=1.9.3
  - scikit-learn
  - scipy
  - squarify
  - tqdm >=4.63
  - pycairo >=1.20
source:
  folder: scirpy-0.26.1
  sha256: e4685f010030e32f1e72bbc3a4d5e500789ecdbdb17505afcb2a2baf3579e879
  url: https://pypi.io/packages/source/s/scirpy/scirpy-0.26.1.tar.gz
test:
  imports:
  - scirpy
  requires:
  - pytest
