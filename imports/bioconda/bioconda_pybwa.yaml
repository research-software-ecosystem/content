about:
  dev_url: https://github.com/fulcrumgenomics/pybwa
  doc_url: https://pybwa.readthedocs.io/en/latest
  home: https://github.com/fulcrumgenomics/pybwa
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pybwa is a python module that makes it easy to align sequence data. It
    is a lightweight wrapper of bwa.
build:
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifier:
  - DOI:10.5281/zenodo.15029038
  recipe-maintainers:
  - nh13
package:
  name: pybwa
  version: 2.3.2
requirements:
  build:
  - null
  - null
  - make
  - autoconf
  - automake
  - libtool
  - pkg-config
  host:
  - cython
  - pip
  - python
  - setuptools
  - poetry-core
  - zlib
  - xz
  - bzip2
  - libdeflate
  - libcurl
  - openssl
  - pysam >=0.22.1
  run:
  - python
  - fgpyo >=0.7.0
  - pysam >=0.22.1
  - typing-extensions >=3.7.4
source:
  sha256: b2a25b358f1f8fa069cd8a4d15ab730497b90095645a59d6f9a03b56261afae9
  url: https://github.com/fulcrumgenomics/pybwa/releases/download/2.3.2/pybwa-2.3.2.tar.gz
test:
  imports:
  - pybwa
