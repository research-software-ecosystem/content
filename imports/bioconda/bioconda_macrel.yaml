about:
  description: 'Used for the prediction of AMPs in (meta)genomes.

    '
  dev_url: https://github.com/BigDataBiology/macrel
  home: https://github.com/BigDataBiology/macrel
  license: MIT
  summary: A pipeline for AMP (antimicrobial peptide) prediction
build:
  entry_points:
  - macrel= macrel.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: python -m pip install --disable-pip-version-check --no-cache-dir --ignore-installed
    --no-deps -vv .
extra:
  identifiers:
  - doi:10.7717/peerj.10555
  recipe-maintainers:
  - celiosantosjr
  - luispedro
package:
  name: macrel
  version: 1.6.1
requirements:
  host:
  - python
  - pip
  - setuptools
  run:
  - python
  - atomicwrites
  - ngless
  - joblib
  - megahit
  - paladin
  - pandas
  - scikit-learn
  - requests
  - onnxruntime <1.26
  - tzlocal
  - pyrodigal >=0.7.3
source:
  sha256: 897de93abb9857b85a8e3989feba1de30e558818088b42dbc90efd5a6d7d349e
  url: https://github.com/BigDataBiology/macrel/archive/v1.6.1.tar.gz
test:
  commands:
  - macrel --version
  imports:
  - macrel
