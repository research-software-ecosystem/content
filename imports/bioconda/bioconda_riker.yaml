about:
  dev_url: https://github.com/fulcrumgenomics/riker
  doc_url: https://github.com/fulcrumgenomics/riker/blob/v0.5.0/README.md
  home: https://github.com/fulcrumgenomics/riker
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: High-performance tools next generation sequencing QC.
build:
  binary_relocation: false
  number: 0
  run_exports:
  - null
  script:
  - export LIBCLANG_PATH="${BUILD_PREFIX}/lib"
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install --locked --version '>=0.12.0' cargo-multivers
  - cargo multivers --profile dist --out-dir "${PREFIX}/bin"
  - cargo install --no-track --locked --profile dist --root "${PREFIX}" --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - nh13
  - tfenne
package:
  name: riker
  version: 0.5.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
  - libclang 21.*
  - clang 21.*
  - cmake
  - make
source:
  sha256: d2b7d622bd53aa90f382c021701bbd5a2189d710e89c92a3fe193d9517537f55
  url: https://github.com/fulcrumgenomics/riker/archive/v0.5.0.tar.gz
test:
  commands:
  - riker --help
