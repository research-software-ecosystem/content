about:
  home: https://github.com/BiocPy/GenomicRanges
  license: MIT
  license_file: LICENSE.txt
  summary: Container class to represent and operate over genomic regions and annotations.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: genomicranges
  version: 0.8.5
requirements:
  host:
  - python
  - setuptools >=46.1.0
  - setuptools-scm >=5
  - pip
  run:
  - python
  - numpy
  - biocutils >=0.3.3
  - biocframe >=0.7.1
  - iranges >=0.7.2
  - compressed-lists >=0.4.3
source:
  sha256: a493956ec5a72b1a63f6b3e2f56a64a7b6938fa06fd0119fffe4bcb75e86c3eb
  url: https://pypi.org/packages/source/g/genomicranges/genomicranges-0.8.5.tar.gz
test:
  commands:
  - pip check
  imports:
  - genomicranges
  requires:
  - pip
