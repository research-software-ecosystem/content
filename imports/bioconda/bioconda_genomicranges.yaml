about:
  home: https://github.com/BiocPy/GenomicRanges
  license: MIT
  license_file: LICENSE.txt
  summary: Container class to represent and operate over genomic regions and annotations.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: genomicranges
  version: 0.9.0
requirements:
  host:
  - python
  - hatchling
  - hatch-vcs
  - pip
  run:
  - python
  - numpy
  - biocutils >=0.4.0
  - biocframe >=0.8.0
  - iranges >=0.7.2
  - compressed-lists >=0.4.3
source:
  sha256: b5f538b56f58ad246818192b9350740f601155e716b75c4cb7d72ee44f836de4
  url: https://pypi.org/packages/source/g/genomicranges/genomicranges-0.9.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - genomicranges
  requires:
  - pip
