about:
  dev_url: https://github.com/genomewalker/dart
  doc_url: https://github.com/genomewalker/dart/wiki
  home: https://github.com/genomewalker/dart
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: DART - Damage-Aware Read Translation for ancient DNA metagenomics.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - genomewalker
  skip-lints:
  - uses_vcs_url
package:
  name: dart-adna
  version: 1.1.0
requirements:
  build:
  - null
  - null
  - cmake >=3.18
  - make
  - pkg-config
  host:
  - zlib
  - zstd
  - libgomp
  - llvm-openmp
  run:
  - libgomp
  - llvm-openmp
source:
  git_rev: 1ca34f3
  git_url: https://github.com/genomewalker/dart.git
  sha256: unused
test:
  commands:
  - dart --version
  - dart --help
  - dart predict --help
  - dart hits2emi --help
  - dart damage-annotate --help
