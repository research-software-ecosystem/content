about:
  dev_url: https://github.com/OrthoFinder/OrthoFinder
  doc_url: https://orthofinder.github.io/OrthoFinder
  home: https://github.com/OrthoFinder/OrthoFinder
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: Accurate inference of orthogroups, orthologs, gene trees and rooted species
    tree made easy!
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: orthofinder
  version: '3.2'
requirements:
  run:
  - python >=3.11,<=3.14
  - numpy
  - scipy
  - scikit-learn
  - biopython
  - ete4
  - rich
  - pandas >=2.0
  - blast
  - diamond >=2.1.7
  - mcl
  - fastme
  - mafft
  - fasttree
  - muscle
  - raxml
  - raxml-ng
  - iqtree
  - bzip2
  - mmseqs2
  - aster
  - famsa
source:
  sha256: 554cc15b4cca86e496c680cccf8697f3b0953ff25403e2ff0d585bd015071adb
  url: https://github.com/OrthoFinder/OrthoFinder/releases/download/v3.2/orthofinder-3.2.tar.gz
test:
  commands:
  - orthofinder -h
  - orthofinder -v
  - orthofinder-utils
  - primary_transcript -h
  - make_ultrametric -h
  - convert_orthofinder_tree_ids -h
  - create_hog_fastas -h
  - ncbi_primary_transcript -h
  - orthogroup_gene_count -h
  - split_ortholog_files -h
  - species_tree_alignment -h
  - mcl_orthogroup_sequences -h
  source_files:
  - ExampleData
  - ExampleData/*
