about:
  dev_url: https://github.com/qbic-pipelines/t2pmhc
  doc_url: https://github.com/qbic-pipelines/t2pmhc/blob/main/README.md
  home: https://github.com/qbic-pipelines/t2pmhc
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A structure-informed graph neural network for predicting TCR-pMHC binding
build:
  entry_points:
  - t2pmhc = t2pmhc.__main__:run_t2pmhc
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  identifiers:
  - doi:10.64898/2026.02.27.708137
  recipe-maintainers:
  - jonasscheid
  - mapo9
package:
  name: t2pmhc
  version: 1.1.4
requirements:
  host:
  - python 3.11.*
  - pip
  - setuptools >=77
  run:
  - python >=3.11
  - biopython >=1.85
  - joblib >=1.4
  - numpy >=1.26,<3
  - pandas >=2.1
  - rich >=13
  - rich-click >=1.9
  - scikit-learn >=1.6,<1.8
  - pytorch >=2.6
  - pytorch_geometric >=2.6
source:
  sha256: 3405f8f9c4f6e4967260524e0fd847f10f52a32a1a0274fdca9eb69de71e3512
  url: https://pypi.org/packages/source/t/t2pmhc/t2pmhc-1.1.4.tar.gz
test:
  commands:
  - pip check
  - t2pmhc --help
  imports:
  - t2pmhc
  requires:
  - pip
  - python 3.11.*
