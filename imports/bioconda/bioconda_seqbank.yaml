about:
  dev_url: https://github.com/rbturnbull/seqbank
  doc_url: https://rbturnbull.github.io/seqbank/
  home: https://github.com/rbturnbull/seqbank
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: A database to quickly read and write DNA sequence data in numerical form.
build:
  entry_points:
  - seqbank = seqbank.main:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - rbturnbull
package:
  name: seqbank
  version: 0.4.1
requirements:
  host:
  - python >=3.10,<3.14
  - hatchling
  - pip
  run:
  - python >=3.10,<3.14
  - attrs >=23.1.0
  - biopython >=1.81
  - h5py >=3.9.0
  - joblib >=1.3.2
  - python-kaleido >=1.0.0,<2
  - python-lmdb >=1.7
  - numpy >=1.22.0
  - pandas >=2.0.0
  - plotly >=6.1.1
  - pyfastx >=1.1.0
  - requests >=2.31.0
  - rich >=10.16.1
  - typer >=0.9.0
source:
  sha256: 358c14098c5e72472f50d78b13dde3ab45857c9fd736da16706e58dc2d206179
  url: https://pypi.io/packages/source/s/seqbank/seqbank-0.4.1.tar.gz
test:
  commands:
  - seqbank --help
  - pip check
  imports:
  - seqbank
  requires:
  - pip
