about:
  home: https://github.com/goeckslab/Galaxy-ML
  license: MIT
  license_file: LICENSE
  summary: APIs for Galaxy machine learning tools
build:
  number: 0
  run_exports:
  - null
  script: "cython -3 galaxy_ml/externals/selene_sdk/sequences/_sequence.pyx\ncython\
    \ -3 galaxy_ml/externals/selene_sdk/targets/_genomic_features.pyx\n -m pip install\
    \ . --no-deps --no-build-isolation --ignore-installed -vvv\n"
  skip: true
extra:
  recipe-maintainers:
  - qiagu
  - qchiujunhao
  - anuprulez
  - IvoLeist
  - bgruening
package:
  name: galaxy-ml
  version: 0.11.0
requirements:
  build:
  - null
  - null
  - null
  host:
  - python 3.12.*
  - cython >=3.3,<4
  - pip
  - setuptools >=84
  - wheel >=0.48
  - numpy >=2.4,<2.5
  run:
  - python >=3.12,<3.13
  - pyfaidx >=0.9,<0.10
  - pytabix ==0.1
  - tabix
  - htslib
  - scipy >=1.18,<1.19
  - numpy >=2.4,<2.5
  - joblib >=1.6,<1.7
  - asteval >=1.0,<1.1
  - pandas >=3.0,<3.1
  - scikit-learn >=1.9,<2
  - xgboost >=3.4,<4
  - mlxtend >=0.25,<0.26
  - skrebate >=1!0.8.4,<1!0.9
  - imbalanced-learn >=0.14,<0.15
  - keras >=3.15,<3.16
  - keras-preprocessing >=1.1,<1.2
  - tensorflow >=2.21,<2.22
  - plotly >=7.1,<8
  - matplotlib-base >=3.10,<3.11
  - scikit-optimize >=0.10,<0.11
  - h5py >=3.14,<3.15
  - six >=1.17,<2
  - bleach >=6.4,<7
source:
  sha256: 9155c5682413bd0aa47ce6112bee559bf49e2ae82ad30cb535401e049174b9d8
  url: https://pypi.io/packages/source/G/Galaxy-ML/galaxy_ml-0.11.0.tar.gz
test:
  commands:
  - command -v tabix
  - command -v bgzip
  imports:
  - galaxy_ml
  - galaxy_ml.keras_galaxy_models
  - galaxy_ml.iraps_classifier
  - galaxy_ml.model_persist
  - galaxy_ml.model_validations
  - galaxy_ml.preprocessors
  - galaxy_ml.utils
  - galaxy_ml.externals.selene_sdk.sequences._sequence
