about:
  dev_url: https://github.com/openvax/varcode
  doc_url: https://github.com/openvax/varcode/blob/main/README.md
  home: https://github.com/openvax/varcode
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Variant annotation in Python.
build:
  entry_points:
  - varcode-genes = varcode.cli.genes_script:main
  - varcode = varcode.cli.effects_script:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - jonasscheid
package:
  name: varcode
  version: 10.11.1
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools <82
  run:
  - python >=3.9
  - setuptools <82
  - biopython >=1.64
  - memoized-property >=1.0.2
  - numpy >=2.0.0,<3
  - pandas >=2.0.0,<3
  - pyensembl >=2.6.2
  - pyvcf3 >=1.0.0
  - sercol >=0.1.4
  - serializable >=0.2.1
source:
  sha256: 72d434a0b3319e41d29796b4ebde3b040d034e26f6cd2001a5b3e6f3642288d4
  url: https://pypi.org/packages/source/v/varcode/varcode-10.11.1.tar.gz
test:
  commands:
  - varcode-genes --help
  - varcode --help
  imports:
  - test
  - varcode
  - varcode.cli
  - varcode.effects
