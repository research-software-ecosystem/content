about:
  description: 'BCFtools is a set of utilities that manipulate variant calls in the
    Variant

    Call Format (VCF) and its binary counterpart BCF. All commands work transparently

    with both VCFs and BCFs, both uncompressed and BGZF-compressed. Most commands

    accept VCF, bgzipped VCF and BCF with filetype detected automatically even when

    streaming from a pipe. Indexed VCF and BCF will work in all situations. Un-indexed

    VCF and BCF and streams will work in most, but not all situations.

    '
  dev_url: https://github.com/samtools/bcftools
  doc_url: https://samtools.github.io/bcftools/bcftools.html
  home: https://github.com/samtools/bcftools
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: BCFtools, utilities for manipulating variant calls in VCF and BCF formats.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:bcftools
  - usegalaxy-eu:bcftools_merge
  - doi:10.1093/bioinformatics/btp352
package:
  name: bcftools
  version: '1.25'
requirements:
  build:
  - make
  - null
  - null
  host:
  - htslib
  - zlib
  - gsl >=2.6,<2.7
  - libxcrypt
  run:
  - perl
source:
  sha256: f96e583d2315998645bb56756f1c8f230c489512db2655b0f623198ebc8a2d99
  url: https://github.com/samtools/bcftools/releases/download/1.25/bcftools-1.25.tar.bz2
test:
  commands:
  - bcftools -h
  - bcftools --version
  - bcftools plugin -lv
  - bcftools -h | grep polysomy
  - vcfutils.pl 2>&1 | grep vcfutils
