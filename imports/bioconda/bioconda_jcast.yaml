about:
  dev_url: https://github.com/ed-lau/jcast
  home: https://github.com/ed-lau/jcast
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Jcast retrieves splice junction information and translates into amino acids
build:
  entry_points:
  - jcast=jcast.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
package:
  name: jcast
  version: 0.4.0
requirements:
  host:
  - pip
  - python >=3.11
  - setuptools >=77
  run:
  - python >=3.11
  - biopython >=1.78
  - gtfparse >=1.3
  - pandas >=1.5
  - numpy >=1.23.2
  - scipy >=1.9.2
  - requests >=2.20
  - platformdirs >=2.5
  - tqdm >=4
  - matplotlib-base >=3.6
source:
  sha256: bd5a4b4c6c6bdc52176b5b5ea9fddd1b79c9df8e501f52b1247bc68a2314d73f
  url: https://pypi.io/packages/source/j/jcast/jcast-0.4.0.tar.gz
test:
  commands:
  - jcast --help
  imports:
  - jcast
