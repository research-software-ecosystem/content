about:
  dev_url: https://github.com/OpenMS/OpenMS
  doc_url: https://openms.readthedocs.io/en/latest/index.html
  home: https://github.com/OpenMS/OpenMS
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: OpenMS is an open-source software C++ library for LC-MS data management
    and analyses. The openms-meta package should not be installed. Please use one
    of its outputs libopenms, openms (=tools) or openms-thirdparty.
build:
  number: 0
  overlinking_ignore_patterns: '*'
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:openms
  - usegalaxy-eu:openms_fileconverter
  - doi:10.1038/s41592-024-02197-7
  skip-lints:
  - build_number_needs_reset
  - missing_run_exports
  - should_be_noarch_generic
outputs:
- about:
    dev_url: https://github.com/OpenMS/OpenMS
    doc_url: https://openms.readthedocs.io/en/latest/index.html
    home: https://github.com/OpenMS/OpenMS
    license: BSD-3-Clause
    license_family: BSD
    license_file: LICENSE
    summary: Libraries and headers for developing with OpenMS. They are also a dependency
      of pyopenms and openms (tools).
  build:
    ignore_run_exports_from:
    - libboost-devel
    run_exports:
    - libopenms 3.6.0
  name: libopenms
  requirements:
    build:
    - null
    - null
    - cmake
    host:
    - bzip2
    - coin-or-utils
    - coin-or-clp
    - coin-or-cgl
    - coin-or-cbc
    - eigen >=3.4.0
    - libarrow =23=*_cpu
    - libparquet =23
    - libboost-devel
    - libcurl
    - libsvm
    - libzip
    - xerces-c
    - zlib
    - zstd
    - libgomp
    - sysroot_linux-64 =2.17
    - llvm-openmp
  script: package_libopenms.sh
  test:
    commands:
    - command -v readelf >/dev/null 2>&1 && readelf -d ${PREFIX}/lib/libOpenMS.so
      | grep 'R.*PATH' || echo "Mulled container.. skip tests"
    - command -v otool >/dev/null 2>&1 && otool -L ${PREFIX}/lib/libOpenMS.dylib ||
      echo "Mulled container.. skip tests"
    - test -f ${PREFIX}/share/OpenMS/TOOLS/OpenMS.tsv
    - test -f ${PREFIX}/lib/cmake/OpenMS/OpenMSConfig.cmake
  version: 3.6.0
- about:
    dev_url: https://github.com/OpenMS/OpenMS
    doc_url: https://openms.readthedocs.io/en/latest/index.html
    home: https://github.com/OpenMS/OpenMS
    license: BSD-3-Clause
    license_family: BSD
    license_file: LICENSE
    summary: The OpenMS TOPP tools (without GUI components and adapted thirdparty
      tools) and the TOPP tool framework library OpenMS_CLI with its headers, for
      developing own tools.
  name: openms
  requirements:
    build:
    - null
    - null
    - cmake
    host:
    - null
    - libarrow 23.* *_cpu
    - libparquet =23
    run:
    - null
  script: package_openms-tools.sh
  test:
    commands:
    - command -v readelf >/dev/null 2>&1 && readelf -d ${PREFIX}/bin/OpenMSInfo |
      grep 'R.*PATH' || echo "Mulled container.. skip tests"
    - command -v otool >/dev/null 2>&1 && otool -L ${PREFIX}/bin/OpenMSInfo || echo
      "Mulled container.. skip tests"
    - OPENMS_DATA_PATH=${PREFIX}/share/OpenMS/ ${PREFIX}/bin/OpenMSInfo
    - OPENMS_DATA_PATH=${PREFIX}/share/OpenMS/ ${PREFIX}/bin/FileMerger --help
    - ${PREFIX}/bin/OpenMSDatabasesInfo -enzymes_out /tmp/openms_enzymes.tsv -mods_out
      /tmp/openms_mods.tsv
    - test "$(wc -l < /tmp/openms_mods.tsv)" -gt 100
    - test -f ${PREFIX}/include/OpenMS/APPLICATIONS/TOPPBase.h
    - test -f ${PREFIX}/lib/cmake/OpenMS/OpenMSCLITargets.cmake
  version: 3.6.0
- about:
    dev_url: https://github.com/OpenMS/OpenMS
    doc_url: https://openms.readthedocs.io/en/latest/index.html
    home: https://github.com/OpenMS/OpenMS
    license: BSD-3-Clause
    license_family: BSD
    license_file: LICENSE
    summary: A helper package to install OpenMS TOPP tools with all their compatible
      and conda-available versions of adapted thirdparty tools.
  build:
    skip: true
  name: openms-thirdparty
  requirements:
    run:
    - null
    - comet-ms ==2024011
    - luciphor2 ==2020_04_03
    - msgf_plus ==2024.03.26
    - percolator ==3.9
    - sirius-ms >=6.1.0
    - thermorawfileparser ==1.4.3
    - sage-proteomics ==0.14.7
    - gnuplot
    - r-gplots
  test:
    commands:
    - OPENMS_DATA_PATH=${PREFIX}/share/OpenMS/ ${PREFIX}/bin/OpenMSInfo
  version: 3.6.0
package:
  name: openms-meta
  version: 3.6.0
requirements:
  build:
  - null
  - null
  - cmake >=3.24
  - ninja
  host:
  - bzip2
  - coin-or-utils
  - coin-or-clp
  - coin-or-cgl
  - coin-or-cbc
  - eigen >=3.4.0
  - libarrow =23=*_cpu
  - libparquet =23
  - libboost-devel
  - libcurl
  - libsvm
  - libzip
  - xerces-c
  - zlib
  - zstd
  - libgomp
  - sysroot_linux-64 =2.17
  - llvm-openmp
source:
  patches:
  - 0001-File-take-install-path-lengths-at-run-time.patch
  sha256: 70c7f7afff938634b5e87a7c9f71856a4469ae0e45d66dd50655460dbf6d6535
  url: https://github.com/OpenMS/OpenMS/releases/download/v3.6.0/OpenMS-3.6.0.tar.gz
test:
  commands:
  - echo "Tests are in subpackages"
