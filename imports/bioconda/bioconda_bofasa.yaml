about:
  home: https://github.com/raufs/bofasa
  license: BSD-3-Clause
  license_family: BSD
  summary: 'bofasa: bacterial orthology finding and syntenic analysis'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - ' -m pip install . --no-deps --no-build-isolation -vv'
  - mkdir -p $PREFIX/share/bofasa/db
  - mkdir -p $PREFIX/etc/conda/activate.d
  - mkdir -p $PREFIX/etc/conda/deactivate.d
  - echo '#!/bin/bash' > $PREFIX/etc/conda/activate.d/bofasa-activate.sh
  - echo 'export BOFASA_DB_PATH="${CONDA_PREFIX}/share/bofasa/db"' >> $PREFIX/etc/conda/activate.d/bofasa-activate.sh
  - echo '#!/bin/bash' > $PREFIX/etc/conda/deactivate.d/bofasa-deactivate.sh
  - echo 'unset BOFASA_DB_PATH' >> $PREFIX/etc/conda/deactivate.d/bofasa-deactivate.sh
extra:
  recipe-maintainers:
  - raufs
package:
  name: bofasa
  version: 1.2.1
requirements:
  host:
  - python
  - setuptools
  - pip
  run:
  - python >=3.9
  - genomad
  - setuptools
  - biopython
  - pip
  - orthofinder =2.5.5
  - diamond
  - scipy
  - slclust
  - ete3
  - prodigal
  - pyrodigal
  - scipy
  - pyhmmer =0.11.1
  - genomad
  - curl
  - rich-argparse
  - tqdm
  - plotly
  - slclust
  - pandas
  - xlsxwriter
  - hmmer
  - trimal
  - muscle =5.1
  - hmmer
  - xgboost
  - fasttree
  - legacy-cgi
source:
- sha256: 925c61071b86f10af0ea28d073c96ace3e1d4f32ece8c2192eae4bdc0715a21f
  url: https://github.com/raufs/bofasa/archive/refs/tags/v1.2.1.tar.gz
test:
  commands:
  - bofasa -h
  - test -f "$PREFIX/etc/conda/activate.d/bofasa-activate.sh"
