about:
  description: 'AlignView is a terminal workspace for nucleotide and protein sequences,

    local search evidence, multiple alignments and standalone offline reports.

    Viewing existing alignments, the bundled demonstration and report exports

    require only Python. Scientific engines are installed separately for the

    selected analysis, for example BLAST, DIAMOND, MAFFT or VSEARCH.

    '
  dev_url: https://github.com/Est-oup/AlignView
  doc_url: https://github.com/Est-oup/AlignView/tree/main/docs
  home: https://github.com/Est-oup/AlignView
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Sequence alignment inspection and local similarity evidence
build:
  entry_points:
  - alignview = alignview:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - Est-oup
package:
  name: alignview
  version: 1.0.0
requirements:
  host:
  - python 3.10.*
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.10
source:
  sha256: f819f53b917a59ec8b7d016276d6ebcb722f1bbcf2aaab1c9330e0ca6d079bdf
  url: https://github.com/Est-oup/AlignView/releases/download/v1.0.0/alignview-1.0.0.tar.gz
test:
  commands:
  - cd "$(mktemp -d)"
  - alignview --version
  - alignview --help
  - alignview --docs quickstart
  - alignview --docs files
  - alignview --demo --no-menu --no-open --save --out "bioconda smoke project" --html-out
    "bioconda smoke report.html"
  - alignview report "bioconda smoke project" --html-out "bioconda resumed report.html"
    --no-open
  - python -c "import json,pathlib; p=pathlib.Path('bioconda smoke project'); d=json.loads((p/'session.json').read_text());
    assert d['msa']; assert (p/'project_manifest.json').is_file(); assert pathlib.Path('bioconda
    smoke report.html').stat().st_size > 1000; assert pathlib.Path('bioconda resumed
    report.html').stat().st_size > 1000"
  imports:
  - alignview
  - av_report
  - av_workspace
  - av_genetics
  requires:
  - python 3.10.*
