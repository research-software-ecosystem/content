about:
  description: 'uLTRA is a tool for splice alignment of long transcriptomic reads
    to a genome, guided by a database of exon annotations. It is particularly accurate
    when aligning to small exons. As of 0.3.0 uLTRA is implemented in Rust; the command
    line and output files are unchanged.

    '
  dev_url: https://github.com/ksahlin/ultra
  doc_url: https://github.com/ksahlin/ultra
  home: https://github.com/ksahlin/ultra
  license: GPL-3.0-only
  license_file:
  - LICENSE.txt
  - THIRDPARTY.yml
  summary: Splice alignment of long transcriptomic reads to a genome, guided by exon
    annotations
build:
  number: 0
  run_exports:
  - null
  script:
  - export LIBCLANG_PATH=$BUILD_PREFIX/lib
  - cd rust
  - cargo-bundle-licenses --format yaml --output ../THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  identifiers:
  - doi:10.1093/bioinformatics/btab540
  recipe-maintainers:
  - ksahlin
package:
  name: ultra_bioinformatics
  version: 0.3.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - cmake
  - make
  - clangdev
  - cargo-bundle-licenses
  run:
  - minimap2
source:
  sha256: 05a16bc19c6dc86a8c736b100767bd21839e1f2c92debc69aa158ebf4cb3c6f6
  url: https://github.com/ksahlin/ultra/archive/refs/tags/v0.3.0.tar.gz
test:
  commands:
  - uLTRA --version
  - uLTRA --help > /dev/null
  - uLTRA index --help > /dev/null
  - uLTRA align --help > /dev/null
