about:
  dev_url: https://github.com/PGScatalog/pygscatalog
  doc_url: https://pygscatalog.readthedocs.io/en/latest
  home: https://github.com/PGScatalog/pygscatalog
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Utilities for working with PGS Catalog API and scoring files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=2.0.4
extra:
  recipe-maintainers:
  - nebfield
  - smlmbrt
package:
  name: pgscatalog-utils
  version: 2.0.4
requirements:
  host:
  - python >=3.10
  - setuptools-scm
  - pip
  run:
  - python >=3.10.0
  - pgscatalog.calc
  - pgscatalog.core >=1.1.1
  - pgscatalog.match
  - pandas ==2.2.0
source:
  sha256: 3e7a9913091f8a12abf7bc1980f8c5c773cc51a9efbccffedef03dc079881c81
  url: https://pypi.org/packages/source/p/pgscatalog-utils/pgscatalog_utils-2.0.4.tar.gz
test:
  commands:
  - pip check
  - pgscatalog-download --help
  - pgscatalog-combine --help
  - pgscatalog-match --help
  - pgscatalog-matchmerge --help
  - pgscatalog-relabel --help
  - pgscatalog-aggregate --help
  - pgscatalog-ancestry-adjust --help
  imports:
  - pgscatalog.match
  - pgscatalog.calc
  - pgscatalog.core
