about:
  description: 'Annostat is a command-line toolkit for inspecting, validating, analyzing,

    and comparing bacterial genome annotations. It produces reproducible

    statistics, quality-control results, reports, tables, and scientific

    visualizations from GFF3 and FASTA inputs.

    '
  dev_url: https://github.com/dpatel511/annostat
  home: https://github.com/dpatel511/annostat
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Analyze and validate bacterial genome annotations from GFF3 and FASTA files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - dpatel511
package:
  name: annostat
  version: 1.1.2
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10
  - matplotlib-base >=3.10
  - biopython >=1.85
source:
  sha256: 6f3ff549c6f519542c1353afb27b5e613c7ac49b3a0c7fa7c8c22656c12ca633
  url: https://pypi.org/packages/source/a/annostat/annostat-1.1.2.tar.gz
test:
  commands:
  - annostat --version
  - annostat --help
  - annostat validate --help
  - annostat inspect --help
  - annostat compare --help
  imports:
  - annostat
  - annostat.cli
