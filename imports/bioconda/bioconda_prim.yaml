about:
  description: 'prim consists of four programs for designing and scoring diagnostic
    PCR primers.

    fa2prim and prim2tab support primer design with primer3, converting template

    sequences to primer3 input and primer3 output to a table. scop scores primers
    by

    sensitivity and specificity using in silico PCR against a BLAST database and the

    NCBI taxonomy, and cops corrects the scores computed by scop using evolutionary

    distances.

    '
  dev_url: https://github.com/EvolBioInf/prim
  home: https://github.com/EvolBioInf/prim
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Programs for designing and testing diagnostic PCR primers
build:
  number: 0
  run_exports:
  - null
  skip: true
package:
  name: prim
  version: '0.2'
requirements:
  build:
  - null
  - null
  run:
  - blast
  - phylonium
  - primer3
source:
  sha256: d8b0da34ad1a65fd551cdbfb1da7129258b67028adfa1cfb5f956cd6cd289578
  url: https://github.com/EvolBioInf/prim/archive/761af3829343231c978fb37734720889fe2769a6.tar.gz
test:
  commands:
  - cops -v
  - fa2prim -v
  - prim2tab -v
  - scop -v
  - printf '>t\nACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCAACGTTGCA\n'
    | fa2prim | grep -q PRIMER_TASK=generic
