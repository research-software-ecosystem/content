about:
  dev_url: https://github.com/ndierckx/NOVOLoci
  home: https://github.com/ndierckx/NOVOLoci
  license: Other
  license_file: LICENSE
  summary: Haplotype-aware assembler for complex regions and small genomes (ONT/HiFi).
build:
  noarch: generic
  number: 0
  run_exports:
  - null
  script:
  - sed -i.bak '1s|^#!.*perl|#!/usr/bin/env perl|' NOVOLoci0.8.pl
  - install -d "$PREFIX/bin" "$PREFIX/share/novoloci"
  - install -m 0755 NOVOLoci0.8.pl "$PREFIX/bin/novoloci"
  - install -m 0644 config.txt "$PREFIX/share/novoloci/config.txt"
extra:
  identifiers:
  - doi:10.1101/2025.08.08.669243
  recipe-maintainers:
  - ndierckx
package:
  name: novoloci
  version: '0.8'
requirements:
  run:
  - perl
  - blast
  - mafft
  - perl-mce
  - perl-parallel-forkmanager
source:
  sha256: 01b449843592529c1a95c4874de42c0e683afa5156c5131a9827d26eaa0d3206
  url: https://github.com/ndierckx/NOVOLoci/archive/refs/tags/NOVOLoci0.8.tar.gz
test:
  commands:
  - novoloci 2>&1 | head -n 5
  - perl -MMCE::Channel -e1
  - perl -MMCE::Child -e1
  - perl -MParallel::ForkManager -e1
