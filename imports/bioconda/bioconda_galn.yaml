about:
  description: 'G-ALN runs `bwa aln` and `bwa index` on NVIDIA GPUs (compute capability
    7.0 or newer) and

    `bwa samse`/`sampe` on all CPU cores, writing files byte-identical to those of
    BWA 0.7.19.

    It is made for ancient DNA and other short reads. A GPU is needed for the fast
    paths;

    `galn aln --cpu-only` and `galn index -a cpu` run without one.

    '
  dev_url: https://github.com/bilalbioinfo/galn
  doc_url: https://github.com/bilalbioinfo/galn/blob/v0.2.7/README.md
  home: https://github.com/bilalbioinfo/galn
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - NOTICE.md
  - third_party/libsais/LICENSE
  - third_party/libcubwt/LICENSE
  - third_party/zlib-ng/LICENSE.md
  summary: 'G-ALN: GPU-accelerated bwa aln/index/samse/sampe, with output byte-identical
    to BWA 0.7.19.'
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  identifiers:
  - doi:10.64898/2026.10.18.759956
  recipe-maintainers:
  - bilalbioinfo
package:
  name: galn
  version: 0.2.7
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.18
  - make
  - libgomp
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-version >=12.9,<13
source:
  sha256: 557d3a77eb2d774fde0efb7010da6852c53ec0225213d67475f6e137102edb4b
  url: https://github.com/bilalbioinfo/galn/archive/refs/tags/v0.2.7.tar.gz
test:
  commands:
  - galn --version | grep -F "G-ALN 0.2.7"
  - 'galn 2>&1 | grep -F "Program: G-ALN"'
  - 'galn index 2>&1 | grep -F "Usage:   galn index"'
  - 'galn samse 2>&1 | grep -F "Usage:   galn samse"'
