about:
  description: 'EASTR (Emending Alignments of Spliced Transcript Reads) identifies
    and

    eliminates systematic alignment errors in multi-exon genes from RNA-seq

    data. This C++ implementation provides ~10x faster performance than the

    original Python version with identical results.

    '
  dev_url: https://github.com/ishinder/eastr-cpp
  doc_url: https://github.com/ishinder/eastr-cpp#readme
  home: https://github.com/ishinder/eastr-cpp
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Detect and remove spuriously spliced alignments from RNA-seq data
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional_platforms:
  - linux-aarch64
  identifiers:
  - doi:10.1038/s41467-023-43017-4
  - biotools:eastr
  recipe-maintainers:
  - ishinder
package:
  name: eastr-cpp
  version: 2.1.2
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.16
  - make
  - git
  host:
  - htslib >=1.15
  - zlib
  run:
  - bowtie2 >=2.5.2
source:
- sha256: 030329fbd78f3d81d01283c39754d0a7fb0381e88d90892c346762cf547d05d8
  url: https://github.com/ishinder/eastr-cpp/archive/v2.1.2.tar.gz
- folder: external/minimap2
  sha256: 5ea6683b4184b5c49f6dbaef2bc5b66155e405888a0790d1b21fd3c93e474278
  url: https://github.com/lh3/minimap2/archive/v2.28.tar.gz
test:
