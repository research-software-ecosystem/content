about:
  dev_url: https://github.com/louisabraham/pydivsufsort
  home: https://github.com/louisabraham/pydivsufsort
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python bindings to libdivsufsort (suffix arrays, BWT) and other string
    algorithms
build:
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - louisabraham
package:
  name: pydivsufsort
  version: 0.0.20
requirements:
  build:
  - null
  - null
  - null
  - cmake
  - make
  host:
  - python
  - pip
  - setuptools
  - wheel
  - cython
  - numpy
  - llvm-openmp
  - libgomp
  run:
  - python
  - numpy
source:
  sha256: 685a5791fae5e200ce8b7a4e5d515b6153ffde7175331bd0df81a421108ad4df
  url: https://pypi.org/packages/source/p/pydivsufsort/pydivsufsort-0.0.20.tar.gz
test:
  commands:
  - python -c "from pydivsufsort import divsufsort, kasai; assert divsufsort(\"banana\").tolist()
    == [5, 3, 1, 0, 4, 2]; assert kasai(\"banana\").tolist() == [1, 3, 0, 0, 2, 0]"
  imports:
  - pydivsufsort
