about:
  dev_url: https://github.com/lumc/cram-archiver
  doc_url: https://github.com/lumc/cram-archiver
  home: https://github.com/lumc/cram-archiver
  license: agpl-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: A samtools wrapper for CRAM conversion automation.
build:
  entry_points:
  - cram-archiver = cram_archiver.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --ignore-installed -vv '
extra:
  recipe-maintainers:
  - rhpvorderman
  - DavyCats
package:
  name: cram-archiver
  version: 1.2.0
requirements:
  host:
  - pip
  - python >=3.10
  - setuptools-scm >=8
  run:
  - python >=3.10
  - samtools >=1.25
source:
  sha256: 9d0ec88beafc5bd6fa289560ad8da11249a86109d73a633b1cc2b91bb1e7dcc1
  url: https://pypi.io/packages/source/c/cram_archiver/cram_archiver-1.2.0.tar.gz
test:
  commands:
  - cram-archiver --help
  imports:
  - cram_archiver
