  - pysam
  - matplotlib-base
  - matplotlib-venn
  - seaborn
  - python-graphviz
  - requests
  - fastcluster
  - tqdm
  - gzip
  - kraken2
  - megahit
  - minimap2
source:
  sha256: 7773c460deebd510084cc56e31206264cdd17920d45ff5d11c663a5286e87e0f
