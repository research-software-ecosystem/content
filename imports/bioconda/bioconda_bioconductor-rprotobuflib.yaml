about:
  description: This package provides the headers and static library of Protocol buffers
    for other R packages to compile and link against.
  dev_url: https://bioconductor.org/packages/3.23/bioc/html/RProtoBufLib.html
  home: https://bioconductor.org/packages/3.23/bioc/html/RProtoBufLib.html
  license: BSD-3-Clause
  license_family: BSD
  summary: C++ headers and static libraries of Protocol buffers.
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  parent_recipe:
    name: bioconductor-rprotobuflib
    path: recipes/bioconductor-rprotobuflib
    version: 1.2.0
package:
  name: bioconductor-rprotobuflib
  version: 2.24.0
requirements:
  build:
  - null
  - null
  - null
  - autoconf
  - automake
  - libtool
  - pkg-config
  - make
  - gnuconfig
  host:
  - r-base
  - libblas
  - liblapack
  - protobuf <4
  - zlib
  - liblzma-devel
  run:
  - r-base
source:
  sha256: dad6a02a99d556bf8dcebda3e9de7c5aff3181671da9adc93c0d7011ae6743d4
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/RProtoBufLib_2.24.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/RProtoBufLib/RProtoBufLib_2.24.0.tar.gz
  - https://bioarchive.galaxyproject.org/RProtoBufLib_2.24.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-rprotobuflib/bioconductor-rprotobuflib_2.24.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('RProtoBufLib')"
