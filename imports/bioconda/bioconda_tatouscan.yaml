about:
  home: https://github.com/JeanMainguy/tatouscan
  license: MIT
  license_file: LICENSE
  summary: 'A command-line tool for identifying toxin-antitoxin (TA) systems in genomes
    and metagenomes. '
build:
  entry_points:
  - tatouscan = tatouscan.main:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - JeanMainguy
package:
  name: tatouscan
  version: 0.3.0
requirements:
  host:
  - python >=3.10
  - setuptools >=61.0.0
  - pip
  run:
  - python >=3.10
  - rich
  - typer >=0.15.0
  - pyhmmer >=0.11.0,<0.12.0
source:
  sha256: a7c56168c27c859446e0e6db39fe67db47e9c530f4ceb1a963a4a2b7d35f9d52
  url: https://pypi.org/packages/source/t/tatouscan/tatouscan-0.3.0.tar.gz
test:
  commands:
  - pip check
  - tatouscan --help
  imports:
  - tatouscan
  requires:
  - pip
