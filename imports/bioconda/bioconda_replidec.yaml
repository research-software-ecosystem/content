about:
  dev_url: https://github.com/pengSherryYel/Replidec
  doc_url: https://github.com/pengSherryYel/Replidec/blob/v.0.3.6/README.md
  home: https://github.com/deng-lab/Replidec
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Replication Cycle Decipher for Phages.
build:
  entry_points:
  - Replidec = Replidec.Replidec_cmdline:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - pengSherryYel
package:
  name: replidec
  version: 0.3.6
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - biopython >=1.77
  - future >=0.18.2
  - numpy >=1.21
  - blast
  - hmmer
  - mmseqs2
  - prodigal
source:
  sha256: 346f59fdecdd43cb1d01c7fb6ad895a7e0f0e78e66b228a924a4ed3e9087a507
  url: https://pypi.org/packages/source/r/replidec/replidec-0.3.6.tar.gz
test:
  commands:
  - Replidec --help
