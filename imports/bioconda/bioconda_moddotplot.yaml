about:
  dev_url: https://github.com/marbl/ModDotPlot
  doc_url: https://github.com/marbl/ModDotPlot/blob/v0.9.9/README.md
  home: https://github.com/marbl/ModDotPlot
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: ModDotPlot is a dot plot visualization tool designed to be used at scale,
    both for smaller sequences and whole genomes.
build:
  entry_points:
  - moddotplot = moddotplot.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  identifiers:
  - doi:10.1093/bioinformatics/btae493
package:
  name: moddotplot
  version: 0.9.9
requirements:
  host:
  - python >=3.7
  - setuptools >=61.0
  - pip
  run:
  - python >=3.7
  - pysam
  - pandas
  - plotly
  - dash
  - plotnine ==0.12.4
  - palettable
  - mmh3
  - setproctitle
  - numpy
  - pillow
  - patchworklib ==0.6.3
  - cairosvg
  - pygenometracks
  - svgutils
  - cooler
  - seaborn-base
source:
  sha256: 7c897cdfbe55b59e7c2db12024425599eb1676af8044648475aa3470574cdc66
  url: https://github.com/marbl/ModDotPlot/archive/v0.9.9.tar.gz
test:
  commands:
  - moddotplot --help
  imports:
  - moddotplot
