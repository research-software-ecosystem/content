about:
  dev_url: https://github.com/ablab/IsoQuant
  doc_url: https://ablab.github.io/IsoQuant
  home: https://github.com/ablab/IsoQuant
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file: LICENSE
  summary: IsoQuant is a tool for reference-based analysis of long RNA reads, such
    as gene/transcript quantification and discovery.
build:
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  identifiers:
  - doi:10.1038/s41587-022-01565-y
package:
  name: isoquant
  version: 4.0.0
requirements:
  host:
  - python
  - pip
  - setuptools >=64
  run:
  - python
  - biopython >=1.76
  - coverage >=7.6
  - editdistance >=0.8.1
  - gffutils >=0.10.1
  - intervaltree >=3.0
  - mappy >=2.24
  - matplotlib-base >=3.1.3
  - minimap2 >=2.18
  - numba >=0.58
  - numpy >=1.24
  - packaging
  - pandas >=1.0.1
  - pyfaidx >=0.7
  - pysam >=0.15
  - pyyaml >=5.4
  - samtools >=1.14
  - scipy >=1.10
  - seaborn-base >=0.10.0
  - scikit-learn >=1.3.2
  - star
  - ssw-py >=1.0
  - xgboost >=2.1.4
source:
  sha256: 98fbe5b2f9c39c9cc52041b106f06e6f11bbf9c75c500b44505e973805ed0921
  url: https://github.com/ablab/IsoQuant/releases/download/v4.0.0/IsoQuant-4.0.0.tar.gz
test:
  commands:
  - isoquant --test
  - rm -rf isoquant_test
  source_files:
  - isoquant_tests
