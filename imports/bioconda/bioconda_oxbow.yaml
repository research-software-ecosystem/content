about:
  dev_url: https://github.com/abdenlab/oxbow
  home: https://github.com/abdenlab/oxbow
  license: MIT AND Apache-2.0
  license_file:
  - oxbow/LICENSE-APACHE
  - oxbow/LICENSE-MIT
  - THIRDPARTY.yml
  summary: Read genomic file formats into data frames and more.
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  recipe-maintainers:
  - Matt-BF
package:
  name: oxbow
  version: 0.8.2
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  host:
  - python
  - maturin >=1.0,<2.0
  - pip
  run:
  - python
  - arro3-core >=0.4.6
  - polars >=1.26.0
  - pandas >=2.2.3
  - pyarrow >=19.0.1
  - fsspec >=2025.5.1
  - typing_extensions
source:
  sha256: e978d75835a775ab1f5de5db335c765396b0a9e03357e708d5db3ac13a5959da
  url: https://pypi.org/packages/source/o/oxbow/oxbow-0.8.2.tar.gz
test:
  imports:
  - oxbow
