about:
  dev_url: https://github.com/duceppemo/primer-finder
  doc_url: https://github.com/duceppemo/primer-finder/wiki
  home: https://github.com/duceppemo/primer-finder
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Find group-specific kmers to design selective qPCR assays
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: primer-finder
  version: 1.10.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10
  - kmc >=3.2
  - skesa >=2.4
  - spades >=3.15
  - minimap2 >=2.24
  - blast >=2.14
  - primer3 >=2.6
source:
  sha256: acacfa9017a9ced2513a810fb01df54ff95188197a975a147f61bda5bfe93c60
  url: https://github.com/duceppemo/primer-finder/archive/refs/tags/v1.10.0.tar.gz
test:
  commands:
  - primer-finder --help
  - primer-finder --version
