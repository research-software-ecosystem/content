about:
  description: 'fast-beagle is a standalone C port of Beagle 5.5 (27Feb25), the genotype

    phasing and imputation tool. Its output is byte-identical to the Java

    release run with the same nthreads=. It installs as fast-beagle and takes

    Beagle''s key=value arguments.

    '
  dev_url: https://github.com/michael-denyer/fast-beagle-5.5
  doc_url: https://github.com/michael-denyer/fast-beagle-5.5/blob/main/docs/usage.md
  home: https://github.com/michael-denyer/fast-beagle-5.5
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: C port of Beagle 5.5 phasing and imputation with byte-identical output
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - michael-denyer
package:
  name: fast-beagle
  version: 5.5.3
requirements:
  build:
  - null
  - null
  - make
  host:
  - htslib
source:
  sha256: 85507f5e4997a9401e8ecd4453b4673f4a45c76225802b8083a5ad6958a91e3d
  url: https://github.com/michael-denyer/fast-beagle-5.5/releases/download/v5.5.3/fast-beagle-5.5.3.tar.gz
test:
  commands:
  - printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\tA\tB\tC\tD\n'
    > t.vcf
  - for p in 100 200 300 400 500 600 700 800; do printf '1\t%s\t.\tA\tC\t.\tPASS\t.\tGT\t0/1\t1/1\t0/0\t0/1\n'
    "$p" >> t.vcf; done
  - fast-beagle gt=t.vcf out=t nthreads=2
  - test "$(bgzip -dc t.vcf.gz | grep -vc '^#')" = 8
  - bgzip -dc t.vcf.gz | grep -v '^#' | cut -f10- | grep -c / | grep -qx 0
  requires:
  - htslib
