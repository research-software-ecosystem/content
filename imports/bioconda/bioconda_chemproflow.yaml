about:
  home: https://github.com/brsynth/chemproflow
  license: MIT
  license_file: LICENSE
  summary: End-to-end mapping of membrane transport from chemical structure to microorganisms
build:
  entry_points:
  - chemproflow=chemproflow.pipeline.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install -vv --no-deps --no-build-isolation .
extra:
  recipe-maintainers:
  - guillaume-gricourt
package:
  name: chemproflow
  version: 1.2.0
requirements:
  host:
  - pip
  - python
  - pyyaml
  - setuptools
  run:
  - python
  - blast ==2.16.0
  - cmap
  - iterative-stratification =0.1.9
  - jinja2
  - lightning =2.5.6
  - natsort
  - optuna =4.4.0
  - owlready2
  - pandas
  - pybiopax
  - pytorch =2.9.1
  - pytorch_geometric =2.7.0
  - rdflib
  - rdkit =2024.9.3
  - scikit-learn =1.7.2
  - scikit-multilearn =0.2.0
  - scipy =1.17.1
  - seaborn
  - tensorboard
  - torchmetrics
  - tqdm
source:
  sha256: 537d1675f79dfd0a6ac482b477384f02b4bc8e13c63fe5128a6b1c7bdfb88e5f
  url: https://github.com/brsynth/chemproflow/archive/1.2.0.tar.gz
test:
  commands:
  - chemproflow --help
  imports:
  - chemproflow
