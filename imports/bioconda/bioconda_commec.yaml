about:
  dev_url: https://github.com/ibbis-screening/common-mechanism
  doc_url: https://github.com/ibbis-screening/common-mechanism/wiki
  home: https://github.com/ibbis-screening/common-mechanism
  license: MIT
  license_family: MIT
  summary: 'commec: a free, open-source, globally available tool for DNA sequence
    screening'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  container:
    image: quay.io/biocontainers/commec
  identifiers:
  - biotools:commec
package:
  name: commec
  version: 2.0.0
requirements:
  build:
  - python >=3.10
  - pip
  - setuptools
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - biopython
  - numpy
  - pandas
  - pyyaml
  - pycountry
  - blast >=2.17
  - hmmer
  - infernal
  - wget
  - yaml
  - tar
  - zstd
source:
  sha256: 1f8ab8e1c1cee5918dbcd83b2a86642c0f0945cabe078246a42cc18637b6c056
  url: https://github.com/ibbis-screening/common-mechanism/archive/refs/tags/v2.0.0.tar.gz
test:
  commands:
  - commec screen --help
  - commec flag --help
  - commec list --help
