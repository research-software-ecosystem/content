about:
  dev_url: https://github.com/ibbis-bio/common-mechanism
  doc_url: https://github.com/ibbis-bio/common-mechanism/wiki
  home: https://commec.ibbis.bio
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'commec: a free, open-source, globally available tool for DNA synthesis
    screening'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  container:
    image: quay.io/biocontainers/commec
  identifiers:
  - biotools:commec
package:
  name: commec
  version: 2.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - biopython
  - numpy
  - pandas
  - pyyaml
  - pycountry
  - flask
  - werkzeug
  - openpyxl
  - xlrd
  - psutil
  - blast >=2.17
  - hmmer
  - infernal
  - mkcert
  - tar
  - zstd
source:
  sha256: e4657ae7ce1338c473a649a33c993fe81f79afb403a22a639c8b13558e7be55d
  url: https://github.com/ibbis-bio/common-mechanism/archive/refs/tags/v2.1.0.tar.gz
test:
  commands:
  - commec --version
  - commec setup --help
  - commec screen --help
  - commec flag --help
  - commec list --help
  - commec gui --help
