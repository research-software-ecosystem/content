  - python >=3.10
  - pip
  - hatchling
  run:
  - python >=3.10
source:
  sha256: 3e5d2154011198b0e4b4598c3e1868059d01dca42e0440df46d639e65f58f4ae
  url: https://github.com/SMD-Bioinformatics-Lund/smd-variant-tools/archive/refs/tags/v0.1.0.tar.gz
