about:
  description: Implements exact and approximate methods for singular value decomposition
    and principal components analysis, in a framework that allows them to be easily
    switched within Bioconductor packages or workflows. Where possible, parallelization
    is achieved using the BiocParallel framework.
  home: https://bioconductor.org/packages/3.23/bioc/html/BiocSingular.html
  license: GPL-3
  license_file: /lib/R/share/licenses/GPL-3
  summary: Singular Value Decomposition for Bioconductor Packages
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:biocsingular
package:
  name: bioconductor-biocsingular
  version: 1.28.0
requirements:
  build:
  - null
  - null
  - null
  - make
  host:
  - bioconductor-assorthead >=1.6.3,<1.7.0
  - bioconductor-beachmat >=2.28.0,<2.29.0
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-biocparallel >=1.46.0,<1.47.0
  - bioconductor-delayedarray >=0.38.2,<0.39.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - bioconductor-scaledmatrix >=1.20.0,<1.21.0
  - r-base
  - r-irlba
  - r-matrix
  - r-rcpp
  - r-rsvd
  - libblas
  - liblapack
  - zlib
  - liblzma-devel
  run:
  - bioconductor-assorthead >=1.6.3,<1.7.0
  - bioconductor-beachmat >=2.28.0,<2.29.0
  - bioconductor-biocgenerics >=0.58.1,<0.59.0
  - bioconductor-biocparallel >=1.46.0,<1.47.0
  - bioconductor-delayedarray >=0.38.2,<0.39.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - bioconductor-scaledmatrix >=1.20.0,<1.21.0
  - r-base
  - r-irlba
  - r-matrix
  - r-rcpp
  - r-rsvd
source:
  md5: ad586e9236ce6ee15e6ae67dc3180e45
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/BiocSingular_1.28.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/BiocSingular/BiocSingular_1.28.0.tar.gz
  - https://bioarchive.galaxyproject.org/BiocSingular_1.28.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-biocsingular/bioconductor-biocsingular_1.28.0_src_all.tar.gz
test:
