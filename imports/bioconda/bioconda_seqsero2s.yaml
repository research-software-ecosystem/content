about:
  dev_url: https://github.com/LSTUGA/SeqSero2S
  home: https://github.com/LSTUGA/SeqSero2S
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Simplified Salmonella serotype prediction from genome sequencing data
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  - bash $RECIPE_DIR/patch_stringmlst.sh
extra:
  identifiers:
  - doi:10.1128/aem.02600-24
  recipe-maintainers:
  - LSTUGA
  - crashfrog
  - biocoder
package:
  name: seqsero2s
  version: 1.2.1
requirements:
  host:
  - python >=3
  - pip
  - setuptools
  - stringmlst >=0.6
  run:
  - python >=3
  - blast >=2.2
  - zstd
  - samtools
  - bedtools >=2.17
  - sra-tools >=2.8
  - spades >=3.9
  - salmid
  - bwa >=0.7
  - seqtk >=1.3
  - stringmlst >=0.6
  - mlst >=2.32.2
source:
  sha256: 01f8e9640e035a2645896a19bbc486dc2302bb14705a7ac55e3753e6556324b8
  url: https://github.com/LSTUGA/SeqSero2S/archive/refs/tags/v1.2.1.tar.gz
test:
  commands:
  - SeqSero2S.py -h
  - blastn -help
  - SalmID.py -h
  - mlst -h
