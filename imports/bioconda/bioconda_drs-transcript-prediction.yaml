about:
  description: 'TP predicts transcripts by finding candidate transcript start/stop
    sites from

    changes in read depth across distinct regions of a position-sorted BED file of

    direct RNA sequencing reads, then filters alternative transcripts that could use

    various start/stop combinations. Outputs candidate and predicted transcripts in

    BED format, and predicted transcripts in GFF3 format.

    '
  dev_url: https://github.com/Dunning-Hotopp-Lab/Direct_RNA_Sequencing
  doc_url: https://github.com/Dunning-Hotopp-Lab/Direct_RNA_Sequencing/blob/v1.0.5/README.md
  home: https://github.com/Dunning-Hotopp-Lab/Direct_RNA_Sequencing
  license: AGPL-3.0-only
  license_family: AGPL
  license_file: LICENSE
  summary: 'TP (Transcript Prediction): predict transcripts from candidate start/stop
    sites in direct RNA sequencing reads.'
build:
  entry_points:
  - drs-transcript-prediction = tp:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - adkinsrs
package:
  name: drs-transcript-prediction
  version: 1.0.5
requirements:
  host:
  - python 3.9
  - pip
  - setuptools >=77
  run:
  - python >=3.9
  - numpy >=1.20
  - pandas >=2.0
source:
  sha256: 0ea88f0cd60b1e7c01b307d5ef69f27273c28df3d0e00d4dba36d5324a40c999
  url: https://github.com/Dunning-Hotopp-Lab/Direct_RNA_Sequencing/archive/refs/tags/v1.0.5.tar.gz
test:
  commands:
  - drs-transcript-prediction --help
  - drs-transcript-prediction --version
  - tp.py --help
  imports:
  - tp
  requires:
  - python 3.9
