about:
  description: A computational oncology assay to infer subclonal payoff matrices,
    solve Nash equilibria, decouple microenvironmental confounders, and simulate adaptive
    therapy regimens directly from intact spatial transcriptomics biopsies.
  dev_url: https://github.com/Lukecele/spatial-game-assay
  home: https://lukecele.github.io/spatial-game-assay/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: In situ spatial evolutionary game assay for inferring tumor subclonal payoff
    matrices and adaptive therapy regimens.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.5281/zenodo.23585216
  recipe-maintainers:
  - Lukecele
package:
  name: insitugame
  version: 1.0.7
requirements:
  host:
  - python >=3.9
  - setuptools >=61.0
  - pip
  run:
  - python >=3.9
  - numpy >=1.20
  - scipy >=1.7
  - pandas >=1.3
  - scikit-learn >=1.0
  - matplotlib-base >=3.4
source:
  sha256: 1ac85bc3043aeffd4b52f75524cbb3a80dc66afd8d8b48be6fc00aa852d83cf1
  url: https://github.com/Lukecele/spatial-game-assay/archive/refs/tags/v1.0.7.tar.gz
test:
  imports:
  - insitugame
