about:
  description: "In data dependent acquisition the instrument picks the ions it fragments\
    \ more or less at random. \nA peptide identified and quantified in one run is\
    \ therefore often present in another run without ever having been fragmented there,\
    \ \nso that run has no identification and no quantification for it. Run alignment\
    \ maps the scan time of one run onto another, \nso that a later tool can look\
    \ for the peptide where it should elute. \nQuantBasedAlignment reads the quantified\
    \ peptide ions of a target run (-i) and of one or more source runs (-ii). \nOn\
    \ the peptide ions a source run shares with the target it fits a smoothing spline\
    \ from source scan times to \ntarget scan times, and with that spline it predicts\
    \ the scan time of every source peptide ion in the target run.\nAlignmentBasedQuantification\
    \ then extracts and quantifies the peptide ions at the predicted scan times.\n"
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/QuantBasedAlignment.html
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: QuantBasedAlignment predicts where peptide ions from one run should appear
    in another run, enabling their later quantification even when they were not identified
    there.
