about:
  dev_url: https://github.com/EBI-Metagenomics/EukCC
  doc_url: https://eukcc.readthedocs.io/en/latest
  home: https://github.com/EBI-Metagenomics/EukCC
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Check eukaryotic genomes or MAGs for completeness and contamination.
build:
  entry_points:
  - eukcc = eukcc.__main__:main
  - shared_markers = eukcc.find_markerset:main
  - binlinks = scripts.binlinks:main
  - filter_euk_bins = scripts.filter_euk_bins:main
  - binlinks.py = scripts.binlinks:main
  - filter_euk_bins.py = scripts.filter_euk_bins:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir'
extra:
  recipe-maintainers:
  - openpaul
  - dezordi
package:
  name: eukcc
  version: 2.3.1
requirements:
  host:
  - pip
  - python >=3.10,<3.12
  - setuptools >=61.0
  run:
  - biopython ==1.83
  - click >=8.1
  - ete3 >=3.1.3
  - jsonpickle >=4.0.0
  - numpy >=1.24.4
  - python >=3.10,<3.12
  - hmmer =3.3
  - epa-ng =0.3.8
  - metaeuk =4.a0f584d
  - bwa
  - pplacer
  - samtools >=1.12
  - pysam ==0.21.0
  - six
source:
  sha256: 7b3176d7ae97c138e4df2c5116a610ce864a6e95b22e62618f82c0b20b6075a7
  url: https://pypi.io/packages/source/e/eukcc/eukcc-2.3.1.tar.gz
test:
  commands:
  - eukcc --help > /dev/null
  imports:
  - eukcc
