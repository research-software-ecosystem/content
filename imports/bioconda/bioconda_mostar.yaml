about:
  home: https://github.com/nermze/MOSTAR
  license: MIT
  license_file: LICENSE
  summary: Modular ONT-Short-read Taxonomic Assembly and Resistome-Evolution pipeline
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  notes: "Post-install setup required before first use (databases are not bundled):\n\
    \  amrfinder -u\n  msf_data install --target <path> CONJScan\n  (plus separate\
    \ Kraken2, Bakta, and geNomad database downloads \u2014\n   see project README\
    \ for details)\n"
  recipe-maintainers:
  - nermze
package:
  name: mostar
  version: 1.0.5
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools >=61
  run:
  - python >=3.11
  - flye
  - medaka
  - filtlong
  - polypolish
  - fastp
  - bwa
  - samtools
  - bcftools
  - minimap2
  - circlator
  - bakta =1.11.4
  - pyhmmer <0.11
  - hmmer =3.4
  - alive-progress =3.0.1
  - ncbi-amrfinderplus
  - blast
  - kraken2
  - macsyfinder
  - genomad
  - matplotlib-base
  - numpy
  - pandas
  - biopython
  - osfclient
  - wget
  - curl
source:
  sha256: 1177b73f1b47d365d301ee96afa7fb6a7ce36948b22d3148a7a15986a4870333
  url: https://pypi.io/packages/source/m/mostar/mostar-1.0.5.tar.gz
test:
  commands:
  - mostar --help
