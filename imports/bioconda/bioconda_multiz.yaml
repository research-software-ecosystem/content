about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:multiz
  - biotools:tba
  - biotools:roast
package:
  name: multiz
  version: '11.4'
requirements:
  build:
  - make
  - null
  - null
  host: null
  run:
  - coreutils
  - grep
source:
  sha256: a0e11b8ce8757359aee643f115f21ce0c0e477b1695f91454cc5b33608be945f
  url: https://github.com/multiz/multiz/archive/refs/tags/v11.4.tar.gz
test:
  commands:
  - multiz 2>&1 | grep -qF 'multiz.v11.4'
  - tba 2>&1 | grep -qF 'tba.v14'
  - roast 2>&1 | grep -qF 'roast.v4'
