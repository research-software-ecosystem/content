about:
  home: http://www.bx.psu.edu/miller_lab/
  license: MIT
  summary: DNA multiple sequence aligner from Penn State's Miller lab.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:multiz
  - biotools:tba
  - biotools:roast
package:
  name: multiz
  version: '11.1'
requirements:
  build:
  - make
  - null
  - null
  host: null
  run:
  - coreutils
  - gawk
  - grep
source:
  patches:
  - mkdtemp-darwin.patch
  sha256: 791cb7e0f9061bfd652927aa0d95335f9f839e5fdb89020b173b9f85393e21d7
  url: https://github.com/multiz/multiz/archive/refs/tags/v11.10.tar.gz
test:
  commands:
  - multiz 2>&1 | grep -qF 'multiz.v11.10'
  - tba 2>&1 | grep -qF 'tba.v20'
  - roast 2>&1 | grep -qF 'roast.v9'
