about:
  dev_url: https://github.com/ferdinand-popp/telomerehunter2
  doc_url: https://ferdinand-popp.github.io/telomerehunter2
  home: https://github.com/ferdinand-popp/telomerehunter2
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.txt
  summary: An advanced version of TelomereHunter for Python 3. Single-cell and bulk
    telomere content estimation from NGS data with improved accuracy and new features.
build:
  entry_points:
  - telomerehunter2 = telomerehunter2.telomerehunter2_main:main
  - telomerehunter2-sc = telomerehunter2.telomerehunter2_sc:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
package:
  name: telomerehunter2
  version: 1.0.11
requirements:
  host:
  - python >=3.8
  - setuptools >=61.0.0
  - python-build >=0.10.0
  - pip
  run:
  - python >=3.8
  - pysam >=0.20.0
  - pandas >=1.4.0
  - numpy >=1.22.0
  - pypdf2 >=2.0.0
  - plotly >=5.0.0
  - python-kaleido >=0.2.1
source:
  sha256: 0c783112ed2a217067552c5dc88c7e4a8331073ba3260c121fdc21d9b44be397
  url: https://pypi.org/packages/source/t/telomerehunter2/telomerehunter2-1.0.11.tar.gz
test:
  commands:
  - telomerehunter2 --help
  - telomerehunter2-sc --help
  imports:
  - telomerehunter2
