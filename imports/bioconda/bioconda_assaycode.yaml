about:
  description: 'This metapackage installs the matching DotMatch release, which provides
    the

    assaycode compatibility command for compiling and inspecting assay

    specifications alongside the main dotmatch command.

    '
  dev_url: https://github.com/dnncha/dotmatch
  doc_url: https://dotmatch.readthedocs.io/en/latest/assaycode.html
  home: https://dnncha.github.io/dotmatch
  license: Apache-2.0
  summary: Compatibility metapackage for the assaycode command included with DotMatch.
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - dnncha
package:
  name: assaycode
  version: 0.2.2
requirements:
  run:
  - dotmatch ==0.2.2
test:
  commands:
  - assaycode --version | grep '^assaycode 0.2.2 (DotMatch engine 0.2.2)$'
  - assaycode --help | grep 'additive assay-level identity'
  - dotmatch --version | grep '^dotmatch 0.2.2$'
  - python -c "import assaycode, dotmatch; assert assaycode.engine is dotmatch"
