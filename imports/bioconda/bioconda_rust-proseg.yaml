about:
  dev_url: https://github.com/dcjones/proseg
  doc_url: https://github.com/dcjones/proseg/blob/v3.2.0/README.md
  home: https://github.com/dcjones/proseg
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE.md
  summary: A Rust crate for running Proseg, a cell segmentation method for in situ
    spatial transcriptomics.
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: rust-proseg
  version: 3.2.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 41be6532b44772a9588cc8f6ef96711d1cd2a0ecb5ebfd2fe2c8f7314633a2ea
  url: https://github.com/dcjones/proseg/archive/refs/tags/v3.2.0.tar.gz
test:
  commands:
  - proseg --version
  - proseg-to-baysor --help
