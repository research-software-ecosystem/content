about:
  description: 'FitHiChIP calls statistically significant cis interactions (loops)
    from HiChIP and PLAC-seq data,

    modelling the distance decay and the coverage (or ICE) bias of the bins. Run it
    with

    `FitHiChIP_HiCPro.sh -C configfile`. The wrapper runs a private copy of the FitHiChIP
    code

    (installed in share/fithichip-<version>), because FitHiChIP runs its scripts from
    its own directory

    and writes there. Input contacts can be a HiC-Pro bin and matrix pair, a .cool/.mcool,
    a .hic or a BED

    interaction file. HiC-Pro is not included; it is needed only to build the matrix
    from a validPairs file.

    '
  dev_url: https://github.com/ay-lab/FitHiChIP
  doc_url: https://ay-lab.github.io/FitHiChIP/
  home: https://github.com/ay-lab/FitHiChIP
  license: MIT
  license_family: MIT
  license_file: fithichip/LICENSE
  summary: Identification of significant chromatin contacts from HiChIP and PLAC-seq
    data.
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  identifiers:
  - doi:10.1038/s41467-019-11950-y
  recipe-maintainers:
  - birkiy
package:
  name: fithichip
  version: '11.0'
requirements:
  run:
  - python >=3.4
  - numpy
  - networkx
  - hic-straw
  - cooler
  - r-base >=3.3
  - r-optparse
  - r-ggplot2
  - r-data.table
  - r-fdrtool
  - r-plyr
  - r-dplyr
  - r-rcolorbrewer
  - bioconductor-genomicranges
  - bioconductor-edger
  - bedtools >=2.26
  - samtools >=1.6
  - htslib
  - ucsc-bedtobigbed
  - macs2
  - iced
  - bc
  - gawk
  - gzip
  - coreutils
source:
- folder: fithichip
  sha256: 0ab11a130ad6b070f82ce7dff330f877c4b0156f9fe90b6e582e462339380e6c
  url: https://github.com/ay-lab/FitHiChIP/archive/refs/tags/11.0.tar.gz
- folder: ucsc
  sha256: 32a1a53db52bb05b3679f71e590e9e50ca5d810682bd408e7da0de63e665bef1
  url: https://raw.githubusercontent.com/ucscGenomeBrowser/kent/v502_base/src/hg/lib/interact.as
test:
  commands:
  - FitHiChIP_HiCPro.sh -h 2>&1 | grep -q ConfigFile
  - test -f ${PREFIX}/share/fithichip-11.0/interact.as
  - test -f ${PREFIX}/share/fithichip-11.0/src/FitHiC_SigInt.r
  - ice --help
  - macs2 --version
  - python -c "import hicstraw, networkx, numpy"
  - Rscript -e "suppressMessages({library(optparse); library(ggplot2); library(data.table);
    library(fdrtool); library(plyr); library(dplyr); library(RColorBrewer); library(GenomicRanges);
    library(edgeR)})"
