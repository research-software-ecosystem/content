about:
  home: https://github.com/yfukasawa/LongQC
  license: MIT
  license_file: LICENSE
  summary: LongQC is a tool for the data quality control of the PacBio and ONT long
    reads
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: longqc
  version: 1.2.3
requirements:
  run:
  - python >=3
  - minimap2-coverage
  - numpy
  - scipy
  - matplotlib-base >=2.1.2
  - scikit-learn
  - pandas >=0.24.0
  - jinja2
  - h5py
  - pysam
  - python-edlib
source:
  sha256: 812379c26db5f7ef5664b1d2214b0703136659c7e41332bf5309653fb6360de9
  url: https://github.com/yfukasawa/LongQC/archive/refs/tags/v1.2.3.tar.gz
test:
  commands:
  - longQC.py --help
  - longQC.py sampleqc --help
  - minimap2-coverage --help
