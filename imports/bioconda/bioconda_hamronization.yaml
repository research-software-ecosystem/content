about:
  home: https://github.com/pha4ge/hAMRonization
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  summary: Tool to convert and summarize AMR gene detection outputs using the hAMRonization
    specification
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - fmaguire
package:
  name: hamronization
  version: 1.4.1
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools
  run:
  - python >=3.7
  - pandas
source:
  sha256: 8a4292897a19a1224e1f621da194739d527c8443a9978aede3bf5a844cbcb00d
  url: https://pypi.org/packages/source/h/hamronization/hamronization-1.4.1.tar.gz
test:
  commands:
  - pip check
  - hamronize --help
  imports:
  - hAMRonization
  requires:
  - pip
