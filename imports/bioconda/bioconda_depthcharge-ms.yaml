about:
  home: https://wfondrie.github.io/depthcharge/latest
  license: Apache-2.0
  license_file: LICENSE
  summary: A mass spectrometry toolkit for deep learning with Transformer models.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - wagnerr-umn
package:
  name: depthcharge-ms
  version: 0.4.10
requirements:
  host:
  - python >=3.10,<3.14
  - setuptools >=61
  - wheel
  - setuptools-scm >=3.4
  - pip
  run:
  - python >=3.10,<3.14
  - pytorch >=2.0.0
  - polars >=0.19.0
  - pyarrow >=12.0.1
  - pylance >=0.7.5
  - pyteomics >=4.7.2
  - numpy >=1.18.1
  - numba >=0.48.0
  - lxml >=4.9.1
  - einops >=0.4.1
  - tqdm >=4.65.0
  - lark >=1.1.4
  - selfies >=2.1.1
  - sortedcontainers >=2.4.0
  - dill >=0.3.6
  - rdkit >=2023.03.1
  - pillow >=9.4.0
  - spectrum_utils >=0.4.1
  - cloudpathlib >=0.18.1
  - psims >=1.3.3
  - timsrust_pyo3 >=0.4.1,<0.5.0
source:
  sha256: effff388c0f8db7fbcbffc5018f41f636901d13d6df9ce7e47c15b674cd943aa
  url: https://pypi.org/packages/source/d/depthcharge-ms/depthcharge_ms-0.4.10.tar.gz
test:
  commands:
  - pip check
  imports:
  - depthcharge
  requires:
  - pip
