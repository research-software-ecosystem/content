about:
  home: https://github.com/richardstoeckl/prokanota
  license: BSL-1.0
  license_file: LICENSE
  summary: A modular, configuration-driven workflow for prokaryotic genome annotation.
build:
  entry_points:
  - prokanota = prokanota.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - richardstoeckl
package:
  name: prokanota
  version: 2.0.0
requirements:
  host:
  - python >=3.11
  - hatchling >=1.27.0
  - pip
  run:
  - python >=3.11
  - click >=8.1.3
  - jsonschema >=4.0.0
  - pandas >=1.5.0
  - pyyaml >=6.0
  - snakemake >=9.0.1
  - snaketool-utils >=0.0.4
  - pytest >=8.3.4
source:
  sha256: 4ee728c90ecfb8823fc3ce4f4ba12b223fbb32768e790d8450b56d7f26221a86
  url: https://pypi.org/packages/source/p/prokanota/prokanota-2.0.0.tar.gz
test:
  commands:
  - pip check
  - prokanota --help
  - prokanota version
  - prokanota test-minimal
  imports:
  - prokanota
  requires:
  - pip
