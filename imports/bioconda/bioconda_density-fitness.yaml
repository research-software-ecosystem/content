about:
  description: "The program density-fitness calculates electron density metrics,\n\
    for main- (includes C\u03B2 atom) and side-chain atoms of individual residues.\n\
    \nFor this calculation, the program uses the structure model in either PDB\nor\
    \ mmCIF format and the electron density from the 2mFo-DFc and mFo-DFc maps.\n\
    If these maps are not readily available, the MTZ file and model can be used\n\
    to calculate maps clipper. Density-fitness support both X-ray and electron\ndiffraction\
    \ data.\n\nThis program is essentially a reimplementation of _edstats_, a program\n\
    available from the CCP4 suite. However, the output now contains only the\nRSR,\
    \ SRSR and RSCC fields as in _edstats_ with the addition of EDIAm\nand OPIA and\
    \ no longer requires pre-calculated map coefficients.\n"
  dev_url: https://github.com/PDB-REDO/density-fitness
  doc_url: https://github.com/PDB-REDO/density-fitness/blob/v1.2.0/doc/density-fitness.pdf
  home: https://github.com/PDB-REDO/density-fitness
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Application to calculate the density statistics (RSR, SRSR, RSCCS, EDIAm
    and OPIA) for x-ray structures
