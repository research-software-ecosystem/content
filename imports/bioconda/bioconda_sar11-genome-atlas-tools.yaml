about:
  home: https://github.com/stsnsn/SAR11_Atlas
  license: MIT
  license_file: LICENSE
  summary: SGAmapper and SGAclassifier for the SAR11 Genome Atlas
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv
extra:
  recipe-maintainers:
  - satoshinishino
package:
  name: sar11-genome-atlas-tools
  version: 0.2.0
requirements:
  host:
  - python 3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - biopython >=1.80
  - pandas >=2.0
  - pyyaml >=6.0
  - rich >=13.7
  - prodigal
  - hmmer
  - mafft
  - epa-ng
  - fastani
source:
  sha256: d3f4d33f597c5512b0809b1c210f953de9f1e59e9a123df6033179f222c378cd
  url: https://pypi.org/packages/source/s/sar11-genome-atlas-tools/sar11_genome_atlas_tools-0.2.0.tar.gz
test:
  commands:
  - sga-mapper --version
  - sga-classify --version
  - sga-run --version
  requires:
  - python 3.10
