about:
  description: 'irit is a set of small command-line tools: leanqc (read QC), sheetgen
    (sample sheets for

    nf-core pipelines and read-file checks against MD5s), isotable (one graded row
    per sample from

    tool outputs, MIMAG tiers for MAGs), dblock (pinned reference databases), seqplan
    (isolates per

    sequencing run), gtdbprep (GTDB-Tk species checks and tree placement in 8 GB),
    cooccur

    (co-occurrence statistics) and irit-mcp (an MCP server that runs bioinformatics
    tools for AI

    agents with a replayable record). The msascope alignment viewer is not included.

    '
  dev_url: https://github.com/dzulfikar08/irit
  doc_url: https://dzulfikar08.github.io/irit/
  home: https://dzulfikar08.github.io/irit/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: 'Bacterial genomics and metagenomics on an 8 GB laptop: read QC, sample
    sheets, result tables, reference databases, GTDB species checks, co-occurrence,
    and an MCP server for AI agents.'
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - dzulfikar08
package:
  name: irit
  version: 0.7.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  - make
  - pkg-config
source:
  sha256: 006ff4bb79e49702624645ac562a656f1cfb7f2ba4b341e72b636310cf5b06bc
  url: https://github.com/dzulfikar08/irit/archive/v0.7.0.tar.gz
test:
  commands:
  - sheetgen --version | grep '0.7.0'
  - leanqc --version | grep '0.7.0'
  - isotable --version | grep '0.7.0'
  - dblock --version | grep '0.7.0'
  - seqplan --version | grep '0.7.0'
  - cooccur --version | grep '0.7.0'
  - gtdbprep --version | grep '0.7.0'
  - irit-mcp --version | grep '0.7.0'
