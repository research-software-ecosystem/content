about:
  dev_url: https://github.com/OlmLab/MetaTrawl
  home: https://github.com/OlmLab/MetaTrawl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Mutable registry and workflow bookkeeping for large ZipStrain/SRA profiling
    projects.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - parsaghadermarzi
package:
  name: metatrawl
  version: 0.2.4
requirements:
  host:
  - python >=3.12
  - pip
  - poetry-core >=2.0
  run:
  - python >=3.12
  - click >=8.1
  - duckdb >=1.1
  - h5py >=3.10
  - matplotlib-base >=3.10
  - numpy >=1.26
  - polars >=1.0
  - rich >=13.0
  - scipy >=1.16
  - seaborn >=0.13
  - zipstrain >=1.0.1,<2
  - zstandard >=0.23
  - sylph
  - samtools
  - bowtie2
  - prodigal
  - sra-tools >=2.11
  - ncbi-datasets-cli
source:
  sha256: 3cad9da8c1e669605e49377fb555d7f2c7b3c5380e4b2e7427d210e14c2eab58
  url: https://pypi.org/packages/source/m/metatrawl/metatrawl-0.2.4.tar.gz
test:
  commands:
  - metatrawl --help
  - zipstrain --help
  - sylph --version
  - samtools --version
  - bowtie2 --version
  - datasets --version
  - command -v prodigal
  - command -v prefetch
  - command -v fasterq-dump
  imports:
  - metatrawl
