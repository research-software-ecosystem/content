about:
  dev_url: https://github.com/OlmLab/MetaTrawl
  home: https://github.com/OlmLab/MetaTrawl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Mutable registry and workflow bookkeeping for large ZipStrain/SRA profiling
    projects.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - parsaghadermarzi
package:
  name: metatrawl
  version: 0.4.10
requirements:
  host:
  - python >=3.12
  - pip
  - poetry-core >=2.0
  run:
  - python >=3.12
  - click >=8.1
  - duckdb >=1.1
  - h5py >=3.10
  - matplotlib-base >=3.10
  - numpy >=1.26
  - polars >=1.0
  - rich >=13.0
  - scipy >=1.16
  - seaborn >=0.13
  - zipstrain >=1.0.1,<2
  - zstandard >=0.23
  - sylph
  - samtools
  - bowtie2
  - prodigal
  - sra-tools >=2.11
  - ncbi-datasets-cli
source:
  sha256: 52b2c35fb5d18c91733eec57e2430325ccf35c81bea04e335f7f2a860cf33ce7
  url: https://pypi.org/packages/source/m/metatrawl/metatrawl-0.4.10.tar.gz
test:
  commands:
  - metatrawl --help
  - zipstrain --help
  - sylph --version
  - samtools --version
  - bowtie2 --version
  - datasets --version
  - command -v prodigal
  - command -v prefetch
  - command -v fasterq-dump
  imports:
  - metatrawl
