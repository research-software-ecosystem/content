  - python >=3.7
  - flit-core >=3.2,<4
  - pip
  run:
  - python >=3.7
  - scanpy
  - opencv
  - scikit-image
  - fastparquet
source:
  sha256: 4fcce16b385a41d81719d205c3e17dce74787c89c2d75d25bc9384c17bacafde
  url: https://pypi.org/packages/source/b/bin2cell/bin2cell-0.3.5.tar.gz
test:
  commands:
  - pip check
  imports:
  - bin2cell
  requires:
  - pip
