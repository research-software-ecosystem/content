about:
  home: https://github.com/Teichlab/bin2cell
  license: MIT
  license_file: LICENSE
  summary: Join subcellular Visium HD bins into cells
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - camlloyd
package:
  name: bin2cell
  version: 0.3.5
requirements:
