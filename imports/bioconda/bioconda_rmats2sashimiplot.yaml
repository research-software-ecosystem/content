about:
  home: https://github.com/Xinglab/rmats2sashimiplot
  license: GNU General Public v2 (GPLv2)
  license_family: GPL2
  license_file: LICENSE
  summary: rmats2sashimiplot
build:
  entry_points:
  - rmats2sashimiplot=rmats2sashimiplot.rmats2sashimiplot:main
  - index_gff=MISO.misopy.index_gff:main
  - sashimi_plot=MISO.misopy.sashimi_plot.sashimi_plot:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --ignore-installed --no-deps -vv'
package:
  name: rmats2sashimiplot
  version: 4.0.0
requirements:
  host:
  - pip
  - python
  - setuptools
  run:
  - bedtools
  - matplotlib-base
  - numpy
  - pysam
  - python
  - samtools
  - scipy
source:
  sha256: 4f1442b22c305fe7fc75b84f38d471b0668ca9ae6ef55363d3e4fcbba71425ec
  url: https://pypi.io/packages/source/r/rmats2sashimiplot/rmats2sashimiplot-4.0.0.tar.gz
test:
  commands:
  - rmats2sashimiplot --help
  - index_gff --help
  - sashimi_plot --help
  imports:
  - MISO
  - MISO.misopy
  - MISO.misopy.sashimi_plot
  - MISO.misopy.sashimi_plot.plot_utils
  - rmats2sashimiplot
