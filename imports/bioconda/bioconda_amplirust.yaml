about:
  description: 'Amplirust is a high-performance in-silico PCR tool written in Rust
    that

    performs primer matching and PCR product extraction from FASTA sequences.

    Features include SIMD-accelerated approximate matching, IUPAC ambiguity

    code support, circular genome handling, and multi-threaded processing.

    '
  dev_url: https://github.com/erdikilic/amplirust
  home: https://github.com/erdikilic/amplirust
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: In-silico PCR primer matching and product extraction tool.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - erdikilic
package:
  name: amplirust
  version: 0.3.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
  - cmake
  - make
source:
  sha256: a65ec18e54f63ef28a4291973b952516f0341750e7d3b5837b672edc10e87303
  url: https://github.com/erdikilic/amplirust/archive/refs/tags/0.3.0.tar.gz
test:
  commands:
  - amplirust --help
  - amplirust --version
