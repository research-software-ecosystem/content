about:
  home: https://github.com/DessimozLab/omamer
  license: LGPL-3.0
  license_file:
  - LICENSE
  - COPYING.LESSER
  - COPYING
  summary: OMAmer - tree-driven and alignment-free protein assignment to sub-families
build:
  entry_points:
  - omamer = omamer.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
extra:
  identifiers:
  - doi:10.1093/bioinformatics/btab219
  recipe-maintainers:
  - alpae
package:
  name: omamer
  version: 2.2.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - alive-progress
  - biopython
  - lxml
  - numba
  - numpy >=1.26
  - pandas >2.0.0,<3
  - property-manager
  - rmath4
  - scipy
  - pytables >=3.10.1
  - tqdm
  - pysais
source:
  sha256: edd60962ec8ec45c123ccedfc2eb21f54b8eee4b150141d797724fcb22652241
  url: https://pypi.io/packages/source/o/omamer/omamer-2.2.0.tar.gz
test:
  commands:
  - omamer --help
  imports:
  - omamer
