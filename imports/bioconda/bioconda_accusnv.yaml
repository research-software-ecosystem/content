about:
  dev_url: https://github.com/liaoherui/AccuSNV
  doc_url: https://github.com/liaoherui/AccuSNV#readme
  home: https://github.com/liaoherui/AccuSNV
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: High-accuracy SNV calling for bacterial isolates.
build:
  entry_points:
  - accusnv = accusnv.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.1101/gr.281341.125
  recipe-maintainers:
  - liaoherui
  - alexcritschristoph
package:
  name: accusnv
  version: 1.1.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools >=61
  run:
  - python >=3.11
  - snakemake >=8,<10
  - snakemake-executor-plugin-slurm
  - numpy
  - pyyaml
  - scipy
  - pandas
  - pytorch
  - biopython
  - bcbio-gff
  - matplotlib-base
  - statsmodels
  - bwa
  - bowtie2
  - samtools
  - bcftools
  - tabix
  - samclip
  - sickle-trim
  - cutadapt
  - phylip
source:
  sha256: cd0fda54fd0d9c70932fa6c209e5df9bd9ca737fde6516a8c0ea4203ff9d014d
  url: https://pypi.org/packages/source/a/accusnv/accusnv-1.1.0.tar.gz
test:
  commands:
  - accusnv --help
  - which dnapars
  - which bwa
  - which samclip
  - which samtools
  - which bowtie2
  imports:
  - accusnv
  - accusnv.accusnv
  - accusnv.downstream
  - accusnv.preprocessing
