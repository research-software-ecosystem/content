  license: MIT
  license_file: LICENSE.md
  summary: Parse CD-HIT cluster files
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: python -m pip install --no-deps --ignore-installed .
extra:
  recipe-maintainers:
  - telatin
package:
  name: cdhit-reader
  version: 0.5.0
requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  run:
  - python >=3.6
  - cd-hit
  - click
  - xopen
  - more-itertools
source:
  sha256: 1162d4a4cfff0607b56870d64170bb81a40881b9d2a5bd09ef27939e5f606011
  url: https://github.com/telatin/cdhit-parser/archive/v0.5.0.tar.gz
test:
  commands:
  - cdhit-parser --version | grep 0.5.0
