about:
  dev_url: https://github.com/OpenMS/OpenMS
  doc_url: https://openms.readthedocs.io/en/latest
  home: https://github.com/OpenMS/OpenMS
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python bindings for OpenMS, an open-source software C++ library for LC-MS
    data management and analyses.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  identifiers:
  - biotools:openms
  - doi:10.1038/s41592-024-02197-7
  recipe-maintainers:
  - timosachsenberg
  - jonasscheid
package:
  name: pyopenms
  version: 3.6.0
requirements:
  build:
  - null
  - null
  - ninja
  - cmake >=3.24
  host:
  - python
  - nanobind >=3.1,<4
  - numpy >=2.0
  - pandas >=3
  - matplotlib-base >=3.5
  - libopenms ==3.6.0
  - libarrow =23=*_cpu
  - libboost-headers
  - eigen >=3.4.0
  run:
  - python
  - libopenms ==3.6.0
  - numpy >=2.0
  - pandas >=3
  - matplotlib-base >=3.5
source:
  patches:
  - 0001-bind_format-include-BrukerTimsFile.h-only-with-WITH_OPENTIMS.patch
  sha256: 70c7f7afff938634b5e87a7c9f71856a4469ae0e45d66dd50655460dbf6d6535
  url: https://github.com/OpenMS/OpenMS/releases/download/v3.6.0/OpenMS-3.6.0.tar.gz
test:
  commands:
  - python -c "import pyopenms as oms; assert oms.__version__ == '3.6.0', oms.__version__;
    print(oms.__version__)"
  - python -c "import pyopenms as oms; n = oms.ModificationsDB().getNumberOfModifications();
    assert n > 100, n; print(n)"
  imports:
  - pyopenms
