about:
  description: 'Eggsplorer turns an eggNOG-mapper .emapper.annotations file into a
    self-contained,

    offline HTML report (COG and GO profiles, EC, TC, CAZy and Pfam summaries,

    KEGG-Decoder metabolic function scores, a cell overview and nitrogen, sulfur and

    carbon cycle diagrams) and optional TSV summary tables.

    '
  dev_url: https://github.com/vebaev/eggsplorer
  doc_url: https://github.com/vebaev/eggsplorer/blob/v1.1.0/README.md
  home: https://github.com/vebaev/eggsplorer
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - fonts/OFL.txt
  - third_party/kegg_decoder/LICENSE
  summary: Interactive HTML report of eggNOG-mapper functional annotations of bacterial
    genomes.
build:
  entry_points:
  - eggsplorer = eggsplorer.eggsplorer:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - vebaev
package:
  name: eggsplorer
  version: 1.1.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  run:
  - python >=3.9
  - plotly >=5
source:
  sha256: 51b126de282d1d7ae418bbb98b8552adfbd872a34ea34643ba9990f83cff81e5
  url: https://github.com/vebaev/eggsplorer/archive/refs/tags/v1.1.0.tar.gz
test:
  commands:
  - eggsplorer --help
  - eggsplorer --version
  imports:
  - eggsplorer
