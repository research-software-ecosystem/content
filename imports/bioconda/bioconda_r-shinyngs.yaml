about:
  home: https://github.com/pinin4fjords/shinyngs
  license: AGPL-3.0
  license_family: AGPL
  license_file: shinyngs/LICENSE.md
  summary: Provides Shiny applications for various array and NGS applications. Currently
    very RNA-seq centric, with plans for expansion.
build:
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
package:
  name: r-shinyngs
  version: 3.2.1
requirements:
  host:
  - r-biocmanager
  - bioconductor-limma
  - bioconductor-summarizedexperiment
  - git
  - pandoc
  - r-base
  - r-bslib >=0.9.0
  - r-cluster
  - r-dplyr
  - r-dt >=0.2
  - r-ggbeeswarm
  - r-ggplot2
  - r-ggdendro
  - r-heatmaply
  - r-htmltools
  - r-htmlwidgets
  - r-markdown
  - r-matrixstats
  - r-rmarkdown
  - r-optparse
  - r-plotly >=4.8.0
  - r-rcolorbrewer
  - r-rsconnect
  - r-scatterplot3d
  - r-shiny >=1.7.0
  - r-shinycssloaders
  - r-shinyjs
  - r-viridislite
  - r-yaml
  run:
  - r-biocmanager
  - bioconductor-limma
  - bioconductor-summarizedexperiment
  - r-base
  - r-bslib >=0.9.0
  - r-cluster
  - r-dplyr
  - r-dt >=0.2
  - r-ggbeeswarm
  - r-ggplot2
  - r-ggdendro
  - r-heatmaply
  - r-htmltools
  - r-htmlwidgets
  - r-markdown
  - r-matrixstats
  - r-optparse
  - r-plotly >=4.8.0
  - r-rcolorbrewer
  - r-rsconnect
  - r-scatterplot3d
  - r-shiny >=1.7.0
  - r-shinycssloaders
  - r-shinyjs
  - r-viridislite
  - r-yaml
source:
- folder: shinyngs
  sha256: 510bb1d1658cd559ffd255bd4841f1fd3d572e651945a3aaa9ac04f75d89d2a7
  url: https://github.com/pinin4fjords/shinyngs/archive/refs/tags/v3.2.1.tar.gz
test:
  commands:
  - $R -e "library('shinyngs')"
  - make_app_from_files.R --help
  - exploratory_plots.R --help
  - differential_plots.R --help
