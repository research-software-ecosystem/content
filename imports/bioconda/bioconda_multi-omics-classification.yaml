about:
  home: https://github.com/usegalaxy-eu/MultiOmicsClassification
  license: MIT
  summary: A FAIR Machine Learning Framework for Benchmarking, Feature Selection,
    and Hyperparameter Optimization of machine learning Models for Multiomics Data
    in Galaxy
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - python -m pip install . --no-deps -vv
extra:
  recipe-maintainers:
  - renu-pal
package:
  name: multi-omics-classification
  version: 0.1.6
requirements:
  host:
  - python
  - pip
  - setuptools
  - wheel
  run:
  - python
  - numpy
  - pandas
  - scikit-learn
  - matplotlib-base
  - seaborn
  - imbalanced-learn
  - lightgbm
  - xgboost
  - pip
  - tabpfn
source:
  sha256: 0cc5fa2ccd2414f9e30e1af26a437ecfb33d153521fd5ca9d037d3861c54a9eb
  url: https://github.com/usegalaxy-eu/MultiOmicsClassification/archive/refs/tags/v0.1.6.tar.gz
test:
  commands:
  - multiclasspredict --help
  imports:
  - multiclasspredict
