about:
  home: https://github.com/usegalaxy-eu/MultiOmicsClassification
  license: MIT
  summary: A Machine Learning Framework for Benchmarking, Feature Selection, and Hyperparameter
    Optimization of machine learning Models for Multiomics Data in Galaxy
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - python -m pip install . --no-deps -vv
extra:
  recipe-maintainers:
  - renu-pal
package:
  name: multi-omics-classification
  version: 0.1.10
requirements:
  host:
  - python
  - pip
  - setuptools
  - wheel
  run:
  - python
  - numpy
  - pandas
  - scikit-learn
  - matplotlib-base
  - seaborn
  - imbalanced-learn
  - lightgbm
  - xgboost
  - pip
  - tabpfn
source:
  sha256: d1257bc6f5217173f81233f87942bafc490d8f770878b7d807dbf6021dcc5ffe
  url: https://github.com/usegalaxy-eu/MultiOmicsClassification/archive/refs/tags/v0.1.10.tar.gz
test:
  commands:
  - multiclasspredict --help
  imports:
  - multiclasspredict
