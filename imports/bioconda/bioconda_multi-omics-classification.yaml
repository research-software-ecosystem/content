about:
  home: https://github.com/usegalaxy-eu/MultiOmicsClassification
  license: MIT
  summary: A Machine Learning Framework for Benchmarking, Feature Selection, and Hyperparameter
    Optimization of machine learning Models for Multiomics Data in Galaxy
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - python -m pip install . --no-deps -vv
extra:
  recipe-maintainers:
  - renu-pal
package:
  name: multi-omics-classification
  version: 0.1.7
requirements:
  host:
  - python
  - pip
  - setuptools
  - wheel
  run:
  - python
  - numpy
  - pandas
  - scikit-learn
  - matplotlib-base
  - seaborn
  - imbalanced-learn
  - lightgbm
  - xgboost
  - pip
  - tabpfn
source:
  sha256: 5047c5e2924bb75929a9486339d204227f70a00d1ab0cc1ea87e1499a16b298d
  url: https://github.com/usegalaxy-eu/MultiOmicsClassification/archive/refs/tags/v0.1.7.tar.gz
test:
  commands:
  - multiclasspredict --help
  imports:
  - multiclasspredict
