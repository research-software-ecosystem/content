about:
  dev_url: https://github.com/abiswas-odu/Disco
  doc_url: https://github.com/abiswas-odu/Disco/blob/1.3/README.md
  home: https://github.com/abiswas-odu/Disco
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Multi-threaded Distributed Memory Overlap-Layout-Consensus (OLC) Metagenome
    Assembler.
build:
  number: 2
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - usegalaxy-eu:disco
package:
  name: disco
  version: '1.3'
requirements:
  build:
  - make
  - null
  - null
  - null
  - pkg-config
  host:
  - coreutils
  - mpich-mpicxx
  - zlib
  run:
  - coreutils
  - mpich-mpicxx
  - biopython
  - bbmap
source:
  patches:
  - 0001-Replace-g++-by-CXX.patch
  - sstr.patch
  - 0003-Utils-cstdint.patch
  - 0004-cs2-parser-pr_type-buffer-size.patch
  - 0005-overlapgraph-erase-iterator-invalidation.patch
  sha256: 50d311ed8a5111d9a55e49ee74e6c9309af7b4173720731f4db17b87289befb0
  url: https://github.com/abiswas-odu/Disco/releases/download/1.3/Disco1.3.tar.gz
test:
  commands:
  - runDisco.sh -h 2>&1 | grep "runDisco"
  - runAssembly.sh -h 2>&1 | grep "runDisco"
  - runECC.sh -h 2>&1 | grep "runDisco"
  - buildG --help
  - export UCX_TLS=self,sm
  - buildG-MPI --help
  - buildG-MPIRMA --help
  - fullsimplify --help
