about:
  description: 'pycoqc-ng is a maintained continuation of pycoQC. It computes metrics
    and

    generates interactive QC plots from Oxford Nanopore sequencing runs,

    reading the sequencing_summary.txt file produced by Albacore and Guppy as

    well as FASTQ, unaligned BAM from Dorado, and POD5 input. Reports are

    self-contained HTML, with an optional machine-readable JSON summary.

    '
  dev_url: https://github.com/duceppemo/pycoqc-ng
  home: https://github.com/duceppemo/pycoqc-ng
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Interactive QC metrics and plots for Oxford Nanopore sequencing data
build:
  entry_points:
  - pycoQC = pycoQC.__main__:main_pycoQC
  - Fast5_to_seq_summary = pycoQC.__main__:main_Fast5_to_seq_summary
  - Fastq_to_seq_summary = pycoQC.__main__:main_Fastq_to_seq_summary
  - Pod5_to_seq_summary = pycoQC.__main__:main_Pod5_to_seq_summary
  - Bam_to_seq_summary = pycoQC.__main__:main_Bam_to_seq_summary
  - Barcode_split = pycoQC.__main__:main_Barcode_split
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.21105/joss.01236
  recipe-maintainers:
  - duceppemo
package:
  name: pycoqc-ng
  version: 3.1.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  run:
  - python >=3.9
  - numpy >=1.24
  - scipy >=1.10
  - pandas >=2.0
  - plotly >=5.16
  - jinja2 >=3.1
  - h5py >=3.10
  - tqdm >=4.66
  - pysam >=0.22
  - python-dateutil >=2.8
  - pod5 >=0.2.4
source:
  sha256: cf1cabe915571540a16b220919a65ff341a46dd398952ca75c485a2d2857cdf0
  url: https://pypi.io/packages/source/p/pycoqc-ng/pycoqc_ng-3.1.0.tar.gz
test:
  commands:
  - pycoQC --version
  - pycoQC --help
  - pycoQC --default_config > /dev/null
  - Fast5_to_seq_summary --help
  - Fastq_to_seq_summary --help
  - Pod5_to_seq_summary --help
  - Bam_to_seq_summary --help
  - Barcode_split --help
  imports:
  - pycoQC
  - pycoQC.pycoQC
  - pycoQC.pycoQC_parse
  - pycoQC.pycoQC_plot
  - pycoQC.pycoQC_report
  - pycoQC.common
  - pycoQC.Fast5_to_seq_summary
  - pycoQC.Fastq_to_seq_summary
  - pycoQC.Pod5_to_seq_summary
  - pycoQC.Bam_to_seq_summary
  - pycoQC.Barcode_split
