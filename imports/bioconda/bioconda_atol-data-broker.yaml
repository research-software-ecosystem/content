about:
  dev_url: https://github.com/AToL-Bioinformatics/data-broker
  home: https://github.com/AToL-Bioinformatics/data-broker
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Submits metadata to ENA on behalf of Canopy.
build:
  entry_points:
  - broker = broker.cli:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.1.5
package:
  name: atol-data-broker
  version: 0.1.5
requirements:
  host:
  - pip
  - python >=3.13
  - setuptools-scm
  run:
  - httpx >=0.27.0
  - lxml >=5.2.0
  - pydantic-settings >=2.3.0
  - pydantic >=2.7.0
  - rich >=13.7.0
  - tenacity >=8.3.0
  - typer >=0.12.0
source:
  sha256: 0e2b7a2a5191d06a4b50f6c38c65c64e2d3b40b3507647591af2fd2fc083fe28
  url: https://github.com/AToL-Bioinformatics/data-broker/archive/refs/tags/0.1.5.tar.gz
test:
  commands:
  - 'broker --help | grep ''Usage: broker'''
