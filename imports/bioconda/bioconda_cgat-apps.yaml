about:
  dev_url: https://github.com/cgat-developers/cgat-apps
  doc_url: https://cgat-apps.readthedocs.io/en/latest
  home: https://github.com/cgat-developers/cgat-apps
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Computational Genomics Analysis Toolkit.
build:
  entry_points:
  - cgat = cgat.cgat:main
  number: 0
  run_exports:
  - null
  script_env:
  - MACOSX_DEPLOYMENT_TARGET=10.13
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  recipe-maintainers:
  - Acribbs
package:
  name: cgat-apps
  version: 0.7.11
requirements:
  build:
  - null
  - null
  - null
  host:
  - python
  - pip
  - cython >=0.29.35
  - numpy
  - pysam
  - htslib
  run:
  - python
  - cgatcore
  - alignlib-lite
  - biopython
  - matplotlib-base
  - numpy
  - pandas
  - pybedtools
  - pybigwig
  - pysam
  - htslib
  - pyyaml
  - quicksect
  - scipy
  - scikit-learn
  - sortedcontainers
  - bedtools
  - ucsc-bedgraphtobigwig
  - ucsc-wigtobigwig
  - coreutils
  - grep
source:
  sha256: 6c893949a57966d84e111b2a655381af56a953046ccb42184ebfe77e3bd958e1
  url: https://pypi.org/packages/source/c/cgat/cgat-0.7.11.tar.gz
test:
  commands:
  - cgat --help
  - cgat gtf2table -h
  - find ${PREFIX} -iname "*bamtools.cpython-*-x86_64-linux-gnu.so*" -exec ldd {}
    \;
  - cgat bam2bed -h
  imports:
  - cgat
  skip: true
