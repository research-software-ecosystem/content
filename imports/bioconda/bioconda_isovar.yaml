about:
  description: 'Isovar assembles RNA reads which support a variant to determine the
    mutant

    protein sequence(s) that a tumour actually expresses, rather than relying

    on a reference transcript annotation alone.

    '
  dev_url: https://github.com/openvax/isovar
  doc_url: https://github.com/openvax/isovar#documentation
  home: https://github.com/openvax/isovar
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Determine mutant protein sequences from RNA using assembly around variants.
build:
  entry_points:
  - isovar-uorf-evidence = isovar.cli.isovar_uorf_evidence:run
  - isovar-audit-bundle = isovar.cli.isovar_audit_bundle:run
  - isovar = isovar.cli.commands:run
  - isovar-protein-sequences = isovar.cli.isovar_protein_sequences:run
  - isovar-protein-hypotheses = isovar.cli.isovar_protein_hypotheses:run
  - isovar-translations = isovar.cli.isovar_translations:run
  - isovar-reference-contexts = isovar.cli.isovar_reference_contexts:run
  - isovar-allele-reads = isovar.cli.isovar_allele_reads:run
  - isovar-allele-counts = isovar.cli.isovar_allele_counts:run
  - isovar-variant-reads = isovar.cli.isovar_variant_reads:run
  - isovar-variant-sequences = isovar.cli.isovar_variant_sequences:run
  - isovar-plot = isovar.cli.isovar_plot:run
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - jonasscheid
package:
  name: isovar
  version: 1.56.1
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  run:
  - python >=3.9
  - pyensembl >=2.27.2
  - varcode >=10.13.0,<11
  - pandas >=0.23.0
  - pysam >=0.15.2
  - python-edlib
  - osteosarc >=0.15.5,<0.16
  - orfdata >=0.15.0,<1
source:
  sha256: 51567489fff4d92287c5bc10f61976b2eee3ad0ff7af3e33e8113f28cd5d18f5
  url: https://pypi.org/packages/source/i/isovar/isovar-1.56.1.tar.gz
test:
  commands:
  - isovar --help
