about:
  dev_url: https://github.com/maidinhvn/easy45
  home: https://github.com/maidinhvn/easy45
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Assembly-free recovery of the 45S nrDNA transcribed unit and ribotype variants
    from HiFi reads
build:
  entry_points:
  - easy45 = easy45.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - maidinhvn
package:
  name: easy45
  version: 0.1.0
requirements:
  host:
  - python
  - pip
  - setuptools >=64
  run:
  - python
  - biopython >=1.79
  - minimap2
  - seqkit
  - vsearch
  - itsx
  - barrnap
  - abpoa
  - infernal
source:
  sha256: fb28e0360f917edfc1f6cae9382f3e855cb1e1f49bef982f2f255b9645a92975
  url: https://github.com/maidinhvn/easy45/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - easy45 --version
  - easy45 check-deps
  imports:
  - easy45
