about:
  dev_url: https://github.com/maidinhvn/easy45
  home: https://github.com/maidinhvn/easy45
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Assembly-free recovery of the 45S nrDNA transcribed unit and ribotype variants
    from HiFi reads
build:
  entry_points:
  - easy45 = easy45.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - maidinhvn
package:
  name: easy45
  version: 0.3.0
requirements:
  host:
  - python
  - pip
  - setuptools >=64
  run:
  - python
  - biopython >=1.79
  - minimap2
  - seqkit
  - vsearch
  - itsx
  - barrnap >=0.9,<1.0
  - abpoa
  - infernal
source:
  sha256: 6108233b57f8d725314fddc7c4ac91abc6004bd40a81ed76ceb7cdd56b81ba72
  url: https://github.com/maidinhvn/easy45/archive/refs/tags/v0.3.0.tar.gz
test:
  commands:
  - easy45 --version
  - easy45 check-deps
  imports:
  - easy45
