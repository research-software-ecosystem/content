about:
  description: "ZNA (Compressed Z-Nucleic N-Acid A) is a specialized binary format\
    \ for \nstoring DNA/RNA sequences with exceptional compression and I/O speed.\n\
    \nFeatures:\n- 1.7 GB/s decode and 726 MB/s encode on 150 bp reads; 6.6 GB/s decode\
    \ on\n  long reads (single core, Apple silicon -- roughly 2.5x lower per core\
    \ on\n  an older x86 part; see the README for both)\n- ~4x compression from 2-bit\
    \ packing, more with Zstd on duplicated data\n- C++ acceleration with a pure Python\
    \ fallback\n- Columnar block layout; batch and block-sharded reading for data\
    \ loaders\n- Supports single-end, paired-end, interleaved, and overlap-merged\
    \ reads\n- Supports strand-specific protocols and per-record fragment geometry\n\
    - Optional: install python-isal alongside for 2.3x faster gzip input, which\n\
    \  is the largest single cost of `zna merge` (the pip extra is zna[fast]);\n \
    \ without it pigz or the stdlib is used, with identical output\n"
  dev_url: https://github.com/mkiyer/zna
  doc_url: https://github.com/mkiyer/zna/blob/main/README.md
  home: https://github.com/mkiyer/zna
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: High-performance binary format for compressed nucleic acid sequences
build:
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - mkiyer
package:
  name: zna
  version: 0.6.0
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.15
  - make
  - llvm-tools
  host:
  - python
  - pip
  - scikit-build-core >=0.10
  - nanobind >=2.0
  run:
  - python
  - zstandard
  - pyyaml
source:
  sha256: 72985f76fae3724294e02abe8a39e5ec84f4528b16f38b5a1c438136be9dd108
  url: https://github.com/mkiyer/zna/archive/v0.6.0.tar.gz
test:
  commands:
  - zna --help
  - zna merge --help
  - python -c "from zna.merge.backend import available_merge_backends as a; assert
    'accel' in a(), 'merge C++ backend did not build'"
  - python -c "import zna; print('ZNA version:', zna.__version__)"
  - python -c "from zna import is_accelerated; assert is_accelerated(), 'C++ backend
    did not load'"
  - python -c "import zna, io; h=zna.ZnaHeader(read_group='t', seq_len_bytes=2); b=io.BytesIO();
    w=zna.ZnaWriter(b,h); w.write_record('ACGTACGT',False,True,False); w.close();
    r=list(zna.ZnaReader(io.BytesIO(b.getvalue())).records()); assert r[0][0]=='ACGTACGT',
    r"
  imports:
  - zna
  - zna.core
  - zna.cli
  - zna.merge
  - zna.merge._accel
