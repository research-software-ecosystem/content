about:
  dev_url: https://github.com/AI-sandbox/snputils
  doc_url: https://docs.snputils.org
  home: https://snputils.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Process genomes with ease
build:
  number: 0
  run_exports:
  - null
  script:
  - export SETUPTOOLS_SCM_PRETEND_VERSION=1.1.0
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - davidbonet
package:
  name: snputils
  version: 1.1.0
requirements:
  build:
  - null
  - null
  host:
  - python
  - pip
  - setuptools >=64
  - setuptools_scm >=8
  - zlib
  run:
  - python >=3.9
  - numpy <2
  - numpy
  - pandas
  - pandas-stubs
  - scikit-learn
  - pgenlib
  - matplotlib-base
  - joblib
  - tqdm
  - polars >=1.34
  - plotly
  - plotly_express
  - nbformat
  - adjusttext
  - zstandard
  - cairosvg
source:
  sha256: 092f11d2f8cbf814bc37e717228afbee1fb8da8ddbbfdcabc69a342488d931ac
  url: https://pypi.org/packages/source/s/snputils/snputils-1.1.0.tar.gz
test:
  commands:
  - pip check
  - snputils version
  - python -c "import snputils; obj = snputils.build_synthetic_snp_dataset(n_samples=4,
    n_snps=8, seed=1); assert obj.n_samples == 4 and obj.n_snps == 8"
  imports:
  - snputils
  - snputils.snp.io.read._bcf
  - snputils.snp.io.write._bcf
  - snputils.snp.io._bgen
  requires:
  - pip
