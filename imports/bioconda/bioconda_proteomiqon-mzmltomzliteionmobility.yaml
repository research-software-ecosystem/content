about:
  description: 'The success of modern proteomics has been made possible by constant
    advances in the field of mass spectrometry. Over the past few years, a whole range
    of manufacturers of

    mass spectrometers have succeeded in establishing themselves in the field of biological
    research. As the acquisition and recording of mass spectra are performance-critical
    processes,

    various performance-optimised, yet manufacturer-specific and proprietary formats
    have been developed for storing raw MS data. This poses a challenge for developers
    of toolchains

    who wish to provide tools for all scientists, regardless of the format of their
    raw data. This tool makes it possible to easily convert TIMs data, where ion mobility
    is an essential factor, into the mzmlite data format

    '
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/tools/MzMLToMzLite.html
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: The tool MzMLToMzLiteIonMobility allows to convert mzML files to mzLite
    files specifically for TIMs data.
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: proteomiqon-mzmltomzliteionmobility
  version: 0.0.4
requirements:
  build:
  - null
  host:
  - unzip
  run:
  - dotnet-runtime >=10.0, <11.0
  - zlib
source:
  sha256: 4338937a556fbe52aafbe534653f0df2a8f9728692c404cc7adc1c43c4ee1bd1
  url: https://www.nuget.org/api/v2/package/ProteomIQon.MzMLToMzLiteIonMobility/0.0.4
test:
  commands:
  - test -x "$PREFIX/bin/proteomiqon-mzmltomzliteionmobility"
  - test -f "$PREFIX/lib/dotnet/tools/MzMLToMzLiteIonMobility/ProteomIQon.MzMLToMzLiteIonMobility.dll"
  - bash -n "$PREFIX/bin/proteomiqon-mzmltomzliteionmobility"
  - grep -q "MzMLToMzLiteIonMobility/ProteomIQon.MzMLToMzLiteIonMobility.dll" "$PREFIX/bin/proteomiqon-mzmltomzliteionmobility"
