about:
  home: https://github.com/lifs-tools/pygoslin
  license: MIT
  license_file: LICENSE
  summary: Python implementation for Goslin
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - hechth
package:
  name: pygoslin
  version: 2.2.4
requirements:
  host:
  - python >=3.5
  - setuptools >=42
  - wheel
  - cython
  - pytest-runner
  - pip
  run:
  - python >=3.5
source:
  sha256: f018c0a1ce7a9c2434ecb100b0a99fa334c645d934c080674457cba41b564a41
  url: https://pypi.org/packages/source/p/pygoslin/pygoslin-2.2.4.tar.gz
test:
  commands:
  - pip check
  imports:
  - pygoslin
  requires:
  - pip
  - python
