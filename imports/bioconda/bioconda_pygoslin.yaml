about:
  home: https://github.com/lifs-tools/pygoslin
  license: MIT
  license_file: LICENSE
  summary: Python implementation for Goslin
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - hechth
package:
  name: pygoslin
  version: 2.2.5
requirements:
  host:
  - python >=3.5
  - setuptools >=42
  - wheel
  - cython
  - pytest-runner
  - pip
  run:
  - python >=3.5
source:
  sha256: 8be4caf3ae4e1ce52c7036da61d280c53eba509c53d818807605c3550ab9fed4
  url: https://pypi.org/packages/source/p/pygoslin/pygoslin-2.2.5.tar.gz
test:
  commands:
  - pip check
  imports:
  - pygoslin
  requires:
  - pip
  - python
