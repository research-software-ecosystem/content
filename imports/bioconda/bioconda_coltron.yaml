about:
  description: 'Coltron builds transcriptional regulatory networks from ROSE enhancer

    tables, BAM signal and motif scans. The upstream 1.0.2 release was written

    for Python 2 and hard-coded legacy genome paths. This recipe applies a

    Python 3 compatibility patch and adds command-line options for custom

    annotation, TF-list and genome FASTA directories, enabling custom genomes

    such as hg38/GRCh38 when appropriate reference files are supplied.

    '
  doc_url: https://pypi.org/project/coltron
  home: https://github.com/BradnerLab/pipeline
  license: MIT
  license_family: MIT
  summary: Transcriptional regulatory network analysis from ROSE enhancer tables.
build:
  entry_points:
  - coltron = coltron.crc:main
  - coltron-get-data = coltron.crc:downloadDataFiles
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - PFRoux
package:
  name: coltron
  version: 1.0.2
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - numpy
  - networkx >=2
  - meme
  - samtools
source:
  patches:
  - modernize-python3-and-genomes.patch
  sha256: c8e5d805e3ba66e0fa8840d422ff6f2a3c8a0887eb79eecaa35d81e1544d0fe6
  url: https://pypi.org/packages/source/c/coltron/coltron-1.0.2.tar.gz
test:
  commands:
  - coltron --help
  imports:
  - coltron
  - coltron.crc
  - coltron.utils
