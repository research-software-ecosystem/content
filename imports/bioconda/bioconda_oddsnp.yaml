about:
  doc_url: https://nemoto-lab.github.io/oddSNP/
  home: https://github.com/nemoto-lab/oddSNP
  license: Apache-2.0
  license_file: LICENSE
  summary: A CLI tool for Optimizing demultiplexing pooled experiments based on Single-Nucleotide
    Polymorphism
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - RodolfoAllendes
package:
  name: oddsnp
  version: 0.1.2
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools
  run:
  - python >=3.12
  - click
  - pandas
  - pysam >=0.17
  - plotly
  - nbformat
  - python-kaleido
  - tqdm
  - scipy
  - requests
  - ipykernel
  - threadpoolctl
  - vireosnp
  - cellsnp-lite
source:
  sha256: bb12d25e914b7e1c323db4eca1c59942ecfe9531082613dc3814182629549e0b
  url: https://pypi.org/packages/source/o/oddsnp/oddsnp-0.1.2.tar.gz
test:
  commands:
  - oddSNP --help
  imports:
  - oddSNP
  requires:
  - python
  - pip
