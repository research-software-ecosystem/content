about:
  home: https://pypi.org/project/darkprofiler/
  license: MIT
  license_file: LICENSE.txt
  summary: 'DarkProfiler: Alignment and Classification of Peptides from Reference-Independent
    De Novo Peptide Sequencing Experiments.'
build:
  entry_points:
  - darkprofiler = darkprofiler.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - LeeHanJun00
package:
  name: darkprofiler
  version: 0.4.1
requirements:
  host:
  - python >=3.7
  - setuptools >=61
  - wheel
  - pip
  run:
  - python >=3.7
  - biopython >=1.78
  - matplotlib-base >=3.3
source:
  sha256: 7717fcb95436d28dcba096e363d3e5c3d045436d3dadf12e1bafbe215dfc142e
  url: https://pypi.org/packages/source/d/darkprofiler/darkprofiler-0.4.1.tar.gz
test:
  commands:
  - pip check
  - darkprofiler --help
  imports:
  - darkprofiler
  requires:
  - pip
