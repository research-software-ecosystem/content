about:
  doc_url: https://pyskani.readthedocs.io
  home: https://github.com/althonos/pyskani/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: PyO3 bindings and Python interface to skani, a method for fast fast genomic
    identity calculation using sparse chaining.
build:
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517
    -vvv
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - althonos
package:
  name: pyskani
  version: 0.3.0
requirements:
  build:
  - null
  - null
  host:
  - python
  - pip
  - maturin
  run:
  - python
source:
  sha256: 663114278d04c586c2684ce8111699884be1122bcef7d2e892a64886938e8e17
  url: https://pypi.org/packages/source/p/pyskani/pyskani-0.3.0.tar.gz
test:
  commands:
  - python -m unittest -vv pyskani.tests
  imports:
  - pyskani
