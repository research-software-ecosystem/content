about:
  home: https://github.com/rpetit3/genome-dl
  license: MIT
  license_file: LICENSE
  summary: Download genomes from NCBI Datasets.
build:
  entry_points:
  - genome-dl = genome_dl.cli.download:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - rpetit3
package:
  name: genome-dl
  version: 1.0.0
requirements:
  host:
  - python >=3.11,<3.14
  - poetry-core
  - pip
  run:
  - python >=3.11,<3.14
  - requests >=2.31.0
  - rich-click >=1.6.1
  - rich >=13.3.1
source:
  sha256: 053b6b03ddf4bebdba836f16233fd04b1f830c74ebd4a647f18d2dfe0112cbe0
  url: https://pypi.io/packages/source/g/genome_dl/genome_dl-1.0.0.tar.gz
test:
  commands:
  - genome-dl --version
  - genome-dl --help
