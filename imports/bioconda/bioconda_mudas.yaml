about:
  home: https://github.com/freyrelab/MicroarrayProject
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A microarray data access system for GEO
build:
  entry_points:
  - mudas = mudas.mudas:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - diego-carc
package:
  name: mudas
  version: 0.0.2
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77.0.3
  run:
  - python >=3.9
  - pandas
  - numpy
  - scipy
  - biopython
  - geoparse
  - rpy2
  - qnorm
  - inmoose
  - speedtest-cli
  - psutil
  - bowtie2
  - r-base
  - bioconductor-rsubread
  - bioconductor-affxparser
source:
  sha256: c20873a9d29598b8da5edce4c9e8ba6b0f221d8db5c41c99ad065488f126a16e
  url: https://pypi.io/packages/source/m/mudas/mudas-0.0.2.tar.gz
test:
  commands:
  - mudas --help
  - pip check
  imports:
  - mudas
  requires:
  - pip
