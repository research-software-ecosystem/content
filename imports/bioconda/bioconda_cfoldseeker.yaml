about:
  dev_url: https://github.com/LucoDevro/cfoldseeker
  doc_url: https://cfoldseeker.readthedocs.io/en/stable/
  home: https://github.com/LucoDevro/cfoldseeker
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tool to find gene clusters using protein structure similarity
build:
  entry_points:
  - cfoldseeker = cfoldseeker.main:main
  - cfoldseeker-cds = cfoldseeker.build_cds_db:main
  - cfoldseeker-seqs = cfoldseeker.extract_sequences:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-build-isolation --no-cache-dir'
extra:
  recipe-maintainers:
  - LucoDevro
package:
  name: cfoldseeker
  version: 0.3.0
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools
  run:
  - python >=3.12
  - biopython
  - cblaster ==1.4.0
  - polars >=1.0.0
  - foldseek
  - networkx
  - requests
  - tqdm
  - kegg_pull
  - gb-io
source:
  sha256: 7a84972799998eb20b78b11632e5b1c1851fb3415eb981ce1b93d9451216bf30
  url: https://pypi.org/packages/source/c/cfoldseeker/cfoldseeker-0.3.0.tar.gz
test:
  commands:
  - cfoldseeker -h
