about:
  dev_url: https://github.com/Tabviewer/tabview
  home: https://github.com/Tabviewer/tabview
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A curses command-line CSV and list (tabular data) viewer.
build:
  entry_points:
  - tabview = tabview.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: tabview
  version: 1.5.0
requirements:
  host:
  - python >=3.11
  - hatchling
  - pip
  run:
  - python >=3.11
source:
  sha256: d28f1a638c5bcf01280b8fc292a83caa872a5001293f04dcb35a9afe60bd7c96
  url: https://pypi.org/packages/source/t/tabview/tabview-1.5.0.tar.gz
test:
  commands:
  - tabview -h > /dev/null || [[ "$?" == 2 ]]
  imports:
  - tabview
