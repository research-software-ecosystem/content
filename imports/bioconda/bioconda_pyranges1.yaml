about:
  dev_url: https://github.com/pyranges/pyranges_1.x
  home: https://github.com/pyranges/pyranges_1.x
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: GenomicRanges for Python.
build:
  entry_points:
  - pyranger = pyranges1.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=1.4.4
extra:
  recipe-maintainers:
  - endrebak
package:
  name: pyranges1
  version: 1.4.4
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools >=61
  - setuptools-scm >=6.2
  run:
  - python >=3.12
  - fire
  - pyrle >=0.0.43
  - bamread
  - pyfaidx
  - pybigwig
  - joblib
  - pandas
  - tabulate
  - natsort
  - ruranges >=0.1.2
  - gtfreader >=0.2.0
source:
  sha256: 6ae6cec98025370965f741efc02728a31bfeb5b3c75d182b72f4d5aa0085628a
  url: https://pypi.org/packages/source/p/pyranges1/pyranges1-1.4.4.tar.gz
test:
  commands:
  - pyranger --help
  imports:
  - pyranges1
