about:
  description: 'bwa-mem4 aligns short reads to a reference and produces SAM/BAM/CRAM
    that is byte-identical to

    bwa-mem2 2.3, verified on a real 32.9x human WGS. It reads the same index format,
    takes the same

    `mem` command line, and peaks at ~11 GB of RAM on hg38 versus bwa-mem2''s ~17
    GB. SIMD kernels

    (NEON on arm64, AVX2 on x86_64) are chosen at runtime.

    '
  dev_url: https://github.com/IPNP-BIPN/bwa-mem4
  home: https://github.com/IPNP-BIPN/bwa-mem4
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Byte-identical Rust reimplementation of bwa-mem2 2.3, with lower resident
    memory
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - BenjaminDEMAILLE
package:
  name: bwa-mem4
  version: 4.3.3
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
  - make
  - cmake
  - pkg-config
  - clangdev
  host:
  - zlib
  - bzip2
  - xz
  - libdeflate
source:
  sha256: 3325d9f84cc14a75d4e7e03de003c70946c6378dc8199397851d5907443bb38a
  url: https://github.com/IPNP-BIPN/bwa-mem4/archive/refs/tags/v4.3.3.tar.gz
test:
  commands:
  - bwa-mem4 --version
  - bwa-mem4 --help
