about:
  dev_url: https://github.com/LucoDevro/csuite
  doc_url: https://csuite-miner.readthedocs.io/
  home: https://github.com/LucoDevro/CAGEcleaner
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Streamlined workflows for query-based gene cluster mining
build:
  entry_points:
  - csuite = csuite.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-build-isolation --no-cache-dir'
extra:
  recipe-maintainers:
  - LucoDevro
package:
  name: csuite
  version: 0.2.0
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools
  run:
  - python >=3.12
  - cblaster ==1.4.0
  - cagecleaner >=1.6.0
  - cfoldseeker >=0.3.0
source:
  sha256: 5ac7c0e5d097fe89857c3ac6fb89c3e36c7e7ac24c056931389a8446014a79fd
  url: https://pypi.org/packages/source/c/csuite/csuite-0.2.0.tar.gz
test:
  commands:
  - csuite -h
