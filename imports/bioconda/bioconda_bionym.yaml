about:
  description: "BioNym gathers evidence for a gene identifier from public \nAPIs \u2014\
    \ NCBI, VEuPathDB, OMA, UniProt, KEGG \u2014 and asks a \ntyped-question judge\
    \ (JEV / any POST /v1/systemone-compatible\nbackend) an ordered workflow of questions\
    \ to produce a\nconfidence-scored knowledge graph with evidence provenance on\
    \ \nevery edge. Ships a CLI, a Python library, and a self-contained \nHTML report\
    \ (`bionym resolve --report`).\nA FastAPI service and static D3 UI live in the\
    \ source repo only \u2014\nthey are not part of the installed package.\n"
  dev_url: https://github.com/d-callan/bionym
  doc_url: https://github.com/d-callan/bionym#readme
  home: https://github.com/d-callan/bionym
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Resolve bioinformatics identifiers into confidence-scored knowledge graphs
build:
  entry_points:
  - bionym = bionym.cli:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - d-callan
package:
  name: bionym
  version: 0.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - httpx >=0.27
  - typer >=0.12
  - pydantic >=2.6
  - diskcache >=5.6
  - python-dotenv >=1.0
source:
  sha256: d2f31c9c0a364ac25d1759c85df02089bb468f6353403335053c98a810083027
  url: https://pypi.org/packages/source/b/bionym/bionym-0.1.0.tar.gz
test:
  commands:
  - bionym --help
  - bionym version
  - bionym resolve --help
  - bionym ask --help
  - pip check
  imports:
  - bionym
