about:
  home: https://github.com/adamewing/haphazard
  license: MIT
  license_file: LICENSE
  summary: Resolve overlapping haplotype phase blocks in haplotagged ONT BAM files
    using CpG methylation profiles
build:
  noarch: python
  number: 0
  script: -m pip install . --no-deps --no-build-isolation -q
extra:
  skip-lints:
  - missing_run_exports
package:
  name: haphazard
  version: 0.1.0
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - pysam >=0.22.0
  - numpy >=1.23
  - scipy >=1.10
  - networkx >=2.5
  - tqdm >=4.0
  - matplotlib-base >=3.3
source:
  sha256: 052a6b60a832cdac1087448111909d85c1c62c4453883f0443fd4c16f9be01a2
  url: https://github.com/adamewing/haphazard/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - haphazard --help
  imports:
  - haphazard
