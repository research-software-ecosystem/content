about:
  dev_url: https://github.com/poeli-lanl/GOTTCHA2
  doc_url: https://github.com/poeli-lanl/GOTTCHA2/wiki
  home: https://github.com/poeli-lanl/GOTTCHA2
  license: BSD-3
  license_family: BSD
  license_file: LICENSE
  summary: Genomic Origin Through Taxonomic CHAllenge (GOTTCHA) v2.
build:
  entry_points:
  - gottcha2 = gottcha.gottcha2:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install -vvv --no-deps --no-build-isolation --no-cache-dir .
extra:
  identifiers:
  - biotools:gottcha2
package:
  name: gottcha2
  version: 2.5.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  - pandas
  run:
  - python >=3.9
  - minimap2 >=2.17
  - biom-format >=2.1.7
  - numpy
  - pandas
  - requests
  - tqdm
  - pysam >=0.22.0
  - samtools
  - sylph
source:
  sha256: 08ced1fb0d6f32a2e8561fda05ce22c9cb3ecc2d3bb3edbae116e391b8a4b78f
  url: https://github.com/poeli-lanl/GOTTCHA2/archive/refs/tags/2.5.0.tar.gz
test:
  commands:
  - minimap2 -h
  - python -c "import gottcha.gottcha2 as g; assert g.__version__ == '2.5.0'"
  - gottcha2 version
