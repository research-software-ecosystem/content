about:
  dev_url: https://github.com/poeli-lanl/GOTTCHA2
  doc_url: https://github.com/poeli-lanl/GOTTCHA2/wiki
  home: https://github.com/poeli-lanl/GOTTCHA2
  license: BSD-3
  license_family: BSD
  license_file: LICENSE
  summary: Genomic Origin Through Taxonomic CHAllenge (GOTTCHA) v2.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install -vvv --no-deps --no-build-isolation --no-cache-dir .
extra:
  identifiers:
  - biotools:gottcha2
package:
  name: gottcha2
  version: 2.5.1.2
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  - pandas >=1.2.0
  run:
  - python >=3.9
  - minimap2 >=2.27
  - biom-format >=2.1.7
  - numpy >=1.19.0
  - pandas >=1.2.0
  - requests >=2.25.0
  - tqdm
  - pysam >=0.22.0
  - minify-html >=0.18
  - samtools >=1.2
  - sylph
source:
  sha256: 27fe34d2f7f756d45da60791bb31e924efb24d16cbf0f382ede7cb1f8a070859
  url: https://github.com/poeli-lanl/GOTTCHA2/archive/refs/tags/2.5.1.2.tar.gz
test:
  commands:
  - minimap2 -h
  - python -c "import gottcha.gottcha2 as g; assert g.__version__ == '2.5.1.2'"
  - gottcha2 version
