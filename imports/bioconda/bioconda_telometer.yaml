about:
  dev_url: https://github.com/santiago-es/Telometer
  home: https://github.com/santiago-es/Telometer
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A simple regular expression based method for measuring individual, chromosome-specific
    telomere lengths from long-read sequencing data.
build:
  entry_points:
  - telometer = telometer.telometer:run_telometer
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - santiago-es
package:
  name: telometer
  version: 2.0.3
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools >=61,<76
  run:
  - python >=3.8
  - numpy
  - pandas
  - pysam
  - regex
  - scipy
  - samtools
  - minimap2
source:
  sha256: a76e2f972a6766b31f17ee36b3096a00542bb88241a453fb3ca6debe8afe14f7
  url: https://pypi.org/packages/source/t/telometer/telometer-2.0.3.tar.gz
test:
  commands:
  - telometer --help
  imports:
  - telometer
