about:
  dev_url: https://github.com/paulzierep/COMEBin-LLMopt
  home: https://github.com/paulzierep/COMEBin-LLMopt
  license: GPL-3.0-only
  license_family: GPL3
  license_file:
  - LICENSE.txt
  - NOTICE.md
  summary: 'An LLM-optimized, faster COMEBin: binning of metagenomic contigs with
    contrastive multi-view representation learning'
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - paulzierep
package:
  name: comebin-llmopt
  version: 1.1.2
requirements:
  run:
  - python >=3.11,<3.14
  - bedtools >=2.31,<3
  - biolib >=0.1.9,<0.2
  - biopython >=1.85,<2
  - bwa >=0.7.17,<0.8
  - checkm-genome >=1.2,<2
  - checkm2 >=1.1.0,<2
  - click >=8,<9
  - fraggenescan >=1.31,<2
  - hmmer >=3.4,<4
  - hnswlib >=0.8,<1
  - leidenalg >=0.12,<0.13
  - numpy >=2,<3
  - perl
  - prodigal >=2.6,<3
  - python-igraph >=1,<2
  - pytorch >=2.12,<2.14
  - pyyaml >=6,<7
  - samtools >=1.20,<2
  - scikit-learn >=1.5,<1.10
  - scipy >=1.13,<2
  - setuptools <82
  - tensorboard >=2.18,<3
  - tqdm >=4.66,<5
source:
  sha256: 3a838f8f9d941e23a4e10e92b021d7150e1fe575130ee5e5c67a0d3426c2d735
  url: https://github.com/paulzierep/COMEBin-LLMopt/archive/refs/tags/v1.1.2.tar.gz
test:
  commands:
  - comebin-llmopt -h
  - comebin-llmopt -V | grep -q "1.1.2"
  - comebin-llmopt -T "${PWD}/tmp_test" -h
  - python -c "import Bio, hnswlib, igraph, leidenalg, numpy, scipy, sklearn, torch,
    tqdm, yaml"
  - python -c "from biolib.common import make_sure_path_exists; from checkm.defaultValues
    import DefaultValues"
  - python "${PREFIX}/share/comebin-llmopt/COMEBin/main.py" -h
  - comebin-llmopt-gen-cov -h 2>&1 | grep -q "Usage"
  - checkm2 --version
