about:
  dev_url: https://github.com/KarchinLab/open-cravat
  doc_url: https://github.com/KarchinLab/open-cravat/wiki
  home: https://www.opencravat.org
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: OpenCRAVAT - variant analysis toolkit
build:
  entry_points:
  - oc = cravat.oc:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - cvaske
  - kmoad
  - rachelkarchin
  - skanderson
package:
  name: open-cravat
  version: 3.2.4
requirements:
  host:
  - pip
  - python >=3.9
  - setuptools
  run:
  - aiohttp <4.0.0
  - aiosqlite
  - biopython
  - chardet >=3.0.4,<6.0.0
  - intervaltree
  - markdown
  - mpmath
  - nest-asyncio
  - openpyxl
  - oyaml
  - psutil
  - pyliftover
  - python >=3.9
  - setuptools
  - pyyaml
  - requests
  - requests-toolbelt
  - twobitreader
  - websockets
  - xlsxwriter
  - pyvcf3
  - looseversion
  - packaging >=25.0.0
  - flask
  - paste
  - waitress
  - whitenoise
  - flask-caching
  - cachelib
  - celery
  - cryptography
source:
  sha256: 1cf4a59aec23ee373397393b2b98448be3f257de26fc70985aacf5a8df6d5dcd
  url: https://pypi.org/packages/source/o/open-cravat/open_cravat-3.2.4.tar.gz
test:
  imports:
  - cravat
