about:
  description: SPICE is an algorithm that reconstructs hundreds to thousands of equally
    plausible copy-number alteration (CNA) phylogenies for each tumour, taking as
    input clone-specific CNA profiles inferred from either bulk DNA sequencing data
    using copy-number deconvolution methods or from single-cell DNA sequencing data
    by clustering cells with similar CNAs. Rather than relying on a single, error-prone
    estimate, SPICE enumerates multiple equally-plausible CNA phylogenies to quantify
    uncertainty for each inferred CNA event.
  dev_url: https://github.com/zaccaria-lab/SPICE
  doc_url: https://github.com/zaccaria-lab/SPICE/blob/v0.1.0/README.md
  home: https://github.com/zaccaria-lab/SPICE
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Subclone Probability Inference of Copy-number Evolution (SPICE)
build:
  entry_points:
  - spice = spice.sh.spice:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: "set -ex\n -m pip install . -vv --no-deps --no-build-isolation\n"
package:
  name: spice
  version: 0.1.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  run:
  - python >=3.9
  - numpy >=1.22.0,<2.0.0
  - pandas >=2.0.0
  - scipy >=1.10.0,<2.0.0
  - pyomo >=6.7.0
  - biopython >=1.80
  - matplotlib-base >=3.7.0
  - seaborn >=0.13.0
source:
  sha256: 07162766df6915aa238afcf9fe851780a6d977150c75998c27eb5d51a6b0e0c2
  url: https://github.com/zaccaria-lab/SPICE/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - spice -h
  imports:
  - spice
  - spice.core
  - spice.sh
  - spice.plotting
  - spice.postprocess
