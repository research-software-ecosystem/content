about:
  dev_url: https://github.com/casparbein/polymeval
  home: https://github.com/casparbein/polymeval
  license: MIT
  license_file: LICENSE
  summary: Snakemake pipeline to (1) evaluate polymerase-amplified PacBio HiFi read
    sets or (2) benchmark HG002 PacBio HiFi reads for SNP/InDel/TR/SV calling against
    various gold standard ground truths.
build:
  entry_points:
  - polymeval = polymeval.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - casparbein
package:
  name: polymeval
  version: 0.2.1
requirements:
  host:
  - python >=3.10
  - pip
  - hatchling
  run:
  - python >=3.10
  - ruamel.yaml >=0.18
  - snakemake >=9.0
  - snakemake-executor-plugin-slurm
source:
  sha256: f49779148763b2e2abf2dbf7043d48ce280dba9b3d7c28ded9b9c38f26027452
  url: https://github.com/casparbein/polymeval/archive/refs/tags/v0.2.1.tar.gz
test:
  commands:
  - polymeval --help
  - polymeval --version
