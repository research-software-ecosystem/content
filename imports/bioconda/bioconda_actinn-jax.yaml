about:
  dev_url: https://github.com/iandriver/actinn-jax
  home: https://github.com/iandriver/actinn-jax
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast JAX reimplementation of ACTINN for single-cell cell-type reference
    mapping
build:
  entry_points:
  - actinn-jax = actinn_jax.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517
    -vvv
extra:
  recipe-maintainers:
  - iandriver
package:
  name: actinn-jax
  version: 0.3.1
requirements:
  host:
  - pip
  - python >=3.10
  - setuptools >=61.0
  - wheel
  run:
  - python >=3.10
  - numpy >=1.23
  - scipy >=1.9
  - anndata >=0.9
  - pandas >=1.5
  - h5py
  - scanpy >=1.10
  - jax >=0.4.0
  - jaxlib >=0.4.0
  - optax >=0.1.5
source:
  sha256: c597ad467078a00004b01748c0501e0bf0d496badda96783768897eb3d415b00
  url: https://pypi.org/packages/source/a/actinn-jax/actinn_jax-0.3.1.tar.gz
test:
  commands:
  - actinn-jax --help
  imports:
  - actinn_jax
