about:
  description: 'tchem reads the first reads of a single-cell RNA library and names
    its kit, read geometry,

    barcode lists, cDNA strand and library type, with a confidence, across vendors
    (10x, BD

    Rhapsody, Parse, SPLiT-seq, Singleron, ScaleBio, MGI and others). tchem-fetch-whitelists

    downloads the vendors'' barcode lists and checks each against its registered sha256;
    the

    lists belong to their vendors and are not part of this package.

    '
  dev_url: https://github.com/Tussl-Co/TusslChemistry
  doc_url: https://github.com/Tussl-Co/TusslChemistry/blob/v0.1.0/README.md
  home: https://github.com/Tussl-Co/TusslChemistry
  license: Apache-2.0
  license_family: APACHE
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Names a single-cell RNA library's chemistry from its first reads, across
    vendors.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - artymisterJ
package:
  name: tussl-chemistry
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  run:
  - bash
  - curl
  - gzip
  - coreutils
  - grep
  - gawk
source:
  sha256: 12a229441398020fffcbb5e4bba2b0085ba70c7a34f5d61efd10aeb5042c03ea
  url: https://github.com/Tussl-Co/TusslChemistry/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - tchem --version
  - tchem --help
  - tchem --version | grep -qx "tchem 0.1.0"
  - (tchem-fetch-whitelists 2>&1 || true) | grep -q usage
  - test -f "${PREFIX}/share/tussl-chemistry/data/lists.tsv"
  - test "$(ls "${PREFIX}/share/tussl-chemistry/data")" = lists.tsv
