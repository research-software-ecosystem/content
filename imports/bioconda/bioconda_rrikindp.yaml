about:
  description: 'RRIkinDP computes thermodynamic and kinetic features of RNA-RNA interactions
    based on a direct paths

    interaction formation model. As input, two RNA sequences as well as their interaction
    structure are

    provided. The tool generates the state space of all intermediate interactions
    from single base pair

    or seed interaction to the full input interaction. On top of this state space
    it computes the barrier

    energy for the best direct path from a given start interaction to the full input
    interaction. In

    addition, the included python library enables modeling of the interaction formation
    as a markov

    process on this state space.

    '
  dev_url: https://github.com/mwaldl/RRIkinDP
  doc_url: https://doi.org/10.1101/2023.07.28.548983
  home: https://github.com/mwaldl/RRIkinDP
  license: GPL-3.0-only
  license_family: GPL3
  license_file: COPYING
  summary: "Targeted RNA\u2013RNA interaction kinetics."
