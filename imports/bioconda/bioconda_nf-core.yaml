about:
  dev_url: https://github.com/nf-core/tools
  doc_url: https://nf-co.re
  home: https://nf-co.re
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python package with helper tools for the nf-core community.
build:
  entry_points:
  - nf-core=nf_core.__main__:run_nf_core
  noarch: python
  number: 1
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  container:
    extended-base: true
  identifiers:
  - doi:10.1038/s41587-020-0439-x
package:
  name: nf-core
  version: 4.2.2
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=40.6.0
  - wheel
  run:
  - python >=3.10
  - click
  - filetype
  - git
  - gitpython
  - pygithub
  - jinja2
  - jsonschema >=4.0
  - markdown >=3.3
  - packaging
  - pillow
  - prek
  - pdiff
  - prompt_toolkit <=3.0.52
  - pydantic >=2.2.1
  - pyyaml
  - questionary >=2.0.1
  - refgenie
  - requests
  - requests-cache
  - rich >=13.3.1
  - rich-click ==1.9.*
  - rocrate
  - repo2rocrate
  - ruamel.yaml
  - setuptools <85
  - tabulate
  - textual ==8.2.8
  - linkify-it-py >=1,<3
  - trogon
  - nextflow >=25.04.2
  - nf-test
source:
  sha256: d9af2e94f21bdc47714b536727df36b303cab2c0e5bceb861dcb9d4839a9d002
  url: https://github.com/nf-core/tools/archive/refs/tags/4.2.2.tar.gz
test:
  commands:
  - nf-core --help
  - nextflow help
  - nf-test version
