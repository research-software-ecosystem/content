about:
  doc_url: https://reneshbedre.github.io/blog/howtoinstall.html
  home: https://reneshbedre.github.io/blog/howtoinstall.html
  license: MIT
  summary: The bioinfokit toolkit aimed to provide various easy-to-use functionalities
    to analyze, visualize, and interpret the biological data generated from genome-scale
    omics experiments.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: python -m pip install --no-deps --ignore-installed .
package:
  name: bioinfokit
  version: 2.1.4
requirements:
  host:
  - python
  - pip
  - setuptools
  run:
  - python
  - pandas
  - matplotlib-base
  - scipy
  - scikit-learn
  - seaborn
  - matplotlib-venn
  - tabulate
  - statsmodels
  - textwrap3
  - adjusttext
source:
  sha256: 4824955704faf7a57aa91d4b87e581b61c3ff5a68b082bb2259d83d5123c146e
  url: https://github.com/reneshbedre/bioinfokit/archive/v2.1.4.tar.gz
test:
  imports:
  - bioinfokit
