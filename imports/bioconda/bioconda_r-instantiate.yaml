about:
  description: 'Similar to ''rstantools'' for ''rstan'', the ''instantiate'' package
    builds pre-compiled

    ''CmdStan'' models into CRAN-ready statistical modeling R packages. The models
    compile

    once during installation, the executables live inside the file systems of their

    respective packages, and users have the full power and convenience of ''cmdstanr''

    without any additional compilation after package installation. This approach saves

    time and helps R package developers migrate from ''rstan'' to the more modern
    ''cmdstanr''.

    Packages ''rstantools'', ''cmdstanr'', ''stannis'', and ''stanapi'' are similar
    Stan clients

    with different objectives.

    '
  dev_url: https://github.com/wlandau/instantiate
  home: https://wlandau.github.io/instantiate/
  license: MIT
  license_family: MIT
  license_file:
  - /lib/R/share/licenses/MIT
  - LICENSE
  summary: pre-compiled CmdStan models in R packages
