about:
  dev_url: https://github.com/iskandr/osteosarc
  doc_url: https://iskandr.github.io/osteosarc
  home: https://pypi.org/project/osteosarc
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Reproducible access to the public osteosarc.com dataset.
build:
  entry_points:
  - osteosarc = osteosarc.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: osteosarc
  version: 0.15.5
requirements:
  host:
  - python >=3.9
  - setuptools >=77
  - pip
  run:
  - python >=3.9
  - beautifulsoup4 >=4.12
  - datacache
  - pysam >=0.22
  - requests >=2.28
source:
  sha256: 5992158140deb0563f769bbe83b71d6fef4390572eefbcbcec667b4cdd64fb8f
  url: https://pypi.org/packages/source/o/osteosarc/osteosarc-0.15.5.tar.gz
test:
  commands:
  - osteosarc --help
  imports:
  - osteosarc
