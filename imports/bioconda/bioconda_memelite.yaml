about:
  dev_url: https://github.com/jmschrei/memesuite-lite
  home: https://github.com/jmschrei/memesuite-lite
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast numba re-implementations of MEME suite tools (Tomtom, FIMO) as Python
    functions.
build:
  entry_points:
  - ttl = memelite.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  recipe-maintainers:
  - musharna
package:
  name: memelite
  version: 0.5.0
requirements:
  host:
  - python >=3.9
  - pip
  - uv-build >=0.11.14,<0.12.0
  run:
  - python >=3.9
  - numba >=0.55.1
  - numpy >=1.14.2
  - pandas >=1.3.3
  - pyfaidx >=0.7.2.1
  - tqdm >=4.64.1
source:
  sha256: 42f3e141c566b713d4caadadd8e9f4ca88c0993177b79eaca37782d91a036f60
  url: https://pypi.org/packages/source/m/memelite/memelite-0.5.0.tar.gz
test:
  commands:
  - pip check
  - ttl --help
  imports:
  - memelite
  - memelite.fimo
  - memelite.tomtom
  requires:
  - pip
