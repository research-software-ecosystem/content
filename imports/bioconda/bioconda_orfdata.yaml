about:
  home: https://pypi.org/project/orfdata
  license: Apache-2.0
  license_family: APACHE
  license_file:
  - LICENSE
  - tests/data/pfizer_rna/NOTICE.md
  - tests/data/wang/NOTICE.md
  - tests/data/copy/NOTICE.md
  - tests/data/ingolia/NOTICE.md
  - tests/data/search_reference/NOTICE.md
  - tests/data/regions/NOTICE.md
  - tests/data/pfizer/NOTICE.md
  - orfdata/data/orf-evidence/NOTICE.txt
  - orfdata/data/uorf-evidence/NOTICE.txt
  summary: Reference open reading frames and experimental translation evidence on
    annotated transcripts.
build:
  entry_points:
  - orfdata = orfdata.cli:run
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: orfdata
  version: 0.18.0
requirements:
  host:
  - python >=3.9
  - setuptools >=77
  - pip
  run:
  - python >=3.9
source:
  sha256: 7b591bc4978c293eb67d64b4c7d5033068a466aa0e188130712e4b4c7df8b1ec
  url: https://pypi.org/packages/source/o/orfdata/orfdata-0.18.0.tar.gz
test:
  commands:
  - orfdata --help
  imports:
  - orfdata
