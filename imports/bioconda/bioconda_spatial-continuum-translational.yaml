about:
  description: A deterministic Python and command-line research profile for explicit
    GIST features, supporting validated TSV, CSV, and JSON cohort inputs. It is not
    a clinical predictor or treatment recommendation.
  dev_url: https://github.com/Lukecele/spatial-continuum-translational
  home: https://github.com/Lukecele/spatial-continuum-translational
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Reproducible research-only GIST phenotype profile CLI.
build:
  entry_points:
  - spatial-continuum-gist = spatial_continuum_translational.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.5281/zenodo.23963562
  recipe-maintainers:
  - Lukecele
package:
  name: spatial-continuum-translational
  version: 0.1.54
requirements:
  host:
  - python >=3.10
  - setuptools >=61
  - pip
  run:
  - python >=3.10
  - spatial-continuum >=1.0.3
source:
  sha256: 063c688e18ce295579d953b48ffe61f9d746e0da208ea47d2f43a887c825e465
  url: https://github.com/Lukecele/spatial-continuum-translational/archive/refs/tags/v0.1.54.tar.gz
test:
  commands:
  - spatial-continuum-gist --help
  imports:
  - spatial_continuum_translational
