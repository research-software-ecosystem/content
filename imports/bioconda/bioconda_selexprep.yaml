about:
  dev_url: https://github.com/marcorotanegroni/selexprep
  home: https://github.com/marcorotanegroni/selexprep
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Accession-first preprocessing for public HT-SELEX with primer auto-inference
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - marcorotanegroni
package:
  name: selexprep
  version: 0.4.6
requirements:
  host:
  - python >=3.10
  - hatchling >=1.26
  - pip
  run:
  - python >=3.10
  - typer >=0.12
  - numpy >=1.24
  - pandas >=2.0
  - pyarrow >=14.0
  - pyyaml >=6.0
  - requests >=2.31
  - matplotlib-base >=3.8
  - pydantic >=2.0
  - cutadapt >=4.0
  - dnaio >=1.2
source:
  sha256: 09d45244e8f558998e87992bba7e2b7851ff73b9927063b7503b25bbe65c41c8
  url: https://pypi.io/packages/source/s/selexprep/selexprep-0.4.6.tar.gz
test:
  commands:
  - selexprep --help
  imports:
  - selexprep
