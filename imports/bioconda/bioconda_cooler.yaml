about:
  dev_url: https://github.com/open2c/cooler
  doc_url: https://open2c.github.io/cooler
  home: https://github.com/open2c/cooler
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Sparse binary format for genomic interaction matrices.
build:
  entry_points:
  - cooler = cooler.cli:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  container:
    extended-base: true
  identifiers:
  - doi:0.1093/bioinformatics/btz540
package:
  name: cooler
  version: 0.12.1
requirements:
  host:
  - python >=3.9
  - pip
  - hatchling
  - hatch-vcs
  run:
  - asciitree >=0.3
  - click >=8
  - dask
  - h5py >=3.0
  - numpy >=1.26
  - pairix
  - pandas >1.5
  - pyfaidx
  - pysam
  - python >=3.9
  - pyyaml
  - scipy >=1.11
source:
  sha256: 0298597dd630e77883314f795255abb815774a76732bcc8a4d3b2adc4bb3d05e
  url: https://pypi.python.org/packages/source/c/cooler/cooler-0.12.1.tar.gz
test:
  commands:
  - cooler --help
  imports:
  - cooler
  - cooler.cli
