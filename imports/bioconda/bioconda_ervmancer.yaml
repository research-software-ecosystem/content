about:
  description: ERVmancer quantifies Human Endogenous Retrovirus (HERV) short read
    RNA sequencing expression data by aligning short reads to a curated subset of
    HERVs and then resolves ambiguity in alignment using a pre-computed HERV phylogenetic
    tree.
  dev_url: https://github.com/AuslanderLab/ervmancer
  home: https://github.com/AuslanderLab/ervmancer
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Quantifies HERV short read RNA sequencing expression data.
build:
  entry_points:
  - ervmancer = ervmancer.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - RNAPolymerase12
  - bryantduong
package:
  name: ervmancer
  version: 1.0.1
requirements:
  host:
  - python >=3.9,<3.11
  - setuptools <82
  run:
  - python >=3.9,<3.11
  - bowtie2 >=2.4.2
  - samtools >=1.20
  - bedtools >=2.29.2
  - setuptools <82
  - numpy
  - pandas
  - tqdm
  - regex
source:
  sha256: ba79f02682e174e5ce76566294393e7176a6a286110144ebabce3ea23fc8044a
  url: https://github.com/AuslanderLab/ERVmancer/archive/refs/tags/v1.0.1.tar.gz
test:
  commands:
  - ervmancer --help
