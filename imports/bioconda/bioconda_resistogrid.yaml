about:
  dev_url: https://github.com/erinyoung/resistogrid
  home: https://github.com/erinyoung/resistogrid
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Pivot NCBI AMRFinder and AMRFinderPlus long-format TSV outputs into sample-by-gene
    matrices.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - erinyoung
package:
  name: resistogrid
  version: 0.1.0.20260807.1
requirements:
  host:
  - python >=3.8
  - setuptools >=61.0
  - pip
  run:
  - python >=3.8
  - pandas >=1.5.0
  - tomli >=2.0.0
source:
  sha256: 0a09c38f02b52b896773f812b3bd0ad306347fb94486b5646e0647978738f0ab
  url: https://pypi.org/packages/source/r/resistogrid/resistogrid-0.1.0.20260807.1.tar.gz
test:
  commands:
  - pip check
  - resistogrid --help
  imports:
  - resistogrid
  requires:
  - pip
