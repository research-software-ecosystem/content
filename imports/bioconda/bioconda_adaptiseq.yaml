about:
  description: 'adaptiSeq downloads sequencing data and metadata from GSA, SRA, ENA,
    DDBJ

    and GEO. It offers batch-parallel download of accession lists, a segmented and
    resumable

    HTTP(S)/FTP engine, md5 verification of every file inside the worker pool

    with an exit status that reflects what was delivered, adaptive concurrency

    (several controllers), adaptive parallel Aspera, and an importable Python API.

    '
  dev_url: https://github.com/swargo98/adaptiSeq
  doc_url: https://swargo98.github.io/adaptiSeq/
  home: https://github.com/swargo98/adaptiSeq
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast, resumable, adaptive batch downloader for public sequencing data (GSA/SRA/ENA/DDBJ/GEO).
build:
  entry_points:
  - adaptiseq = adaptiseq.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - swargo98
package:
  name: adaptiseq
  version: 0.1.15
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77.0
  run:
  - python >=3.10
  - aiohttp >=3.8
  - aioftp >=0.21
  - numpy >=1.21
  - wget
  - axel
  - pigz
  - coreutils
  - sra-tools >=2.11.0
  - aspera-cli 4.14.0.*
source:
  sha256: de80376b7b51b162fbc96d1b8134eae58c21f47ebef0c74f752980c705683842
  url: https://pypi.org/packages/source/a/adaptiseq/adaptiseq-0.1.15.tar.gz
test:
  commands:
  - adaptiseq --version
  - adaptiseq --help
  - python -m adaptiseq --version
  - pip check
  imports:
  - adaptiseq
  - adaptiseq.engine
  requires:
  - pip
