about:
  description: 'Phyling is a fast, scalable, and user-friendly tool supporting phylogenomic
    reconstruction of species phylogenies directly

    from protein-encoded genomic data. It identifies orthologous genes by searching
    a sample''s protein sequences against a Hidden

    Markov Models marker set, containing single-copy orthologs, retrieved from the
    BUSCO database. In the final step, users can

    choose between consensus and concatenation strategies to construct the species
    tree from the aligned orthologs.

    '
  dev_url: https://github.com/stajichlab/Phyling
  doc_url: https://phyling.readthedocs.io
  home: https://github.com/stajichlab/Phyling
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A phylogenetic inference tool based on protein-coding genomic sequences
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifies:
  - 10.1093/g3journal/jkag062
  - 10.5281/zenodo.1257001
  recipe-maintainers:
  - chtsai0105
package:
  name: phyling
  version: 2.5.0
requirements:
  host:
  - pip
  - python >=3.10,<3.15
  - hatchling >=1.27
  - versioningit
  run:
  - aster >=1.19
  - biopython >=1.81
  - clipkit >=2.1.1
  - fasttree >=2.1.1
  - iqtree >=3.1.2
  - matplotlib-base >=3.10.9
  - numpy >=2.0.2,<3.0.0
  - phykit >=2.8.0
  - pyfaidx >=0.9.0.3
  - pyhmmer >=0.12.3
  - python >=3.10,<3.15
  - typing-extensions
source:
  sha256: f378a221fe428a14d43ff00bd5d925ef68b661a0c75009c02dedcddcf7be0520
  url: https://github.com/stajichlab/Phyling/releases/download/v2.5.0/phyling-2.5.0.tar.gz
test:
  commands:
  - phyling -h
  - phyling download -h
  - phyling align -h
  - phyling filter -h
  - phyling tree -h
