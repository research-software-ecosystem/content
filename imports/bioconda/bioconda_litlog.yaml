about:
  dev_url: https://github.com/isomlab/litlog
  home: https://github.com/isomlab/litlog
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Local-first tracker for the papers you read and how they interconnect.
build:
  entry_points:
  - litlog = litlog.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - dangerisom
package:
  name: litlog
  version: 0.1.1
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=64
  run:
  - python >=3.9
  - pymupdf >=1.23
  - python-docx >=1.1
  - scikit-learn >=1.3
source:
  sha256: 594b871ba1f71f8d11c26e28ea9a5aa066e7c3d596f202ebf57b8a13c73c33ab
  url: https://github.com/isomlab/litlog/archive/refs/tags/v0.1.1.tar.gz
test:
  commands:
  - litlog --help
  imports:
  - litlog
  - litlog.graph
  - litlog.server
