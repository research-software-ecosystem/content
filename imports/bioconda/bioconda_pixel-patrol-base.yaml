about:
  description: 'PixelPatrol scans image collections, extracts file- and pixel-level

    metadata into a Parquet table and presents it as an interactive web

    report, helping to spot problems in bioimage datasets before analysis.

    This is the base package providing the CLI, processing pipeline,

    plugin registry and the pre-built web viewer.

    '
  dev_url: https://github.com/ida-mdc/pixel-patrol
  doc_url: https://ida-mdc.github.io/pixel-patrol/
  home: https://ida-mdc.github.io/pixel-patrol/
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - src/pixel_patrol_base/viewer_dist/LICENSES.txt
  summary: Image prevalidation tool for bioimage datasets
build:
  entry_points:
  - pixel-patrol = pixel_patrol_base.cli:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - rmassei
package:
  name: pixel-patrol-base
  version: 1.0.0
requirements:
  host:
  - python 3.12
  - pip
  - hatchling <1.27
  run:
  - python >=3.12
  - click >=8.2.1
  - packaging >=21.0
  - matplotlib-base >=3.10.3
  - numpy
  - polars >=1.33.0
  - pyarrow >=21.0.0
  - pyyaml >=6.0.2
  - statsmodels >=0.14.4
  - dask-core >=2025.5.1
  - distributed >=2025.5.1
  - python-duckdb >=1.2.0
  - psutil >=6.0.0
  - tqdm >=4.67.1
  - yaspin >=3.4.0
source:
  sha256: d49170e7a27d91def8a72434c7d943910c2aa100d2384ef8745aae3a72676bff
  url: https://pypi.org/packages/source/p/pixel-patrol-base/pixel_patrol_base-1.0.0.tar.gz
test:
  commands:
  - pip check
  - pixel-patrol --help
  - pixel-patrol --version
  imports:
  - pixel_patrol_base
  - pixel_patrol_base.cli
  - pixel_patrol_base.api
  - pixel_patrol_base.core.processing
  - pixel_patrol_base.plugin_registry
  - pixel_patrol_base.viewer_extensions
  requires:
  - python 3.12
  - pip
  - pytest >=8.3.5
  - pytest-mock >=3.14.1
  source_files:
  - tests
  - pyproject.toml
