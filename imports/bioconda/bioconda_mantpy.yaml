about:
  home: https://github.com/moeghaf/Mantpy
  license: MIT
  license_file: LICENSE
  summary: A framework for extracellular matrix analysis in spatial proteomics
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - nilchia
package:
  name: mantpy
  version: 1.3.0
requirements:
  host:
  - python >=3.11,<3.14
  - hatch-vcs
  - hatchling
  - pip
  run:
  - python >=3.11,<3.14
  - anndata >=0.12
  - dask-core >=2024.10
  - igraph >=0.10
  - leidenalg >=0.10
  - joblib >=1.3
  - matplotlib-base >=3.8
  - networkx >=3.2
  - numpy >=1.24,<2.5
  - pandas >=2.1
  - pillow >=10
  - pooch >=1.8
  - requests >=2.28
  - scanpy >=1.10,<1.13
  - scikit-image >=0.21
  - scikit-learn >=1.4
  - scipy >=1.11
  - seaborn >=0.13
  - squidpy >=1.8.2,<1.9
  - tifffile >=2025.5.21
  - tqdm >=4.66
  - zarr >=3.1,<3.2
source:
  sha256: 106b784f0d69d5cc2c7f573f78bfc1016a685c6555f95866dcd584184071d555
  url: https://pypi.org/packages/source/m/mantpy/mantpy-1.3.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - mantpy
  requires:
  - pip
