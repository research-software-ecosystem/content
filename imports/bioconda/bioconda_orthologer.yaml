about:
  description: Ortholog detection for comparative genomics and fast functional annotation
    behind OrthoDB and BUSCO.
  dev_url: https://gitlab.com/ezlab/orthologer_container
  doc_url: https://orthologer.ezlab.org/#on-orthodb-data
  home: https://orthologer.ezlab.org
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Ortholog detection for comparative genomics and fast functional annotation
    behind OrthoDB and BUSCO.
build:
  number: 1
  run_exports:
  - null
extra:
  container:
    extended-base: true
  identifiers:
  - biotools:orthologer
  - doi:10.1093/nar/gkae987
  - PMID:39535043
  recipe-maintainers:
  - ftegenfe
package:
  name: orthologer
  version: 3.9.2
requirements:
  build:
  - null
  - null
  - null
  - cmake
  - make
  - pkg-config
  - rsync
  host:
  - python >=3.9,<3.14
  - bash >=4.1
  - llvm-openmp
  - libgomp
  - spdlog
  - boost-cpp
  run:
  - boost-cpp
  - bash >=4.1
  - python >=3.9,<3.14
  - llvm-openmp
  - libgomp
  - rsync
  - wget
  - blast
  - mmseqs2
  - cd-hit
  - diamond
  - busco >=5.7.0
source:
  sha256: 9f04eaecb3cd430959648c047502ff5d69ecf7b48a359c676fc2ed59a1f62ffa
  url: https://data.orthodb.org/current/download/software/orthologer_3.9.2.tgz
test:
  commands:
  - ALLOW_RUNAS_ROOT=1 orthologer -h
