about:
  description: 'markinp is an independent, unofficial command-line utility and Python

    library for reading, validating, and building Program MARK encounter-history

    (.inp) files. It performs file I/O and validation only and does not fit

    models or compute statistics. It is not affiliated with or endorsed by the

    authors of Program MARK or RMark.

    '
  dev_url: https://github.com/leonbzt/markinp
  home: https://github.com/leonbzt/markinp
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Read, validate, and build Program MARK encounter-history (.inp) files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - leonbzt
package:
  name: markinp
  version: 0.3.0
requirements:
  host:
  - python
  - pip
  - hatchling
  run:
  - python
  - typer >=0.9
source:
  sha256: 4c9a8e3adb458372db3c3cdee804b2b54a880652692783c9bc2cbe36a33e03f5
  url: https://pypi.org/packages/source/m/markinp/markinp-0.3.0.tar.gz
test:
  commands:
  - pip check
  - markinp --help
  - markinp --version
  imports:
  - markinp
  requires:
  - pip
