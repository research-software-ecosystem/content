about:
  doc_url: http://www.htslib.org/
  home: https://github.com/samtools/htslib
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: C library for high-throughput sequencing data formats.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:HTSlib
  skip-lints:
  - in_other_channels
package:
  name: htslib
  version: '1.25'
requirements:
  build:
  - make
  - null
  - null
  host:
  - libcurl
  - bzip2
  - xz
  - zlib
  - libdeflate
  - openssl
source:
  patches:
  - arm_hwcap.patch
  sha256: 158c271e4e2986bb2dd11283b640edc10c56695b293df77a109ce99480303730
  url: https://github.com/samtools/htslib/releases/download/1.25/htslib-1.25.tar.bz2
test:
  commands:
  - otool -L $PREFIX/bin/bgzip | grep deflate
  - ldd $PREFIX/bin/bgzip | grep deflate
  - test -e test1.bed || printf 'chr1\t100\t200\n' > test1.bed
  - bgzip test1.bed
  - tabix test1.bed.gz
  - htsfile test1.bed.gz
  files:
  - test1.bed
