about:
  home: https://github.com/GabrielHoffman/recode_h5ad
  license: MIT
  license_file: LICENSE
  summary: Recode H5AD file changing sparsity format and cell sorting
build:
  entry_points:
  - recode_h5ad = recode_h5ad.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - GabrielHoffman
package:
  name: recode-h5ad
  version: 0.1.6
requirements:
  host:
  - python >=3.8
  - setuptools >=61.0
  - anndata >=0.13.0
  - hdf5plugin >=7.0.0
  - numpy >=1.20,<2.5
  - scipy
  - pip
  run:
  - python >=3.8
  - anndata
  - hdf5plugin
  - numpy >=1.20,<2.5
  - scipy
source:
  sha256: f1c4ee7679b5bab04e3002a8eef12635d224d3d347d852042813089436e3e86c
  url: https://pypi.org/packages/source/r/recode-h5ad/recode_h5ad-0.1.6.tar.gz
test:
  commands:
  - pip check
  - recode_h5ad --help
  imports:
  - recode_h5ad
  requires:
  - pip
  - python
  - anndata
  - setuptools
  - hdf5plugin
  - numpy
  - scipy
