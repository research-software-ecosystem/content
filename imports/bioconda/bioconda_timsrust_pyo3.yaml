about:
  description: 'timsrust_pyo3 provides Python bindings to TimsRust, a high-performance
    Rust ecosystem for reading and preprocessing Bruker timsTOF mass spectrometry
    data.

    TimsRust provides type-safe, composable abstractions for working with liquid chromatography
    coupled to trapped ion mobility spectrometry (LC-TIMS-TOF) data in multiple formats.

    '
  dev_url: https://github.com/jspaezp/timsrust_pyo3
  home: https://github.com/jspaezp/timsrust_pyo3
  license: Apache-2.0
  license_file: THIRDPARTY.yml
  summary: Python bindings to the TimsRust reader
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - wagnerr-umn
package:
  name: timsrust_pyo3
  version: 0.4.1
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  host:
  - python
  - pip
  - maturin >=1.3,<2.0
  run:
  - python
source:
  sha256: 7e98005a3a9b3071fc1c851a618d005ad41e9818e31faa9e03efb4d4981a7810
  url: https://github.com/jspaezp/timsrust_pyo3/archive/refs/tags/v0.4.1.tar.gz
test:
  imports:
  - timsrust_pyo3
