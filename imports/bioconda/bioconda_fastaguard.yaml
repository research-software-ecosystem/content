about:
  description: 'FastaGuard validates assembly FASTA files, detects structural and

    composition red flags, and emits pipeline-ready JSON, TSV, HTML, and

    MultiQC outputs before downstream analysis.

    '
  dev_url: https://github.com/ehsanestaji/FastaGuard
  doc_url: https://github.com/ehsanestaji/FastaGuard/blob/v1.0.0/README.md
  home: https://github.com/ehsanestaji/FastaGuard
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: FASTA preflight QC for assembly pipelines
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - ehsanestaji
package:
  name: fastaguard
  version: 1.0.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 427bd1b9cf406f42e9754bdf2e79370c3c879249cfb87e8a4a7c9dbfa6dc4cfa
  url: https://github.com/ehsanestaji/FastaGuard/archive/refs/tags/v1.0.0.tar.gz
test:
  commands:
  - fastaguard --version | grep 1.0.0
  - fastaguard --help
  - fastaguard --schema
  - fastaguard --finding-catalog
