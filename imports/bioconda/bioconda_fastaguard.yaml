about:
  description: 'FastaGuard validates assembly FASTA files, detects structural and

    composition red flags, and emits pipeline-ready JSON, TSV, HTML, and

    MultiQC outputs before downstream analysis.

    '
  dev_url: https://github.com/ehsanestaji/FastaGuard
  doc_url: https://github.com/ehsanestaji/FastaGuard/blob/v0.6.0/README.md
  home: https://github.com/ehsanestaji/FastaGuard
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: FASTA preflight QC for assembly pipelines
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - ehsanestaji
package:
  name: fastaguard
  version: 0.6.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: b57e967ccaa03ef5e70c14b96247a644750d8bd492360633988f2f53fe84184b
  url: https://github.com/ehsanestaji/FastaGuard/archive/refs/tags/v0.6.0.tar.gz
test:
  commands:
  - fastaguard --version | grep 0.6.0
  - fastaguard --help
  - fastaguard --schema
  - fastaguard --finding-catalog
