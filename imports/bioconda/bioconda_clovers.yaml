about:
  description: 'CLOVERS is an ab initio protein-coding gene finder for prokaryotic

    genomes. It combines Z-curve features, GC-specific heuristic MLP models,

    a genome-specific RBF-SVM, and TriTISA+ start-site revision to annotate

    complete or draft single genomes as well as metagenomic assemblies.

    '
  dev_url: https://github.com/zetong-zhang/clovers
  doc_url: https://github.com/zetong-zhang/clovers/blob/main/README.md
  home: https://github.com/zetong-zhang/clovers
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Protein-coding gene prediction for single and metagenomic prokaryotic sequences
build:
  number: 0
  run_exports:
  - null
