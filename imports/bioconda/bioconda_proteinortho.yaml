about:
  dev_url: https://gitlab.com/paulklemm_PHD/proteinortho
  doc_url: https://gitlab.com/paulklemm_PHD/proteinortho/-/blob/master/README.md
  home: https://gitlab.com/paulklemm_PHD/proteinortho
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Proteinortho is a tool to detect orthologous genes within different species.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  identifiers:
  - biotools:proteinortho
  - doi:10.3389/fbinf.2023.1322477
  - usegalaxy-eu:proteinortho
  - usegalaxy-eu:proteinortho_summary
  - usegalaxy-eu:proteinortho_grab_proteins
package:
  name: proteinortho
  version: 6.3.7
requirements:
  build:
  - make
  - null
  - null
  - null
  - cmake
  host:
  - llvm-openmp
  - libgomp
  - liblapacke
  - libblas
  run:
  - llvm-openmp
  - libgomp
  - perl
  - perl-dbi
  - perl-dbd-sqlite
  - python
  - diamond >=0.9.29
  - liblapacke
  - libblas
source:
  sha256: 9ebc51af7f9653a24d93cb930afebf4fbc3df5be088c121ddf56928556187830
  url: https://gitlab.com/paulklemm_PHD/proteinortho/-/archive/v6.3.7/proteinortho-v6.3.7.tar.gz
test:
  commands:
  - perl -MDBI -e 'print $DBI::VERSION'
  - perl -MDBD::SQLite -e 'print $DBD::SQLite::VERSION'
  - proteinortho --version
  - proteinortho -test
  - proteinortho_clustering -test
  - proteinortho_grab_proteins.pl -help
