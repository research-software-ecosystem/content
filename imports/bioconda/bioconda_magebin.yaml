about:
  home: https://github.com/RanaweeraHK/MAGE-Bin
  license: MIT
  license_file: LICENSE
  summary: Masked adaptive graph-evidence binning for viral metagenomes
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - RanaweeraHK
package:
  name: magebin
  version: 0.1.3
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.10
  - python-igraph >=0.11
  - leidenalg >=0.10
  - numpy >=1.26
  - pandas >=2.0
  - scikit-learn >=1.3
  - scipy >=1.10
  - pytorch >=2.1
  - pytorch_geometric >=2.6
source:
  sha256: 8c0d0a0f30f1edee0c0a5cb796bee494e28696926c6766a164ef61fb17e04da3
  url: https://pypi.io/packages/source/m/magebin/magebin-0.1.3.tar.gz
test:
  commands:
  - magebin --version
  - magebin --help
  - pip check
  imports:
  - magebin
  requires:
  - pip
