about:
  dev_url: https://github.com/FOI-Bioinformatics/nanometa_live
  doc_url: https://github.com/FOI-Bioinformatics/nanometa_live/wiki
  home: https://github.com/FOI-Bioinformatics/nanometa_live
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE.txt
  summary: Workflow and GUI for real-time species classification and pathogen characterization
    of nanopore sequence reads.
build:
  entry_points:
  - nanometa-live = nanometa_live.nanometa_live:main
  - nanometa-prepare = nanometa_live.cli.prepare:main
  - nanometa-report = nanometa_live.cli.report:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: nanometa-live
  version: 0.11.1
requirements:
  host:
  - pip
  - python >=3.11
  - setuptools >=67.6.0
  run:
  - python >=3.11
  - dash >=2.8.1
  - dash-daq >=0.5.0
  - dash-bootstrap-components >=1.3.1
  - dash-ag-grid
  - plotly >=5.13.0
  - numpy >=1.24.1
  - pandas >=1.5.3
  - pyyaml >=6.0
  - pytest >=7.2.1
  - snakemake-minimal >=7.20.0
  - blast >=2.13.0
  - biopython >=1.80
  - gzip >=1.10
  - kraken2 >=2.1.2
  - fastp >=0.23.2
  - ruamel.yaml >=0.17.32
  - ncbi-datasets-cli >=15.20.0
  - tqdm >=4.62.3
  - diskcache
  - multiprocess
source:
  sha256: 3a509b99839c8fd14c0005281289c42d27100dbb58e9eee8e2c79809a43e757c
  url: https://github.com/FOI-Bioinformatics/nanometa_live/archive/0.11.1.tar.gz
test:
  commands:
  - nanometa-live --help
  - nanometa-prepare --help
  - nanometa-report --help
