about:
  dev_url: https://github.com/snakemake/snakefmt
  doc_url: https://github.com/snakemake/snakefmt/blob/v2.1.0/README.md
  home: https://github.com/snakemake/snakefmt
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: The uncompromising Snakemake code formatter.
build:
  entry_points:
  - snakefmt = snakefmt.snakefmt:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - mbhall88
  - bricoletc
package:
  name: snakefmt
  version: 2.1.0
requirements:
  host:
  - python >=3.11,<4.0
  - pip
  - hatchling
  run:
  - python >=3.11,<4.0
  - black >=26.3.1,<27.0
  - click >=8.2.0,<9.0
  - pathspec >=1.0.0
  - go-shfmt >=3.13,<4.0
source:
  sha256: 6a6ce79ff5b0ee18888896cb1660eb888a41592dbc36dccfd2c4f2a161d6dd7f
  url: https://pypi.org/packages/source/s/snakefmt/snakefmt-2.1.0.tar.gz
test:
  commands:
  - snakefmt --help
  imports:
  - snakefmt
