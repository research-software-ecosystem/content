about:
  home: https://github.com/PathoGenOmics-Lab/distree
  license: GPL-3.0-only
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: A tool to calculate distances between phylogenetic trees.
build:
  number: 0
  run_exports:
  - pin_subpackage(name, max_pin="x.x")
  script:
  - cargo install --no-track --verbose --root "${PREFIX}" --path .
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
package:
  name: distree
  version: 1.0.1
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: a2b7f7d67cf230d4493f89442f674bbc0f721fbe5b9a87c1331b0d9f4aaab9fd
  url: https://github.com/PathoGenOmics-Lab/distree/archive/v1.0.1.tar.gz
test:
  commands:
  - distree --version
