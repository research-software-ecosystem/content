about:
  doc_url: https://binette.readthedocs.io
  home: https://github.com/genotoul-bioinfo/Binette
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: A fast and accurate binning refinement tool to constructs high quality
    MAGs from the output of multiple binning tools.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install --no-deps --ignore-installed -vv .
extra:
  identifiers:
  - biotools:binette
  - usegalaxy-eu:binette
  - doi:10.21105/joss.06782
  recipe-maintainers:
  - JeanMainguy
package:
  name: binette
  version: 1.3.0
requirements:
  host:
  - python >=3.12
  - pip
  - setuptools
  run:
  - python >=3.12
  - checkm2 >=1.1,<2.0
  - tensorflow >=2.17,<2.19
  - numpy >=1.24,<3.0
  - diamond >=2.1,<3
  - pandas >=2,<3
  - joblib >=1.0,<2.0
  - networkx >=3.0,<4.0
  - pyfastx >=2,<3
  - pyrodigal >=3.0,<4.0
  - typer >=0.9,<1.0
  - pyroaring >=1.0.0,<2.0.0
  - rich >=12.0.0,<16.0.0
source:
  sha256: f8defafffcc8a95b1a57d5ff9090793c24ae363f05d76dd22aab75acc3ee759c
  url: https://github.com/genotoul-bioinfo/Binette/archive/refs/tags/v1.3.0.tar.gz
test:
  commands:
  - binette -h
  imports:
  - binette
