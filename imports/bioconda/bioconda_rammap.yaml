about:
  description: 'rammap is a pure-Rust, minimap2-compatible sequence aligner and read
    mapper.

    It is designed to be extensible and performant for mapping sequencing reads

    against reference sequences.

    '
  dev_url: https://github.com/jwanglab/rammap
  doc_url: https://github.com/jwanglab/rammap/blob/v1.2.0/README.md
  home: https://github.com/jwanglab/rammap
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: An extensible and performant aligner and read mapper.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - thanhleviet
package:
  name: rammap
  version: 1.2.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
