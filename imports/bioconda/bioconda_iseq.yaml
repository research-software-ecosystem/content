about:
  dev_url: https://github.com/BioOmics/iSeq
  home: https://github.com/BioOmics/iSeq
  license: MIT
  license_family: MIT
  summary: iSeq is a Bash script that allows you to download sequencing data and metadata
    from GSA, SRA, ENA, and DDBJ databases.
build:
  noarch: generic
  number: '0'
  run_exports:
  - null
  script:
  - mkdir -p "$PREFIX/bin"
  - chmod +x "$SRC_DIR/iSeq-v2.0.0/bin/iseq"
  - install -v -m 0755 "$SRC_DIR/iSeq-v2.0.0/bin/iseq" "$PREFIX/bin"
extra:
  recipe-maintainers:
  - BioOmics
package:
  name: iseq
  version: 2.0.0
requirements:
  host:
  - bash
  run:
  - pigz
  - wget
  - axel
  - aspera-cli =4.14.0
  - sra-tools >=2.11.0
source:
  sha256: 3adde7f4162821f28378f85c68ae99114b76639c8170bc086bf07c1695005019
  url: https://github.com/BioOmics/iSeq/releases/download/v2.0.0/iSeq-v2.0.0.tar.gz
test:
  commands:
  - iseq --help
