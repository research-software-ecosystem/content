about:
  home: https://pypi.org/project/Readzor/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A Python3 program for fully automatic trimming and quality control of short
    read sequences.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - abjanssen
package:
  name: readzor
  version: 0.1.30
requirements:
  host:
  - python
  - setuptools >=77.0.3
  - pip
  run:
  - python
  - numpy ==2.5.2
  - python-isal ==1.8.0
  - fuzzysearch ==0.8.1
source:
  sha256: f9a46b42d8ccc26ba211d77809f44d9f47552838d9870fa834308cd42f011212
  url: https://pypi.org/packages/source/r/readzor/readzor-0.1.30.tar.gz
test:
  commands:
  - pip check
  - readzor --help
  - Readzor --help
  imports:
  - readzor
  requires:
  - pip
  - python
