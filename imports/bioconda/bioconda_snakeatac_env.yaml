about:
  dev_url: https://github.com/sebastian-gregoricchio/snakeATAC
  doc_url: https://github.com/sebastian-gregoricchio/snakeATAC/wiki
  home: https://github.com/sebastian-gregoricchio/snakeATAC
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Snakemake-based pipeline for the analysis of ATAC-seq data
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - sebastian-gregoricchio
package:
  name: snakeatac_env
  version: 0.1.2
requirements:
  run:
  - snakemake-minimal >=7.24.0
  - python >=3.8
  - numpy >=1.22
  - pandas
  - cutadapt
  - fastqc
  - multiqc >=1.23
  - bwa-mem2
  - samtools
  - gatk4
  - mawk
  - macs3
  - deeptools >=3.5.2
  - bedtools
  - ucsc-bedgraphtobigwig
  - htslib
  - subread
  - tobias
  - snpsift
  - pdfcombine
  - r-base >=4.2
  - r-dplyr
  - r-ggplot2
  - r-data.table
  - r-reshape2
  - r-snow
  - bioconductor-copywriter
  - bioconductor-biocparallel
  - jq
source:
  sha256: 4ce1391a7e7b94ed1721e351ca0b2b3fd3857c89330dba12a18553b0a0e95e28
  url: https://github.com/sebastian-gregoricchio/snakeATAC/archive/refs/tags/0.1.2.tar.gz
test:
  commands:
  - samtools --version
  - deeptools --version
  - macs3 --version
  - TOBIAS --help
  - snakemake --version
  - Rscript -e "library('CopywriteR')"
