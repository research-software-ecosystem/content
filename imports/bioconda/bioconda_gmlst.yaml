about:
  description: 'gmlst is a fast Python CLI for bacterial genome typing with classical
    MLST,

    large cgMLST and wgMLST schemes, and scheme-free discovery workflows.

    It supports assembled genomes and raw reads, several alignment backends

    (BLAST+, KMA, minimap2, MUMmer4), multiple public data providers,

    custom local schemes, offline cache reuse, and local MST visualization.

    '
  dev_url: https://github.com/indexofire/gmlst
  doc_url: https://indexofire.github.io/gmlst/
  home: https://github.com/indexofire/gmlst
  license: MIT
  license_file: LICENSE
  summary: Fast bacterial genome typing with MLST, cgMLST, and scheme-free discovery
build:
  entry_points:
  - gmlst = gmlst._entry:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vvv
extra:
  recipe-maintainers:
  - indexofire
package:
  name: gmlst
  version: 0.6.1
requirements:
  host:
  - python >=3.12,<3.13
  - hatchling
  - pip
  run:
  - python >=3.12,<3.13
  - click >=8.1
  - flask >=3.0
  - pyrodigal >=3.4
  - pyyaml >=6.0
  - requests >=2.31
  - rich >=13.0
  - python-xxhash >=3.0
source:
  sha256: 737285dafe139b27d308b634d67c181629cb5002151fcc1e51c2e9106181973c
  url: https://pypi.io/packages/source/g/gmlst/gmlst-0.6.1.tar.gz
test:
  commands:
  - gmlst --help
  imports:
  - gmlst
