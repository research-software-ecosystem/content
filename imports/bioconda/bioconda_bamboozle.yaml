about:
  dev_url: https://github.com/sandberg-lab/dataprivacy
  home: https://github.com/sandberg-lab/dataprivacy
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Remove genetic variation from sequencing reads in BAM files to protect
    donor privacy.
build:
  entry_points:
  - BAMboozle = BAMboozle.BAMboozle:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.1101/2021.01.11.426206
  recipe-maintainers:
  - SaimMomin12
package:
  name: bamboozle
  version: 0.5.0
requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  run:
  - python >=3.6
  - pysam >=0.14.0
  - samtools
source:
  sha256: e449f99006f881b9be6e9b513c09af0b306d8c7f849d99e368891e74a48ff8af
  url: https://github.com/sandberg-lab/dataprivacy/archive/v0.5.0.tar.gz
test:
  commands:
  - BAMboozle --help
