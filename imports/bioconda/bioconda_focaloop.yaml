about:
  dev_url: https://github.com/nekrut/focaloop
  home: https://github.com/nekrut/focaloop
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Adaptive byte-budgeted streaming loops for RNA-seq expression, genomic
    variation, and eukaryotic genome annotation
build:
  entry_points:
  - focaloop = focaloop.cli:main
  number: 0
  run_exports:
  - null
  skip: true
extra:
  recipe-maintainers:
  - nekrut
package:
  name: focaloop
  version: 0.3.0
requirements:
  build:
  - null
  - null
  - llvm-openmp
  - libgomp
  host:
  - python
  - pip
  - setuptools >=68
  run:
  - python
  - numpy >=1.24
  - pandas >=2.0
  - pyarrow >=14
  - scipy >=1.10
  - pyyaml >=6
  - requests >=2.28
  - zstandard >=0.21
  - pydeseq2 >=0.4.12
  - statsmodels >=0.14
  - scikit-learn >=1.5
  - numba >=0.58
  - mappy >=2.26
  - pysam >=0.22
  - biopython >=1.83
  - bwa >=0.7.17
  - bwa-mem2 >=2.2.1
  - strobealign >=0.14.0
  - minimap2 >=2.28
  - hisat2 >=2.2.1
  - salmon >=1.10.3
  - piscem >=0.10.3
  - samtools >=1.21
  - bcftools >=1.21
  - htslib >=1.21
  - miniprot
  - diamond
  - stringtie
  - gffcompare
  - seqkit
  - hmmer
  - infernal
  - trnascan-se
  - barrnap
  - curl
  - zstd
source:
  sha256: 7b2657012b143fab822b4e7f7fbd50bd3881534e0a6caa1753b521510884dc24
  url: https://github.com/nekrut/focaloop/archive/refs/tags/v0.3.0.tar.gz
test:
  commands:
  - focaloop --version
  - focaloop expressionloop --help
  - focaloop variationloop --help
  - focaloop geneloop --help
  - focaloop query --help
  imports:
  - focaloop
  - focaloop.panexpr
  - focaloop.malariavar
  - focaloop.geneloop
