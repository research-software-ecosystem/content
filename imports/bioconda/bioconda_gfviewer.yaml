about:
  description: 'GFViewer draws round-capped chromosome ideograms with each gene family
    in

    its own colour and computes localization statistics (sub-telomeric bias,

    tandem arrays, 1-D Ripley''s K/L, chromosome enrichment, multigene-family

    hotspots, family-proximity clustering, ...). Reads annotation tables, BED,

    GFF3 and GTF. Provides the `gfviewer` command-line tool.

    '
  dev_url: https://github.com/sakshar/GFViewer
  home: https://github.com/sakshar/GFViewer
  license: MIT
  license_file: LICENSE
  summary: Visualize and quantify the localization of multigene families across chromosomes.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --ignore-installed -vv'
extra:
  recipe-maintainers:
  - sakshar
package:
  name: gfviewer
  version: 2.0.4
requirements:
  host:
  - python >=3.8,<3.13
  - pip
  - setuptools >=64
  - wheel
  run:
  - python >=3.8,<3.13
  - biopython
  - pandas
  - numpy
  - matplotlib-base
  - pillow
  - reportlab
  - pypdf2
  - openpyxl
  - pyyaml
source:
  sha256: 321212d322c65d34f4bf7b93374191edbf5082e370a10a904c398b6b7d0a9a99
  url: https://files.pythonhosted.org/packages/40/b0/36fe7e03967fac7e053e0236faa31fe7a01b81791142eb7093668e05dd2b/gfviewer-2.0.4.tar.gz
test:
  commands:
  - gfviewer --help
  - gfviewer --version
  imports:
  - gfviewer
