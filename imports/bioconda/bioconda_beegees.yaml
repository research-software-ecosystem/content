about:
  dev_url: https://github.com/bge-barcoding/BeeGees
  doc_url: https://github.com/bge-barcoding/BeeGees
  home: https://github.com/bge-barcoding/BeeGees
  license: MIT
  license_file: LICENSE
  summary: High-throughput protein-coding DNA barcode recovery from genome skims
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vvv
extra:
  recipe-maintainers:
  - SchistoDan
package:
  name: beegees
  version: 3.0.7
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools
  run:
  - python >=3.11
  - snakemake >=9.9
  - snakemake-executor-plugin-slurm >=1.6.1
  - snakemake-executor-plugin-slurm-jobstep >=0.3.0
  - pyyaml
  - pandas >=2.2.3
  - numpy >=1.26.4
  - biopython >=1.84
  - fastp >=0.23.4
  - blast >=2.17.0
  - hmmer >=3.4
  - trim-galore >=0.6.10
  - pigz >=2.8
  - bwa >=0.7.19
  - samtools >=1.20
  - bbmap >=40.02
  - multiqc >=1.35
  - mitogeneextractor >=1.9.6
  - r-base >=4.4
  - r-tidyverse >=2.0.0
  - r-yaml
  - wget
  - gene-fetch >=1.0.21
source:
  sha256: aa89f1602ee357fe82e913fc505c3f5d8f673acc5679aaa47ac60dd45c55f8dd
  url: https://pypi.org/packages/source/b/beegees/beegees-3.0.7.tar.gz
test:
  commands:
  - beegees --version
  - beegees --help
