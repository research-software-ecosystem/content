about:
  home: http://github.com/moonso/genmod
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Annotate genetic inheritance models in variant files
build:
  entry_points:
  - genmod = genmod.commands.base:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  recipe-maintainers:
  - ramprasadn
package:
  name: genmod
  version: 3.11.0
requirements:
  host:
  - pip
  - hatchling
  - python
  run:
  - ped_parser
  - pytabix
  - interval_tree >=0.3.4
  - click
  - configobj
  - importlib_resources
  - intervaltree >=3.1.0
  - extract_vcf
  - vcftoolbox
  - six
source:
  sha256: e6d408e6f3e9a93d8476cefff4fcd8eee334a139e05d4057c2b7af55bf2de5e3
  url: https://pypi.io/packages/source/g/genmod/genmod-3.11.0.tar.gz
test:
  commands:
  - genmod --help
  imports:
  - genmod
  - genmod.annotate_models
  - genmod.annotate_models.models
  - genmod.annotate_regions
  - genmod.annotate_variants
  - genmod.annotations
  - genmod.commands
  - genmod.errors
  - genmod.score_variants
  - genmod.utils
  - genmod.vcf_tools
