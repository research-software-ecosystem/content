about:
  home: http://github.com/moonso/genmod
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Annotate genetic inheritance models in variant files
build:
  entry_points:
  - genmod = genmod.commands.base:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  recipe-maintainers:
  - ramprasadn
package:
  name: genmod
  version: 3.13.0
requirements:
  host:
  - pip
  - hatchling
  - python >=3.11
  run:
  - python >=3.11
  - click
  - configobj
  - importlib_resources
  - intervaltree >=3.1.0
  - ped_parser
  - pysam
  - six
source:
  sha256: 51ef8b950e92bf79713b83faa0b44ce16e20e812f0925941261b135e1370bbd4
  url: https://pypi.io/packages/source/g/genmod/genmod-3.13.0.tar.gz
test:
  commands:
  - genmod --help
  imports:
  - genmod
  - genmod.annotate_models
  - genmod.annotate_models.models
  - genmod.annotate_regions
  - genmod.annotate_variants
  - genmod.annotations
  - genmod.commands
  - genmod.errors
  - genmod.score_variants
  - genmod.utils
  - genmod.vcf_tools
