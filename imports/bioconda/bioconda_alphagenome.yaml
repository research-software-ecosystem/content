about:
  description: 'AlphaGenome is a unified DNA sequence model from Google DeepMind for

    regulatory variant-effect prediction. This package provides the Python

    SDK for interacting with the AlphaGenome API and visualizing predictions

    across gene expression, splicing, chromatin features, and contact maps.

    '
  dev_url: https://github.com/google-deepmind/alphagenome
  doc_url: https://www.alphagenomedocs.com/
  home: https://github.com/google-deepmind/alphagenome
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Python SDK for interacting with and visualizing AlphaGenome genomic models
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - dannon
package:
  name: alphagenome
  version: 2.0.0
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  - grpcio-tools 1.78.*
  - grpcio
  - protobuf 6.*
  run:
  - python >=3.11
  - absl-py
  - anndata
  - null
  - immutabledict
  - intervaltree
  - jaxtyping
  - matplotlib-base
  - ml_dtypes
  - numpy
  - pandas
  - null
  - pyarrow
  - scipy
  - seaborn
  - tqdm
  - typeguard
  - typing-extensions
  - zstandard
source:
  sha256: cb1d49d39fc82627b7eb387d979e898b7397a499284f711481fef59d5533b844
  url: https://pypi.io/packages/source/a/alphagenome/alphagenome-2.0.0.tar.gz
test:
  imports:
  - alphagenome
  - alphagenome.data
  - alphagenome.models
