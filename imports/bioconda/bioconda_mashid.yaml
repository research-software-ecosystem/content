about:
  dev_url: https://github.com/duceppemo/mashID
  home: https://github.com/duceppemo/mashID
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Identify organisms from genome assemblies or raw reads using Mash
build:
  entry_points:
  - mashID = mashid.cli:main
  - mashid = mashid.cli:main
  - make_mashID_db = mashid.makedb:main
  - mashID_download_db = mashid.download_cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: mashid
  version: 0.3.2
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - mash >=2.3
  - python-isal
source:
  sha256: 5396d3e26cd35a51c5f782602a008e45e9be54982261e4812e13b20f255a6815
  url: https://github.com/duceppemo/mashID/archive/refs/tags/v0.3.2.tar.gz
test:
  commands:
  - mashID --help
  - mashid --help
  - make_mashID_db --help
  - mashID_download_db --help
