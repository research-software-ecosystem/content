about:
  dev_url: https://github.com/duceppemo/mashID
  home: https://github.com/duceppemo/mashID
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Identify organisms from genome assemblies or raw reads using Mash
build:
  entry_points:
  - mashID = mashid.cli:main
  - make_mashID_db = mashid.makedb:main
  - mashID_download_db = mashid.download_cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: mashid
  version: 0.2.8
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - mash >=2.3
  - python-isal
source:
  sha256: aae1e169517b5b07cc5fc3f43fe6ee2221bdefe952fd21e093bc42e43a90763d
  url: https://github.com/duceppemo/mashID/archive/refs/tags/v0.2.8.tar.gz
test:
  commands:
  - mashID --help
  - make_mashID_db --help
  - mashID_download_db --help
