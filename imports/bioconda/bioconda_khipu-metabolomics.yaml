about:
  dev_url: https://github.com/shuzhao-li/khipu
  home: https://github.com/shuzhao-li/khipu
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python library for generalized, low-level annotation of MS metabolomics.
build:
  entry_points:
  - khipu = khipu.command_line:main
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - sed -i.bak 's|find_packages|find_namespace_packages|' setup.py
  - rm -rf *.bak
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
extra:
  recipe-maintainers:
  - hechth
package:
  name: khipu-metabolomics
  version: 2.0.7
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools
  run:
  - python >=3.7
  - intervaltree
  - isocor
  - mass2chem
  - matplotlib-base
  - numpy
  - networkx
  - pandas
  - requests
  - scipy
  - treelib
source:
  sha256: 0efada81031cf5cf723835bf0196f558dc25bd81aab48df1fa6b1c226db202df
  url: https://pypi.org/packages/source/k/khipu-metabolomics/khipu_metabolomics-2.0.7.tar.gz
test:
  commands:
  - khipu --help
  imports:
  - khipu
