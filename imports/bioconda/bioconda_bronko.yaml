about:
  dev_url: https://github.com/treangenlab/bronko
  doc_url: https://github.com/treangenlab/bronko/blob/main/README.md
  home: https://github.com/treangenlab/bronko
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: bronko is an ultra-rapid mapping free variant caller for viral amplicon
    sequencing data
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - rdoughty10
package:
  name: bronko
  version: 0.1.5
requirements:
  build:
  - null
  - cargo-bundle-licenses
  - null
  - make
  run:
  - kmc >=3.2
source:
  sha256: 05a7d357f103e5be19988505fa0d88e226410ccfeb8e3a03bc0bc0543c3f8b14
  url: https://github.com/treangenlab/bronko/archive/refs/tags/v0.1.5.tar.gz
test:
  commands:
  - bronko --help
