about:
  dev_url: https://github.com/treangenlab/bronko
  doc_url: https://github.com/treangenlab/bronko/blob/main/README.md
  home: https://github.com/treangenlab/bronko
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: bronko is an ultra-rapid mapping free variant caller for viral amplicon
    sequencing data
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - rdoughty10
package:
  name: bronko
  version: 0.1.4
requirements:
  build:
  - null
  - cargo-bundle-licenses
  - null
  - make
  run:
  - kmc >=3.2
source:
  sha256: ce21ff8c475ba57d7e23dc012f1ad82be0e48866ee5b84134c6070aa119bb95d
  url: https://github.com/treangenlab/bronko/archive/refs/tags/v0.1.4.tar.gz
test:
  commands:
  - bronko --help
