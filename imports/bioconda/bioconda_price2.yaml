about:
  description: 'PRICE 2 detects actively translated open reading frames based on multiple

    Ribo-seq or QTI-seq datasets. It builds on ideas from PRICE and a generative

    model for isoform deconvolution, using group-LASSO penalized Poisson

    regression over read equivalence groups.

    '
  dev_url: https://github.com/kilian-m/PRICE2
  doc_url: https://github.com/kilian-m/PRICE2/blob/main/README.md
  home: https://github.com/kilian-m/PRICE2
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Detect actively translated ORFs from multiple Ribo-seq datasets using group-LASSO
    penalized Poisson regression.
build:
  entry_points:
  - price2 = price2.price:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - kilian-m
package:
  name: price2
  version: 1.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61
  run:
  - python >=3.10
  - numpy
  - scipy
  - pandas
  - numba
  - htseq
  - pysam
  - pyfaidx
  - pebble
  - filelock
  - psutil
  - tqdm
  - matplotlib-base
  - samtools
source:
  sha256: ed7015e2a8e36309201cf1e89983d73fde6681d8f56f561426caf266fe1a65fb
  url: https://github.com/kilian-m/PRICE2/archive/refs/tags/v1.1.0.tar.gz
test:
  commands:
  - price2 --help
  imports:
  - price2
