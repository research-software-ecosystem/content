about:
  description: "Trim Galore v2 is a Rust rewrite of the original Perl Trim Galore.\
    \ A single\nstatic binary with no external dependencies \u2014 no Python, Perl,\
    \ Cutadapt,\nJava, igzip or pigz install. Adapter detection and trimming, quality\n\
    trimming, filtering and compression run in one pass over the data, with\noptional\
    \ FastQC reporting from a bundled library (fastqc-rust) afterwards;\ninput and\
    \ output can be either FASTQ or unaligned BAM. Adapter\nauto-detection covers\
    \ Illumina, Nextera, Small RNA and BGI/DNBSEQ, with\npoly-G/poly-A trimming and\
    \ RRBS support alongside. Existing v0.6.x command\nlines and output filenames\
    \ carry over, and CI checks the core flag paths\nbyte-for-byte against Perl 0.6.11.\
    \ Deliberate departures are listed in the\nmigration notes at https://www.trimgalore.com/reference/migration/.\n"
  dev_url: https://github.com/FelixKrueger/TrimGalore
  home: https://www.trimgalore.com/
  license: GPL-3.0-only
  license_family: GPL
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: "Fast adapter and quality trimming for NGS data \u2014 Oxidized Edition\
    \ (Rust)"
build:
  number: 1
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - usegalaxy-eu:trim_galore
  recipe-maintainers:
  - FelixKrueger
  - ewels
package:
  name: trim-galore
  version: 2.6.0
requirements:
  build:
  - cargo-bundle-licenses
  - null
  - null
  - null
  - make
  - pkg-config
  host:
  - zlib
source:
  sha256: 1e45c78d4bb3f2b9b9cef8c54fadc4b0bc874061091c1c67b2d4ffacd6ef86dc
  url: https://github.com/FelixKrueger/TrimGalore/archive/refs/tags/v2.6.0.tar.gz
test:
  commands:
  - which trim_galore
  - trim_galore --version
