about:
  dev_url: https://github.com/rderelle/noref
  doc_url: https://github.com/rderelle/noref/blob/0.2.0/README.md
  home: https://github.com/rderelle/noref
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: SNP-calling and recombination detection without a reference genome
build:
  number: 0
  run_exports:
  - null
  script:
  - export LDFLAGS="${LDFLAGS} -L${PREFIX}/lib"
  - export CPPFLAGS="${CPPFLAGS} -I${PREFIX}/include"
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - RUST_BACKTRACE=1 cargo install --no-track --verbose --root "${PREFIX}" --path
    .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: noref
  version: 0.2.0
requirements:
  build:
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 861cb27e7ff0ebba5d93f8ac3c4dc21163b10db1d433447a3b6a6e8bfae4b08b
  url: https://github.com/rderelle/noref/archive/0.2.0.tar.gz
test:
  commands:
  - noref -h
