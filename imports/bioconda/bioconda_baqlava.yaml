about:
  home: https://github.com/biobakery/baqlava
  license: MIT
  license_file: LICENSE
  summary: 'BAQLaVa: Bioinformatic Application of Quantification and Labeling of Viral
    Taxonomy (BAQLaVa).'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - Matt-BF
package:
  name: baqlava
  version: 1.0.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - anadama2
  - pandas
  - numpy
  - scipy
  - biopython
source:
  sha256: c9a6a9625bdb086a65a9e92ef1b280b69c499d22445a34454457f5915589e883
  url: https://pypi.org/packages/source/b/baqlava/baqlava-1.0.0.tar.gz
test:
  commands:
  - baqlava --help
  - python -c "from baqlava.utility_scripts.join_tables import main"
  - baqlava_database --help
  imports:
  - baqlava
  requires:
  - pip
  - python
