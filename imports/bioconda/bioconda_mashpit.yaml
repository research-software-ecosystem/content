about:
  dev_url: https://github.com/tongzhouxu/mashpit
  home: https://github.com/tongzhouxu/mashpit
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file: LICENSE
  summary: Sketch-based surveillance platform.
build:
  entry_points:
  - mashpit = mashpit.mashpit:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install --no-deps --no-build-isolation --no-cache-dir . -vvv
package:
  name: mashpit
  version: 1.0.0
requirements:
  host:
  - python >=3.9,<3.10
  - pip
  - setuptools
  run:
  - biopython >=1.83
  - dask-core >=2024.1
  - flask >=3.0.3
  - ncbi-datasets-cli >=16.10
  - ncbi-datasets-pylib >=16.6.0
  - numpy <2.0.0
  - python >=3.9,<3.10
  - pandas >=2.0.3
  - requests
  - scikit-bio
  - scipy >=1.0
  - screed >=1.0.5
  - sourmash >=4.6.1
  - tqdm
  - phytreeviz
  - psutil
source:
  sha256: 631ed8ef56884ce46fae5708353ce81152e96a2d8966f0bd54d6f371fb4e15f4
  url: https://github.com/tongzhouxu/mashpit/archive/refs/tags/v1.0.0.tar.gz
test:
  commands:
  - mashpit --help
