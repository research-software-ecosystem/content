about:
  dev_url: https://github.com/FofanovLab/MetaTracer
  home: https://github.com/FofanovLab/MetaTracer
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: MetaTracer metatranscriptomic analysis pipeline.
build:
  entry_points:
  - metatracer = metatracer.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - tfursten
package:
  name: metatracer
  version: 0.1.2
requirements:
  host:
  - python >=3.9
  - setuptools >=64
  - pip
  run:
  - python >3.9
  - mtsv-tools >=2.2.0
  - click >=8.1
  - biopython >=1.80
  - pysam >=0.21
  - intervaltree >=3.1
  - ete3 >=3.1
  - tqdm >=4.64
  - htslib
  - pyfaidx
  - eggnog-mapper >=2.1.14,<3
  - ncbi-datasets-cli >=18.33.1
  - unzip >=6.0
source:
  sha256: 7bd1dd37eeee3bac0627e725f9525013c4a583c1822533f3c9fee61fb120aa8f
  url: https://github.com/FofanovLab/metatracer/archive/refs/tags/0.1.2.tar.gz
test:
  commands:
  - metatracer --help
  imports:
  - metatracer
