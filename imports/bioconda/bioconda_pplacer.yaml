about:
  dev_url: https://github.com/matsen/pplacer/
  home: http://matsen.fredhutch.org/pplacer/
  license: GPL-3.0
  license_family: GPL
  summary: Pplacer places query sequences on a fixed reference phylogenetic tree to
    maximize phylogenetic likelihood or posterior probability according to a reference
    alignment.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  skip-lints:
  - uses_vcs_url
package:
  name: pplacer
  version: 1.1.alpha23
requirements:
  build:
  - make
  - null
  - null
  - ocaml =4.14.2
  - opam =2.1.3
  host:
  - zlib
  - sqlite
  - gsl
  - libcblas
  run:
  - zlib
  - sqlite
source:
- patches:
  - conda-dynamic-linking.patch
  sha256: 4671bff9cb3ac2d4120d2d0d957faadf994eadfcb1c545ae92265cb96d5b542f
  url: https://github.com/matsen/pplacer/archive/refs/tags/v1.1.alpha23.tar.gz
- depth: 1
  folder: mcl
  git_rev: 1f1932b64619e9bd9ecbcb421cb1e3f1eb535e80
  git_url: https://github.com/fhcrc/mcl
  sha256: unused
- sha256: d2502e40a95ff06b6fd4c380d682c9727b8413c157a6bfb93a87470f9d6fe9f6
  url: https://github.com/matsen/pplacer/releases/download/v1.1.alpha23/pplacer-macos-arm64.zip
test:
  commands:
  - pplacer --help > /dev/null
  - guppy to_csv --help > /dev/null
  - rppr check --help > /dev/null
