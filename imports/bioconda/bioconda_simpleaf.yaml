about:
  dev_url: https://github.com/COMBINE-lab/simpleaf
  doc_url: https://simpleaf.readthedocs.io/en/latest
  home: https://github.com/COMBINE-lab/simpleaf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A rust framework to make using alevin-fry even simpler.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: simpleaf
  version: 0.26.2
requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - cmake
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  run:
  - alevin-fry >=0.16.2
  - piscem >=0.21.1
source:
  sha256: a01f661a773ae96f7cc8ee4cc3c64afa423ee8ec65025a4222b2d9b09c226b36
  url: https://github.com/COMBINE-lab/simpleaf/archive/v0.26.2.tar.gz
test:
  commands:
  - simpleaf --help || test $? -eq 1
