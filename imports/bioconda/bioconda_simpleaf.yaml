about:
  dev_url: https://github.com/COMBINE-lab/simpleaf
  doc_url: https://simpleaf.readthedocs.io/en/latest
  home: https://github.com/COMBINE-lab/simpleaf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A rust framework to make using alevin-fry even simpler.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: simpleaf
  version: 0.30.0
requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - cmake
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  run:
  - alevin-fry >=0.18.1
  - piscem >=0.23.0
source:
  sha256: 7e908f354ece181c5a255c2a5b8d9f2eb606dd6841cf3c05eaaf979f22a93c41
  url: https://github.com/COMBINE-lab/simpleaf/archive/v0.30.0.tar.gz
test:
  commands:
  - simpleaf --help || test $? -eq 1
