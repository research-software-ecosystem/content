about:
  dev_url: https://github.com/COMBINE-lab/simpleaf
  doc_url: https://simpleaf.readthedocs.io/en/latest
  home: https://github.com/COMBINE-lab/simpleaf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A rust framework to make using alevin-fry even simpler.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: simpleaf
  version: 0.29.0
requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - cmake
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  run:
  - alevin-fry >=0.18.0
  - piscem >=0.23.0
source:
  sha256: 090079336da4694be9a917ba19e4e809d706f47b183c46a4ae3909bb1f1308ac
  url: https://github.com/COMBINE-lab/simpleaf/archive/v0.29.0.tar.gz
test:
  commands:
  - simpleaf --help || test $? -eq 1
