about:
  dev_url: https://github.com/COMBINE-lab/simpleaf
  doc_url: https://simpleaf.readthedocs.io/en/latest
  home: https://github.com/COMBINE-lab/simpleaf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A rust framework to make using alevin-fry even simpler.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: simpleaf
  version: 0.31.0
requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - cmake
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  run:
  - alevin-fry >=0.19.0
  - piscem >=0.24.0
source:
  sha256: f34d320db47e1d38a960df1b41a243159c8d76c0d55d334e1c9eed9d1f9ea628
  url: https://github.com/COMBINE-lab/simpleaf/archive/v0.31.0.tar.gz
test:
  commands:
  - simpleaf --help || test $? -eq 1
