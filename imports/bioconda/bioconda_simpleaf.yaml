about:
  dev_url: https://github.com/COMBINE-lab/simpleaf
  doc_url: https://simpleaf.readthedocs.io/en/latest
  home: https://github.com/COMBINE-lab/simpleaf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A rust framework to make using alevin-fry even simpler.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - osx-arm64
  - linux-aarch64
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: simpleaf
  version: 0.28.0
requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - cmake
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  run:
  - alevin-fry >=0.18.0
  - piscem >=0.22.1
source:
  sha256: 40c7e04850d4cc49e997c975b61b7fb3a5a0d0f827b53e72d6ea710abf16aba6
  url: https://github.com/COMBINE-lab/simpleaf/archive/v0.28.0.tar.gz
test:
  commands:
  - simpleaf --help || test $? -eq 1
