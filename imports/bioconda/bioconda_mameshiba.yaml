about:
  description: 'MameShiba provides Shiba in splicing-only mode (shiba.py --mame),
    including

    junction extraction with Tosa and beta-binomial regression with glmmTMB.

    Expression, PCA, and plotting dependencies are omitted.

    '
  dev_url: https://github.com/Sika-Zheng-Lab/Shiba
  doc_url: https://sika-zheng-lab.github.io/Shiba
  home: https://github.com/Sika-Zheng-Lab/Shiba
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Splicing-only Shiba with Tosa and beta-binomial regression
build:
  noarch: generic
  number: 1
  run_exports:
  - null
  script:
  - mkdir -p ${PREFIX}/bin
  - mkdir -p ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}
  - cp -R src scripts example shiba.py scshiba.py snakeshiba.smk snakescshiba.smk
    VERSION LICENSE environment.yml ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/
  - chmod 0755 ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/shiba.py
  - chmod 0755 ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/scshiba.py
  - ln -sf ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/shiba.py ${PREFIX}/bin/shiba.py
  - ln -sf ${PREFIX}/share/${PKG_NAME}-${PKG_VERSION}-${PKG_BUILDNUM}/scshiba.py ${PREFIX}/bin/scshiba.py
extra:
  recipe-maintainers:
  - NaotoKubota
package:
  name: mameshiba
  version: 1.0.0
requirements:
  host:
  - python 3.12.*
  run:
  - python 3.12.*
  - numpy 2.2.*
  - pandas 2.3.*
  - scipy 1.15.*
  - statsmodels 0.14.*
  - pyyaml 6.0.*
  - openpyxl 3.1.*
  - pysam 0.23.*
  - snakemake-minimal 9.13.*
  - tosa 1.0.0
  - stringtie 3.0.*
  - samtools 1.22.*
  - r-base 4.5.*
  - r-glmmtmb 1.1.13
  - r-tmb 1.9.19
  - r-jsonlite 2.0.*
source:
  sha256: 098b5c6a63501f8020b8fe266fb0d76a1e0601dea1dfd3cf466226cb567479ec
  url: https://github.com/Sika-Zheng-Lab/Shiba/archive/refs/tags/v1.0.0.tar.gz
test:
  commands:
  - shiba.py --help | grep "v1.0.0"
  - scshiba.py --help | grep "v1.0.0"
  - tosa --version | grep "1.0.0"
  - samtools --version
  - snakemake --version
  - test -s "$PREFIX/share/mameshiba-1.0.0-1/src/beta_binomial_glm.R"
  - test -d "$PREFIX/share/mameshiba-1.0.0-1/src/templates"
  - Rscript --vanilla -e 'options(warn=2); for (p in c("glmmTMB", "TMB", "jsonlite"))
    stopifnot(requireNamespace(p, quietly=TRUE))'
  imports:
  - numpy
  - pandas
  - scipy
  - statsmodels
  - yaml
  - pysam
  - openpyxl
