about:
  home: https://github.com/migshaw03/MetaAMRplus
  license: MIT
  license_file: LICENSE
  summary: 'MetaAMRplus: AMR + metal resistance + colocalisation analysis'
build:
  noarch: generic
  number: 0
  run_exports:
  - null
  script: "set -euo pipefail\n\necho \"==== MetaAMRplus build starting ====\"\necho\
    \ \"VERSION: 1.5.2\"\n\nmkdir -p \"$PREFIX/bin\"\nmkdir -p \"$PREFIX/share/metaamrplus/db\"\
    \n\n########################################\n# Install executables\n########################################\n\
    install -m 755 \"$SRC_DIR/bin/metaamrplus\" \"$PREFIX/bin/metaamrplus\"\ninstall\
    \ -m 755 \"$SRC_DIR/bin/metaamrplus_batch\" \"$PREFIX/bin/metaamrplus_batch\"\n\
    \nif [[ -f \"$SRC_DIR/bin/metaamrplus-download-db\" ]]; then\n  install -m 755\
    \ \"$SRC_DIR/bin/metaamrplus-download-db\" \"$PREFIX/bin/metaamrplus-download-db\"\
    \nfi\n\n########################################\n# Annotation script\n########################################\n\
    install -m 755 \"$SRC_DIR/bin/annotate_metaamrplus.py\" \\\n  \"$PREFIX/bin/annotate_metaamrplus.py\"\
    \n\n########################################\n# Database\n########################################\n\
    DB_DIR=\"$SRC_DIR/db\"\n\ncp \"$DB_DIR\"/MetaAMRplus_DB_v1.0.* \"$PREFIX/share/metaamrplus/db/\"\
    \ || true\n\nif [[ -f \"$DB_DIR/MetaAMRplus_v1.0.idmap.tsv\" ]]; then\n  cp \"\
    $DB_DIR/MetaAMRplus_v1.0.idmap.tsv\" \"$PREFIX/share/metaamrplus/db/\"\nfi\n\n\
    ########################################\n# Permissions\n########################################\n\
    chmod +x \"$PREFIX/bin/metaamrplus\"\nchmod +x \"$PREFIX/bin/metaamrplus_batch\"\
    \nchmod +x \"$PREFIX/bin/annotate_metaamrplus.py\"\n\necho \"==== Build completed\
    \ successfully ====\"\n"
extra:
  recipe-maintainers:
  - migshaw03
package:
  name: metaamrplus
  version: 1.5.2
requirements:
  build:
  - bash
  - coreutils
  host:
  - python >=3.8
  run:
  - python >=3.8
  - bash
  - coreutils
  - gawk
  - blast
  - prodigal
source:
  sha256: 5955962ed4534b4e210f17c26309f2548a8355d1bd3dd9aaadb9543e78bd4a82
  url: https://github.com/migshaw03/MetaAMRplus/archive/refs/tags/v1.5.2.tar.gz
test:
  commands:
  - metaamrplus --help
