about:
  home: https://github.com/EIDOSlab/torchstain
  license: MIT
  license_file: LICENSE
  summary: Stain normalization tools for histological analysis and computational pathology
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - dianichj
package:
  name: torchstain
  version: 1.4.1
requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  - wheel
  run:
  - python >=3.6
  - numpy
source:
  sha256: 6469c29d7dd8e231aff4bd76d23b138cd2ac97cc81128c979ec2d3468641ecdc
  url: https://files.pythonhosted.org/packages/source/t/torchstain/torchstain-1.4.1.tar.gz
test:
  commands:
  - pip check
  - python -c "from torchstain.base.normalizers import MacenkoNormalizer, ReinhardNormalizer;
    MacenkoNormalizer(backend='numpy'); ReinhardNormalizer(backend='numpy')"
  imports:
  - torchstain
  - torchstain.numpy
  requires:
  - pip
