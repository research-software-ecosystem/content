about:
  description: "A columnar, randomly-accessible compressed format for single-base\n\
    cytosine methylation data, with a fast in-process htslib pileup\nbackend for BAM\
    \ \u2192 cz conversion.\n"
  dev_url: https://github.com/DingWB/cytozip
  doc_url: https://dingwb.github.io/cytozip
  home: https://github.com/DingWB/cytozip
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'cytozip: Chunk-based ZIP for cytosine (methylation) data'
build:
  entry_points:
  - czip = cytozip:main
  number: 0
  run_exports:
  - null
  script: "# htslib is guaranteed present in ``host:`` requirements below, so\n# force\
    \ setup.py to build the ``cytozip._bam_pileup`` extension even\n# if the auto-detection\
    \ based on ``$PREFIX`` / ``$CONDA_PREFIX``\n# misses the header path for any reason.\
    \ Without this, the ``test:``\n# phase fails with ``ModuleNotFoundError: cytozip._bam_pileup``.\n\
    export CYTOZIP_FORCE_HTSLIB=1\n -m pip install . --no-deps --no-build-isolation\
    \ -vv\n"
  skip: true
extra:
  recipe-maintainers:
  - DingWB
package:
  name: cytozip
  version: 0.3.8
requirements:
  build:
  - null
  - null
  - make
  host:
  - python
  - pip
  - setuptools >=61
  - setuptools_scm
  - cython >=3.0
  - numpy >=2.0
  - htslib
  - libdeflate
  - zlib
  run:
  - python
  - numpy >=1.19
  - pandas
  - loguru
  - pysam
  - samtools
  - fsspec
  - requests
  - anndata
  - scipy
  - biopython
  - htslib
  - libdeflate
  - zlib
source:
  sha256: f4d5f0d3c2d786fcb294c09af3f7d6edd493cbcb86fe6152507893a41698a55a
  url: https://pypi.io/packages/source/c/cytozip/cytozip-0.3.8.tar.gz
test:
  commands:
  - czip --help
  imports:
  - cytozip
  - cytozip.cz_accel
  - cytozip._bam_pileup
