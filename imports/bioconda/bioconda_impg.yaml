about:
  dev_url: https://github.com/pangenome/impg
  doc_url: https://github.com/pangenome/impg/blob/v0.5.0/README.md
  home: https://github.com/pangenome/impg
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'impg: implicit pangenome graphs.'
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - AndreaGuarracino
package:
  name: impg
  version: 0.5.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - gfortran_osx-arm64
  - gfortran_osx-64
  - make
  - cmake
  - cargo-bundle-licenses
  - pkg-config
  - clangdev
  host:
  - llvm-openmp
  - zlib
  - zstd
  - bzip2
  - xz
  - libcurl
  - htslib
  - gsl
  - jemalloc
source:
  sha256: 7b56ccb20159e33ec5645b29648cf2f81734c700a664170bd5ece0c96612cfb7
  url: https://github.com/pangenome/impg/releases/download/v0.5.0/impg-v0.5.0.tar.gz
test:
  commands:
  - impg --help
  - impg --version
  - $PREFIX/libexec/impg/gfaffix --help
  - $PREFIX/libexec/impg/wfmash --version
  - $PREFIX/libexec/impg/FastGA 2>&1 | grep -qE "Usage.*FastGA"
  - $PREFIX/libexec/impg/FAtoGDB 2>&1 | grep -qE "Usage.*FAtoGDB"
  - $PREFIX/libexec/impg/GIXmake 2>&1 | grep -qE "Usage.*GIXmake"
  - $PREFIX/libexec/impg/GIXrm 2>&1 | grep -qE "Usage.*GIXrm"
  - $PREFIX/libexec/impg/ALNtoPAF 2>&1 | grep -qE "Usage.*ALNtoPAF"
  - $PREFIX/libexec/impg/PAFtoALN 2>&1 | grep -qE "Usage.*PAFtoALN"
  - $PREFIX/libexec/impg/ONEview 2>&1 | grep -q ONEview
