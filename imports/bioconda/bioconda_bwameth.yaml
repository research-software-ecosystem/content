about:
  dev_url: https://github.com/brentp/bwa-meth
  home: https://github.com/brentp/bwa-meth
  license: MIT
  license_family: MIT
  summary: A fast and accurate aligner of BS-seq reads.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir --use-pep517
    -vvv
extra:
  identifiers:
  - usegalaxy-eu:bwameth
package:
  name: bwameth
  version: 0.2.10
requirements:
  host:
  - python
  - pip
  - setuptools <82
  - toolshed >=0.3.9
  run:
  - python
  - toolshed >=0.3.9
  - bwa
  - bwa-mem2
  - samtools
source:
  sha256: 08c8c43146df81d293667336b1152cc645eefc69b3d0d7cd092f548ebed93378
  url: https://github.com/brentp/bwa-meth/archive/v0.2.10.tar.gz
test:
  commands:
  - bwameth.py --version
  - samtools --help
