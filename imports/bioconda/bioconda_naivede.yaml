about:
  description: 'NaiveDE is a Python package that implements a simple differential
    expression (DE) test based on likelihood ratio tests.

    It is designed to be easy to use and integrate into existing workflows for analyzing
    gene expression data.

    '
  dev_url: https://github.com/Teichlab/NaiveDE
  home: https://github.com/Teichlab/NaiveDE
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: The most trivial DE test based on likelihood ratio tests
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - nilchia
package:
  name: naivede
  version: 1.3.1
requirements:
  host:
  - python
  - pip
  - setuptools
  run:
  - python
  - numpy
  - scipy
  - pandas
  - tqdm
  - patsy
  - matplotlib-base
source:
  sha256: 0702c44fa6196d4a43493cbaf0e4e1a1e35261bb12f06ea37ada8bdcf145ec81
  url: https://github.com/Teichlab/NaiveDE/archive/34899669cc210fad62f28243432dc5ecf8697764.tar.gz
test:
  commands:
  - pip check
  imports:
  - NaiveDE
  requires:
  - pip
  - python
