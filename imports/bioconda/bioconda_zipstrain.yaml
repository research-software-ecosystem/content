about:
  dev_url: https://github.com/OlmLab/ZipStrain
  home: https://github.com/OlmLab/ZipStrain
  license: MIT
  license_family: MIT
  summary: Fast strain-level metagenomics
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --ignore-installed -vv
package:
  name: zipstrain
  version: 1.2.0
requirements:
  host:
  - python >=3.12
  - poetry-core
  - pip
  run:
  - python >=3.12
  - samtools
  - click
  - polars
  - plotly
  - numpy
  - seaborn
  - scipy
  - pyarrow
  - aiofiles
  - pydantic >=2,<3
  - rich
  - psutil
  - duckdb
  - pandas
  - matplotlib-base
  - h5py
  - pytorch
source:
  sha256: 8d80b751972b06c875c873e24e0ad60963f78f72dd1601cca0d581d88c16a4ad
  url: https://pypi.io/packages/source/z/zipstrain/zipstrain-1.2.0.tar.gz
test:
  commands:
  - zipstrain --help
  - samtools --version
  - zipstrain compare --help
  - zipstrain utilities --help
  imports:
  - zipstrain
