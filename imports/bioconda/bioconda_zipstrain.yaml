about:
  dev_url: https://github.com/OlmLab/ZipStrain
  home: https://github.com/OlmLab/ZipStrain
  license: MIT
  license_family: MIT
  summary: Fast strain-level metagenomics
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --ignore-installed -vv
package:
  name: zipstrain
  version: 1.0.3
requirements:
  host:
  - python >=3.12
  - poetry-core
  - pip
  run:
  - python >=3.12
  - samtools
  - click
  - polars
  - plotly
  - numpy
  - seaborn
  - scipy
  - pyarrow
  - aiofiles
  - pydantic >=2,<3
  - rich
  - psutil
  - duckdb
  - pandas
  - matplotlib-base
  - h5py
  - pytorch
source:
  sha256: beb6a8615a136500704d7e198fbdf2c162ae80764e1160ad6b2e9ea8e6cc0580
  url: https://pypi.io/packages/source/z/zipstrain/zipstrain-1.0.3.tar.gz
test:
  commands:
  - zipstrain --help
  - samtools --version
  - zipstrain compare --help
  - zipstrain utilities --help
  imports:
  - zipstrain
