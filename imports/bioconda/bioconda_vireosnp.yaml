about:
  dev_url: https://github.com/huangyh09/vireoSNP
  doc_url: https://vireosnp.readthedocs.io/en/latest
  home: https://github.com/huangyh09/vireoSNP
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: vireoSNP - donor deconvolution for multiplexed scRNA-seq data.
build:
  entry_points:
  - vireo = vireoSNP.vireo:main
  - GTbarcode = vireoSNP.GTbarcode:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
package:
  name: vireosnp
  version: 0.5.10
requirements:
  host:
  - python
  - pip
  - setuptools
  run:
  - python
  - numpy >=1.9.0
  - scipy >=1.4.0
  - matplotlib-base
source:
  sha256: 930c32776e9785ef900fc3a809ade336c29c0b6c4b92196caf1f5fcfc71b6ee6
  url: https://pypi.org/packages/source/v/vireoSNP/vireosnp-0.5.10.tar.gz
test:
  commands:
  - vireo --help
  - GTbarcode --help
  imports:
  - vireoSNP
