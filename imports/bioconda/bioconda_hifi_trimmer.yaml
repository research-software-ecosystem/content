about:
  home: https://github.com/sanger-tol/hifi-trimmer
  license: MIT
  license_file: LICENSE
  summary: hifi-trimmer is a tool for filtering and trimming extraneous adapter hits
    from a HiFi read set using a BLAST search.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - prototaxites
package:
  name: hifi_trimmer
  version: 5.0.1
requirements:
  host:
  - python >=3.10
  - hatchling
  - pip
  run:
  - python >=3.10
  - py-bgzip >=0.5.1
  - click >=8.1.8
  - polars <=1.22.0
  - pyfastx >=2.3.1
  - pysam >=0.24.0
  - pyyaml >=6.0.2
  - loguru >=0.7.3
source:
  sha256: 5a5e545ce8fe02dee508517259de6b2b68e5bed7772ccc3942b5a85301ecdae6
  url: https://pypi.org/packages/source/h/hifi_trimmer/hifi_trimmer-5.0.1.tar.gz
test:
  commands:
  - pip check
  - hifi-trimmer --help
  imports:
  - hifi_trimmer
  requires:
  - pip
