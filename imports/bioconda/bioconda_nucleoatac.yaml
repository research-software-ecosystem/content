about:
  description: 'NucleoATAC calls nucleosome positions from ATAC-seq data and provides

    helper utilities for paired-end ATAC-seq signal processing. This recipe

    packages the Python 3 modernization fork used by nf-core/atacportray.

    '
  dev_url: https://github.com/alecethell/NucleoATAC/tree/py311-modernization
  doc_url: https://nucleoatac.readthedocs.io
  home: https://github.com/GreenleafLab/NucleoATAC
  license: MIT
  license_family: MIT
  summary: Nucleosome calling from ATAC-seq data.
build:
  entry_points:
  - nucleoatac = nucleoatac.cli:main
  - pyatac = pyatac.cli:main
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1101/gr.192294.115
  recipe-maintainers:
  - PFRoux
package:
  name: nucleoatac
  version: 1.0.0
requirements:
  build:
  - null
  - null
  host:
  - python
  - pip
  - setuptools >=68
  - cython <3
  - numpy >=1.23,<2
  - pysam >=0.19,<0.21
  - pysam
  - htslib
  run:
  - python
  - numpy
  - scipy >=1.9
  - pysam
  - htslib
  - matplotlib-base >=3.5
  - samtools >=1.18
source:
  patches:
  - add-console-script-main-wrappers.patch
  - relax-pyproject-requirements.patch
  - relax-setup-requirements.patch
  sha256: 2bf6f790b294cf119d8c2f5d63ce09519ab9362328ded55ae8387c347ed68f85
  url: https://github.com/alecethell/NucleoATAC/archive/22edcd0d026845c94013e12e5c550a17842edb7f.tar.gz
test:
  commands:
  - nucleoatac --help
  - nucleoatac run --help
  - pyatac --help
  imports:
  - nucleoatac
  - pyatac
  - pyatac.fragments
  - nucleoatac.multinomial_cov
