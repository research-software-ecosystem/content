about:
  home: https://github.com/genialis/RNAnorm
  license: Apache-2.0
  license_file: LICENSE
  summary: Common RNA-seq normalization methods
build:
  entry_points:
  - rnanorm = rnanorm.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - VinzentRisch
package:
  name: rnanorm
  version: 2.3.0
requirements:
  host:
  - python >=3.9,<3.14
  - setuptools >=64.0.0
  - setuptools-scm >=6.4.0
  - pip
  run:
  - python >=3.9,<3.14
  - click
  - numpy >=1.0.0
  - pandas >=1.0.0
  - scikit-learn >=1.6.0
  - pandera
source:
  sha256: 0cb25c2c31aa77c8fe8263b09dff5f96690a4b90c7ac0ebce9a905f0b102440e
  url: https://pypi.org/packages/source/r/rnanorm/rnanorm-2.3.0.tar.gz
test:
  commands:
  - pip check
  - rnanorm --help
  imports:
  - rnanorm
  requires:
  - pip
