about:
  dev_url: https://github.com/gamcil/cblaster
  doc_url: https://cblaster.readthedocs.io/en/latest/
  home: https://github.com/gamcil/cblaster
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Find clustered hits from a BLAST search.
build:
  entry_points:
  - cblaster=cblaster.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
package:
  name: cblaster
  version: 1.4.2
requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  run:
  - python >=3.6
  - appdirs
  - biopython
  - clinker-py >=0.0.15
  - gffutils
  - numpy
  - pysimplegui
  - requests
  - scipy
  - diamond
  - defusedxml
source:
  sha256: dcc5d5544e50ead0b05b66be52fdae80f90fdbb2fc220d0d39f7ac35a7549177
  url: https://pypi.io/packages/source/c/cblaster/cblaster-1.4.2.tar.gz
test:
  commands:
  - cblaster --help
  imports:
  - cblaster
  - cblaster.gui
  - tests
  requires:
  - pytest
  - pytest-cov
  - pytest-mock
  - requests-mock
