about:
  home: https://github.com/bionetslab/scxmatch
  license: MIT
  license_file: LICENSE
  summary: Python implementation for single-cell cross match test, an efficient implementation
    of Rosenbaum's test.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - annmoel
package:
  name: scxmatch
  version: 1.0.1
requirements:
  build:
  - python >=3.10
  host:
  - python >=3.10
  - hatchling
  - pip
  run:
  - python >=3.10
  - anndata >=0.10.9
  - scanpy >=1.10.3,<2
  - scipy >=1.13.1,<2
  - graph-tool >=2.92,<3
source:
  sha256: b5df0f2e09025136f3111659797c2599c0288820c5ebd40c6167242716eb60c6
  url: https://github.com/bionetslab/scxmatch/releases/download/scxmatch-1.0.1/scxmatch-1.0.1.tar.gz
test:
  imports:
  - scxmatch
