about:
  dev_url: https://github.com/sunericd/TISSUE
  doc_url: https://github.com/sunericd/TISSUE#tissue-tutorials
  home: https://github.com/sunericd/TISSUE
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Uncertainty-calibrated prediction of single-cell spatial transcriptomics.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
package:
  name: tissue-sc
  version: 1.0.1
requirements:
  host:
  - python >=3.8
  - pip
  - flit-core >=3.2,<4
  run:
  - python >=3.8
  - anndata
  - matplotlib-base
  - numpy
  - pandas
  - scanpy
  - scikit-image
  - scikit-learn
  - scipy
  - squidpy >=1.2.3
source:
  sha256: 07195fdd1c502f05e7c56d46e9d421fbab94119a74166c8be5a9c9ec2d71c556
  url: https://pypi.org/packages/source/t/tissue-sc/tissue_sc-1.0.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - tissue
  - tissue.main
  - tissue.downstream
  - tissue.experiments
  - tissue.utils
  - tissue.SpaGE.main
  requires:
  - pip
