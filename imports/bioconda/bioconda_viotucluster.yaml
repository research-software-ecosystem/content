about:
  dev_url: https://github.com/liusihang/ViOTUcluster
  doc_url: https://github.com/liusihang/ViOTUcluster/blob/master/README.md
  home: https://github.com/liusihang/ViOTUcluster
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE
  summary: High-speed all-in-one viromics analysis pipeline for metagenomic data.
build:
  entry_points:
  - ViOTUcluster=ViOTUcluster.viotucluster_cli:main
  - ViOTUcluster_AllinOne=ViOTUcluster.viotucluster_allinone_cli:main
  noarch: generic
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.1002/imo2.70023
package:
  name: viotucluster
  version: 0.7.0
requirements:
  host:
  - python >=3.10,<3.11
  - pip
  - setuptools
  run:
  - python >=3.10,<3.11
  - biopython >=1.79
  - pandas >=1.3
  - numpy
  - packaging
  - fastp
  - megahit
  - spades
  - viralverify
  - virsorter =2.2.4
  - genomad =1.8.0
  - checkv =1.0.3
  - drep =3.5.0
  - vrhyme
  - bwa
  - sambamba
  - coverm
  - blast
  - parallel
source:
  sha256: 1119f3d76152b5005ca4f66ff7a3104c62f5fd4186bb72fcda8c96b6a8a2f7f7
  url: https://github.com/liusihang/ViOTUcluster/archive/refs/tags/v0.7.0.tar.gz
test:
  commands:
  - ViOTUcluster --help
  - ViOTUcluster_AllinOne --help
  - python -c "import ViOTUcluster"
  imports:
  - ViOTUcluster
