about:
  description: 'BrucellaID reads a fastq sample, compares it with MASH to 429 curated
    Brucella reference genomes

    covering all 30 named species of the clade to name the species and the closest
    reference, and calls the

    nine alleles of the Whatmore MLST scheme with Seal from

    BBTools to give the sequence type. It takes single-end or paired-end reads, or
    a folder of samples, and

    writes a table per sample, a table per locus, every MASH distance, a JSON report,
    a MultiQC file and a

    self-contained HTML quality assurance report holding the evidence behind every
    call. Where two species

    are too close for the distance to separate them, the sequence type decides. The
    reference sketch and

    the MLST database are shipped with the package.

    '
  dev_url: https://github.com/duceppemo/BrucellaID
  doc_url: https://github.com/duceppemo/BrucellaID/wiki
  home: https://github.com/duceppemo/BrucellaID
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Identify the Brucella species of a read set with MASH, and type it with
    MLST
build:
  entry_points:
  - brucellaid = brucellaid.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: brucellaid
  version: 2.2.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10
  - mash >=2.3
  - bbmap >=38.0
  - xlsxwriter >=3
  - reportlab >=4
source:
  sha256: 1232b5d865b4313a291fb411a5c846f339389a2c1428700c531b3bfa97d95490
  url: https://github.com/duceppemo/BrucellaID/archive/refs/tags/v2.2.0.tar.gz
test:
  commands:
  - brucellaid --version
  - brucellaid --help
  - mash --version
  - seal.sh --version
  - python -c "from brucellaid.references import load_references; assert len(load_references())
    == 429"
  - python -c "from brucellaid.references import VSNP_REFERENCES_FILE, data_path,
    load_references; assert len(load_references(data_path(VSNP_REFERENCES_FILE)))
    == 16"
  - python -c "from brucellaid.mlst import load_profiles; assert len(load_profiles()[1])
    == 122"
  - python -c "s = ''.join('ACGT'[(i*i+3*i+1)%4] for i in range(150)); r = '@r\n'
    + s + '\n+\n' + 'I'*len(s) + '\n'; open('reads.fastq','w').write(r+r)"
  - brucellaid -r1 reads.fastq -o test_out -s test --pdf
  - test -s test_out/brucellaid.json
  - test -s test_out/brucellaid_report.html
  - test -s test_out/brucellaid_mqc.json
  - test -s test_out/brucellaid_report.pdf
  - python -c "assert '<!doctype html>' in open('test_out/brucellaid_report.html').read()"
  - python -c "import json; s = json.load(open('test_out/brucellaid.json'))['samples'][0];
    assert s['identified'] is False, s"
  - rm -rf test_out reads.fastq
  imports:
  - brucellaid
