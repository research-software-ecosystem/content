about:
  description: 'AKmerGWAS is a k-mer based genome-wide association study pipeline
    that

    accepts any input format (short reads, assemblies, whole genomes). It counts

    k-mers with kmtricks, turns the presence/absence matrix into PLINK bed chunks,

    runs GEMMA association per chunk and trait, and maps significant k-mers back

    to reference genomes with bowtie or bwa. Version 1.0.0 is a pure-Python

    (standard-library-only) rewrite of the original Snakemake workflow.

    '
  dev_url: https://github.com/suzkami/AKmerGWAS
  home: https://github.com/suzkami/AKmerGWAS
  license: MIT
  license_file: LICENSE
  summary: AKmerGWAS -- k-mer GWAS for any input format (short reads, assemblies,
    genomes).
build:
  entry_points:
  - akgwas = akgwas.cli:main
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - suzkami
package:
  name: akgwas
  version: 1.0.0
requirements:
  host:
  - python >=3.11,<3.14
  - pip
  - setuptools
  run:
  - python >=3.11,<3.14
  - kmtricks
  - gemma
  - plink
  - bowtie
  - bwa
source:
  sha256: 1135d16c6d6fa09f89654f6799f1dfc4d8c61a0f75a652c9acf7f748f07ea172
  url: https://github.com/suzkami/AKmerGWAS/releases/download/v1.0.0/akgwas-1.0.0.tar.gz
test:
  commands:
  - akgwas --version
  - akgwas --help
  - akgwas --errors
  imports:
  - akgwas
  - akgwas.stages
