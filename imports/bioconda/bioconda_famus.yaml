about:
  description: "FAMUS is a supervised contrastive learning (supcon) based framework\
    \ that annotates \nprotein sequences with function using pre-trained models or\
    \ custom training.\nFor GPU (CUDA) support, see the installation notes in the\
    \ README.\n"
  dev_url: https://github.com/burstein-lab/famus
  doc_url: https://github.com/burstein-lab/famus
  home: https://github.com/burstein-lab/famus
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Functional Annotation Method Using Supervised contrastive learning
build:
  entry_points:
  - famus-train = famus.cli.train:main
  - famus-classify = famus.cli.classify:main
  - famus-convert-sdf = famus.cli.convert_sdf:main
  - famus-install = famus.cli.install_models:main
  - famus-defaults = famus.config:main
  noarch: generic
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - guyshur
package:
  name: famus
  version: 0.2.4
requirements:
  host:
  - python >=3.11,<3.13
  - pip
  - setuptools >=45
  - wheel
  run:
  - python >=3.11,<3.13
  - numpy >=1.26.4,<2.0
  - pandas >=2.2.3
  - scikit-learn >=1.3.0
  - scipy >=1.10.0
  - biopython >=1.76
  - tqdm >=4.66.2
  - matplotlib-base >=3.7.0
  - seaborn >=0.13.2
  - pyyaml >=5.0
  - pytorch >=2.0
  - hmmer
  - mafft
  - seqkit
  - mmseqs2
source:
  sha256: 10395cc36b57ea7d338d596d6b131bd1e8a6ee6732ff02434b8f1d6ce4672e45
  url: https://github.com/burstein-lab/famus/archive/refs/tags/v0.2.4.tar.gz
test:
  commands:
  - famus-train --help
  - famus-classify --help
  - famus-convert-sdf --help
  - famus-install --help
  - famus-defaults
  - python -c "import torch, famus.model; out = famus.model.MLP(4, 8)(torch.zeros(2,
    4)); assert tuple(out.shape) == (2, 8)"
  - which hmmsearch
  - which mafft
  - which mmseqs
  - which seqkit
  imports:
  - famus
  - famus.cli
  - famus.classification
  - famus.data_preprocessing
  - famus.model
  - famus.sdf
  - famus.train
