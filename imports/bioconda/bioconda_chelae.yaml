about:
  dev_url: https://github.com/fulcrumgenomics/chelae
  doc_url: https://github.com/fulcrumgenomics/chelae/blob/v0.2.1/README.md
  home: https://github.com/fulcrumgenomics/chelae
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: A toolkit for trimming and filtering FASTQ reads.
build:
  binary_relocation: false
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install --locked --version '>=0.12.0' cargo-multivers
  - cargo multivers --profile dist --out-dir "${PREFIX}/bin"
  - cargo install --no-track --locked --profile dist --root "${PREFIX}" --path .
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - nh13
  - tfenne
package:
  name: chelae
  version: 0.2.1
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 15cc3698880de2affbe713abe695b39fd0061c4a0ae80eff21abb30c1331600f
  url: https://github.com/fulcrumgenomics/chelae/archive/v0.2.1.tar.gz
test:
  commands:
  - chelae --help
