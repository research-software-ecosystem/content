about:
  dev_url: https://github.com/COMBINE-lab/QCatch
  home: https://github.com/COMBINE-lab/QCatch
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'QCatch: Quality Control downstream of alevin-fry / simpleaf.'
build:
  entry_points:
  - qcatch = qcatch.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - ygao61
package:
  name: qcatch
  version: 0.2.14
requirements:
  host:
  - python ==3.12.9
  - hatchling
  - pip
  run:
  - python ==3.12.9
  - numpy ==2.1.3
  - scipy ==1.15.2
  - pandas ==2.2.3
  - beautifulsoup4 ==4.13.3
  - pyroe ==0.9.0
  - scanpy ==1.10.4
  - plotly ==6.0.0
  - python-igraph ==0.11.8
  - requests
  - hdf5plugin >=4
source:
  sha256: 0dbb13452436bbcc69903da95206eebbfa272a516e0f83e002c96c519d031e38
  url: https://pypi.org/packages/source/q/qcatch/qcatch-0.2.14.tar.gz
test:
  commands:
  - qcatch --help
  - python -c "import hdf5plugin; import h5py; assert h5py.h5z.filter_avail(32001)"
  files:
  - test_hdf5_compression.py
  imports:
  - qcatch
  requires:
  - pytest
