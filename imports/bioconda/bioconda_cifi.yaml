about:
  dev_url: https://github.com/mr-eyes/cifi-toolkit
  home: https://github.com/mr-eyes/cifi-toolkit
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: CiFi - toolkit for downstream processing of CiFi long reads.
build:
  entry_points:
  - cifi = cifi.cli:main
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - mr-eyes
package:
  name: cifi
  version: 1.1.0
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.15
  - make
  - pkg-config
  host:
  - python
  - pip
  - setuptools
  - scikit-build-core >=0.4.3
  - nanobind >=1.3.2
  - htslib
  - zlib
  run:
  - python
  - click >=8.0
  - jinja2 >=3.0
  - htslib
source:
  sha256: fd4e6c140392c6722052e0e2c9b974fc3fb8f826e5c1ea5e00e2413cb16ba46a
  url: https://pypi.org/packages/source/c/cifi/cifi-1.1.0.tar.gz
test:
  commands:
  - cifi --help
  - cifi enzymes
  imports:
  - cifi
