about:
  description: 'nuclease is a fast and resource-frugal sequencing read preprocessor.
    It streams

    local or ENA FASTQ through a processing plan and emits cleaned FASTQ/FASTA for

    downstream tools.

    '
  dev_url: https://github.com/nrminor/nuclease
  doc_url: https://github.com/nrminor/nuclease/blob/v0.6.3/README.md
  home: https://github.com/nrminor/nuclease
  license: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Streaming FASTQ preprocessor for trimming, merging, filtering, and more.
build:
  number: 0
  run_exports:
  - null
  script:
  - export CARGO_INCREMENTAL=0
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  - cargo install -v --locked --no-track --root $PREFIX --path . --bin nuclease
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - nrminor
package:
  name: nuclease
  version: 0.6.3
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
source:
  sha256: 7182e03e1748660053c6dc7a6e5180600e3d23e72e4c05149d4f012d05c58674
  url: https://github.com/nrminor/nuclease/archive/refs/tags/v0.6.3.tar.gz
test:
  commands:
  - nuclease --version
  - nuclease --help
