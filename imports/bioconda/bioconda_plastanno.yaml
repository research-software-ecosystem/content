about:
  description: 'Plastanno v2 annotates chloroplast genomes by merging two independent
    engines

    (Exonerate protein2genome + profile HMMs) in a confidence-scored reconciliation

    layer, flagging low-confidence loci for review. The reference database (~266 MB)

    is downloaded separately via `plastanno fetch-db`.

    '
  dev_url: https://github.com/maidinhvn/plastanno
  home: https://github.com/maidinhvn/plastanno
  license: MIT
  license_file: LICENSE
  summary: Dual-evidence, confidence-aware plastid genome (plastome) annotation pipeline
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - maidinhvn
package:
  name: plastanno
  version: 2.0.4
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  run:
  - python >=3.9
  - biopython
  - pandas
  - matplotlib-base
  - platformdirs
  - blast
  - exonerate
  - hmmer
  - aragorn
  - trnascan-se
source:
  sha256: bb6e2b1138f297c30d14ed2c0f903a9e89bca84da55ccec83893f3daa98beb24
  url: https://github.com/maidinhvn/plastanno/archive/refs/tags/v2.0.4.tar.gz
test:
  commands:
  - plastanno --help
  imports:
  - plastanno
