about:
  description: 'MolPACD designs, adds, analyzes and removes molecular aperture caps
    in

    protein structures (PDB and mmCIF), and removes lipids packed inside

    protein cavities.

    '
  dev_url: https://github.com/BlankenbergLab/molpacd
  home: https://github.com/BlankenbergLab/molpacd
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Molecular Pore Aperture Cap Designer
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - jaidevjoshi83
package:
  name: molpacd
  version: 0.3.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=68
  - wheel
  run:
  - python >=3.9
  - biopython >=1.80
  - numpy >=1.21,<2.5
source:
  sha256: 82408e123905790d3630f93040e66dcfa6210eaadcf2be3adc718354bd3af081
  url: https://pypi.io/packages/source/m/molpacd/molpacd-0.3.0.tar.gz
test:
  commands:
  - molpacd --help
  imports:
  - molpacd
