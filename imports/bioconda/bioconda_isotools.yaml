about:
  dev_url: https://github.com/HerwigLab/IsoTools2
  doc_url: https://isotools.readthedocs.io/en/latest
  home: https://github.com/HerwigLab/IsoTools2
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Framework for the analysis of long read transcriptome sequencing data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  identifiers:
  - doi:10.1093/bioinformatics/btad364
  - doi:10.1016/j.jmb.2025.169049
  recipe-maintainers:
  - kbseah
package:
  name: isotools
  version: 2.2.0
requirements:
  host:
  - python >=3.10
  - setuptools >=77.0.3
  - pip
  run:
  - python >=3.10
  - numpy
  - pandas
  - tqdm
  - intervaltree
  - matplotlib-base
  - seaborn-base
  - biopython
  - pysam
  - umap-learn
  - scikit-learn
  - scipy
  - statsmodels
  - pyhmmer
  - requests
  - cpat >=3.0
  - python-ternary
source:
  sha256: 3569eab9ca9517a803073cea54c2790a5ab9ae422490ced606dcaac0e347ad99
  url: https://pypi.org/packages/source/i/isotools/isotools-2.2.0.tar.gz
test:
  commands:
  - run_isotools --help
  imports:
  - isotools
