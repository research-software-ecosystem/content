  home: https://docs.rastair.com
  license: LicenseRef-NonCommercial
  license_file:
  - LICENSE.txt
  - THIRDPARTY.yml
  summary: Fast and flexible extraction of methylation information from BAM files.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - ze97286
package:
  name: rastair
  version: 2.2.0
requirements:
  build:
  - null
  - null
  - null
  - null
  - make
  - cmake
  - pkg-config
  - clang
  - libclang
  - cargo-bundle-licenses
  host:
  - bzip2
  - xz
  - zlib
  run:
  - bzip2
  - r-base
  - r-argparser
  - r-rmarkdown
  - r-data.table
  - r-ggplot2
  - r-ggside
  - bioconductor-rsamtools
  - bioconductor-genomicranges
  - bioconductor-biostrings
  - bcftools
  - pandoc
source:
  sha256: 739e0e4080a4c56ed10cf9b39e8793b2b8ab8e37773d363cba31c9e17eaf3137
  url: https://github.com/bsbludwig/rastair/releases/download/v2.2.0/rastair-2.2.0-vendored.tar.gz
test:
