about:
  dev_url: https://github.com/baoxingsong/AnchorWave
  doc_url: https://github.com/baoxingsong/AnchorWave/blob/v1.3.1/README.md
  home: https://github.com/baoxingsong/AnchorWave
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Sensitive alignment of genomes with high sequence diversity, extensive
    structural polymorphism, and whole-genome duplication variation.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: anchorwave
  version: 1.3.1
requirements:
  build:
  - null
  - null
  - null
  - ninja
  - cmake >=3.10
  - pkg-config
  host:
  - llvm-openmp
  - libgomp
  - zlib
  run:
  - llvm-openmp
  - libgomp
  - gmap
  - minimap2
source:
  sha256: 2288de8ba58dea3e944b51c92c840f4634bec32ff6e8112ecaa14c546af3e780
  url: https://github.com/baoxingsong/AnchorWave/archive/refs/tags/v1.3.1.tar.gz
test:
  commands:
  - anchorwave --version | grep -F "anchorwave v1.3.1"
  - 'anchorwave --help 2>&1 | grep -F "Usage: anchorwave"'
  - 'anchorwave genoAli -h 2>&1 | grep -F "fa3^2 (default: 50000)"'
  - printf "%s\n" ">reference" "ACGTACGT" > reference.fa
  - printf "%s\n" ">query" "ACGTTCGT" > query.fa
  - anchorwave ali -r reference.fa -s query.fa > alignment.fa
  - test "$(grep -c '^>' alignment.fa)" -eq 2
