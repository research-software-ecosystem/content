about:
  dev_url: https://github.com/caixudong2001/PhytoReg
  doc_url: https://github.com/caixudong2001/PhytoReg/blob/main/docs/inference.md
  home: https://github.com/caixudong2001/PhytoReg
  license: MIT
  license_file: LICENSE
  summary: Predict plant regulatory activity from DNA sequences
build:
  entry_points:
  - phytoreg = phytoreg.cli:main
  - phytoreg-inspect = phytoreg.cli:inspect_main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vv
extra:
  recipe-maintainers:
  - caixudong2001
package:
  name: phytoreg
  version: 1.0.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  - wheel
  run:
  - python >=3.10
  - numpy >=1.24
  - pytorch >=2.1
source:
  sha256: 4a8cb891d026a0016df23cb0863ad34ca9fbdf28a6ae4c5da0436a597d6ce99a
  url: https://github.com/caixudong2001/PhytoReg/releases/download/v1.0.1/phytoreg-1.0.1.tar.gz
test:
  commands:
  - phytoreg --help
  - phytoreg predict --help
  - phytoreg-inspect --help
  imports:
  - phytoreg
