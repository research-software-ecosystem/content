about:
  home: https://github.com/htaohan/SCGBinner
  license: MIT
  license_file: LICENSE
  summary: A deep learning-based metagenomic binning method
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - htaohan
package:
  name: scgbinner
  version: 1.0.5
requirements:
  host:
  - python >=3.9,<3.10
  - setuptools >=61
  - pip
  run:
  - python >=3.9,<3.10
  - biopython >=1.85
  - numpy =1.19
  - scipy >=1.9
  - igraph >=0.10
  - leidenalg >=0.10.2
  - joblib >=1.5
  - pandas =1.4
  - scikit-learn >=1.6
  - pyyaml >=6.0.2
  - tqdm >=4.67
  - hnswlib >=0.8
  - atomicwrites >=1.4
  - bedtools >=2.31.1
  - fraggenescan =1.32
  - hmmer =3.4
source:
  sha256: d28202c42d2172502b2cf7450c4582d8afc258ed06c342891956f9ec8a5d0fea
  url: https://pypi.org/packages/source/S/SCGBinner/scgbinner-1.0.5.tar.gz
test:
  commands:
  - pip check
  - scgbinner
  - split_contigs --help
  imports:
  - SCGBinner
  requires:
  - pip
  - python
