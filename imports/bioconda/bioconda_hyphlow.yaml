about:
  home: https://pypi.org/project/hyphlow
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bioinformatics selection analysis pipeline and GUI.
build:
  entry_points:
  - hyphlow = hyphlow.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - hellojung0810
package:
  name: hyphlow
  version: 1.0.8
requirements:
  host:
  - python >=3.8,<3.13
  - setuptools >=61.0
  - pip
  run:
  - python >=3.8,<3.13
  - hyphy
  - pyqt
  - qtawesome
  - pandas
  - ete3
  - rapidfuzz
  - taxopy
  - xlsxwriter
  - matplotlib-base
  - seaborn-base
source:
  sha256: 6e3c49855738101a10ac074d577d4e78c0f78e2e08ec80dd9aff3df44c6483d2
  url: https://pypi.org/packages/source/h/hyphlow/hyphlow-1.0.8.tar.gz
test:
  imports:
  - hyphlow
