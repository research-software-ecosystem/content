about:
  home: https://pypi.org/project/hyphlow
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bioinformatics selection analysis pipeline and GUI.
build:
  entry_points:
  - hyphlow = hyphlow.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - hellojung0810
package:
  name: hyphlow
  version: 1.1.0
requirements:
  host:
  - python >=3.8,<3.13
  - setuptools >=61.0
  - pip
  run:
  - python >=3.8,<3.13
  - hyphy
  - pyqt
  - qtawesome
  - pandas
  - ete3
  - rapidfuzz
  - taxopy
  - xlsxwriter
  - matplotlib-base
  - seaborn-base
source:
  sha256: f8ef703f927b28cdfbdb5728d335ec3316f2fe727368379b3bc135b2e56d6378
  url: https://pypi.org/packages/source/h/hyphlow/hyphlow-1.1.0.tar.gz
test:
  imports:
  - hyphlow
