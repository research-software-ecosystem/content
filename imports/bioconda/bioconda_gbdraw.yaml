about:
  description: For details, see https://github.com/satoshikawato/gbdraw
  dev_url: https://github.com/satoshikawato/gbdraw
  fonts_license: SIL OFL, Version 1.1
  home: https://github.com/satoshikawato/gbdraw
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE.txt
  - LICENSE_LIBERATION_FONTS.txt
  summary: A genome diagram generator for microbes and organelles.
build:
  entry_points:
  - gbdraw = _gbdraw_console:main
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  - mkdir -p $PREFIX/fonts
  - cp -f gbdraw/data/*.ttf $PREFIX/fonts/
extra:
  recipe-maintainers:
  - satoshikawato
package:
  name: gbdraw
  version: 0.14.5
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10,<3.14
  - numpy >=1.23
  - pandas
  - fonttools
  - biopython
  - svgwrite
  - cairosvg
  - bcbio-gff
  - tomli
  - losat ==0.1.0
source:
  sha256: 6da214bf1531125d62fe1808c904a4482b4b308003872f6e31303e9559521c5e
  url: https://pypi.org/packages/source/g/gbdraw/gbdraw-0.14.5.tar.gz
test:
  commands:
  - gbdraw --help
  - gbdraw circular --help
  - gbdraw linear --help
  - cairosvg --help
  - losat --version
  imports:
  - gbdraw
