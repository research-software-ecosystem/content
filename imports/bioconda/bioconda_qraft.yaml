about:
  description: 'QRAFT (Quartet Regrafting for Accurate and Fast Species Tree Estimation)

    infers a species tree from gene trees. It looks for the species tree that

    agrees with the most gene-tree quartets, counting every quartet exactly,

    and it scales to very large datasets. It reads gene trees in Newick

    format, which may miss taxa or hold several copies of a taxon, and writes

    the species tree in Newick format, optionally with local posterior

    probabilities on its edges.

    '
  dev_url: https://github.com/risenfromashes/qraft
  doc_url: https://github.com/risenfromashes/qraft/blob/main/README.md
  home: https://github.com/risenfromashes/qraft
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file:
  - LICENSE
  - external/taskflow/LICENSE
  summary: Species trees from gene trees by quartet regrafting, at the scale of a
    million taxa.
