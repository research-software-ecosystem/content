about:
  home: https://github.com/CIBIO-BU/mozaiko
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Piecing Together Complete Genetic Coverage for Biomonitoring
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  recipe-maintainers:
  - camilababo
package:
  name: mozaiko
  version: 0.3.1
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=61
  - wheel
  run:
  - python >=3.9
  - biopython >=1.80
  - numpy
  - pandas
  - matplotlib-base
  - tqdm
  - vsearch ==2.16
  - cutadapt ==4.9
  - catnip-seq
  - crabs ==0.1.7
source:
  sha256: 1a754ac4d1e8d0267001b82aa0eb7711f362d066acf15e4236822c4dcc882b01
  url: https://github.com/CIBIO-BU/mozaiko/archive/refs/tags/0.3.1.tar.gz
test:
  commands:
  - mozaiko --version
  - crabs --version
  imports:
  - mozaiko
  requires:
  - pip
  - python
