about:
  dev_url: https://github.com/SamueleSoraggi/HMMploidy
  home: https://github.com/SamueleSoraggi/HMMploidy
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: Genotype-likelihood- and depth-based HMM for inference of ploidy levels
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - SamueleSoraggi
package:
  name: hmmploidy
  version: 2.0.0
requirements:
  host:
  - python
  - pip
  - setuptools >=61.0
  run:
  - python >=
  - numpy >=1.23
  - scipy >=1.9
  - pandas >=1.5
  - matplotlib-base >=3.6
  - numba >=0.57
  - samtools
source:
  sha256: 986af2015820d691a83547486e14cb572872c13737ebdefed503165ebaed92f5
  url: https://github.com/SamueleSoraggi/HMMploidy/archive/refs/tags/v2.0.0.tar.gz
test:
  commands:
  - hmmploidy --help
  imports:
  - hmmploidy
  - hmmploidy.hmm
  - hmmploidy.run
  requires:
  - python
