about:
  dev_url: https://github.com/genpat-it/cgmlst-dists-py
  home: https://github.com/genpat-it/cgmlst-dists-py
  license: GPL-3.0-only
  license_file: LICENSE
  summary: High-performance pairwise Hamming distance calculator for cgMLST data with
    GPU acceleration.
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - andreaderuvo
  skip-lints:
  - should_be_noarch_python
package:
  name: cgmlst-dists-py
  version: 0.1.7
requirements:
  run:
  - python >=3.9
  - numpy
  - pandas
  - tqdm
  - psutil
  - pyarrow
source:
  sha256: 5c2ad3e07b9ad8b8eafb5254ec689cb27057991e390a50e9511ee1ae745da720
  url: https://github.com/genpat-it/cgmlst-dists-py/archive/refs/tags/0.1.7.tar.gz
test:
  commands:
  - cgmlst-dists.py --version | grep -F '0.1.7'
  - cgmlst-dists.py -h
  - python -c "open('in.tab','w').write('id\tL1\tL2\tL3\nS1\t1\t2\t3\nS2\t1\t9\t3\n')"
  - cgmlst-dists.py -i in.tab -c -s > out.tsv
  - python -c "rows=[l.split() for l in open('out.tsv')]; assert rows[1][1:] == ['0',
    '1'], rows"
  - python -c "import pyarrow"
