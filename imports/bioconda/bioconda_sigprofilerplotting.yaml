about:
  dev_url: https://github.com/alexandrovlab/SigProfilerPlotting
  doc_url: https://osf.io/2aj6t/wiki/home
  home: https://github.com/alexandrovlab/SigProfilerPlotting
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: SigProfiler plotting tool.
build:
  entry_points:
  - SigProfilerPlotting = sigProfilerPlotting.sigProfilerPlotting_CLI:main_function
  - sigprofilerplotting-web = sigProfilerPlotting.web.launcher:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
package:
  name: sigprofilerplotting
  version: 1.6.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools-scm >=8
  run:
  - python >=3.9
  - matplotlib-base >=3.4.3
  - pandas >=2.0.0
  - scikit-learn >=1.1.3
  - pillow >=10.0.0
  - plotly >=6.1.1
  - python-kaleido >=1.0.0
  - pypdf >=5.0.0
source:
  sha256: b36a228cfe7e9c137b4291a90512a0dd86db0be6f4934e532b380a887cf67a3b
  url: https://pypi.org/packages/source/s/sigProfilerPlotting/sigprofilerplotting-1.6.0.tar.gz
test:
  commands:
  - SigProfilerPlotting plotSBS --help
  imports:
  - sigProfilerPlotting
