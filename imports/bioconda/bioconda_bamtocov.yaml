about:
  description: 'A collection of tools to extract coverage information from BAM and
    CRAM files,

    supporting target (BED, GFF) and reporting the output in bedGraph (BED) or WIG
    format.


    The suite includes:

    - bamtocov: fast BAM/CRAM to coverage converter

    - covtotarget: extract coverage for specific targets

    '
  docs: https://telatin.github.io/bamtocov
  home: https://github.com/telatin/bamtocov
  license: MIT
  summary: Extract coverage information from BAM files, supporting stranded and physical
    coverage and streams.
build:
  number: 0
  run_exports:
  - null
extra:
  identifiers:
  - biotools:bamtocov
  - doi:10.3390/bioengineering8050059
  recipe-maintainers:
  - telatin
package:
  name: bamtocov
  version: 2.10.0
requirements:
  build:
  - null
  - null
  - nim
  host:
  - zlib
  - pcre
  - htslib >=1.10
  run: null
source:
- sha256: faa3575cf87de2442c9aae99cedc91e42b15d281f5fd5ee2c94d9610937f8b7e
  url: https://github.com/telatin/bamtocov/archive/v2.10.0.tar.gz
test:
