about:
  home: https://pypi.org/project/vhamster/
  license: Custom
  license_file: LICENSE
  summary: VHAMSTeR ensemble inference CLI
build:
  entry_points:
  - vhamster = vhamster:main
  - vhamster-features = vhamster:features_main
  - vhamster-install-models = install_models:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - susiegriggo
package:
  name: vhamster
  version: 1.3.1
requirements:
  host:
  - python >=3.10
  - setuptools >=68
  - wheel
  - pip
  run:
  - python >=3.10
  - click >=8.3,<9
  - loguru >=0.7,<1
  - numpy >=2.4,<3
  - polars >=1.39,<2
  - pytorch >=2.11,<3
  - tqdm >=4.67,<5
  - transformers >=5.4,<6
  - peft >=0.18,<1
  - biopython >=1.87,<2
  - pyrodigal-gv >=0.3.2,<0.4
  - scikit-learn >=1.8,<2
  - joblib >=1.4,<2
  - huggingface_hub >=0.23,<2
  - xgboost >=2.1,<3
source:
  sha256: f45dd4cfe4893b974ec03eff146e0571385e18ff9b23380f2ef89f5f17064731
  url: https://pypi.org/packages/source/V/VHAMSTeR/vhamster-1.3.1.tar.gz
test:
  commands:
  - pip check
  - vhamster --help
  - vhamster-features --help
  - vhamster-install-models --help
  imports:
  - install_models
  - vhamster
  requires:
  - pip
  - python
