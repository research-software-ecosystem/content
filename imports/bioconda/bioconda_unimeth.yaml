about:
  dev_url: https://github.com/sekeyWang/Unimeth
  home: https://github.com/sekeyWang/Unimeth
  license: BSD-3-Clause-Clear
  license_file: LICENSE
  summary: A unified DNA methylation detection framework for nanopore reads
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - sekeyWang
  - PengNi
package:
  name: unimeth
  version: 0.2.3
requirements:
  host:
  - python >=3.12,<3.13
  - pip
  - hatchling
  run:
  - python >=3.12,<3.13
  - pytorch >=2.3,<2.6
  - numpy >=2.0,<3
  - transformers >=4.40,<5
  - tqdm >=4.66
  - accelerate >=1.0,<2
  - pysam >=0.22
  - pod5 >=0.3,<0.3.35
  - pyarrow >=20,<21
  - scikit-learn >=1.5
  - scipy >=1.13
source:
  sha256: b3464bf61d72231b3e6055b48b2e6f3c660ce2d3bec54d3ff0110731d4af70c7
  url: https://github.com/sekeyWang/Unimeth/archive/refs/tags/0.2.3.tar.gz
test:
  commands:
  - unimeth --version
  - unimeth --help
  - unimeth infer --help
  - unimeth-infer --help
  - python -c "import pod5; print('pod5 ok')"
  - python -c "from unimeth.config.model_config import ModelConfig; assert ModelConfig.from_name('default').d_model
    == 384"
  imports:
  - unimeth
  - unimeth.config
