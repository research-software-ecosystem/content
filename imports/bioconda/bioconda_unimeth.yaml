about:
  dev_url: https://github.com/sekeyWang/Unimeth
  home: https://github.com/sekeyWang/Unimeth
  license: BSD-3-Clause-Clear
  license_file: LICENSE
  summary: A unified DNA methylation detection framework for nanopore reads
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  recipe-maintainers:
  - sekeyWang
  - PengNi
package:
  name: unimeth
  version: 0.3.4
requirements:
  host:
  - python >=3.12
  - pip
  - hatchling
  run:
  - python >=3.12
  - pytorch >=2.3,<2.9
  - numpy >=2.0
  - transformers >=4.40,<5
  - tqdm >=4.66
  - accelerate >=1.0,<2
  - packaging >=23
  - pysam >=0.22
  - pod5 >=0.3.38
  - pyarrow >=22,<23
  - scikit-learn >=1.5
  - scipy >=1.13
source:
  sha256: 29bf04fb02e4c0d4c19175c325b8504db4ec9cdb51e0f3c12b35ef293a3891c0
  url: https://github.com/sekeyWang/Unimeth/archive/refs/tags/0.3.4.tar.gz
test:
  commands:
  - unimeth --version
  - unimeth --help
  - unimeth infer --help
  - unimeth-infer --help
  - python -c "import pod5; print('pod5 ok')"
  - python -c "from unimeth.config.model_config import ModelConfig; assert ModelConfig.from_name('default').d_model
    == 384"
  imports:
  - unimeth
  - unimeth.config
