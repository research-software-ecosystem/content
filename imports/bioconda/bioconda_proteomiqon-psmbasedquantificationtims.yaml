about:
  description: ProteomIQon.PSMBasedQuantificationTIMs performs PSM-based peptide ion
    quantification for mass spectrometry data with ion mobility information.
  dev_url: https://github.com/CSBiology/ProteomIQon
  doc_url: https://csbiology.github.io/ProteomIQon/
  home: https://csbiology.github.io/ProteomIQon/
  license: MIT
  summary: PSM-based quantification for trapped ion mobility spectrometry data
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: proteomiqon-psmbasedquantificationtims
  version: 0.0.13
requirements:
  build:
  - null
  host:
  - unzip
  run:
  - dotnet-runtime >=10.0, <11.0
  - zlib
source:
  sha256: afb788a825402b264b7a989eb09a323e297779cd6e8bc2eea39d3426bed2d3a3
  url: https://www.nuget.org/api/v2/package/ProteomIQon.PSMBasedQuantificationTIMs/0.0.13
test:
  commands:
  - test -x "$PREFIX/bin/proteomiqon-psmbasedquantificationtims"
  - test -f "$PREFIX/lib/dotnet/tools/PSMBasedQuantificationTIMs/ProteomIQon.PSMBasedQuantificationTIMs.dll"
  - bash -n "$PREFIX/bin/proteomiqon-psmbasedquantificationtims"
  - grep -q "PSMBasedQuantificationTIMs/ProteomIQon.PSMBasedQuantificationTIMs.dll"
    "$PREFIX/bin/proteomiqon-psmbasedquantificationtims"
