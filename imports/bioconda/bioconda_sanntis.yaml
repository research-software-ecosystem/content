about:
  description: 'Tool for identifying biosynthetic gene clusters (BGCs) in genomic
    and metagenomic data from InterProScan

    domain annotations. Takes a nucleotide FASTA, a GenBank file or a protein FASTA
    with its GFF3, each optionally

    with a precomputed InterProScan TSV; writes GFF3, antiSMASH sideloader JSON and
    tables.

    '
  dev_url: https://github.com/Finn-Lab/SanntiS
  doc_url: https://github.com/Finn-Lab/SanntiS/tree/master/docs
  home: https://github.com/Finn-Lab/SanntiS
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: SMBGC Annotation using Neural Networks Trained on Interpro Signatures
build:
  entry_points:
  - sanntis = sanntis.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vv
extra:
  identifiers:
  - doi:10.1101/2023.05.23.540769
  recipe-maintainers:
  - SantiagoSanchezF
package:
  name: sanntis
  version: 1.2.1
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling >=1.25
  run:
  - python >=3.11
  - numpy >=2,<3
  - pandas >=2.2,<3
  - pyarrow >=17
  - scikit-learn >=1.9,<1.10
  - scipy >=1.13
  - skops >=0.11
  - pytorch >=2.4
  - safetensors >=0.4
  - huggingface_hub >=0.30
  - biopython >=1.84
  - pyrodigal >=3.5,<4
  - click >=8.1,<9
  - pydantic >=2.7,<3
  - pyyaml >=6
  - matplotlib-base >=3.8
  - rdkit >=2024.03
  - nextflow >=26.04
  - openjdk >=17
source:
  sha256: 07a276d273819e8b463c42503dbaec44e94a7c6b96cbde23ef07ce1d7af7c90e
  url: https://github.com/Finn-Lab/SanntiS/archive/refs/tags/v1.2.1.tar.gz
test:
  commands:
  - sanntis --help
  - sanntis predict --help
  imports:
  - sanntis
  - sanntis.model.bundle
