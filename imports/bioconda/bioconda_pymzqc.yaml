about:
  dev_url: https://github.com/MS-Quality-Hub/pymzqc
  doc_url: https://pymzqc.readthedocs.io
  home: https://github.com/MS-Quality-Hub/pymzqc
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python library for the PSI-mzQC quality control file format.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - biotools:pymzqc
  recipe-maintainers:
  - singjc
package:
  name: pymzqc
  version: 1.0.3
requirements:
  host:
  - python >=3.8
  - pip
  - hatchling
  run:
  - python >=3.8
  - jsonschema >=3.2.0
  - strict-rfc3339
  - rfc3339-validator
  - numpy
  - pandas >=1.1.5
  - pronto
  - requests >=2.27.1
  - click
source:
  sha256: 9a4cc587045c36f51a5606c4819c9d5da26895f732c8688cb3ce7e2086a0472c
  url: https://pypi.org/packages/source/p/pymzqc/pymzqc-1.0.3.tar.gz
test:
  commands:
  - mzqc-fileinfo --help
  - mzqc-filemerger --help
  - mzqc-fixdescriptions --help
  - mzqc-validator --help
  imports:
  - mzqc
  - mzqcaccessories
