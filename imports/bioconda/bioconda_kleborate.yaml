about:
  dev_url: https://github.com/klebgenomics/Kleborate
  doc_url: https://kleborate.readthedocs.io
  home: https://kleborate.readthedocs.io
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: 'Kleborate: a tool for typing and screening pathogen genome assemblies'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir'
extra:
  identifiers:
  - doi:10.1038/s41467-021-24448-3
  recipe-maintainers:
  - marymaranga
package:
  name: kleborate
  version: 3.3.0b1
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools
  - numpy >=1.26.0
  run:
  - python >=3.11
  - biopython ==1.81
  - numpy >=1.26.0
  - kaptive
  - beautifulsoup4
  - numba
  - minimap2
  - mash
  - ezclermont
  - ectyper
  - mist_typing
  - shigapass
  - ncbi-stxtyper
  - ncbi-amrfinderplus
source:
  sha256: 42f2e3db3723a973e61b621387970c571344fc85101cc89231ce111ef620dceb
  url: https://pypi.io/packages/source/k/kleborate/kleborate-3.3.0b1.tar.gz
test:
  commands:
  - kleborate --help
  imports:
  - kleborate
