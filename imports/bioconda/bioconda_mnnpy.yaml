about:
  home: http://github.com/chriscainx/mnnpy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Mutual nearest neighbors correction in python.
build:
  number: 10
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --ignore-installed -vv
  skip: true
extra:
  recipe-maintainers:
  - pinin4fjords
package:
  name: mnnpy
  version: 0.1.9.5
requirements:
  build:
  - null
  - null
  - llvm-openmp
  - libgomp
  host:
  - cython
  - pip
  - python
  - setuptools
  - wheel
  run:
  - anndata >=0.9.2,<0.13
  - numba
  - numpy >=1.23.5,<2.3
  - pandas
  - python >=3.11,<3.14
  - scipy >=1.9.3,<1.15
source:
  patches:
  - 0001-Fix-missing-forceobj-for-numba.jit.patch
  - 0002-Use-workers-for-scipy-cKDTree.patch
  - 0003-Replace-deprecated-numpy-float.patch
  - 0004-Link-the-math-library.patch
  sha256: 41cdafaf21392144b683d7acf99f7a1fc59085f9b3697cd6ace57f40dddace9c
  url: https://pypi.io/packages/source/m/mnnpy/mnnpy-0.1.9.5.tar.gz
test:
  imports:
  - mnnpy
  - mnnpy._utils
