about:
  dev_url: https://github.com/jiangyun-fun/seqconsistency
  doc_url: https://github.com/jiangyun-fun/seqconsistency/blob/v0.1.0/README.md
  home: https://github.com/jiangyun-fun/seqconsistency
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Structural, technical, and pooling-consistency assessment for sequencing
    datasets (FASTQ/BAM).
build:
  entry_points:
  - seqconsistency = seqconsistency.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - jiangyun-fun
package:
  name: seqconsistency
  version: 0.1.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools
  run:
  - python >=3.11
  - numpy >=1.26
  - scipy >=1.11
  - pyarrow >=15
  - pysam >=0.22
  - pyyaml >=6
  - threadpoolctl >=3
source:
  sha256: aba614d5a3baed275d0a2e6328c8fa681934d4fb794d09dff6a4631a6a09940a
  url: https://github.com/jiangyun-fun/seqconsistency/releases/download/v0.1.0/seqconsistency-0.1.0.tar.gz
test:
  commands:
  - seqconsistency --version
  - seqconsistency --help
  imports:
  - seqconsistency
