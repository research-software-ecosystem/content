about:
  description: 'refineGEMs helps with curation, analysis, and refinement of genome-scale

    metabolic models, including model statistics, gap-filling workflows,

    media handling, SBO annotations, and related systems biology utilities.

    '
  dev_url: https://github.com/draeger-lab/refinegems
  doc_url: https://refinegems.readthedocs.io/en/latest/
  home: https://github.com/draeger-lab/refinegems
  license: MIT
  license_file:
  - LICENSE
  - THIRD_PARTY_LICENSES.md
  summary: Python package for curation of genome-scale metabolic models
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.3389/fbinf.2023.1214074
  recipe-maintainers:
  - cb-Hades
  - GwennyGit
package:
  name: refinegems
  version: 2.0.0b3
requirements:
  host:
  - python >=3.10,<3.12
  - pip
  - setuptools
  run:
  - python >=3.10,<3.12
  - biopython >=1.79
  - bioservices >=1.11.2
  - click >=8.1.3
  - cloup >=3.0.5
  - cobra >=0.28.0
  - depinfo >=1.7.0
  - gffutils >=0.10.1
  - ipywidgets
  - markupsafe >=2.0.1
  - matplotlib-base >=3.8.2
  - memote >=0.17.0
  - multiprocess >=0.70.16
  - numpy >=2.0
  - pandas >=2.2.2
  - pyyaml >=6.0.1
  - ratelimit >=2.2.1
  - requests >=2.32.4
  - seaborn >=0.12.2
  - sortedcontainers >=2.4.0
  - sqlalchemy >=2.0.0
  - tqdm >=4.66.1
  - upsetplot >=0.9.0
  - venn >=0.1.3
  - z3-solver >=4.13.0.0
  - xmltodict
source:
  sha256: 3e2136ef3fd8d44b253dc11e3b5169bbf84d0603d8540e52b8c26f0a03738d7f
  url: https://github.com/draeger-lab/refinegems/archive/refs/tags/v2.0.0b3.tar.gz
test:
  commands:
  - refinegems --help
  imports:
  - refinegems
  - refinegems.analysis
  - refinegems.classes
  - refinegems.curation
  - refinegems.utility
