about:
  description: 'Protein-ligand interactions are foundational to the understanding
    of science and discovery of therapies.

    However, to this date, no large, high quality datasets with real-life relevant
    evaluations exist.


    PLINDER is an academic-industry collaboration to address this, driven by VantAI,
    NVIDIA, the Computational Structural Biology group at the University of Basel
    & SIB Swiss Institute of Bioinformatics - co-organizers of CASP, and MIT.

    We aim to provide a gold standard dataset and evaluations to push the field of
    computational protein-ligand interactions prediction forward.

    '
  dev_url: https://github.com/plinder-org/plinder
  doc_url: https://plinder-org.github.io/plinder
  home: https://www.plinder.sh
  license: Apache-2.0
  license_file:
  - NOTICE
  - LICENSE.txt
  summary: 'PLINDER: Protein & Ligand INteraction Dataset and Evaluation Resource'
build:
  entry_points:
  - plinder_download = plinder.core.index.utils:download_plinder_cmd
  - plinder_eval = plinder.eval.cli:main
  - plinder_prepare_release = plinder.data.pipeline.public_release:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=1.0.0
extra:
  identifiers:
  - doi:10.1101/2024.07.17.603955
  recipe-maintainers:
  - eunos-1128
package:
  name: plinder
  version: 1.0.0
requirements:
  host:
  - python 3.12.*
  - python-build
  - setuptools
  - setuptools-scm
  - pip
  run:
  - __unix
  - python >=3.12
  - biotite >=1.2
  - numpy
  - threadpoolctl >=3.6
  - pandas
  - pydantic
  - tqdm
  - peppr >=0.13
  - voronotalt >=1.1
  - rdkit >=2025.09.1
  - pyarrow
  - omegaconf
  - python-duckdb >=1.5
  - cloudpathlib >=0.25,<0.26
  - requests
  - google-cloud-storage
  - gcsfs
  - numba
  - mmseqs2
  - foldseek
  - networkit >11.0
  - tabulate
  - mmpdb >=3.1.4,<3.2
  - ligand-validation ==0.0.1
  - openstructure >=2.12.0
  - posebusters >=0.6.5
  - pytorch-cpu
  - matplotlib-base
  - seaborn
  - mols2grid
  - matplotlib-venn
  - scipy
source:
  sha256: 48f6669eece102b9540b7460196d552e2a7ffbd0cc0e0b35e0751b6547ad8789
  url: https://pypi.org/packages/source/P/PLINDER/plinder-1.0.0.tar.gz
test:
  commands:
  - python -m pip check
  - plinder_download --help
  - plinder_eval --help
  - plinder_prepare_release --help
  imports:
  - plinder
  requires:
  - pip
