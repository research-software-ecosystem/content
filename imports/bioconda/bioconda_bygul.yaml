about:
  dev_url: https://github.com/andersen-lab/Bygul
  home: https://github.com/andersen-lab/Bygul
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Bygul is an amplicon read simulating tool that can generate different sample
    read proportions based on user input.
build:
  entry_points:
  - bygul=bygul._cli:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
package:
  name: bygul
  version: 4.0.5
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools
  run:
  - python >=3.8
  - click
  - numpy
  - pandas
  - tqdm
  - biopython
  - wgsim
  - mason
  - regex
  - art
source:
  sha256: f259de3382282ce43499008b59013f54ae5d12e36f244e6fe212d4208bf2e8bd
  url: https://github.com/andersen-lab/Bygul/archive/V4.0.5.tar.gz
test:
  commands:
  - bygul simulate-proportions --help
  imports:
  - bygul
