about:
  dev_url: https://github.com/ChrisgKent/primalbedtools
  home: https://github.com/ChrisgKent/primalbedtools
  license: MPL-2.0
  license_file: LICENSE
  summary: A collection of tools for working with primer.bed files.
build:
  entry_points:
  - primalbedtools = primalbedtools.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - chriskent
package:
  name: primalbedtools
  version: 1.1.0
requirements:
  host:
  - python >=3.9,<4
  - hatchling
  - pip
  run:
  - python >=3.9,<4
source:
  sha256: 385ee040a088ac401a402a156b9b1e81643adb0e8c8432bbb55822b3b4911bbb
  url: https://pypi.org/packages/source/p/primalbedtools/primalbedtools-1.1.0.tar.gz
test:
  commands:
  - primalbedtools --help
  imports:
  - primalbedtools
