about:
  dev_url: https://github.com/bioFAM/mofaflex
  doc_url: https://mofaflex.readthedocs.io/
  home: https://pypi.org/project/mofaflex/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Versatile factor analysis framework for factor models for omics data
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
package:
  name: mofaflex
  version: 0.1.2
requirements:
  host:
  - python >=3.11
  - hatch-vcs
  - hatchling
  - pip
  run:
  - python >=3.11
  - anndata >=0.11
  - array-api-compat
  - dtw-python
  - gpytorch
  - h5py
  - mizani
  - mudata >=0.3.2
  - numpy
  - packaging
  - pandas
  - platformdirs
  - plotnine
  - pyro-ppl
  - scikit-learn
  - scipy >=1.8
  - session-info2
  - statsmodels
  - pytorch
  - tqdm
source:
  sha256: 2518c0d9a519675f113c544587374bc9c36c7be919f8cf94364389a50c764331
  url: https://pypi.org/packages/source/m/mofaflex/mofaflex-0.1.2.tar.gz
test:
  commands:
  - pip check
  imports:
  - mofaflex
  requires:
  - pip
  - python
