about:
  dev_url: https://github.com/clintval/bedspec
  doc_url: https://github.com/clintval/bedspec/blob/4.4.0/README.md
  home: https://github.com/clintval/bedspec
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: An HTS-specs compliant BED toolkit.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - clintval
package:
  name: bedspec
  version: 4.4.0
requirements:
  host:
  - python 3.11
  - hatchling
  - pip
  run:
  - python >=3.11
  - pybgzf >=0.2.0
  - superintervals >=1.0.3,<2
  - typeline >=2.4.2,<4
  - typing-extensions >=4.12
  run_constrained:
  - biopython >=1.88
  - captainslog >=0.2.0
  - cyvcf2 >=0.34
  - fgpyo >=1.5.1
  - mappy >=2.31
  - pybedtools >=0.12.1
  - pybwa >=2.3.2
  - pysam >=0.24.1
  - spillsort >=0.1.1
source:
  sha256: 9519005fb9fea75de3644fd2ce16d759d6081406764d11f037198c7f58579bb4
  url: https://pypi.org/packages/source/b/bedspec/bedspec-4.4.0.tar.gz
test:
  imports:
  - bedspec
  requires:
  - python 3.11
