about:
  dev_url: https://github.com/broadinstitute/gatk
  home: https://www.broadinstitute.org/gatk/
  license: BSD-3-Clause
  license_family: BSD
  summary: Genome Analysis Toolkit (GATK4)
build:
  noarch: generic
  number: 0
  run_exports:
  - null
outputs:
- name: gatk4-main
  requirements:
    run:
    - openjdk =17
    - python
  script: build_main.sh
  test:
    commands:
    - gatk -h
    - gatk --list
    - gatk HaplotypeCaller --help
    - gatk DetermineGermlineContigPloidy --help
- name: gatk4-spark
  requirements:
    run:
    - openjdk =17
    - python
    - null
  script: build_spark.sh
  test:
    commands:
    - gatk -h
    - gatk --list
    - gatk MarkDuplicatesSpark --help
    - gatk DetermineGermlineContigPloidy --help
package:
  name: gatk4
  version: 4.7.0.0
requirements:
  host:
  - r-base =4.3.1
  - r-gplots
  - r-ggplot2
  - r-gsalib
  - r-reshape
  - gcnvkernel =0.9
  run:
  - openjdk =17
  - python
  - r-base =4.3.1
  - r-gplots
  - r-ggplot2
  - r-gsalib
  - r-reshape
  - gcnvkernel =0.9
source:
  sha256: d093d2693b1626361a413ca59d6d4a0bf968717f280a8fd9ce060b25eb2ed1db
  url: https://github.com/broadinstitute/gatk/releases/download/4.7.0.0/gatk-4.7.0.0.zip
test:
  commands:
  - gatk -h
  - gatk --list
  - gatk HaplotypeCaller --help
  - gatk DetermineGermlineContigPloidy --help
