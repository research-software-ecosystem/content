about:
  dev_url: https://github.com/fg-labs/bwa-mem3
  doc_url: https://bwa-mem3.readthedocs.io
  home: https://github.com/fg-labs/bwa-mem3
  license: MIT AND Apache-2.0 AND Zlib
  license_family: MIT
  license_file:
  - LICENSE
  - ext/sse2neon/LICENSE
  - ext/mimalloc/LICENSE
  - ext/zlib-ng/LICENSE.md
  summary: Short-read aligner derived from bwa-mem2 with correctness fixes, performance
    improvements, and methylation alignment.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1109/IPDPS.2019.00041
  recipe-maintainers:
  - nh13
package:
  name: bwa-mem3
  version: 0.10.0
requirements:
  build:
  - make
  - cmake
  - null
  - null
  - null
  host:
  - zlib
  - mimalloc >=3.3,<4
  - htslib >=1.21,<2
  - libsais >=2.10.4,<3
  - sse2neon ==1.9.1
  - llvm-openmp
  run:
  - mimalloc >=3.3,<4
  - htslib >=1.21,<2
  - libsais >=2.10.4,<3
  - llvm-openmp
source:
  sha256: fde8509711c9b18e5a5acfd008212ffd70e2286a53483d0c3f9c8c83600ec8db
  url: https://github.com/fg-labs/bwa-mem3/releases/download/v0.10.0/Source_code_including_submodules.tar.gz
test:
  commands:
  - bwa-mem3 version
  - if ldd "${PREFIX}/bin/bwa-mem3" | grep -q libmimalloc; then echo "FAIL - bwa-mem3
    dynamically links libmimalloc (malloc override inert)"; exit 1; fi
