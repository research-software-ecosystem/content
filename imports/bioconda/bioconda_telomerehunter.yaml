about:
  description: 'TelomereHunter extracts, sorts and analyses telomeric reads from BAM
    files

    to estimate telomere content. It was developed at the German Cancer

    Research Center (DKFZ).

    '
  doc_url: https://www.dkfz.de/en/applied-bioinformatics/telomerehunter/telomerehunter.html
  home: https://www.dkfz.de/en/applied-bioinformatics/telomerehunter/telomerehunter.html
  license: GPL
  license_family: GPL
  license_file: LICENSE
  summary: Estimation of telomere content from sequencing data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install *.whl --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.1186/s13059-019-1760-2
  recipe-maintainers:
  - PFRoux
package:
  name: telomerehunter
  version: 1.1.0
requirements:
  host:
  - python 2.7.*
  - pip
  run:
  - python 2.7.*
  - numpy >=1.16,<1.17
  - pysam >=0.15,<0.16
  - pypdf2 >=1.26,<2
  - r-base
  - r-cowplot
  - r-ggplot2
  - r-gridextra
  - r-rcolorbrewer
  - r-reshape2
  - r-svglite
  - samtools
source:
  sha256: 915b0166278514fd441c819a5b03014f1908a77313546931771a42a121f9a580
  url: https://files.pythonhosted.org/packages/e5/67/ce6ac292a88a078a733dc3d9adb3f153834692effbf0851b93a6f3e49b7a/telomerehunter-1.1.0-py2-none-any.whl
test:
  commands:
  - telomerehunter --help
  imports:
  - telomerehunter
