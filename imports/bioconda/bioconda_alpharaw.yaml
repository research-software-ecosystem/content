about:
  description: 'AlphaRaw provides unified access to raw mass spectrometry data from

    various instrument vendors, converting them to a standardized HDF5

    format for downstream analysis in the AlphaPept ecosystem.

    '
  dev_url: https://github.com/MannLabs/alpharaw
  home: https://github.com/MannLabs/alpharaw
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: An open-source Python package to unify raw MS data access and storage.
build:
  entry_points:
  - alpharaw = alpharaw.cli:run
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - jonasscheid
package:
  name: alpharaw
  version: 0.6.1
requirements:
  host:
  - python >=3.8
  - setuptools
  - pip
  run:
  - python >=3.8
  - click
  - pythonnet
  - h5py
  - numba
  - pandas
  - numpy
  - pyteomics
  - lxml
  - owlready2
  - alphabase >=1.5.0
source:
  sha256: cf116165eb845cff014da6122e2effd7a0cbab4cc59dde3031ca38f021b8a097
  url: https://github.com/MannLabs/alpharaw/archive/refs/tags/v0.6.1.tar.gz
test:
  commands:
  - alpharaw --help
  imports:
  - alpharaw
