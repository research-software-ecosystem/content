about:
  dev_url: https://github.com/simonjeanneau/captnseq-toolkit
  home: https://github.com/simonjeanneau/captnseq-toolkit
  license: MIT
  license_file: LICENSE
  summary: Analysis tools for CAPTn-seq transposon-insertion sequencing data
build:
  entry_points:
  - captnseq-toolkit = captnseq_toolkit.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - brassardfelix
package:
  name: captnseq-toolkit
  version: 0.2.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=64
  run:
  - python >=3.9
  - numpy
  - pandas
  - scipy
  - matplotlib-base
source:
  sha256: 5680809c1eaaac8da8c423be2a678e96b1d026f6636e414836af0ed4d7119151
  url: https://github.com/simonjeanneau/captnseq-toolkit/archive/refs/tags/v0.2.0.tar.gz
test:
  commands:
  - captnseq-toolkit --version
  - captnseq-toolkit --help
  - captnseq-toolkit sam2sites --help
  - captnseq-toolkit sites2genes --help
  - captnseq-toolkit essentiality --help
  - python -c "from captnseq_toolkit import __version__; assert __version__ == '0.2.0'"
  imports:
  - captnseq_toolkit
  - captnseq_toolkit.cli
  - captnseq_toolkit.sam2sites
  - captnseq_toolkit.sites2genes
  - captnseq_toolkit.essentiality
