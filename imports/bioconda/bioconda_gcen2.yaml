about:
  description: 'GCEN2 is a command-line tool and Python package (with C++ kernels)
    for gene

    co-expression network analysis, the successor of GCEN. It does everything GCEN

    does, with the same commands, files and results, and adds differential

    co-expression, WGCNA module analysis, the hdWGCNA single-cell and spatial

    workflows, networks along trajectories, multi-omics networks, publication

    figures and reports.

    '
  dev_url: https://github.com/wen-chen/GCEN2
  doc_url: https://www.biochen.org/gcen2/docs/
  home: https://www.biochen.org/gcen2/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Gene co-expression network analysis from bulk to single-cell and spatial
    transcriptomes
build:
  number: 0
  run_exports:
  - null
  script:
  - export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY"
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  recipe-maintainers:
  - wen-chen
package:
  name: gcen2
  version: 2.0.0
requirements:
  build:
  - null
  - null
  - cmake >=3.18
  - ninja
  - make
  host:
  - python
  - pip
  - scikit-build-core >=0.10
  - pybind11 >=2.10
  run:
  - python
  - numpy >=1.24
  - pandas >=2.0
  - scipy >=1.10
  - threadpoolctl >=3.0
  - typer >=0.9
  - anndata >=0.10
  - scanpy >=1.9
  - matplotlib-base >=3.7
  - seaborn >=0.12
  - pyvis >=0.3
  - networkx >=3.1
  - jinja2 >=3.1
  - weasyprint
source:
  sha256: ec3ca6a6b01f3f65b41da8a2fa6b7ce1bde6e49effdcf2f39a9741df17959a76
  url: https://pypi.org/packages/source/g/gcen2/gcen2-2.0.0.tar.gz
test:
  commands:
  - gcen2 --help
  - gcen2 plot --help
  - python -c "from gcen2.core import require_extension; require_extension()"
  imports:
  - gcen2
  - gcen2.core
  - gcen2.network
  - gcen2.tom_modules
  - gcen2.single_cell
  - gcen2.plot
