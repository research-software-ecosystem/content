about:
  dev_url: https://github.com/scverse/liana
  doc_url: https://liana.readthedocs.io
  home: https://github.com/scverse/liana
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'LIANA+: a one-stop-shop framework for cell-cell communication.'
build:
  entry_points:
  - liana-install-skills = liana._skills.install:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - nilchia
  skip-lints:
  - uses_vcs_url
package:
  name: liana
  version: 2.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - hatch-vcs
  - pip
  run:
  - python >=3.12
  - anndata >=0.13
  - fast-array-utils
  - mudata >=0.4
  - pydantic
  - pydantic-settings
  - python-dotenv
  - pandas
  - scanpy >=1.12
  - scverse-misc >=0.1.4
  - numba
  - kneed
  - gseapy
  - joblib
  - plotnine >=0.10.1
  - session-info2
  - tqdm >=4
  - docrep >=0.3.1
  - pre-commit >=3.0.0
  - omnipath >=1.0.6
  - decoupler-py >=2.0.0
  - pydeseq2 >=0.3.5
  - cell2cell
  - muon
  - mofax
  - mofapy2 >=0.7.0
  - corneto
  - cvxpy >=1.6.1
  - requests >=2.25.1
  - pooch
  - scikit-learn
  - squidpy
  - statsmodels
source:
  git_rev: V2.0.0
  git_url: https://github.com/scverse/liana.git
  sha256: unused
test:
  imports:
  - liana
