about:
  description: DAGchainer identifies chains of gene pairs sharing conserved order
    between genomic regions, by identifying paths through a directed acyclic graph
    (DAG).
  home: https://github.com/kullrich/dagchainer
  license: MIT
  license_file: LICENSE
  summary: DAGchainer identifies syntenic regions.
build:
  ignore_run_exports_from:
  - perl-data-dumper
  - perl-storable
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1093/bioinformatics/bth397
package:
  name: dagchainer
  version: 2020.11.11
requirements:
  build:
  - make
  - null
  - null
  host:
  - perl-data-dumper
  - perl-getopt-long
  - perl-storable
  - perl-carp
  - perl-local-lib
  run:
  - perl-data-dumper
  - perl-getopt-long
  - perl-storable
  - perl-carp
  - perl-local-lib
source:
  sha256: cb0b711f36e12a5c5b69e69305d0703112ef1260fe00fc37c9fdc944259d300f
  url: https://github.com/kullrich/dagchainer/archive/v2020.11.11.tar.gz
test:
  commands:
  - dagchainer 2>&1 | grep dagchainer
