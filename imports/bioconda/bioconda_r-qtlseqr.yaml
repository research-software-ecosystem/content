about:
  dev_url: https://github.com/bmansfeld/QTLseqr
  home: https://github.com/bmansfeld/QTLseqr
  license: GPL-3.0-or-later
  license_family: GPL3
  summary: QTLseqr is an R package for QTL mapping using NGS Bulk Segregant Analysis.
build:
  number: 8
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
  script:
  - export DISABLE_AUTOBREW=1
  - ${R} CMD INSTALL --build . ${R_ARGS}
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - Zhougeng Xu
  skip-lints:
  - uses_vcs_url
package:
  name: r-qtlseqr
  version: 0.7.5.2
requirements:
  build:
  - null
  - null
  host:
  - r-base
  - r-mass
  - r-rcpp
  - r-dplyr
  - r-modeest
  - r-ggplot2
  - r-gtools
  - r-readr
  - r-tidyr
  - r-locfit
  run:
  - r-base
  - r-mass
  - r-rcpp
  - r-dplyr
  - r-modeest
  - r-ggplot2
  - r-gtools
  - r-readr
  - r-tidyr
  - r-locfit
source:
  git_rev: 5e761379a805b65038c415c8d3ce7aa61abe89dc
  git_url: https://github.com/bmansfeld/QTLseqr.git
  sha256: unused
test:
  commands:
  - $R -e "library('QTLseqr')"
