about:
  dev_url: https://github.com/althonos/pyfastani
  doc_url: https://pyfastani.readthedocs.org
  home: https://github.com/althonos/pyfastani
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Cython bindings and Python interface to FastANI, a method for fast whole-genome
    similarity estimation.
build:
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - althonos
package:
  name: pyfastani
  version: 0.6.2
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.20
  - make
  host:
  - python
  - pip
  - cython
  - zlib
  - scikit-build-core
  run:
  - python
source:
  sha256: 5a90e6252fcd8b4d9b60151279d533c45c5aeb323fe4d99d431b2847f1415535
  url: https://pypi.io/packages/source/p/pyfastani/pyfastani-0.6.2.tar.gz
test:
  commands:
  - python -m unittest -vv pyfastani.tests
  imports:
  - pyfastani
