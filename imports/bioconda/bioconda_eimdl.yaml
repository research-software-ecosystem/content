about:
  description: 'EIMDL (HyperGraSS / HGS2 / HGS3) unites deterministic seven-law evolutionary
    lossless DNA compression

    with zero-crate C23/C++23/Rust 2024 native execution (eimdl) and zero-dependency
    Java 25 LTS tooling

    (hypergrass, eimdl-java). Supports .hgs2 and multi-omic .hgs3 (FASTA/FASTQ + 6-frame
    CDS digests)

    archives as well as direct zero-FASTA analyze, VCF v4.2 variant calling, k-mer
    search, and slice queries.

    '
  dev_url: https://github.com/MdSaifulIslamMSI/hypergrass-research
  doc_url: https://github.com/MdSaifulIslamMSI/hypergrass-research/blob/master/paper/HGS2_EIMDL_Research_Paper.pdf
  home: https://github.com/MdSaifulIslamMSI/hypergrass-research
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Evolutionary MDL lossless genomic compressor and compressed-domain analytics
    engine (.hgs2/.hgs3).
