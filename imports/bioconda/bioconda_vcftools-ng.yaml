about:
  description: 'vcftools-ng is an HTSlib-based, multithreaded VCF/BCF filtering,

    statistics, conversion, and population-genetics tool. It preserves exact

    VCFtools 0.1.17 scientific output for its documented compatibility surface

    while adding adaptive input backends, deterministic BGZF output,

    transactional writes, and reproducible run logs.

    '
  dev_url: https://github.com/VensinMa/vcftools-ng
  doc_url: https://github.com/VensinMa/vcftools-ng/blob/v0.14.3/README.md
  home: https://github.com/VensinMa/vcftools-ng
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: High-performance, output-compatible successor to VCFtools 0.1.17
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  recipe-maintainers:
  - VensinMa
package:
  name: vcftools-ng
  version: 0.14.3
requirements:
  build:
  - null
  - null
  - cmake >=3.20,<4
  - make
  host:
  - blis
  - htslib >=1.24
  - liblapack
  - zlib
  run:
  - bcftools >=1.24
  - null
source:
  sha256: ef9be38a0f68dc52c5b06c1e719888582d1595bf3972b28d186015eb05b09f13
  url: https://github.com/VensinMa/vcftools-ng/archive/refs/tags/v0.14.3.tar.gz
test:
  commands:
  - vcftools-ng --version | grep -F "vcftools-ng 0.14.3"
  - vcftools-ng --help | grep -F "QUICK EXAMPLES:"
