about:
  dev_url: https://github.com/leelieber2025/TxNova
  doc_url: https://txnova.readthedocs.io
  home: https://github.com/leelieber2025/TxNova
  license: Apache-2.0
  license_file: LICENSE
  summary: Experimental-group-specific novel intergenic transcripts from bulk RNA-seq
    BAMs
build:
  number: 0
  run_exports:
  - null
  script:
  - export LIBCLANG_PATH="${PREFIX}/lib"
  - ' -m pip install . --no-deps --no-build-isolation -vv'
  skip: true
extra:
  notes: 'Input is a coordinate-sorted, indexed BAM from STAR or HISAT2.

    Windows is not built; use WSL2.'
  recipe-maintainers:
  - leelieber2025
package:
  name: txnova
  version: 0.1.10
requirements:
  build:
  - null
  - null
  - null
  host:
  - python >=3.10
  - pip
  - maturin >=1.7,<2
  - clangdev
  - libclang
  - llvmdev
  - zlib
  - bzip2
  - xz
  run:
  - python >=3.10
  - typer >=0.12
  - pydantic >=2.5,<3
  - pyyaml >=6.0
  - pandas >=2.0,<3
  - rich >=13.0
  - jinja2 >=3.1
  - pydeseq2 >=0.4
  - numpy >=1.23,<3
  - scipy >=1.9
source:
  sha256: 4ccb06020e1825004ff1307d58601b2d210446c33964131a7c41fc655d408263
  url: https://pypi.io/packages/source/t/txnova/txnova-0.1.10.tar.gz
test:
  commands:
  - txnova --version
  - txnova --help
  imports:
  - txnova
  - txnova._core
