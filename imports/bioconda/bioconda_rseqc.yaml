about:
  dev_url: https://rseqc.sourceforge.net
  doc_url: https://rseqc.sourceforge.net/#usage-information
  home: https://rseqc.sourceforge.net
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file: LICENSE
  summary: QC package for RNA-seq data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - biotools:rseqc
  - doi:10.1093/bioinformatics/bts356
package:
  name: rseqc
  version: 5.0.5
requirements:
  host:
  - pip
  - python >=3.5
  - setuptools <81
  run:
  - bx-python
  - numpy
  - pybigwig
  - pysam
  - python >=3.5
  - logomaker
  - r-base
source:
  sha256: c3f757e5f384004678c10cbc830355e841f5d5db850fc5b131c2e872afe9d516
  url: https://pypi.org/packages/source/r/rseqc/rseqc-5.0.5.tar.gz
test:
  commands:
  - Rscript --help
  imports:
  - qcmodule
  - qcmodule.SAM
  - psyco_full
