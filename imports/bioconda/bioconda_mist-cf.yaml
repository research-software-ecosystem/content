about:
  description: 'MIST-CF predicts the chemical formula of an MS1 precursor from its
    MS/MS

    spectrum, using formula transformers over subformula assignments.


    Model weights are not included and must be installed separately.

    '
  dev_url: https://github.com/samgoldman97/mist-cf
  home: https://github.com/samgoldman97/mist-cf
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: MIST-CF - predicting MS1 precursor chemical formula from MS/MS data
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.1021/acs.jcim.3c01082
  recipe-maintainers:
  - RJMW
  - neil-butcher
package:
  name: mist-cf
  version: 1.0.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  run:
  - python >=3.9
  - sirius-csifingerid >=5.8.6,<6
  - pytorch
  - pytorch-lightning >=2
  - ray-tune >=2.49.1
  - rdkit
  - numpy
  - pandas
  - scikit-learn
  - joblib
  - matplotlib-base
  - seaborn
  - pathos
  - multiprocess
  - tqdm
  - pyyaml
  - cairosvg
source:
  patches:
  - mist-cf-packaging-and-compat.patch
  sha256: ca78169e386ba2df2fba51fe2794b77a20dc2623231ec030e938079869a6a4d4
  url: https://github.com/samgoldman97/mist-cf/archive/refs/tags/v1.0.0.tar.gz
test:
  imports:
  - mist_cf
  - mist_cf.common
  - mist_cf.decomp
