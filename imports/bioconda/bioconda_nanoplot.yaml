about:
  dev_url: https://github.com/wdecoster/NanoPlot
  home: https://github.com/wdecoster/NanoPlot
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Plotting suite for long read sequencing data and alignments.
build:
  entry_points:
  - NanoPlot = nanoplot.NanoPlot:main
  noarch: python
  number: 1
  run_exports:
  - null
  script:
  - sed -i.bak 's|find_packages|find_namespace_packages|' setup.py
  - rm -rf *.bak
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
package:
  name: nanoplot
  version: 1.48.0
requirements:
  host:
  - python >=3
  - pip
  - setuptools
  run:
  - python >=3
  - biopython
  - pysam >0.10.0.0
  - pandas >=1.1.0
  - numpy >=1.16.5
  - scipy
  - python-dateutil
  - libpng
  - nanoget >=1.19.6
  - plotly >=6.1.1,<7
  - pyarrow
  - python-kaleido >=1.0.0
source:
  sha256: 1cffcb73cece29f59af87d9da496e4447875ce7a7d5e5d2490014c9f83956ef0
  url: https://pypi.org/packages/source/n/nanoplot/nanoplot-1.48.0.tar.gz
test:
  commands:
  - NanoPlot --help
  imports:
  - nanoplot
