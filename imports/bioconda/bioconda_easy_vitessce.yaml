about:
  dev_url: https://github.com/vitessce/easy_vitessce
  home: https://github.com/vitessce/easy_vitessce
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A package to easily use Vitessce to create interactive plots for single-cell
    data.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - pavanvidem
package:
  name: easy_vitessce
  version: 0.0.12
requirements:
  host:
  - python >=3.12
  - hatchling >=1.26
  - pip
  run:
  - python >=3.12
  - scipy >=1.2.1
  - pandas >=1.1.2
  - black >=21.11b1
  - numpy >=1.21.2
  - zarr >=3
  - vitessce-python >=3.9.2
  - scanpy >=1.11.3
  - anndata >=0.12.10
  - spatialdata >=0.7.3
  - spatialdata-plot >=0.4.0
  - xarray >=2024.10.0
  - dask-core
  - distributed
  - donfig >=0.3.1
source:
  sha256: e58dddce848f209bb392415610b90793dc9ea9c4ac45139229a4b4049c5316fc
  url: https://pypi.org/packages/source/e/easy_vitessce/easy_vitessce-0.0.12.tar.gz
test:
  commands:
  - pip check
  imports:
  - easy_vitessce
