about:
  description: 'AmpliTrim recommends the DADA2 settings truncLenF, truncLenR and maxEE
    for

    paired-end amplicon reads by testing candidate settings on the user''s own

    reads. It replicates DADA2''s quality filter, tests real merges with vsearch,

    and writes a report with settings to paste into DADA2 in R or QIIME 2.

    '
  dev_url: https://github.com/paytonyau/amplitrim
  doc_url: https://github.com/paytonyau/amplitrim/blob/main/docs/usage.md
  home: https://github.com/paytonyau/amplitrim
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Recommends DADA2 truncation lengths and maxEE for paired-end amplicon reads
build:
  entry_points:
  - amplitrim = amplitrim.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.5281/zenodo.23860407
  recipe-maintainers:
  - paytonyau
package:
  name: amplitrim
  version: 0.4.1
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.9
  - numpy >=1.24
  - vsearch
source:
  sha256: 20debcac777b028bee528117bcd106fbeb15c46085a7f4fe51ff6e825af9eb0b
  url: https://pypi.io/packages/source/a/amplitrim/amplitrim-0.4.1.tar.gz
test:
  commands:
  - amplitrim --version
  - amplitrim --help
  - vsearch --version
  imports:
  - amplitrim
