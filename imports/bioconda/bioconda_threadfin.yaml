about:
  description: 'Threadfin takes paired single-cell RNA and receptor (BCR or TCR) sequencing
    and describes every clone by the

    distribution of its cells'' transcriptional states, so that clones, not cells,
    can be compared, mapped and tested:

    clone embeddings, clonal coherence, clonal programmes, clone-level tests and clonal
    memory.

    '
  dev_url: https://github.com/Reynold4k/Threadfin
  doc_url: https://github.com/Reynold4k/Threadfin/blob/main/docs/README.md
  home: https://github.com/Reynold4k/Threadfin
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Relationships between B-cell clones from paired single-cell RNA and BCR
    sequencing.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.5281/zenodo.23824521
  recipe-maintainers:
  - Reynold4k
package:
  name: threadfin
  version: 4.7.0
requirements:
  host:
  - python 3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - anndata >=0.10
  - numpy >=1.24
  - pandas >=2.0
  - scipy >=1.10
  - scikit-learn >=1.3
  - joblib >=1.2
  - scanpy >=1.10
  - matplotlib-base >=3.7
  - python-igraph >=0.10
  - leidenalg >=0.10
  - umap-learn >=0.5.5,<0.6
  - pynndescent >=0.5.8,<0.7
  - harmonypy >=0.0.9
source:
  sha256: 81078e82bd1c535a0890d5e6ecd69f71a2746d415ef53e9c67fd012d1bfa1d6e
  url: https://pypi.org/packages/source/t/threadfin/threadfin-4.7.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - threadfin
  requires:
  - python 3.10
  - pip
