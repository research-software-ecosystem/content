about:
  home: https://github.com/MOMA-AUH/abacus
  license: MIT
  license_file: LICENSE
  summary: A tool for analyzing Short Tandem Repeats (STRs) from Long-Read Sequencing
    data
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vv --no-deps --no-build-isolation'
extra:
  recipe-maintainers:
  - simondrue
package:
  name: abacus-str
  version: 3.0.0
requirements:
  host:
  - python 3.11
  - pip
  - setuptools >=77
  run:
  - python >=3.11
  - networkx >=3.6.1
  - numpy >=2.4.6
  - pandas >=3.1.1
  - pyfaidx >=0.9.2.2
  - levenshtein >=0.27.5
  - pysam >=0.24.1
  - rapidfuzz >=3.14.6
  - rich >=15.0.0
  - scipy >=1.17.1
  - typer >=0.29.1
  - pyspoa >=0.3.2
  - biopython >=1.88
  - minigraph >=0.21
  - r-base >=4.5.3
  - r-dplyr >=1.2.1
  - r-ggplot2 >=4.0.4
  - r-ggh4x >=0.3.1
  - r-readr >=2.2.0
  - r-stringr >=1.6.0
  - r-tibble >=3.3.1
  - r-tidyr >=1.3.2
  - r-rcolorbrewer >=1.1_3
  - r-knitr >=1.52
  - r-kableextra >=1.4.1
  - r-rmarkdown >=2.32
  - r-htmltools >=0.5.9
  - pandoc >=3.14
source:
  sha256: fcce7e1165b2ce69209e34314e99e4c6cf906f3ae690a4617e2307132c713870
  url: https://github.com/MOMA-AUH/abacus/archive/refs/tags/v3.0.0.tar.gz
test:
  commands:
  - abacus --help
  - python -c "import json, subprocess; json.loads(subprocess.check_output(['abacus','--show-catalog']));
    print('ok')"
  imports:
  - abacus
  requires:
  - pytest
  source_files:
  - tests/test_cli.py
