about:
  dev_url: https://github.com/grp-bork/meta_eukaryome_detect
  doc_url: https://grp-bork.embl-community.io/grp-microbiome-astrology/meta_eukaryome_detect/
  home: https://github.com/grp-bork/meta_eukaryome_detect
  license: MIT License
  license_family: MIT
  license_file: LICENSE
  summary: Pathogen, Parasite, Eukaryote and Virus detection in metagenomes.
build:
  entry_points:
  - meta_eukaryome_detect = meta_eukaryome_detect.cli:main
  - eukscan = meta_eukaryome_detect.cli:main
  noarch: python
  number: 0
  run_exports: null
  script: ' -m pip install . -vv --ignore-installed --no-deps'
extra:
  recipe-maintainers:
  - fullama
package:
  name: meta_eukaryome_detect
  version: 1.0.0
requirements:
  host:
  - pip
  - python >=3.11
  - poetry
  run:
  - ngless
  - samtools
  - pandas >=2.0
  - requests
source:
  sha256: fbc110880bce6c45bb87a204b9514a4091576d3c0db454ba10b5017ffa29f909
  url: https://pypi.io/packages/source/m/meta_eukaryome_detect/meta_eukaryome_detect-1.0.0.tar.gz
test:
  commands:
  - meta_eukaryome_detect --help
  - eukscan --help
  imports:
  - meta_eukaryome_detect
