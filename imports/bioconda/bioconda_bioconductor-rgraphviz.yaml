about:
  description: Interfaces R with the AT and T graphviz library for plotting R graph
    objects from the graph package.
  home: https://bioconductor.org/packages/3.23/bioc/html/Rgraphviz.html
  license: EPL
  summary: Provides plotting capabilities for R graph objects.
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:rgraphviz
  - usegalaxy-eu:rgraphviz
package:
  name: bioconductor-rgraphviz
  version: 2.56.0
requirements:
  build:
  - null
  - null
  - null
  - autoconf
  - automake
  - libtool
  - make
  - pkg-config
  - gnuconfig
  host:
  - bioconductor-graph >=1.88.0,<1.89.0
  - r-base
  - libblas
  - liblapack
  - zlib
  - liblzma-devel
  run:
  - bioconductor-graph >=1.88.0,<1.89.0
  - r-base
source:
  sha256: 7de4a7dc9a6dd875e236b45a336d923e8126dc7c1f6f03d0af294b6ffd8e2199
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Rgraphviz_2.56.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/Rgraphviz/Rgraphviz_2.56.0.tar.gz
  - https://bioarchive.galaxyproject.org/Rgraphviz_2.56.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-rgraphviz/bioconductor-rgraphviz_2.56.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('Rgraphviz')"
