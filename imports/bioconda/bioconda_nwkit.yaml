about:
  home: https://github.com/kfuku52/nwkit
  license: MIT
  license_file:
  - LICENSE
  - THIRD_PARTY_NOTICES
  summary: Tools for processing newick trees
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-build-isolation --no-deps -vv'
extra:
  recipe-maintainers:
  - kfuku52
package:
  name: nwkit
  version: 0.27.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77.0.3
  - wheel
  run:
  - python >=3.10
  - ete4 >=4.4.0
  - biopython
  - pandas
  - requests
  - numpy
  - scipy
  - matplotlib-base
source:
  sha256: 3d147b3c6471a481ff97658057e72d5eb6f865fdd5c3c18a4188d612d040ca2f
  url: https://github.com/kfuku52/nwkit/archive/refs/tags/v0.27.0.tar.gz
test:
  commands:
  - nwkit --help
  - nwkit --version
  - python -m nwkit --version
  - printf '(A:1,B:1);' | nwkit validate --fail-on-issue yes > /dev/null
  imports:
  - nwkit
