about:
  dev_url: https://github.com/compomics/DeepLC
  doc_url: https://github.com/compomics/DeepLC/blob/v4.1.0/README.md
  home: https://compomics.github.io/projects/DeepLC
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: 'DeepLC: Retention time prediction for (modified) peptides using Deep Learning.'
build:
  entry_points:
  - deeplc=deeplc.__main__:main
  - deeplc-gui=deeplc.gui:start_gui
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.1038/s41592-021-01301-5
  - biotools:deeplc
  recipe-maintainers:
  - compomics
package:
  name: deeplc
  version: 4.1.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools
  run:
  - python >=3.11
  - pytorch >=2.6.0,<3
  - numpy >=1.17,<3
  - pandas >=0.25,<3
  - scikit-learn >=1.2.0,<2
  - psm-utils >=1.5,<2
  - onnx2torch >=1.5,<2
  - click >=8,<9
  - rich >=13,<15
source:
  sha256: b7ae18c21cd3766bb3d88f9b2bdddd9c4cb2869a02fcbe7e3b5ddf0e25638251
  url: https://pypi.io/packages/source/D/DeepLC/deeplc-4.1.0.tar.gz
test:
  imports:
  - deeplc
