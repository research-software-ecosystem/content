about:
  description: 'RNAInterKin (RIKin) implements tools for the fast computation of RNA-RNA

    interaction kinetics in a detailed RNAup/IntaRNA-inspired interaction

    model, based on RNA secondary structure and the full Turner nearest-

    neighbor energy model.

    '
  home: https://github.com/s-will/rikin
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: COPYING
  summary: Fast computation of RNA-RNA interaction kinetics
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - s-will
package:
  name: rikin
  version: 0.9.7
requirements:
  build:
  - null
  - null
  - null
  - autoconf
  - automake
  - libtool
  - pkg-config
  - gengetopt
  - make
  host:
  - viennarna
  - locarna
  - zlib
  - llvm-openmp
  run:
  - viennarna
  - locarna
  - llvm-openmp
  - python >=3.9
  - numpy
  - pandas
  - scipy
  - matplotlib-base
  - seaborn
  - octave
source:
  sha256: 4eab891c98b871401e4d5163959e6f3c9621512bf57897ba62cc1d1689366545
  url: https://github.com/s-will/rikin/archive/refs/tags/v0.9.7.tar.gz
test:
  commands:
  - rikin_enum --help
  - rikin_barriers --help
  - rikin_prune --help
  - rikin_pipeline.py --help
  - rikin_plot.py --help
