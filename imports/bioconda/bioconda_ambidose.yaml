about:
  dev_url: https://github.com/leelieber2025/AmbiDose
  doc_url: https://ambidose.readthedocs.io
  home: https://github.com/leelieber2025/AmbiDose
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Per-cell ambient dose removal for droplet scRNA-seq
build:
  entry_points:
  - ambidose = ambidose.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - leelieber2025
package:
  name: ambidose
  version: 0.3.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61
  run:
  - python >=3.10
  - anndata >=0.8,<0.14
  - numpy >=1.23
  - pandas >=1.3
  - scipy >=1.7
  - h5py >=3.0
  - scanpy >=1.10
  - scikit-learn >=1.0
  - scikit-image >=0.19
  - threadpoolctl >=3.0
  - python-igraph >=0.10
  - scfair >=0.7
source:
  sha256: 0c67b1b3c67086b53dd4bddb4393b482db7514c88888d32b6f6003bf097c19c2
  url: https://pypi.io/packages/source/a/ambidose/ambidose-0.3.0.tar.gz
test:
  commands:
  - ambidose --version
  imports:
  - ambidose
