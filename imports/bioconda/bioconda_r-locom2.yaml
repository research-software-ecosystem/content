about:
  description: Testing differential abundance at individual taxa and in a whole microbial
    community based on the log-ratio of relative abundances, accommodating continuous,
    discrete, and multivariate traits with confounder adjustment.
  home: https://github.com/yijuanhu/LOCOM2
  license: GPL-2.0-or-later
  license_file: /lib/R/share/licenses/GPL-2
  summary: A Logistic Regression Model for Testing Microbial Differential Abundance
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
extra:
  recipe-maintainers:
  - MartinaCardinali
package:
  name: r-locom2
  version: '1.0'
requirements:
  build:
  - null
  - null
  - null
  - make
  host:
  - r-base
  - bioconductor-biocparallel
  - r-rcpp >=1.0.11
  - r-rcpparmadillo
  - r-abind
  - r-car
  - r-matrixstats
  - r-permute
  - libblas
  - liblapack
  run:
  - r-base
  - bioconductor-biocparallel
  - r-rcpp >=1.0.11
  - r-rcpparmadillo
  - r-abind
  - r-car
  - r-matrixstats
  - r-permute
source:
  sha256: abb48ae535928fbf88bf270478741fb8139853c6c0e2564556b3d3fce6ec3c9d
  url:
  - https://cran.r-project.org/src/contrib/LOCOM2_1.0.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/LOCOM2/LOCOM2_1.0.tar.gz
test:
  commands:
  - $R -e "library('LOCOM2')"
