about:
  home: https://github.com/NationalGenomicsInfrastructure/anglerfish
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Anglerfish, a tool to demultiplex Illumina libraries from ONT data
build:
  entry_points:
  - anglerfish=anglerfish.cli:app
  noarch: python
  number: 1
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - remiolsen
package:
  name: anglerfish
  version: 0.7.0
requirements:
  host:
  - pip
  - python
  - setuptools
  run:
  - biopython
  - minimap2 ==2.28
  - numpy
  - pandas
  - python
  - python-levenshtein
  - pyyaml
  - typer
  - typing_extensions
source:
- sha256: f756fbc32a55cc98b2fd5e315f503bdebe52d85cc36eb3d12771d0deb2fce846
  url: https://pypi.io/packages/source/b/bio_anglerfish/bio_anglerfish-0.7.0.tar.gz
- sha256: a85b16d1e4b5a7787dd0990e71f02c679fd678c8ac9d7c8a6dba3b3b58467ee2
  url: https://raw.githubusercontent.com/NationalGenomicsInfrastructure/anglerfish/refs/tags/0.7.0/requirements.txt
test:
  commands:
  - anglerfish --help
  imports:
  - anglerfish.demux
  - anglerfish.demux.demux
  - anglerfish.demux.samplesheet
