about:
  doc_url: https://scanitd.readthedocs.io
  home: https://github.com/ylab-hi/ScanITD
  license: MIT
  license_file: LICENSE
  summary: Detecting internal tandem duplication with robust variant allele frequency
    estimation
build:
  entry_points:
  - scanitd = scanitd.cli.cli:app
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.1093/gigascience/giaa089
  recipe-maintainers:
  - dolittle007
package:
  name: scanitd
  version: 0.9.3
requirements:
  build:
  - null
  - null
  - make
  host:
  - python
  - pip
  - hatchling
  run:
  - python
  - numpy >=2.0.0
  - pysam >=0.22.0
  - pyfaidx >=0.7.2
  - psutil >=5.9.5
  - loguru >=0.7.0
  - typer >=0.12.5
  - rich >=13.7.0
source:
  sha256: 24962f31888bacb01760effe2af232dc0efbd27046d4e86572c0724202605017
  url: https://pypi.io/packages/source/s/scanitd/scanitd-0.9.3.tar.gz
test:
  commands:
  - scanitd --help
  - python -c "from scanitd.ssw import AlignmentMgr; m = AlignmentMgr(); m.set_read('ACGT');
    m.set_reference('TTACGTTT'); r = m.align(); assert r.CIGAR == '4M' and r.reference_start
    == 2"
  imports:
  - scanitd
  - scanitd.ssw
