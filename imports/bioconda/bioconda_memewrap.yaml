about:
  dev_url: https://github.com/musharna/memewrap
  home: https://github.com/musharna/memewrap
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python wrappers for the MEME-suite CLI (STREME, TOMTOM, FIMO, SEA, AME).
build:
  noarch: python
  number: 0
  run_exports:
  - ''
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  recipe-maintainers:
  - musharna
package:
  name: memewrap
  version: 0.3.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10
  - numpy >=1.24
  - pandas >=2.0
  - meme >=5.4.0
source:
  sha256: 0196c62ae5e1438969008dab4bc764bdcb280a5f6b59024638836e220c96c38d
  url: https://pypi.org/packages/source/m/memewrap/memewrap-0.3.0.tar.gz
test:
  commands:
  - python -c "from memewrap import require_tools, DEFAULT_TOOLS, ENRICHMENT_TOOLS;
    require_tools(DEFAULT_TOOLS + ENRICHMENT_TOOLS)"
  imports:
  - memewrap
