about:
  description: 'SSUplex extracts small-subunit rRNA (16S/18S) sequences from environmental

    sequencing reads and sorts them by origin so each set can be routed to the

    appropriate downstream classifier. It is a Rust reimplementation of the

    Metaxa2 SSU extraction and origin-classification step, using nhmmer to scan

    both strands. HMM profiles are not bundled; build them from the Metaxa2 SSU

    profile database as described in the README.

    '
  dev_url: https://github.com/ayobi/ssuplex
  doc_url: https://github.com/ayobi/ssuplex#readme
  home: https://github.com/ayobi/ssuplex
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Fast SSU rRNA extraction and origin sorting (bacterial, archaeal, eukaryotic,
    mitochondrial, chloroplast) for eDNA reads.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.64898/2026.07.02.736232
  recipe-maintainers:
