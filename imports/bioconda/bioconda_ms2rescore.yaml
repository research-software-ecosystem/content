about:
  dev_url: https://github.com/compomics/ms2rescore
  doc_url: https://ms2rescore.readthedocs.io/en/stable
  home: https://github.com/compomics/ms2rescore
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Modular and user-friendly platform for AI-assisted rescoring of peptide
    identifications.
build:
  entry_points:
  - ms2rescore = ms2rescore.__main__:main
  - ms2rescore-gui = ms2rescore.gui.__main__:main
  - ms2rescore-report = ms2rescore.report.__main__:main
  - tims2rescore = ms2rescore.__main__:main_tims
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  container:
    extended-base: true
  recipe-maintainers:
  - CompOmics
  - RalfG
package:
  name: ms2rescore
  version: 4.0.2
requirements:
  host:
  - python >=3.11
  - uv
  - uv-build
  - pip
  run:
  - python >=3.11
  - cascade-config >=0.4.0
  - click >=7
  - customtkinter >=5,<6
  - deeplc >=4.0.0
  - im2deep >=2.0.1
  - jinja2 >=3
  - lxml >=4.5
  - ms2pip >=4.2.0
  - ms2rescore-rs >=0.5.0
  - numpy >=1.25,<3.0
  - packaging >=25.0
  - pandas >=1
  - plotly >=5
  - psm-utils >=1.1
  - pyarrow >=14
  - pyopenms >=3.3
  - pyteomics >=4.7.2
  - rich >=12
  - ristretto-ms >=0.3.0
source:
  sha256: 5a244977528750a6269aae596ba678746ed10f6534354526683d7cff19eeaaac
  url: https://pypi.org/packages/source/m/ms2rescore/ms2rescore-4.0.2.tar.gz
test:
  commands:
  - ms2rescore --help
  - ms2rescore-report --help
  - tims2rescore --help
  imports:
  - ms2rescore
