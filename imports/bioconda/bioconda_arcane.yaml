about:
  dev_url: https://gitlab.com/rahmannlab/arcane
  home: https://gitlab.com/rahmannlab/arcane
  license: MIT
  license_file: LICENSE
  summary: 'Arcane: Alignment-free single cell RNA-seq gene expression estimation'
build:
  entry_points:
  - arcane = arcane.arcane.arcane_main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - JZentgraf
package:
  name: arcane
  version: 1.0.0
requirements:
  host:
  - python >3.12
  - setuptools >=69.0.3
  - pip
  run:
  - python >3.12
  - numpy
  - numba
  - pytest
  - jsonargparse >=4.29.0
  - pip
  - llvmlite
  - clangdev
  - xz
  - tabix
  - bzip2
  - matplotlib-base
  - seaborn
  - scipy
source:
  sha256: 53f706c2f7c375adc122e8aa5eb33aecf2bf1ed0234b40003682c08ce2916ae0
  url: https://pypi.org/packages/source/s/sc-arcane/sc_arcane-1.0.0.tar.gz
test:
  commands:
  - pip check
  - arcane --help
  requires:
  - pip
  - python
