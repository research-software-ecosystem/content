about:
  dev_url: https://github.com/treangenlab/somatem
  doc_url: https://github.com/treangenlab/somatem#readme
  home: https://github.com/treangenlab/somatem
  license: GPL-3.0
  license_file: LICENSE
  summary: Best practices pipeline for long-read metagenomics analysis.
build:
  noarch: generic
  number: 0
extra:
  notes: 'Somatem installs a wrapper command that launches bundled Nextflow workflows
    from

    $PREFIX/share/somatem-0.8.1. Use `somatem --help` to see supported

    workflow shortcuts and common arguments.

    '
  recipe-maintainers:
  - ppreshant
  - microbemarsh
  skip-lints:
  - missing_run_exports
  watch:
    enable: true
package:
  name: somatem
  version: 0.8.1
requirements:
  run:
  - bash
  - nextflow >=26.04.4
  - micromamba
  - coreutils
source:
  sha256: 18ee6a8d1a8108419f5214088438e35a82616fa143e7e9ee7b39fc93bd40fb4e
  url: https://github.com/treangenlab/somatem/archive/refs/tags/v0.8.1.tar.gz
test:
  commands:
  - somatem --help
  - test -f "${PREFIX}/share/somatem-0.8.1/main.nf"
  - test -f "${PREFIX}/share/somatem-0.8.1/nextflow.config"
  - test -f "${PREFIX}/bin/somatem"
