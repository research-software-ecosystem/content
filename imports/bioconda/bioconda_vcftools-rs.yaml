about:
  description: 'vcftools-rs computes allele frequencies, heterozygosity, Hardy-Weinberg

    tests, missingness, nucleotide diversity, Tajima''s D and Weir & Cockerham

    Fst from VCF files, with output byte-identical to VCFtools 0.1.17 and

    the same command-line options, using all CPU cores.

    '
  dev_url: https://github.com/realwalju/vcftools-rs
  home: https://github.com/realwalju/vcftools-rs
  license: LGPL-3.0-only
  license_family: LGPL
  license_file:
  - COPYING.LESSER
  - COPYING
  - THIRDPARTY.yml
  summary: Unofficial, byte-identical, parallel reimplementation of VCFtools population-genetics
    statistics.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - realwalju
package:
  name: vcftools-rs
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 842e7bf8681ff9777510e454b8b95d631c6450199af3554a74819c01eb702e29
  url: https://github.com/realwalju/vcftools-rs/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - vcftools-rs --version
  - vcftools-rs --help
