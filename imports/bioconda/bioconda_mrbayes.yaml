about:
  description: 'MrBayes is a program for Bayesian inference and model choice across
    a wide

    range of phylogenetic and evolutionary models. MrBayes uses Markov chain

    Monte Carlo (MCMC) methods to estimate the posterior distribution of model

    parameters.

    '
  dev_url: https://github.com/NBISweden/MrBayes
  doc_url: https://nbisweden.github.io/MrBayes
  home: https://github.com/NBISweden/MrBayes
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: COPYING
  summary: Bayesian Inference of Phylogeny
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:mrbayes
  - usegalaxy-eu:mrbayes
  - doi:10.1093/bioinformatics/17.8.754
package:
  name: mrbayes
  version: 3.2.8
requirements:
  build:
  - null
  - null
  - make
  - pkg-config
  - gnuconfig
  host:
  - readline
  - openmpi
  - beagle-lib <4
  - ncurses
  run:
  - readline
  - openmpi
  - beagle-lib <4
  - ncurses
source:
  sha256: 331ceb0af036d07cd8bd7091d39632f6d102d8b98c160409d19df3958db85dc2
  url: https://github.com/NBISweden/MrBayes/archive/v3.2.8.tar.gz
test:
