about:
  description: "nabla finds the Longest Common Subsequence (LCS) of two record or\
    \ text\nsequences, selecting automatically among four algorithms \u2014 Myers,\n\
    Hunt-Szymanski, RickSpace, or RickTime \u2014 based on the input's edit\ndistance,\
    \ match count, and alphabet size.  It is able to read FASTA (-F)\nand can emit\
    \ SAM CIGAR alignments (-G), so nucleotide and protein\nsequences can be compared.\
    \  The nabla64 build lifts the 32-bit (4G)\nlength limitation for very long genome\
    \ inputs.\n"
  home: https://github.com/CNHume/nabla
  license: LGPL-3.0-or-later
  license_file:
  - cli/LICENSES/COPYING_LESSER.txt
  - cli/LICENSES/COPYING.txt
  summary: Longest Common Subsequence of two sequences or files, supporting whole-genome
    scale FASTA input and CIGAR output.
