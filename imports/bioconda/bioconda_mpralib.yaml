about:
  home: https://github.com/kircherlab/MPRAlib
  license: MIT
  license_file: LICENSE
  summary: Library to analyze count data of MPRA experiments.
build:
  entry_points:
  - mpralib = mpralib.cli:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - visze
package:
  name: mpralib
  version: 0.11.3
requirements:
  host:
  - python >=3.10,<3.15
  - setuptools
  - wheel
  - pip
  run:
  - python >=3.10,<3.15
  - numpy
  - pandas
  - click
  - scikit-learn
  - scipy
  - anndata >=0.11.3
  - seaborn
  - matplotlib-base
  - jsonschema
  - tqdm
source:
  sha256: e3497a30f141d4d662e58529992675ab76e013f7a4d440a5e566222d56c058aa
  url: https://pypi.org/packages/source/m/mpralib/mpralib-0.11.3.tar.gz
test:
  commands:
  - pip check
  - mpralib --help
  imports:
  - mpralib
  requires:
  - pip
