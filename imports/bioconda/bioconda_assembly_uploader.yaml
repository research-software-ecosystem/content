about:
  doc_url: https://github.com/EBI-Metagenomics/assembly_uploader/blob/main/README.md
  home: https://github.com/EBI-Metagenomics/assembly_uploader
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Python scripts to upload primary metagenome and metatranscriptome assemblies
    to ENA on a per-study basis. The scripts generate xmls to register a new study
    and create manifests necessary for submission with webin-cli.
build:
  entry_points:
  - study_xmls = assembly_uploader.study_xmls:main
  - submit_study = assembly_uploader.submit_study:main
  - assembly_manifest = assembly_uploader.assembly_manifest:main
  - release_study = assembly_uploader.release_study:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - ochkalova
  - Ge94
  - KateSakharova
package:
  name: assembly_uploader
  version: 1.3.6
requirements:
  host:
  - python >=3.8
  - setuptools >=61.0.0
  - pip
  run:
  - python >=3.8
  - requests ==2.32.3
  - click >=8.1.8
  - mgnify-pipelines-toolkit >=1.4.5
  - ena-webin-cli >=9.0.1
source:
  sha256: 9d937d746e93fcb217e9daaaf9e8832883eb969da053ec4c71d6393e5873d785
  url: https://pypi.org/packages/source/a/assembly_uploader/assembly_uploader-1.3.6.tar.gz
test:
  commands:
  - study_xmls --help
  - submit_study --help
  - assembly_manifest --help
  - release_study --help
  - webin_cli_handler --help
  imports:
  - assembly_uploader
