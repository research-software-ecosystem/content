about:
  dev_url: https://github.com/jfjlaros/tssv
  doc_url: https://tssv.readthedocs.io/en/latest
  home: https://github.com/jfjlaros/tssv
  license: MIT
  license_family: MIT
  summary: Targeted characterisation of short structural variation.
build:
  entry_points:
  - tssv = tssv.cli:main
  - tannotate = tssv_extras.annotate:main
  number: 0
  run_exports:
  - null
  script:
  - export CFLAGS="${CFLAGS} -DNO_SSE -O3 -Xlinker -zmuldefs"
  - export CFLAGS="${CFLAGS} -DNO_SSE -O3"
  - -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - Redmar-van-den-Berg
package:
  name: tssv
  version: 1.2.1
requirements:
  build:
  - null
  - null
  host:
  - pip
  - setuptools <82
  - python
  run:
  - biopython >=1.72
  - python
  - setuptools <82
  - requests
  - xopen
  - setuptools
source:
  sha256: e37e35c18469c4a96dabb973392b87cc0d6a0c31a56d033ab62795877c110a9e
  url: https://pypi.org/packages/source/t/tssv/tssv-1.2.1.tar.gz
test:
  commands:
  - tssv -h
