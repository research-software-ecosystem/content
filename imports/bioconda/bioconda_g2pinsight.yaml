about:
  dev_url: https://github.com/ZBaoyi/G2PInsight
  doc_url: https://github.com/ZBaoyi/G2PInsight
  home: https://github.com/ZBaoyi/G2PInsight
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Genome-wide association / genotype-to-phenotype analysis toolkit
build:
  entry_points:
  - G2PInsight = G2PInsight.main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - ZBaoyi
package:
  name: g2pinsight
  version: 1.1.7
requirements:
  host:
  - python >=3.8,<3.14
  - pip
  - setuptools >=65
  - wheel
  run:
  - python >=3.8,<3.14
  - numpy >=1.20
  - pandas >=1.3
  - scikit-learn >=1.0
  - scipy >=1.7
  - joblib >=1.0
  - matplotlib-base >=3.5
  - pillow >=8,<12.3
  - numba >=0.57
  - lightgbm >=3.3,<4.0
  - xgboost >=1.6,<2.1
  - catboost >=1.2,<2.0
  - shap >=0.40
  - plotly >=5.0
  - python-kaleido >=0.2,<1
  - seaborn >=0.11
  - bed-reader >=1.0
  - psutil >=5.0
source:
  sha256: 9a1b426b714e94db47b41cd56b05f8c0fc1841a721c85031790ebab27515ce5b
  url: https://pypi.io/packages/source/g/g2pinsight/g2pinsight-1.1.7.tar.gz
test:
  commands:
  - G2PInsight --version
  - G2PInsight --help
  imports:
  - G2PInsight
