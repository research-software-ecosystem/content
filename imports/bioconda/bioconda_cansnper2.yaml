about:
  home: https://github.com/FOI-Bioinformatics/CanSNPer2
  license: GPLv3
  license_family: GPL3
  license_file: LICENSE
  summary: A toolkit for SNP-typing bacterial genomes.
build:
  entry_points:
  - CanSNPer2=CanSNPer2.CanSNPerTree:main
  - CanSNPer2-database=CanSNPer2.SNPDatabase:main
  - CanSNPer2-download=CanSNPer2.DownloadGenomes:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: python -m pip install --no-deps --ignore-installed .
extra:
  recipe-maintainers:
  - druvus
package:
  name: cansnper2
  version: 2.4.0
requirements:
  host:
  - pip
  - python >3
  - flextaxd >=0.2.1
  - ete3
  run:
  - python >3
source:
  sha256: 080f559a802f04150150de76912d66520cbb4fcd63c665b6cd759644a99dd8b5
  url: https://github.com/FOI-Bioinformatics/CanSNPer2/archive/v2.4.0.tar.gz
test:
  commands:
  - CanSNPer2 --help
  - CanSNPer2-database --help
  - CanSNPer2-download --help
