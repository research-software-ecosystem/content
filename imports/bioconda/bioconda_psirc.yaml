about:
  dev_url: https://github.com/nictru/psirc
  doc_url: https://github.com/nictru/psirc/blob/master/README.md
  home: https://github.com/nictru/psirc
  license: MIT AND BSD-3-Clause AND BSD-2-Clause AND LicenseRef-kallisto-b-non-commercial
  license_file:
  - LICENSE
  - psirc-quant/license.txt
  - kallisto-b/license.txt
  summary: Full-length linear and circular transcript isoform reconstruction and quantification.
build:
  number: 2
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  identifiers:
  - doi:10.1101/gr.275348.121
  notes: 'The bundled kallisto fork is compiled from source and installed as kallisto_b.

    Pass kallisto_b explicitly as the positional kallisto argument to psirc.

    The fork''s license permits educational and research not-for-profit use;

    commercial use requires a separate license (see kallisto-b/license.txt).

    '
  recipe-maintainers:
  - nictru
package:
  name: psirc
  version: 1.0.0
requirements:
  build:
  - null
  - null
  - null
  - cmake <4.0
  - make
  host:
  - htslib
  - hdf5
  - zlib
  run:
  - perl
source:
- sha256: feb67bf60b68c2207e46c81a7b2340c4beb0af7af1bbc44c7669f28aac0ecc50
  url: https://github.com/nictru/psirc/archive/9046acc666c971eea17b6da9112beb3bed8000dc.zip
- folder: kallisto-b
  sha256: f96a117a946bd8a85f0f9909e3f79c98a8d5bdf79ade10b083f7e3761cdb29e1
  url: https://github.com/Christina-hshi/kallisto-b/archive/1ed5583ba5f1e964932556fb1b001709ad648648.tar.gz
test:
  commands:
  - psirc-quant cite
  - psirc-quant version
  - perl -MFAlite -e 1
  - perl -c "$(command -v psirc)"
  - perl -c "$(command -v create_custom_transcriptome_fa.pl)"
  - kallisto_b version
