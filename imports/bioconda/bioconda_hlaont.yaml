about:
  description: 'hlaont types HLA genes (classical, non-classical and pseudogenes),
    C4A/C4B

    copy number and candidate novel alleles from Oxford Nanopore R10 long reads,

    from FASTQ or aligned BAM/CRAM input.

    '
  dev_url: https://github.com/aleixcanalda/hlaont
  home: https://github.com/aleixcanalda/hlaont
  license: MIT AND GPL-3.0-only
  license_family: OTHER
  license_file:
  - LICENSE
  - src/hlaont/resources/anchors/vendor/FUFIHLA_LICENSE
  - src/hlaont/resources/models/vendor/BADREAD_LICENSE
  summary: Confidence-aware full-field HLA typing from ONT R10 long reads
build:
  entry_points:
  - hlaont = hlaont.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - aleixcanalda
package:
  name: hlaont
  version: 0.1.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.11
  - pysam
  - numpy
  - pyyaml
  - minimap2
  - samtools
source:
  sha256: 2a7defca2551963e0466f6a5582aa06fe9f8f711867c9c64a8a93070f16cbec0
  url: https://pypi.org/packages/source/h/hlaont/hlaont-0.1.0.tar.gz
test:
  commands:
  - hlaont --help
  - hlaont run --help
  - minimap2 --version
  - samtools --version
  imports:
  - hlaont
  - hlaont.cli
  - hlaont.stages.pipeline
