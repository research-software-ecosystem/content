about:
  description: A computational oncology framework and bedside decision engine modeling
    microvascular pharmacological sanctuaries, Bessel K0 continuous reaction-diffusion
    drug gradients, ctDNA lead time kinetics, and multicenter survival models in targeted
    solid oncology.
  dev_url: https://github.com/Lukecele/inflammatory-onco-physics
  home: https://github.com/Lukecele/inflammatory-onco-physics
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Continuous reaction-diffusion solver and survival pipeline for microvascular
    pharmacological sanctuaries.
build:
  entry_points:
  - oncophysics-calc = app_bedside_calculator:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.5281/zenodo.24118327
  - biotools:inflammatory-onco-physics
  recipe-maintainers:
  - Lukecele
package:
  name: inflammatory-onco-physics
  version: 1.2.0
requirements:
  host:
  - python >=3.10
  - setuptools >=61.0
  - pip
  run:
  - python >=3.10
  - numpy >=1.23.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - lifelines >=0.28.0
  - matplotlib-base >=3.6.0
  - seaborn >=0.12.0
  - scikit-learn >=1.2.0
source:
  sha256: b1e3561aab7762ada2aa7b2f21f58c18add0bdd0f466aaaafdc80d5259154553
  url: https://github.com/Lukecele/inflammatory-onco-physics/archive/refs/tags/v1.2.0.tar.gz
test:
  commands:
  - oncophysics-calc --help
