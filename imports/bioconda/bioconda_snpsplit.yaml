about:
  description: 'SNPsplit sorts reads from hybrid samples by parental origin, using
    known SNP positions.

    Since 1.0.0 it is a single Rust binary installed as SNPsplit, with tag2sort and

    SNPsplit_genome_preparation linked to it. The Perl version remains available as

    snpsplit=0.9.2.

    '
  dev_url: https://github.com/FelixKrueger/SNPsplit
  doc_url: https://felixkrueger.github.io/SNPsplit
  home: https://github.com/FelixKrueger/SNPsplit
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - rust/THIRD-PARTY-NOTICES.md
  summary: Allele-specific alignment sorter for reads covering known SNP positions.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.12688/f1000research.9037.2
  recipe-maintainers:
  - FelixKrueger
package:
  name: snpsplit
  version: 1.0.0
requirements:
  build:
  - null
  - null
  - null
source:
  sha256: 4688f2493fd7781289121f15d33061beb8e2c6b93f64b69e7e121e562f50af8a
  url: https://github.com/FelixKrueger/SNPsplit/archive/refs/tags/snpsplit-rust-v1.0.0.tar.gz
test:
  commands:
  - 'SNPsplit --version | grep -q "Version: 1.0.0"'
  - 'tag2sort --version | grep -q "version: 1.0.0"'
  - 'SNPsplit_genome_preparation --version | grep -q "version: 1.0.0"'
