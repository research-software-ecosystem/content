about:
  dev_url: https://github.com/jmschrei/tangermeme
  home: https://github.com/jmschrei/tangermeme
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Biological sequence analysis for the modern age.
build:
  entry_points:
  - tangermeme-install-skills = tangermeme._skills.install:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  recipe-maintainers:
  - musharna
package:
  name: tangermeme
  version: 1.6.0
requirements:
  host:
  - python >=3.10
  - pip
  - hatchling >=1.21
  run:
  - python >=3.10
  - figwig >=0.1.0
  - joblib >=1.3
  - matplotlib-base >=3.7
  - memelite >=0.2
  - numba >=0.58
  - numpy >=1.23
  - pandas >=2.0
  - pyfaidx >=0.7.2.1
  - scikit-learn >=1.3
  - scipy >=1.10
  - pytorch >=2.0
  - tqdm >=4.65
source:
  sha256: 740f37cdb7d7e5084affadd80209c8ac199b063d0c6920bce77191ebfde7767c
  url: https://pypi.org/packages/source/t/tangermeme/tangermeme-1.6.0.tar.gz
test:
  commands:
  - pip check
  - tangermeme-install-skills --print-path
  imports:
  - tangermeme
  - tangermeme.ersatz
  - tangermeme.predict
  - tangermeme.deep_lift_shap
  requires:
  - pip
