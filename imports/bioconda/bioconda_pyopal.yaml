about:
  dev_url: https://github.com/althonos/pyopal
  doc_url: https://pyopal.readthedocs.org
  home: https://github.com/althonos/pyopal
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Cython bindings and Python interface to Opal, a SIMD-accelerated pairwise
    aligner.
build:
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - althonos
package:
  name: pyopal
  version: 0.7.4
requirements:
  build:
  - null
  - null
  - null
  - cmake
  - make
  host:
  - python
  - pip
  - cython
  - scikit-build-core
  - scoring-matrices >=0.2
  run:
  - python
  - archspec
  - scoring-matrices >=0.2
source:
  sha256: c4c69fc4e71b258979fa0fd4a4bfd6933d104dc4823b9270b512b74d3bd9c49d
  url: https://pypi.org/packages/source/p/pyopal/pyopal-0.7.4.tar.gz
test:
  commands:
  - python -m unittest -vv pyopal.tests
  imports:
  - pyopal
