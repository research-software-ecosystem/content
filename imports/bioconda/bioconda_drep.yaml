  - numpy
  - pandas
  - seaborn-base
  - matplotlib-base
  - biopython
  - scikit-learn
  - tqdm
  - pytest
  - networkx
  - mummer4
  - mash
  - prodigal
  - fastani
  - checkm-genome
  - skani
source:
  sha256: f02a821dab48bbc4090ed88af2f5efd05ae412e7acd8b1d7350e1425083f23c8
