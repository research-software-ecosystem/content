about:
  doc_url: https://panorama.readthedocs.io
  home: https://github.com/labgem/PANORAMA
  license: CeCiLL-2.1
  license_file: LICENSE
  summary: A robust pangenome-based method for predicting and comparing biological
    systems across species.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install --no-deps --ignore-installed -vv .
extra:
  recipe-maintainers:
  - jpjarnoux
  - JeanMainguy
package:
  name: panorama
  version: 1.0.4
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - ppanggolin >=2.1.0
  - pyhmmer >=0.6
  - lxml >=4.9.2
  - selenium >=4.35.0
  - geckodriver >=0.36.0
source:
  sha256: 5262d6ba8086665655fa7a043a9115866f485a83a0cda7aa1e92a82f15e90775
  url: https://github.com/labgem/PANORAMA/archive/1.0.4.tar.gz
test:
  commands:
  - panorama -h
  imports:
  - panorama
