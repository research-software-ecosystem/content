about:
  description: 'GAIn annotates genomic variants with scores and gene models from a

    Genomic Resource Repository (GRR), and manages GRRs.

    '
  dev_url: https://github.com/iossifovlab/gain
  doc_url: https://iossifovlab.com/gaindocs/
  home: https://github.com/iossifovlab/gain
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'GAIn: Genomic Annotation Infrastructure'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - lchorbadjiev
  - iossifov
package:
  name: gain-core
  version: 2026.10.2
requirements:
  host:
  - python 3.12
  - pip
  - hatchling
  - hatch-vcs
  run:
  - python >=3.12
  - anndata >=0.13
  - apsw >=3.52
  - cerberus >=1.3
  - dask-core >=2026.1
  - dask-jobqueue >=0.9
  - distributed >=2026.1
  - docker-py >=7.1
  - filelock >=3.19
  - fsspec >=2026.2
  - h5py >=3.11
  - intervaltree
  - jinja2 >=3.1
  - lark >=1.2
  - markdown2 >=2.4
  - matplotlib-base >=3.8
  - networkx >=3.6
  - numpy >=2.2
  - openpyxl >=3.1
  - packaging
  - pandas >=2.2
  - pathspec >=1.0
  - psutil
  - pybigwig >=0.3
  - pydantic >=2.8
  - pyliftover >=0.4
  - pysam >=0.24
  - python-box >=7.1
  - pyyaml >=6
  - s3fs >=2026.2
  - scipy >=1.14
  - tqdm >=4.66
source:
- sha256: 277d1d76554da2ae8cb6210e5169ff48cf9627f03edcfb271df05818cc8d8c0f
  url: https://pypi.org/packages/source/g/gain-core/gain_core-2026.10.2.tar.gz
- sha256: d34f0ed158e21799db86c8de595c4b957c05792b6f99a220cb6eb2f141c5e39a
  url: https://raw.githubusercontent.com/iossifovlab/gain/2026.10.2/LICENSE
test:
  commands:
  - python -c "import importlib.metadata as m; v = m.version('gain-core'); assert
    v == '2026.10.2', v"
  - python -c "from importlib.metadata import distribution as d; eps = [e for e in
    d('gain-core').entry_points if e.group == 'console_scripts' or e.group.startswith('gain.')];
    [e.load() for e in eps]; assert eps; print(len(eps), 'entry points loaded')"
  - grr_manage --help
  - annotate_vcf --help
  - pip check
  requires:
  - python 3.12
  - pip
