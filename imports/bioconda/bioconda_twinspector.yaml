about:
  home: https://github.com/clementlab/TwInsPEctor
  license: MIT
  license_file: LICENSE
  summary: 'TwInsPEctor: A tool for twin prime editing analysis.'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
package:
  name: twinspector
  version: 0.2.0
requirements:
  host:
  - python
  - pip
  - setuptools
  - wheel
  run:
  - python >=3.8
  - numpy
  - crispresso2
  - pandas
  - matplotlib-base
  - seaborn
source:
  sha256: 1ab8c56864f1573517c524927fb82155d3716cea31b4df1afdc35701af161776
  url: https://github.com/clementlab/TwInsPEctor/archive/v0.2.0.tar.gz
test:
  commands:
  - TwInsPEctor -h
  imports:
  - TwInsPEctor
