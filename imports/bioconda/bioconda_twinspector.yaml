about:
  home: https://github.com/clementlab/TwInsPEctor
  license: MIT
  license_file: LICENSE
  summary: 'TwInsPEctor: A tool for twin prime editing analysis.'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
package:
  name: twinspector
  version: 0.1.4
requirements:
  host:
  - python
  - pip
  - setuptools
  - wheel
  run:
  - python >=3.8
  - numpy
  - crispresso2
  - pandas
  - matplotlib-base
  - seaborn
source:
  sha256: a6b3761194a8ec3a6131b7415c6ab854de9ce685baa57b7baca754f164a245cd
  url: https://github.com/clementlab/TwInsPEctor/archive/v0.1.4.tar.gz
test:
  commands:
  - TwInsPEctor -h
  imports:
  - TwInsPEctor
