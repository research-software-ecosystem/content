about:
  home: https://github.com/pinellolab/CRISPRitz
  license: LicenseRef-MGBOA-1.0
  license_family: OTHER
  license_file: LICENSE
  summary: CRISPRitz enumeration engine for CRISPR off-target search (index / search
    / add-variants).
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  recipe-maintainers:
  - lucapinello
  - ManuelTgn
package:
  name: crispritz
  version: 2.10.0
requirements:
  build:
  - null
  - null
  - libgomp
  - llvm-openmp
  - make
  host:
  - zlib
  - python >=3.11,<3.12
  run:
  - pandas
  - bcftools
  - boost-cpp
  - openmp
  - zlib
  - python >=3.11,<3.12
  run_constrained:
  - crisprme >=2.10.0
source:
  sha256: a3d7ce8936d2a882d788a47f03fde2fbbd038f10a2a27340f94c3011ba4338b2
  url: https://github.com/pinellolab/CRISPRitz/archive/v2.10.0.tar.gz
test:
  commands:
  - crispritz.py
  - crispritz.py index-genome help
  - crispritz.py search help
  - crispritz.py add-variants help
  - crispritz.py index-info help
  - crispritz.py version
  - test -x "$PREFIX/bin/enricher"
  - test -x "$PREFIX/opt/crispritz/Python_Scripts/Enrichment/enricher"
