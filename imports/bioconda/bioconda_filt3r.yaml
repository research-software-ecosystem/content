  - filt3r -h
  - test -f "$PREFIX/share/filt3r-20260717/flt3_exon14-15.fa"
  - filt3r -k 12 --ref "$PREFIX/share/filt3r-20260717/flt3_exon14-15.fa" --sequences
    "$PREFIX/share/filt3r-20260717/flt3_exon14-15.fa" --out result.json && test -s
    result.json
