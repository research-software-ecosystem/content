about:
  description: 'gwyddionpy reads scanning probe microscopy (SPM) files into NumPy
    arrays.

    It reads `.gwy` files by itself. For vendor formats, also install

    `gwyconvert`, which provides the GPL `gwyconvert` binary.

    '
  dev_url: https://github.com/FAIRmat-NFDI/gwyddionPy
  home: https://github.com/FAIRmat-NFDI/gwyddionPy
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Read any Gwyddion-supported SPM raw file into NumPy via the gwyconvert
    helper.
build:
  entry_points:
  - gwyddionpy-fetch-converter = gwyddionpy._fetch_converter:_main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vvv
extra:
  recipe-maintainers:
  - RubelMozumder
package:
  name: gwyddionpy
  version: 0.1.1
requirements:
  host:
  - python
  - pip
  - setuptools >=78.1.1
  - setuptools-scm >=6.2
  run:
  - python >=
  - numpy >=1.22
  - gwyfile >=0.3
  - platformdirs >=3.0
  run_constrained:
  - gwyconvert ==0.1.1
source:
  sha256: 9295b0f9b4d57f9830db64f924ac15b7e33c1f23de94202e7092815171ce399a
  url: https://pypi.org/packages/source/g/gwyddionpy/gwyddionpy-0.1.1.tar.gz
test:
  imports:
  - gwyddionpy
  requires:
  - python
