about:
  home: https://github.com/COMBINE-lab/piscem
  license: BSD 3-Clause
  license_file: LICENSE
  summary: piscem is a next-generation compacted colored de Bruijn Graph-based indexer
    and mapper
build:
  number: 0
  run_exports:
  - null
  script_env:
  - CFLAGS=-I$PREFIX/include
  - CXXFLAGS=-I$PREFIX/include
  - LDFLAGS=-L$PREFIX/lib
  skip: true
channels:
- conda-forge
- bioconda
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  skip-lints:
  - compiler_needs_stdlib_c
package:
  name: piscem
  version: 0.22.1
requirements:
  build:
  - cmake <4.0.0
  - autoconf
  - make
  - bzip2
  - jemalloc >=5.2.1
  - null
  - null
  - pkg-config
  - curl
  - tapi
  host:
  - bzip2
  - jemalloc >=5.2.1
  - tapi
  run:
  - __osx >=10.9
source:
  sha256: 1df105440850a5cd7259243019e0c9313971156f2d069f2da1cb980c379fd36d
  url: https://github.com/COMBINE-lab/piscem/releases/download/v0.22.1/source-full.tar.gz
test:
  commands:
  - piscem --help
