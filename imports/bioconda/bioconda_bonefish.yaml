about:
  description: 'bonefish aligns Oxford Nanopore reads (FASTQ, FASTA or dorado BAM)
    to a reference and

    writes SAM, PAF or a coordinate-sorted, indexed BAM. Genomic DNA uses minimap2''s
    lr:hq

    seeding and scoring with cheaper chaining and alignment, validated against GIAB
    truth sets;

    direct RNA and cDNA (-x rna, -x cdna) use minimap2''s spliced presets with faster
    intron

    alignment, validated against minimap2, GENCODE and simulated reads.

    '
  dev_url: https://github.com/DylanCosto/bonefish
  doc_url: https://github.com/DylanCosto/bonefish/blob/main/docs/tutorial.md
  home: https://github.com/DylanCosto/bonefish
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Fast aligner for Oxford Nanopore DNA, direct RNA and cDNA reads, with minimap2-level
    accuracy.
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: bonefish
  version: 0.4.0
requirements:
  build:
  - null
  - null
  - null
  - make
  - cargo-bundle-licenses
