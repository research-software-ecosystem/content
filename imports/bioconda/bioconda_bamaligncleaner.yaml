about:
  dev_url: https://github.com/maxibor/bamAlignCleaner
  home: https://github.com/maxibor/bamAlignCleaner
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Removes unaligned references in BAM alignment file.
build:
  entry_points:
  - bamAlignCleaner= bamaligncleaner.cli:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - maxibor
package:
  name: bamaligncleaner
  version: '0.4'
requirements:
  host:
  - pip
  - python >=3.6
  - setuptools
  run:
  - click
  - pysam
  - python >=3.6
  - tqdm
source:
  sha256: e2634a2d645faea292f77953d174d1a4f33f00ff9a7e7997470ccb13f4693d87
  url: https://pypi.org/packages/source/b/bamAlignCleaner/bamaligncleaner-0.4.tar.gz
test:
  commands:
  - bamAlignCleaner --help
  imports:
  - bamaligncleaner
