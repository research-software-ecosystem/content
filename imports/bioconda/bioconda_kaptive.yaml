about:
  dev_url: https://github.com/klebgenomics/Kaptive
  doc_url: https://klebgenomics.github.io/Kaptive/
  home: https://klebgenomics.github.io/Kaptive/
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Reports information about surface polysaccharide loci for bacterial genome
    assemblies.
build:
  entry_points:
  - kaptive = kaptive.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - tomdstanton
package:
  name: kaptive
  version: 3.3.2
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  - hatch-vcs
  run:
  - python >=3.11
  - numpy >=2.4
  - numba >=0.62
  - rammappy >=0.1.3
  - gb-io >=0.4
  - orjson
  - plotly
source:
  sha256: 11213da2f1c7025af315c34ea943a7a1f813b014ee01532112f6418ccccee25a
  url: https://pypi.org/packages/source/k/kaptive/kaptive-3.3.2.tar.gz
test:
  commands:
  - kaptive --help
  imports:
  - kaptive
