about:
  dev_url: https://github.com/xuxocast/hapolish
  doc_url: https://github.com/xuxocast/hapolish/blob/main/README.md
  home: https://github.com/xuxocast/hapolish
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Chromosome assignment and CenSat-boundary estimation for diploid T2T assemblies
    aligned to CHM13, with optional coverage-maximizing haplotype polishing.
build:
  entry_points:
  - hapolish = hapolish.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
package:
  name: hapolish
  version: 0.1.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  - wheel
  run:
  - python >=3.10
  - polars >=0.20
  - pyfaidx >=0.7
  - minimap2 >=2.24
  - winnowmap >=2.03
  - meryl >=1.3
source:
  path: ..
  sha256: c1f3cc27158f3e43e73e11b45a9673a56fa62d7b6dc4c4f06f42e6e02f1523c7
  url: https://github.com/xuxocast/hapolish/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - hapolish --version
  - hapolish --help
  - hapolish run --help
  - hapolish align --help
  - hapolish censat --help
  - hapolish assign --help
  - hapolish polish --help
