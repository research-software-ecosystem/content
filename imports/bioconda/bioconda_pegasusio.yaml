about:
  dev_url: https://github.com/lilab-bcb/pegasusio
  doc_url: https://pegasusio.readthedocs.io
  home: https://github.com/lilab-bcb/pegasusio
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: PegasusIO is the IO package for Pegasus.
build:
  entry_points:
  - pegasusio = pegasusio.__main__:main
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.11.0
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - yihming
  - bli25
package:
  name: pegasusio
  version: 0.11.0
requirements:
  build:
  - null
  - null
  host:
  - python >=3.11
  - python <3.14
  - cython
  - numpy >=2.0.0
  - setuptools
  - setuptools_scm
  - pip
  run:
  - python >=3.11
  - python <3.14
  - numpy >=2.0.0
  - pandas >=1.2.0
  - anndata >=0.12
  - h5py >=3.0.0
  - loompy
  - docopt
  - natsort
  - scipy
  - zarr >=3.1,<4
  - pillow
source:
  sha256: 3b183ecfe33f524fe6257e573b612d16c8bde0dda34cc3a539879efb176775a3
  url: https://pypi.io/packages/source/p/pegasusio/pegasusio-0.11.0.tar.gz
test:
  commands:
  - pegasusio --help
  imports:
  - pegasusio
  - pegasusio.commands
  - pegasusio.cylib.funcs
  - pegasusio.cylib.io
  requires:
  - pip
