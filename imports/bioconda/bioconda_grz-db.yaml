about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  summary: SQL models for grz-cli and grz-watchdog
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - Hoeze
package:
  name: grz-db
  version: 4.0.1
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - alembic >=1.16.1
  - cryptography >=50.0.1
  - sqlmodel >=0.0.38
  - grz-pydantic-models >=4.1,<5
  - psycopg >=3.2,<4
source:
  sha256: 259555c553fc22a54337546c8e124a5e778760184b11b1791d2a0e37e2bdcd98
  url: https://pypi.org/packages/source/g/grz-db/grz_db-4.0.1.tar.gz
test:
  commands:
  - pip check
  imports:
  - grz_db
  requires:
  - pip
