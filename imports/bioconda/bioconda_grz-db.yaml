about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  summary: SQL models for grz-cli and grz-watchdog
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - Hoeze
package:
  name: grz-db
  version: 4.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - alembic >=1.16.1
  - cryptography >=50.0.1
  - sqlmodel >=0.0.38
  - grz-pydantic-models >=4,<5
  - psycopg >=3.2,<4
source:
  sha256: 7333b25f6791c173d6207eede9bccf0738acb20bd6b219702a489d9a3962caf7
  url: https://pypi.org/packages/source/g/grz-db/grz_db-4.0.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - grz_db
  requires:
  - pip
