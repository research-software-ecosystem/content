about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  summary: SQL models for grz-cli and grz-watchdog
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - Hoeze
package:
  name: grz-db
  version: 3.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - alembic >=1.16.1
  - cryptography >=45.0.3,<49
  - sqlmodel >=0.0.38
  - grz-pydantic-models >=3,<4
  - psycopg >=3.2,<4
source:
  sha256: 4c2790778e19d11f1bd64877456b42f7c4d6c52cad1b4a6abaf789554cccb5d9
  url: https://pypi.org/packages/source/g/grz-db/grz_db-3.0.0.tar.gz
test:
  commands:
  - pip check
  imports:
  - grz_db
  requires:
  - pip
