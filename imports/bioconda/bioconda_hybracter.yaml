about:
  dev_url: https://github.com/gbouras13/hybracter
  doc_url: https://hybracter.readthedocs.io/en/latest
  home: https://github.com/gbouras13/hybracter
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: An automated long-read first bacterial genome assembly pipeline.
build:
  entry_points:
  - hybracter=hybracter.__main__:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - gbouras13
package:
  name: hybracter
  version: 0.14.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools
  run:
  - python >=3.9
  - snakemake-minimal >=7.14.0
  - pyyaml >=6.0
  - click >=8.1.3
  - attrmap >=0.0.5
  - biopython >=1.76
  - minimap2 >=2.26
source:
  sha256: 27f67b33d7dc661705515efdad4cf9606b98ba3eec9f4e9e376304b521eb71d4
  url: https://pypi.io/packages/source/h/hybracter/hybracter-0.14.0.tar.gz
test:
  commands:
  - hybracter --help
  imports:
  - hybracter
