about:
  description: 'PHAST is a C-based toolkit for phylogenetic analysis, comparative
    genomics,

    and evolutionary modeling.

    '
  dev_url: https://github.com/CshlSiepelLab/phast
  home: https://github.com/CshlSiepelLab/phast
  license: BSD-3-Clause
  license_file: LICENSE
  summary: 'PHAST: Phylogenetic Analysis with Space/Time models.'
build:
  number: 0
  run_exports:
  - null
  script:
  - ln -sf "${BUILD_PREFIX}/bin/${HOST}-otool" "${BUILD_PREFIX}/bin/otool"
  - export LDFLAGS="${LDFLAGS} -lm -L${PREFIX}/lib"
  - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBLA_VENDOR=Generic -DCMAKE_INSTALL_PREFIX=${PREFIX}
    -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_INCLUDEDIR=include
    -DCMAKE_C_COMPILER=${CC}
  - cmake --build build --parallel ${CPU_COUNT}
  - cmake --install build
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - asiepel
package:
  name: phast
  version: 1.9.9
requirements:
  build:
  - null
  - null
  - pkg-config
  - cmake
  - make
  - cctools
  host:
  - pcre
  - libblas
  - liblapack
  - mkl
  run:
  - pcre
  - mkl
source:
  sha256: ef9fd7c6e6c02e866162cf41ff372559f105ae3f9c4dc8562103533e41f1b069
  url: https://github.com/CshlSiepelLab/phast/archive/refs/tags/v1.9.9.tar.gz
test:
  commands:
  - phastCons --help
  - phyloFit --help
