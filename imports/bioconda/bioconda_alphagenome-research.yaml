about:
  description: 'AlphaGenome is a unified DNA sequence model from Google DeepMind for

    regulatory variant-effect prediction. This package runs the model locally

    with JAX, using weights downloaded separately under the AlphaGenome model

    terms; it does not include the weights.

    '
  dev_url: https://github.com/google-deepmind/alphagenome_research
  doc_url: https://www.alphagenomedocs.com/
  home: https://github.com/google-deepmind/alphagenome_research
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Local inference and fine-tuning code for the AlphaGenome model
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - dannon
package:
  name: alphagenome-research
  version: 0.3.0
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  - alphagenome >=0.7.0,<2
  - grpcio-tools
  - protobuf 6.*
  run:
  - python >=3.11
  - absl-py
  - aiohttp
  - alphagenome >=0.7.0,<2
  - anndata
  - chex
  - dm-haiku
  - einshape
  - etils
  - huggingface_hub
  - jax
  - jaxtyping
  - kagglehub
  - numpy
  - optax
  - orbax-checkpoint
  - pandas <3
  - null
  - pybigwig
  - pyarrow
  - pyfaidx
  - pyranges
  - tensorflow
source:
  sha256: c4257611f27abab2a2ad753ada03dff3f2ab0cbabee72911b437dedd280a19c3
  url: https://github.com/google-deepmind/alphagenome_research/archive/refs/tags/v0.3.0.tar.gz
test:
  imports:
  - grpc
  - alphagenome_research
  - alphagenome_research.model.dna_model
  - alphagenome_research.protos.calibration_scores_pb2
