  - make
  - null
  - null
  host:
  - zlib
  - llvm-openmp
  run:
  - llvm-openmp
source:
- sha256: 8a1129bcba045e4af4b6fbf73b3fc6b42208afbab870c774c5f0cd2716d748ae
  url: https://github.com/lh3/minibwa/archive/v0.7.tar.gz
