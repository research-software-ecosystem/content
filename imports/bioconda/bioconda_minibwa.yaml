about:
  dev_url: https://github.com/lh3/minibwa
  home: https://github.com/lh3/minibwa
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file: LICENSE.txt
  summary: Aligning short and accurate long reads to a reference genome, the successor
    of bwa-mem.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: minibwa
  version: '0.3'
requirements:
  build:
  - make
  - null
  - null
  host:
  - zlib
  - llvm-openmp
  run:
  - llvm-openmp
source:
  patches:
  - override-makefile.patch
  sha256: 85040b1b25caeee6304616c2bc081c313e0ff1a29006bb0295098b8ae51973de
  url: https://github.com/lh3/minibwa/archive/v0.3.tar.gz
test:
  commands:
  - minibwa version | grep 0.3
  - minibwa 2>&1 | grep 'Usage'
  - test -e $PREFIX/lib/libminibwa.a
  - test -e $PREFIX/include/minibwa.h
