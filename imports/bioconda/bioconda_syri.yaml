about:
  dev_url: https://github.com/schneebergerlab/syri
  doc_url: https://schneebergerlab.github.io/syri
  home: https://github.com/schneebergerlab/syri
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Synteny and rearrangement identifier between whole-genome assemblies.
build:
  entry_points:
  - syri = syri.scripts.syri:main
  - chroder = syri.scripts.chroder:main
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1186/s13059-019-1911-0
  - biotools:SyRI
  recipe-maintainers:
  - mnshgl0110
package:
  name: syri
  version: 1.8.2
requirements:
  build:
  - null
  - null
  - null
  host:
  - python
  - pip
  - setuptools
  - numpy
  - cython
  run:
  - python
  - numpy
  - pandas
  - scipy
  - psutil
  - python-igraph
  - pysam
  - longestrunsubsequence
  - pulp
source:
  sha256: ef3fb80df7a0b331c934603f8471aee8f78c2c28c8ba8b9a22cc7a96d8786ac1
  url: https://github.com/schneebergerlab/syri/archive/refs/tags/v1.8.2.tar.gz
test:
  commands:
  - syri --version
  - chroder --version
