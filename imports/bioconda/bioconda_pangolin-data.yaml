  script: -m pip install --no-deps --no-build-isolation . -vvv
package:
  name: pangolin-data
  version: '1.4'
requirements:
  host:
  - python
  - pip
  - setuptools
  run:
  - python
source:
  sha256: bc4ef7a366f9bf99cc6985bdd00c41d92bbf36c2f44f3c21a561ca268e203315
  url: https://github.com/cov-lineages/pangolin-data/archive/refs/tags/v1.40.tar.gz
test:
  imports:
  - pangolin_data
