about:
  description: 'RabbitAAStore combines continuous 5-bit protein sequence encoding,
    compact

    indexing, configurable preloading, and batched disk access. This package

    provides its Python API and compiled C++ core, with runtime SIMD dispatch

    and automatic fallback from io_uring to pread when io_uring is unavailable.

    '
  dev_url: https://github.com/RabbitBio/RabbitAAStore
  doc_url: https://github.com/RabbitBio/RabbitAAStore/blob/main/docs/python_api.md
  home: https://github.com/RabbitBio/RabbitAAStore
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Compact protein sequence storage with batched random and sequential access
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  recipe-maintainers:
  - gyj8321
package:
  name: aastore
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - cmake >=3.16
  - ninja
  - patch
  host:
  - python
  - pip
  - scikit-build-core >=0.10
  - pybind11 >=3.0,<4
  - liburing
  run:
  - python
  - liburing
source:
  patches:
  - fix-probe-deallocation.patch
  sha256: 232ba90f95a27a99cbb5534910dcf17c669b3d1f179e0631adcac1e18578c0f9
  url: https://github.com/RabbitBio/RabbitAAStore/archive/47586d3327252e3c0f85585095b8c8ade810d5f1.tar.gz
test:
