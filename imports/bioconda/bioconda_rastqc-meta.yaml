about:
  description: 'RastQC is a drop-in replacement for FastQC written in Rust. This recipe

    builds two packages from one upstream tag: `rastqc`, the core short-read

    build, and `rastqc-nanopore`, which adds the Fast5 (HDF5) and POD5 (Arrow)

    readers and the long-read modules.

    '
  dev_url: https://github.com/Huang-lab/RastQC
  doc_url: https://github.com/Huang-lab/RastQC/blob/main/README.md
  home: https://github.com/Huang-lab/RastQC
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast Rust-based quality control for high-throughput sequencing data
build:
  number: 0
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - Huang-lab
  skip-lints:
  - missing_run_exports
outputs:
- about:
    description: 'RastQC is a drop-in replacement for FastQC written in Rust. It implements

      all 12 FastQC modules with matching algorithms and output formats (HTML,

      fastqc_data.txt, ZIP, native MultiQC JSON). On a real 18.7M-read NextSeq

      run it is 2.9x faster than Falco on one core and 4.7x on four, and its

      output is byte-identical at any thread count. For Oxford Nanopore data

      (Fast5 + POD5 readers and long-read modules), install the sibling

      package `rastqc-nanopore`.

      '
    dev_url: https://github.com/Huang-lab/RastQC
    doc_url: https://github.com/Huang-lab/RastQC/blob/main/README.md
    home: https://github.com/Huang-lab/RastQC
    license: MIT
    license_family: MIT
    license_file: LICENSE
    summary: Fast Rust-based quality control for high-throughput sequencing data
  build:
    run_exports:
    - null
  name: rastqc
  requirements:
    build:
    - null
    - null
    - null
    - make
    - pkg-config
  script: build-rastqc.sh
  test:
    commands:
    - rastqc --version
    - rastqc --help
  version: 0.2.0
- about:
    description: 'rastqc-nanopore is the long-read variant of RastQC. It adds Fast5
      (HDF5)

      and POD5 (Arrow) readers for Oxford Nanopore data, plus 3 long-read

      modules (N50, quality-stratified length, homopolymer content) on top of

      the 12 standard FastQC modules. The binary is installed as

      `rastqc-nanopore` so this package can coexist with the core `rastqc`

      package in the same environment.

      '
    dev_url: https://github.com/Huang-lab/RastQC
    doc_url: https://github.com/Huang-lab/RastQC/blob/main/README.md
    home: https://github.com/Huang-lab/RastQC
    license: MIT
    license_family: MIT
    license_file: LICENSE
    summary: Fast Rust-based QC for Oxford Nanopore sequencing data (Fast5 + POD5)
  build:
    run_exports:
    - null
  name: rastqc-nanopore
  requirements:
    build:
    - null
    - null
    - null
    - null
    - make
    - pkg-config
    host:
    - hdf5 >=1.10,<1.13
    - libarrow
    run:
    - hdf5 >=1.10,<1.13
    - libarrow
  script: build-rastqc-nanopore.sh
  test:
    commands:
    - rastqc-nanopore --version
    - rastqc-nanopore --help
    - rastqc-nanopore --long-read --help
  version: 0.2.0
package:
  name: rastqc-meta
  version: 0.2.0
source:
  sha256: ceda2350f81218dc878652b467e9d0f27807d9001cd802f371088e20b9a5fd41
  url: https://github.com/Huang-lab/RastQC/archive/refs/tags/v0.2.0.tar.gz
