about:
  dev_url: https://github.com/genid/Yleaf
  doc_url: https://github.com/genid/Yleaf
  home: https://github.com/genid/Yleaf
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.txt
  summary: Y-chromosome haplogroup prediction from next-generation sequencing data.
build:
  entry_points:
  - Yleaf = yleaf.Yleaf:main
  - predict_haplogroup = yleaf.predict_haplogroup:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  identifiers:
  - doi:10.1093/molbev/msy032
  recipe-maintainers:
  - musharna
package:
  name: yleaf
  version: 4.1.7
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  run:
  - python >=3.10
  - python-graphviz
  - networkx
  - numpy
  - pandas
  - python-dateutil
  - pytz
  - six
  - samtools
  - bcftools
  - minimap2
source:
  sha256: d18ec292ce8efcc70d73dfb64bd7c89860b307d0d7a740396d33d7707715f988
  url: https://github.com/genid/Yleaf/archive/refs/tags/v4.1.7.tar.gz
test:
  commands:
  - Yleaf --help
  - predict_haplogroup --help
  - samtools --version
  - bcftools --version
  - minimap2 --version
  - python -c "import pathlib, yleaf; d = pathlib.Path(yleaf.__file__).parent / 'data';
    n = sum(p.is_file() for p in d.rglob('*')); assert n >= 266, n; assert (d / 'hg38'
    / 'new_positions.txt').is_file()"
  imports:
  - yleaf
