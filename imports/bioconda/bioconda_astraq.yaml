about:
  description: 'ASTRAQ (Accurate Species Tree Reconstruction by Amalgamating Quartets)

    reconstructs a phylogeny from quartet tree topologies using constrained

    dynamic programming to maximize agreement with the input quartets. It builds

    candidate bipartitions from quartet-derived neighbor-joining trees and

    randomized taxon subsets, without requiring complete gene trees.

    '
  dev_url: https://github.com/KulyaNikita/ASTRAQ
  doc_url: https://github.com/KulyaNikita/ASTRAQ#readme
  home: https://github.com/KulyaNikita/ASTRAQ
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Species tree reconstruction from (weighted) quartet trees by constrained
    dynamic programming.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - gkanogiannis
  - KulyaNikita
package:
  name: astraq
  version: 0.5.8
requirements:
  build:
  - null
  - null
  - make
  host:
  - libgomp
  - llvm-openmp
  run:
  - libgomp
  - llvm-openmp
source:
  sha256: adbd328731388b2e7a932bdda15435a2440a01548c46198e8fdccef95fbc4c64
  url: https://github.com/KulyaNikita/ASTRAQ/archive/refs/tags/v0.5.8.tar.gz
test:
  commands:
  - ASTRAQ --version | grep -F "0.5.8"
  - ASTRAQ --help
  - printf 'A B C D\nA B C E\nA B D E\nA C D E\nB C D E\n' > quartets.txt
  - ASTRAQ -q quartets.txt -o species.tre -t 2
  - grep -qxF '(A,(B,(C,(D,E))));' species.tre
