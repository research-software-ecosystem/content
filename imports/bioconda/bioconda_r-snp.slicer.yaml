about:
  description: 'Implementation of SNP-Slice, a Bayesian nonparametric method for resolving
    multi-strain infections using slice sampling with stick-breaking construction.
    The algorithm simultaneously estimates strain haplotypes and links them to hosts
    from sequencing data, and supports categorical, Poisson, binomial, and negative
    binomial observation models.

    '
  dev_url: https://github.com/PlasmoGenEpi/snp.slicer
  doc_url: https://plasmogenepi.github.io/snp.slicer/
  home: https://github.com/PlasmoGenEpi/snp.slicer
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Bayesian nonparametric resolution of multi-strain infections
