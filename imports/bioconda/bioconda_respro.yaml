about:
  home: https://github.com/the-foxlab/ResistanceProfiler
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Pathogen-agnostic framework for genotypic antiviral resistance profiling
    from variants.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv
extra:
  recipe-maintainers:
  - jonas-fuchs
package:
  name: respro
  version: 0.3.3
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  run:
  - python >=3.11
  - click >=8.1
  - typer >=0.12
  - rich >=13.0
  - numpy >=1.24
  - biopython >=1.81
  - pysam >=0.22
  - mappy >=2.24
  - jinja2 >=3.1.5
  - markupsafe >=2.1
  - matplotlib-base >=3.7
  - weasyprint >=62.3
source:
  sha256: 792ecd8686bd807594aded9c486d89427286c89c3c8578447993671e2f376314
  url: https://github.com/the-foxlab/ResistanceProfiler/archive/refs/tags/v0.3.3.tar.gz
test:
  commands:
  - respro --help
  imports:
  - respro
