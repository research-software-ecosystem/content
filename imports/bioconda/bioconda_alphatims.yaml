about:
  description: 'AlphaTims provides fast indexing and slicing of Bruker timsTOF raw

    data for mass spectrometry-based proteomics.

    '
  dev_url: https://github.com/MannLabs/alphatims
  doc_url: https://alphatims.readthedocs.io/en/latest
  home: https://github.com/MannLabs/alphatims
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: A Python package for indexing Bruker timsTOF raw data
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - jonasscheid
package:
  name: alphatims
  version: 1.1.1
requirements:
  host:
  - python >=3.8
  - setuptools
  - pip
  run:
  - python >=3.8
  - click
  - h5py
  - numba
  - pandas
  - psutil
  - pyzstd
  - tqdm
  - alpharaw
  - alphabase
source:
  sha256: 6acd6f6057491994797c8cd03fb77dbe6e3c94f5ac7e5fa6bcf07fc1b6f0205a
  url: https://github.com/MannLabs/alphatims/archive/refs/tags/v1.1.1.tar.gz
test:
  commands:
  - alphatims --help
  imports:
  - alphatims
