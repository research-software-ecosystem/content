about:
  description: 'VirMake is a Snakemake-based pipeline for viral taxonomic and functional

    characterisation from shotgun metagenomic sequencing data. It supports

    annotation of paired-end data, offline running, and HPC cluster

    execution via Slurm.

    '
  dev_url: https://github.com/Rounge-lab/VirMake
  doc_url: https://virmake.readthedocs.io
  home: https://github.com/Rounge-lab/VirMake
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A Snakemake pipeline for viral metagenomic data analysis
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps -vv --no-build-isolation'
extra:
  identifiers:
  - doi:10.1101/2025.02.07.637044
  recipe-maintainers:
  - sverre-branders
package:
  name: virmake
  version: 1.1.0
requirements:
  host:
  - python >=3.12
  - pip
  - hatchling
  run:
  - python >=3.12
  - click >=8.1
  - pandas >=2
  - pyyaml >=6
  - platformdirs >=4
  - snakemake >=8.14,<10
  - snakemake-executor-plugin-slurm >=1
source:
  sha256: b8dfb4787038080f486b3117ae2c6599f76416806daf3cba93e47a1d840c17ee
  url: https://github.com/Rounge-lab/VirMake/releases/download/v1.1.0/virmake-1.1.0.tar.gz
test:
  commands:
  - virmake --version
  - virmake --help
  imports:
  - virmake
