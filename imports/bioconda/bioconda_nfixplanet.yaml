about:
  home: https://github.com/grp-bork/nfixplanet
  license: MIT
  summary: Nitrogen fixer detection pipeline
build:
  entry_points:
  - nfixplanet = nfixplanet.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - mahdi-robbani
package:
  name: nfixplanet
  version: 0.1.11
requirements:
  host:
  - python >=3.11
  - pip
  - hatchling
  run:
  - python >=3.11
  - pandas >=1.3,<2.2
  - defopt <7
  - prodigal >=2.6.3
  - hmmer >=3.4
  - fastp =0.24.0
  - minimap2 =2.28
  - coverm =0.7.0
  - wget
source:
  sha256: b6c7b7251755e6fd01697b659d827d567e3d54cd83646136afbdb4475c3f2607
  url: https://pypi.io/packages/source/n/nfixplanet/nfixplanet-0.1.11.tar.gz
test:
  commands:
  - nfixplanet --help
  imports:
  - nfixplanet
