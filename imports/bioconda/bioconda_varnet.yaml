about:
  home: https://github.com/skandlab/VarNet
  license: LicenseRef-PolyForm-Noncommercial-1.0.0
  license_file: LICENSE
  summary: Accurate somatic variant detection using weakly supervised deep learning.
build:
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  notes: 'VarNet installs two commands: `varnet-filter` and `varnet-predict`.

    Run the filter step first to find candidate variants, then predict to generate
    VCF output.

    See https://github.com/skandlab/VarNet for full usage instructions.'
package:
  name: varnet
  version: 1.5.3
requirements:
  host:
  - python 3.10
  - pip
  run:
  - python >=3.10
  - numpy
  - pandas >=1.1.1,<3
  - joblib >=0.16.0
  - pysam >=0.16.0.1
  - tensorflow-cpu >=2.13,<2.16
  - pybedtools >=0.8.1
  - bedtools
source:
  patches:
  - fix-indels-predict-syntax.patch
  sha256: b97c5acf60ad16d5061b23ad34f6d5210bbf6667393872fdd56ee1876eb554ba
  url: https://github.com/skandlab/VarNet/archive/refs/tags/v1.5.3.tar.gz
test:
  commands:
  - varnet-predict --help
  - varnet-filter --help
  - bedtools --version
  requires:
  - python 3.10
