about:
  home: https://github.com/skandlab/VarNet
  license: LicenseRef-PolyForm-Noncommercial-1.0.0
  license_file: LICENSE
  summary: Accurate somatic variant detection using weakly supervised deep learning.
build:
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  notes: 'VarNet installs three commands: `varnet-filter`, `varnet-predict` and `varnet-download-resources`.

    Run the filter step first to find candidate variants, then predict to generate
    VCF output.

    For tumor-only mode, run `varnet-download-resources <folder>` once and pass the
    folder with `--resource_dir`.

    See https://github.com/skandlab/VarNet for full usage instructions.'
package:
  name: varnet
  version: 1.5.4
requirements:
  host:
  - python 3.10
  - pip
  run:
  - python >=3.10
  - numpy
  - pandas >=1.1.1,<3
  - joblib >=0.16.0
  - pysam >=0.16.0.1
  - tensorflow-cpu >=2.13,<2.16
  - pybedtools >=0.8.1
  - bedtools
  - curl
  - coreutils
source:
  sha256: 8010e412039cd0994493f6f37e79ff73d7a0c5f0d4a19557ac81bc5350043008
  url: https://github.com/skandlab/VarNet/archive/refs/tags/v1.5.4.tar.gz
test:
  commands:
  - varnet-predict --help
  - varnet-filter --help
  - varnet-predict --version
  - varnet-filter --version
  - test -x $PREFIX/bin/varnet-download-resources
  - bedtools --version
  requires:
  - python 3.10
