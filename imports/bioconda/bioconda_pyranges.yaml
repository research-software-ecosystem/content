about:
  dev_url: https://github.com/endrebak/pyranges
  doc_url: https://pyranges.readthedocs.io
  home: https://github.com/endrebak/pyranges
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Performant Pythonic GenomicRanges.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.1.7
extra:
  identifiers:
  - biotools:PyRanges
  - doi:10.1093/bioinformatics/btz615
package:
  name: pyranges
  version: 0.1.7
requirements:
  host:
  - python >=3
  - setuptools-scm
  - pip
  run:
  - python >=3
  - pandas
  - ncls >=0.0.63
  - tabulate
  - sorted_nearest >=0.0.33
  - natsort
  - importlib-metadata
source:
  sha256: 908cbd92acf578560c482f6892aebb70a0cd4868a8334a7f1b9bb12e6172b26b
  url: https://pypi.io/packages/source/p/pyranges/pyranges-0.1.7.tar.gz
test:
  imports:
  - pyranges
