about:
  doc_url: https://monsda.readthedocs.io/en/latest/
  home: https://github.com/jfallmann/MONSDA
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: MONSDA, Modular Organizer of Nextflow and Snakemake driven HTS Data Analysis
build:
  entry_points:
  - monsda = MONSDA.RunMONSDA:main
  - monsda_configure = MONSDA.Configurator:main
  noarch: python
  number: 1
  run_exports:
  - null
  script: ' -m pip install . --use-pep517 --no-deps --ignore-installed -vvv'
extra:
  recipe-maintainers:
  - jfallmann
package:
  name: monsda
  version: 1.6.0
requirements:
  host:
  - python >=3.12
  - pip
  - pytest-runner
  - versioneer >=0.20
  run:
  - python >=3.12
  - biopython >=1.88
  - fastapi >=0.162.0
  - grep >=3.4
  - isort >=9.0.2
  - natsort >=8.4.0
  - nextflow >=26.10.5
  - numpy >=2.4.6
  - pandas >=2.3.3
  - perl >=5.44.0
  - pyyaml >=6.0.3
  - scipy >=1.17.1
  - snakemake >=9.27.1
  - snakemake-executor-plugin-slurm =2.8.0
  - snakemake-executor-plugin-cluster-generic =1.0.9
  - snakemake-interface-common =1.23.0
  - snakemake-interface-executor-plugins =9.4.0
  - snakemake-interface-report-plugins =1.3.0
  - snakemake-interface-storage-plugins =4.4.1
  - snakemake-storage-plugin-s3 =0.3.6
  - snakemake-storage-plugin-ftp =0.1.3
  - snakemake-storage-plugin-http =0.3.1
  - snakemake-storage-plugin-zenodo =0.1.5
  - uvicorn >=0.54.0
source:
  sha256: 0c9b906ff6aa4173c944023cdef1fc4c8195a7c2d04894974894cb791505a55d
  url: https://pypi.io/packages/source/M/MONSDA/monsda-1.6.0.tar.gz
test:
  commands:
  - monsda --version 2>&1 |grep 1.6.0
  - monsda_configure -h|grep help
  - rm -rf LOGS
