about:
  dev_url: https://github.com/leelieber2025/scATrans
  doc_url: https://scatrans.readthedocs.io
  home: https://github.com/leelieber2025/scATrans
  license: Apache-2.0
  license_file: LICENSE
  summary: Single-cell active transcription analysis with spliced/unspliced RNA layers
build:
  entry_points:
  - generate-gene-features = scatrans.generate_gene_features:main
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - export SETUPTOOLS_SCM_PRETEND_VERSION=0.10.18
  - -m pip install . --no-deps --no-build-isolation -vvv
extra:
  notes: 'Optional backends (scvelo, pydeseq2, gseapy, memento-de, gtfparse) are not

    bundled. Install via pip extras or separate conda packages as documented at

    https://scatrans.readthedocs.io/en/latest/installation.html'
  recipe-maintainers:
  - leelieber2025
package:
  name: scatrans
  version: 0.10.18
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=61
  - setuptools-scm >=6.2
  run:
  - python >=3.9
  - scanpy >=1.9
  - anndata >=0.8
  - numpy >=1.21
  - pandas >=1.3
  - pyarrow >=10.0
  - scipy >=1.7
  - scikit-learn >=1.0
  - joblib >=1.2
  - statsmodels >=0.13
  - matplotlib-base >=3.5
  - seaborn >=0.12
  - adjusttext >=0.7
source:
  sha256: 375c54bfbd7c36bbbc2f614ecfedfdc12fc1591d5c35c5445baa54b4588ce81c
  url: https://files.pythonhosted.org/packages/49/f3/9830c3526340a69bdbae44e7307badf631988cc3de520e4737e40922cdc2/scatrans-0.10.18.tar.gz
test:
  commands:
  - generate-gene-features --help
  imports:
  - scatrans
