about:
  home: https://github.com/xinehc/args_oap
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'ARGs-OAP: Online Analysis Pipeline for Antibiotic Resistance Genes Detection
    from Metagenomic Data Using an Integrated Structured ARG Database'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --ignore-installed --no-cache-dir'
extra:
  recipe-maintainers:
  - xiaole99
  - xinehc
package:
  name: args_oap
  version: 4.0.0
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools
  run:
  - python >=3.7
  - diamond =2.1.13
  - samtools >=1.15
  - blast >=2.12
  - bwa >=0.7.17
  - pandas
source:
  sha256: e0138d7386c07872ce91e6baa2ca10fa9a6c14127b9541e4c8d3f099d7356db1
  url: https://github.com/xinehc/args_oap/archive/refs/tags/v4.0.0.tar.gz
test:
  commands:
  - args_oap -h
  imports:
  - args_oap
