about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tool for validation, encryption and upload of MV submissions to GDCs.
build:
  entry_points:
  - grz-cli = grz_cli.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - hoeze
package:
  name: grz-cli
  version: 3.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - packaging >=23,<27
  - grz-common >=4,<5
source:
  sha256: 97c9f065ea29c06bc838c41682646691cd3c81614a731e4ce89738cc0f8e10f1
  url: https://pypi.org/packages/source/g/grz-cli/grz_cli-3.0.0.tar.gz
test:
  commands:
  - pip check
  - grz-cli --help
  imports:
  - grz_cli
  requires:
  - pip
