about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tool for validation, encryption and upload of MV submissions to GDCs.
build:
  entry_points:
  - grz-cli = grz_cli.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - hoeze
package:
  name: grz-cli
  version: 2.0.0
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - packaging >=23,<27
  - grz-common >=3,<4
source:
  sha256: d1b50dc72864d6179b68d9a20dd69363206dc94832b50331f861ffa214232080
  url: https://pypi.org/packages/source/g/grz-cli/grz_cli-2.0.0.tar.gz
test:
  commands:
  - pip check
  - grz-cli --help
  imports:
  - grz_cli
  requires:
  - pip
