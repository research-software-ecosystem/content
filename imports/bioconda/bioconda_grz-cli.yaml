about:
  home: https://github.com/BfArM-MVH/grz-tools
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tool for validation, encryption and upload of MV submissions to GDCs.
build:
  entry_points:
  - grz-cli = grz_cli.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - tedil
  - hoeze
package:
  name: grz-cli
  version: 3.0.2
requirements:
  host:
  - python >=3.12
  - hatchling
  - pip
  run:
  - python >=3.12
  - packaging >=23,<27
  - grz-common >=4.0.3,<5
source:
  sha256: 3c6fbe230b3b1640ff2f9e6681f32456d6824e1af83fa9b15bfc115ca4b19f74
  url: https://pypi.org/packages/source/g/grz-cli/grz_cli-3.0.2.tar.gz
test:
  commands:
  - pip check
  - grz-cli --help
  imports:
  - grz_cli
  requires:
  - pip
