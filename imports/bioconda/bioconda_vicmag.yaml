about:
  description: 'VicMAG is a visualization tool for circular metagenome-assembled genomes

    focusing on virulence genes, antimicrobial resistance genes, plasmids,

    and viral regions.

    '
  home: https://github.com/TsudaYusuke/VicMAG
  license: MIT
  license_file: LICENSE
  summary: A visualization tool for circular metagenome-assembled genomes
build:
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - TsudaYusuke
package:
  name: vicmag
  version: 0.1.0
requirements:
  host:
  - python
  run:
  - python
  - pandas
  - numpy
  - matplotlib-base
  - biopython
  - biotite
  - pillow
source:
  sha256: 8e148cc7c072be06c6fae0065cb132d6fd71b2b102d16192ba1826674e93a858
