about:
  home: https://pypi.org/project/beave/
  license: Apache-2.0
  summary: A very Canadian utility for genomic clustering and distance querying.
build:
  number: 1
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
  skip: true
extra:
  recipe-maintainers:
  - mattheww95
package:
  name: beave
  version: 1.1.0
requirements:
  build:
  - null
  - null
  - null
  - cmake >=4.2.3
  - pip >=26.0.1
  - make
  host:
  - python
  - scikit-build-core >=0.4.3
  - nanobind >=2.13.0
  - pip
  run:
  - python
  - numpy >=2.4.0
  - polars >=1.41.1
  - scipy >=1.17.0
  - xlsxwriter >=3.2.9
source:
  sha256: ab2031834ed998ecca788a3035f81da1df37796f5756a1ec150970ad365108f3
  url: https://pypi.org/packages/source/b/beave/beave-1.1.0.tar.gz
