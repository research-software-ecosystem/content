about:
  home: https://pypi.org/project/beave/
  license: Apache-2.0
  summary: A very Canadian utility for genomic clustering and distance querying.
build:
  entry_points:
  - beave = beave.__main__:async_main
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
  skip: true
extra:
  recipe-maintainers:
  - mattheww95
package:
  name: beave
  version: 1.0.0
requirements:
  build:
  - null
  - null
  - null
  - cmake >=4.2.3
  - pip >=26.0.1
  - make
  host:
  - python >=3.13
  - scikit-build-core >=0.4.3
  - nanobind >=2.13.0
  - pip
  run:
  - python >=3.13
  - numpy >=2.4.0
  - polars >=1.41.1
  - scipy >=1.17.0
source:
  sha256: 63cbed87699d4689df0993c775590575a4d6e9c1af2b8e6c3d572b73a3ecd274
  url: https://pypi.org/packages/source/b/beave/beave-1.0.0.tar.gz
test:
  commands:
  - pip check
  - beave --help
  imports:
  - beave
  requires:
  - pip
  - python
