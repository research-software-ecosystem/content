about:
  description: Given a databank D = {S1,...,Sn}, with each Si being any genomic dataset
    (genome or raw reads), kmindex allows to compute the percentage of shared k-mers
    between a query Q and each Si.
  dev_url: https://github.com/tlemane/kmindex/
  doc_url: https://tlemane.github.io/kmindex
  home: https://github.com/tlemane/kmindex
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: A tool for large-scale k-mer indexing
