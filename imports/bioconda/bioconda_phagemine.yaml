  - emmannaemeka
package:
  name: phagemine
  version: 1.0.4
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - phanotate
  - hmmer
  - mmseqs2
  - diamond
source:
  sha256: 9d21f6f3bb905b152007551df614c818eb1d1e9bf84341e8dfa276657b13488b
  url: https://github.com/emmannaemeka/PhageMine/archive/refs/tags/v1.0.4.tar.gz
test:
  commands:
  - phagemine --version
  - phagemine --help
  - phagemine batch --help
