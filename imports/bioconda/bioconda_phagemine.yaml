about:
  dev_url: https://github.com/emmannaemeka/PhageMine
  home: https://github.com/emmannaemeka/PhageMine
  license: MIT
  license_file: LICENSE
  summary: Evidence-based bacteriophage genome annotation and discovery mining
build:
  entry_points:
  - phagemine = phagemine.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  maintainers:
  - emmannaemeka
package:
  name: phagemine
  version: 1.3.2
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - phanotate
  - hmmer
  - mmseqs2
  - diamond
source:
  sha256: 5cd62e56515ef351b06db76bc323e1d5f3581543f36ce5128272fdc801f4b736
  url: https://github.com/emmannaemeka/PhageMine/archive/refs/tags/v1.3.2.tar.gz
test:
  commands:
  - phagemine --version
  - phagemine --help
  - phagemine batch --help
  - phagemine extract --help
  - python -c "import phagemine"
