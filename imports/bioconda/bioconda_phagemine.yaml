about:
  dev_url: https://github.com/emmannaemeka/PhageMine
  home: https://github.com/emmannaemeka/PhageMine
  license: MIT
  license_file: LICENSE
  summary: Evidence-based bacteriophage genome annotation and discovery mining
build:
  entry_points:
  - phagemine = phagemine.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  maintainers:
  - emmannaemeka
package:
  name: phagemine
  version: 1.0.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - phanotate
  - hmmer
  - mmseqs2
  - diamond
source:
  sha256: b6e5cc174bccec1d5f364d29b22409f584e4f8e0dba2086ef60169b95f4c6adc
  url: https://github.com/emmannaemeka/PhageMine/archive/refs/tags/v1.0.0.tar.gz
test:
  commands:
  - phagemine --version
  - phagemine --help
  - phagemine batch --help
  - phagemine extract --help
  - python -c "import phagemine"
