about:
  dev_url: https://github.com/emmannaemeka/PhageMine
  home: https://github.com/emmannaemeka/PhageMine
  license: MIT
  license_file: LICENSE
  summary: Evidence-based bacteriophage genome annotation and discovery mining
build:
  entry_points:
  - phagemine = phagemine.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  maintainers:
  - emmannaemeka
package:
  name: phagemine
  version: 1.3.1
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - phanotate
  - hmmer
  - mmseqs2
  - diamond
source:
  sha256: 2dc58963ecceabbf393874808f329a5c99d18e08e37699824cb4f68499284388
  url: https://github.com/emmannaemeka/PhageMine/archive/refs/tags/v1.3.1.tar.gz
test:
  commands:
  - phagemine --version
  - phagemine --help
  - phagemine batch --help
  - phagemine extract --help
  - python -c "import phagemine"
