about:
  dev_url: https://github.com/emmannaemeka/PhageMine
  home: https://github.com/emmannaemeka/PhageMine
  license: MIT
  license_file: LICENSE
  summary: Evidence-based bacteriophage genome annotation and discovery mining
build:
  entry_points:
  - phagemine = phagemine.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
extra:
  maintainers:
  - emmannaemeka
package:
  name: phagemine
  version: 1.3.3
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - phanotate
  - hmmer
  - mmseqs2
  - diamond
source:
  sha256: c9d124ca8d1697b1bc6454526a0be25e77ad64f3b4923e813abd1076d732abc7
  url: https://github.com/emmannaemeka/PhageMine/archive/refs/tags/v1.3.3.tar.gz
test:
  commands:
  - phagemine --version
  - phagemine --help
  - phagemine batch --help
  - phagemine extract --help
  - python -c "import phagemine"
