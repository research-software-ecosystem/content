about:
  dev_url: https://github.com/popgenmethods/pyrho
  doc_url: https://github.com/popgenmethods/pyrho#readme
  home: https://github.com/popgenmethods/pyrho
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Fast inference of fine-scale recombination rates using fused-LASSO
build:
  entry_points:
  - pyrho = pyrho.frontend:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
extra:
  identifiers:
  - doi:10.1126/sciadv.aaw9206
  recipe-maintainers:
  - d-callan
package:
  name: pyrho
  version: 0.2.1
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - numpy >=1.14.2
  - scipy >=1.0.0
  - msprime >=0.7.0,<1.0
  - numba >=0.47.0
  - pandas >=0.23.4
  - pytables >=3.3.0
  - cyvcf2 >=0.10.9
  - ldpop
  - importlib_resources
source:
  sha256: 84d074c18af4e6ced0be85a3e0053d245db89c3ca7e1f7d0e1e6bd14e3a76417
  url: https://github.com/popgenmethods/pyrho/archive/fe7d1cfe1e5b10bee1f1d0828dbf1dc5391d9888.tar.gz
test:
  commands:
  - pyrho --help
  imports:
  - pyrho
