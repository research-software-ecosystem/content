about:
  description: 'TE-looker provides the `dtr` (Dark TE Rebuilder) CLI plus te-discover
    / te-refine /

    te-seed helpers. It targets older, divergent TEs (D_cc 45-75%) as the Step-4 track
    of

    the Pan_TE pipeline.

    '
  home: https://github.com/unavailable-2374/te-looker
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: 'TE-looker (dtr): de novo discovery of divergent (''twilight-zone'') transposable
    elements (Rust).'
build:
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - unavailable-2374
package:
  name: te-looker
  version: 0.3.0
requirements:
  build:
  - null
  - null
  - null
  - make
  run:
  - abpoa
  - spoa
source:
  sha256: edc3717f97280a76e20c825a6d5eb376fd02f454002ecace68f94ed006e330cd
  url: https://github.com/unavailable-2374/te-looker/archive/refs/tags/v0.3.0.tar.gz
test:
  commands:
  - test -x "$PREFIX/bin/dtr"
  - test -x "$PREFIX/bin/te-discover"
  - test -x "$PREFIX/bin/te-refine"
  - test -x "$PREFIX/bin/te-seed"
