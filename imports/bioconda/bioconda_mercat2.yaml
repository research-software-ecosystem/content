about:
  dev_url: https://github.com/raw-lab/mercat2
  doc_url: https://github.com/raw-lab/mercat2
  home: https://github.com/raw-lab/mercat2
  license: CC BY-NC 4.0
  license_family: OTHER
  license_file: LICENSE.txt
  summary: versatile k-mer counter and diversity estimator for database independent
    property analysis (DIPA) for multi-omic analysis
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vv'
extra:
  recipe-maintainers:
  - decrevi
  - raw-lab
package:
  name: mercat2
  version: 1.5.0
requirements:
  host:
  - pip
  - python >=3.9
  - setuptools
  run:
  - python >=3.9
  - fastqc
  - fastp
  - scikit-learn
  - scikit-bio ==0.5.7
  - scipy ==1.8.1
  - python-kaleido
  - hydrampp
  - configargparse
  - humanize
  - plotly
  - psutil
  - dominate
  - metaomestats
  - matplotlib-base
  - pyrodigal
source:
  sha256: 76cf97a6d0adc0a6343c11251a3a2ef6ed7bcda90bab93ecda9442638df89dde
  url: https://pypi.io/packages/source/m/mercat2/mercat2-1.5.0.tar.gz
test:
  commands:
  - mercat2.py --help
  imports:
  - mercat2_lib
