about:
  dev_url: https://github.com/koszullab/hicberg
  home: https://github.com/koszullab/hicberg
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Statistical profiling based tool for contact data (Hi-C, ChIA-PET, Capture-C,
    etc.) and genomics data reconstruction
build:
  entry_points:
  - hicberg=hicberg.__main__:cli
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - axelcournac
package:
  name: hicberg
  version: 1.0.2
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools
  - wheel
  run:
  - python >=3.10
  - bioframe
  - biopython
  - bowtie2
  - click
  - cooler
  - funcy
  - hicstuff
  - matplotlib-base
  - numpy
  - pandas
  - pysam
  - samtools
  - scikit-learn
  - scipy
  - statsmodels
source:
  sha256: 0bde749bd9841edd7c4a8984581e9fd78da29a27a014edbdbf098de4e5a97cd3
  url: https://github.com/koszullab/hicberg/archive/refs/tags/v1.0.2.tar.gz
test:
  commands:
  - hicberg --help
  imports:
  - hicberg
