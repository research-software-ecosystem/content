about:
  description: "Harpy is a command-line tool to easily process platform-agnostic linked-read\
    \ or WGS data. It uses\nSnakemake under the hood to execute different workflows\
    \ (quality control, trimming, \nalignment, variant calling, phasing, etc.), but\
    \ the user is rarely, if ever, exposed\nto Snakemake directly. With an emphasis\
    \ on user-friendliness, parallelization, transparency,\nand reproducibility, Harpy\
    \ quickly handles data processing so that you can focus more\non analyzing your\
    \ data. \n"
  dev_url: https://github.com/pdimens/harpy
  doc_url: https://pdimens.github.io/harpy
  home: https://github.com/pdimens/harpy
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Process linked-read or WGS data, from raw sequences to phased haplotypes.
build:
  entry_points:
  - harpy = harpy.__main__:cli
  - harpy-utils = harpy.utils:cli
  - hv = harpy.commands.view:view
  number: 0
  run_exports:
  - null
  script_env:
  - SETUPTOOLS_SCM_PRETEND_VERSION=4.1.1
extra:
  recipe-maintainers:
  - pdimens
package:
  name: harpy
  version: 4.1.1
requirements:
  build:
  - null
  - null
  host:
  - python >=3.11,<3.14
  - pip
  - setuptools-scm >=8
  run:
  - altair >=6.0
  - bcftools >=1.23
  - click >=8.2
  - conda >=24.8
  - djinn >=2.3
  - htslib >=1.23
  - jupyter-book >=2.1.0
  - papermill >=2.6
  - pandas >=2.3.3
  - pillow >=12.2
  - polars >=1.39
  - pysam >=0.23
  - python >=3.11,<3.14
  - rich-click >=1.9.3
  - samtools >=1.23
  - seqtk
  - snakemake-minimal >=9.19.0
  - vl-convert-python >=1.9.0
  - xeus-python >=0.18.1
source:
  sha256: 7ff39ec6d1680c2fc61e8478338390e932d1cdf3bcf2f12114fa515f4dcb5f0a
  url: https://github.com/pdimens/harpy/releases/download/4.1.1/harpy.4.1.1.tar.gz
test:
  commands:
  - snakemake --version
  - harpy --version
