about:
  description: Often, genome assembly projects have illumina whole genome sequencing
    reads available for the assembled individual. The k-mer spectrum of this read
    set can be used for independently evaluating assembly quality without the need
    of a high quality reference. Merqury provides a set of tools for this purpose.
  home: https://github.com/marbl/merqury
  license: PUBLIC DOMAIN
  license_file: LICENSE
  summary: Evaluate genome assemblies with k-mers and more.
build:
  noarch: generic
  number: 1
  run_exports:
  - null
package:
  name: merqury
  version: 1.4.1
requirements:
  run:
  - meryl >=1.4.1
  - openjdk  >=11.0.1
  - r-base  >=4
  - r-argparse  >=2.0.1
  - r-ggplot2  >=3.3.2
  - r-scales  >=1.1.1
  - bedtools  >=2.29.2
  - samtools  >=1.22
  - mscorefonts
  - gawk
  - sed
source:
  sha256: 4340ccf1523f30d9f58697ec501555db8dd8d21c9231b6c104e0b883c21fcecb
  url: https://github.com/marbl/merqury/archive/refs/tags/v1.4.1.tar.gz
test:
  commands:
  - merqury.sh 2>&1 | grep Usage
