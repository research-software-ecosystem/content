  script: -m pip install --no-deps --no-build-isolation --no-cache-dir -vvv .
extra:
  recipe-maintainers:
  - corneliusroemer
package:
  name: pango-designation
  version: '1.41'
requirements:
  host:
  - python >=3.7
  - pip
  - setuptools <82
  run:
  - python >=3.7
source:
  sha256: a6e0738c0060ced526d16d6d4b2f644cd6086a1ceac25df547fdf25ef7026061
  url: https://github.com/cov-lineages/pango-designation/archive/refs/tags/v1.41.tar.gz
test:
  imports:
  - pango_designation
