about:
  description: 'glycowork processes and analyzes glycan sequences. It reads IUPAC-condensed/extended,
    WURCS, GlycoCT,

    GlyTouCan IDs, Oxford, LinearCode and more, and provides motif annotation, SNFG
    drawing (GlycoDraw),

    differential glycomics statistics, biosynthetic network construction and curated
    glycan datasets.

    Deep learning functionality (glycowork.ml) needs PyTorch and PyTorch Geometric
    installed separately.

    '
  dev_url: https://github.com/BojarLab/glycowork
  doc_url: https://bojarlab.github.io/glycowork/
  home: https://github.com/BojarLab/glycowork
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: The Python package for glycan data science, from any glycan notation to
    motif analysis, SNFG drawing and glycomics statistics
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.1093/glycob/cwab067
  recipe-maintainers:
  - Bribak
package:
  name: glycowork
  version: 1.12.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools >=64
  run:
  - python >=3.11
  - numpy
  - networkx >=3.4
  - scipy >=1.16
  - pandas >=2.2.2
  - openpyxl
  - glycorender >=0.5.8,<0.6
  - viscose >=0.3.1,<0.4
source:
  sha256: 81a6bc20fa133e411bb3bb9cbcbbc516ddede0b5a46812051eb7f0f5e40655f7
  url: https://pypi.org/packages/source/g/glycowork/glycowork-1.12.0.tar.gz
test:
  commands:
  - pip check
  - python -c "from glycowork.motif.processing import canonicalize_iupac; assert canonicalize_iupac('Neu5Ac(a2-3)Gal(b1-4)GlcNAc')
    == 'Neu5Ac(a2-3)Gal(b1-4)GlcNAc'"
  imports:
  - glycowork
  - glycowork.glycan_data.loader
  - glycowork.glycan_data.stats
  - glycowork.motif.processing
  - glycowork.motif.graph
  - glycowork.motif.annotate
  - glycowork.motif.analysis
  - glycowork.motif.draw
  - glycowork.network.biosynthesis
  requires:
  - pip
