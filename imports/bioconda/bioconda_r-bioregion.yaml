about:
  home: https://github.com/bioRgeo/bioregion, https://bioRgeo.github.io/bioregion/
  license: GPL-3.0-or-later
  maintainer: Maxime Lenormand
  summary: The main purpose of this package is to propose a transparent methodological
    framework to compare bioregionalization methods based on hierarchical and non-hierarchical
    clustering algorithms (Kreft & Jetz (2010) <doi:10.1111/j.1365-2699.2010.02375.x>)
    and network algorithms (Lenormand et al. (2019) <doi:10.1002/ece3.4718> and Leroy
    et al. (2019) <doi:10.1111/jbi.13674>).
build:
  noarch: generic
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports:
  - null
  script:
  - -e "install.packages('fastkmedoids', repos='https://cloud.r-project.org')"
  - R CMD INSTALL --build .
package:
  name: r-bioregion
  version: 1.4.0
requirements:
  build:
  - cross-r-base
  host:
  - r-Matrix
  - r-Rdpack
  - r-apcluster
  - r-ape
  - r-base >=4.2
  - r-bipartite
  - r-cluster
  - r-data.table
  - r-dbscan
  - r-dynamicTreeCut
  - r-fastcluster
  - r-ggplot2
  - r-httr
  - r-igraph
  - r-mathjaxr
  - r-phangorn
  - r-rcartocolor
  - r-rlang
  - r-rmarkdown
  - r-segmented
  - r-sf
  - r-tidyr
  run:
  - r-Matrix
  - r-Rdpack
  - r-apcluster
  - r-ape
  - r-base >=4.2
  - r-bipartite
  - r-cluster
  - r-data.table
  - r-dbscan
  - r-dynamicTreeCut
  - r-fastcluster
  - r-ggplot2
  - r-httr
  - r-igraph
  - r-mathjaxr
  - r-phangorn
  - r-rcartocolor
  - r-rlang
  - r-rmarkdown
  - r-segmented
  - r-sf
  - r-tidyr
source:
  sha256: 5bb485f919906296d644949fcfdd4b124a43d4ca0ef37b4f69f1023ec0f2ce1a
  url: https://cran.r-project.org/src/contrib/bioregion_1.4.0.tar.gz
test:
  commands:
  - $R -e "library('bioregion')"
  - '"%R%" -e "library(''bioregion'')"'
