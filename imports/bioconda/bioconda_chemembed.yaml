about:
  description: "ChemEmbed identifies metabolites by transforming an experimental MS/MS\n\
    spectrum into a learned molecular embedding with a convolutional neural\nnetwork,\
    \ then ranking candidate structures from a reference database by\ncosine similarity\
    \ against that predicted embedding.\n\nModels and the reference database are not\
    \ included and must be supplied\nseparately. \n"
  dev_url: https://github.com/faizanurv/ChemEmbed
  home: https://github.com/faizanurv/ChemEmbed
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Metabolite identification from MS/MS spectra using molecular embeddings
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  identifiers:
  - doi:10.1093/bib/bbag054
  recipe-maintainers:
  - RJMW
  - neil-butcher
package:
  name: chemembed
  version: 1.2.0
requirements:
  host:
  - python >=3.9
  - pip
  - setuptools >=77
  - wheel
  run:
  - python >=3.9
  - numpy >=1.18.0
  - pandas >=1.0.0
  - scipy >=1.4.0
  - pytorch >=1.13.0
  - pyyaml >=5.3.0
  - rdkit >=2020.09.1
  - tqdm >=4.0.0
  - pyarrow >=8
source:
  sha256: 862fa08cd95a72cf945283122c12ca75ae9ac806645327b901effae0d22effad
  url: https://pypi.org/packages/source/c/chemembed/chemembed-1.2.0.tar.gz
test:
  commands:
  - chemembed --help
  imports:
  - chemembed.cli
  - chemembed.data_processing
  - chemembed.model_utils
  - chemembed.reference_utils
  - pyarrow
  - pandas
