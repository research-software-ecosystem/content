about:
  dev_url: https://github.com/duceppemo/BACoN
  doc_url: https://github.com/duceppemo/BACoN/wiki
  home: https://github.com/duceppemo/BACoN
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bait, assemble and compare Nanopore reads matching a reference sequence,
    such as an organelle genome
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: bacon-nanopore
  version: 0.3.8
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - minimap2 >=2.24
  - samtools >=1.21
  - filtlong >=0.2.1
  - flye >=2.9.5
  - myloasm >=0.7
  - ska2 >=0.5
  - parsnp >=2.0
  - harvesttools
  - fasttree >=2.1.11
  - iqtree >=2.2
  - bbmap >=39
  - python-isal
source:
  sha256: a6a17d5e059816a4dbbea2f50dd441a69695539d07e7fe5c8b0abc1fa9ad3c05
  url: https://github.com/duceppemo/BACoN/archive/refs/tags/v0.3.8.tar.gz
test:
  commands:
  - bacon --help
  - bacon --version
