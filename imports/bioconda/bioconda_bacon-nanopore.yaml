about:
  dev_url: https://github.com/duceppemo/BACoN
  doc_url: https://github.com/duceppemo/BACoN/wiki
  home: https://github.com/duceppemo/BACoN
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Bait, assemble and compare Nanopore reads matching a reference sequence,
    such as an organelle genome
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - duceppemo
package:
  name: bacon-nanopore
  version: 0.4.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  run:
  - python >=3.10
  - minimap2 >=2.24
  - samtools >=1.21
  - filtlong >=0.2.1
  - flye >=2.9.5
  - myloasm >=0.7
  - ska2 >=0.5
  - parsnp >=2.0
  - harvesttools
  - fasttree >=2.1.11
  - iqtree >=2.2
  - bbmap >=39
  - python-isal
source:
  sha256: 8424a21f841c4ad15429f3298945b4c9b11a3c6f692c3fbbd38a71321020f33a
  url: https://github.com/duceppemo/BACoN/archive/refs/tags/v0.4.0.tar.gz
test:
  commands:
  - bacon --help
  - bacon --version
