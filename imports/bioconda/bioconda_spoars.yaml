about:
  description: 'spoars is a memory-safe, SIMD-accelerated native-Rust reimplementation
    of

    the C++ spoa (partial order alignment) library. It produces bit-identical

    consensus, multiple-sequence-alignment, and alignment output across SSE4.1 /

    AVX2 / NEON via runtime CPU dispatch.

    '
  dev_url: https://github.com/fg-labs/spoars
  doc_url: https://github.com/fg-labs/spoars/blob/v0.1.4/README.md
  home: https://github.com/fg-labs/spoars
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRD-PARTY.md
  - THIRDPARTY.yml
  summary: Faithful native-Rust reimplementation of the spoa partial order alignment
    library
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - nh13
package:
  name: spoars
  version: 0.1.4
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: 893cd08224ee4a7f9d38687a8faed2fac3acef1fde0249456eae0890c9ff48a9
  url: https://github.com/fg-labs/spoars/archive/refs/tags/v0.1.4.tar.gz
test:
  commands:
  - spoars --help
