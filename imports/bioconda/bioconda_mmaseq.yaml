about:
  home: https://github.com/ssi-dk/MMASeq
  license: MIT
  license_file: LICENSE
  summary: Mixed Microbial Analysis on Sequencing data
build:
  entry_points:
  - mmadeploy = mmaseq.deploy:launcher
  - mmacreate = mmaseq.create:launcher
  - mmaseq = mmaseq.mmaseq:launcher
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - SimoneScrima
package:
  name: mmaseq
  version: 2.1.0
requirements:
  host:
  - python >=3.13
  - hatchling >=1.25
  - pip
  run:
  - python >=3.13
  - packaging <26,>=24.0
  - snakemake
  - pandas
  - conda
source:
  sha256: 5e12dc85773e74967bde150eaebf1cbad4a7ce2f511c8e72933a32bb71351088
  url: https://github.com/ssi-dk/MMASeq/archive/v2.1.0.tar.gz
test:
  commands:
  - pip check
  - mmadeploy --help
  - mmacreate --help
  - mmaseq --help
  imports:
  - mmaseq
  requires:
  - pip
  - python
