about:
  dev_url: https://github.com/ssi-dk/MMASeq
  home: https://github.com/ssi-dk/MMASeq
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Mixed Microbial Analysis on Sequencing data.
build:
  entry_points:
  - mmadeploy = mmaseq.deploy:launcher
  - mmacreate = mmaseq.create:launcher
  - mmaseq = mmaseq.mmaseq:launcher
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - SimoneScrima
package:
  name: mmaseq
  version: 2.4.6
requirements:
  host:
  - python >=3.13
  - hatchling >=1.25
  - pip
  run:
  - python >=3.13
  - packaging >=26.1
  - ruamel.yaml <0.19
  - snakemake
  - pandas
  - conda
source:
  sha256: 326b6c9254ee35ff682cf2b66b3f5cee7704de5d23f053868387c445ea9eb57f
  url: https://github.com/ssi-dk/MMASeq/archive/v2.4.6.tar.gz
test:
  commands:
  - mmadeploy --help
  - mmacreate --help
  - mmaseq --help
  imports:
  - mmaseq
