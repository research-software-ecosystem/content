about:
  description: 'PanIsoGuard ingests novel isoform calls from long-read RNA-seq callers

    (FLAIR/IsoQuant/Bambu/...) and/or SQANTI3 output, plus a BAM and optional

    short-read SJ.tab and personalized haplotype FASTAs, and re-classifies each

    novel call into a confidence class with a mechanistic attribution and a

    provenance/circularity flag. Depends only on htslib.

    '
  dev_url: https://github.com/jibeomko/PanIsoGuard
  doc_url: https://github.com/jibeomko/PanIsoGuard#readme
  home: https://github.com/jibeomko/PanIsoGuard
  license: MIT AND BSL-1.0
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.txt
  - thirdparty/cgranges/LICENSE.txt
  - thirdparty/catch2/LICENSE.txt
  - thirdparty/tomlplusplus/LICENSE
  summary: Caller-agnostic adjudication of long-read RNA-seq novel isoforms
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  recipe-maintainers:
  - jibeomko
package:
  name: panisoguard
  version: 0.0.5
requirements:
  build:
  - null
  - null
  - null
  - cmake >=3.20
  - make
  host:
  - htslib >=1.18
  run:
  - htslib >=1.18
source:
  sha256: e50d8f5709085c7de2924e387478583fc2123f49959019faec423cfa0998c1ca
  url: https://github.com/jibeomko/PanIsoGuard/archive/refs/tags/v0.0.5.tar.gz
test:
  commands:
  - panisoguard --version
  - panisoguard --help > /dev/null
  - panisoguard adjudicate --help > /dev/null
  - panisoguard combine --help > /dev/null
  - printf '%b' 'chr1\ttest\texon\t101\t200\t.\t+\t.\tgene_id "G1"; transcript_id
    "T1";\nchr1\ttest\texon\t301\t400\t.\t+\t.\tgene_id "G1"; transcript_id "T1";\nchr1\ttest\texon\t501\t600\t.\t+\t.\tgene_id
    "G1"; transcript_id "T1";\nchr1\ttest\texon\t101\t200\t.\t+\t.\tgene_id "G1";
    transcript_id "T2";\nchr1\ttest\texon\t501\t600\t.\t+\t.\tgene_id "G1"; transcript_id
    "T2";\n' > mini.gtf
  - panisoguard combine --gtf flair:mini.gtf --out combine_smoke.tsv
  - test -s combine_smoke.tsv
