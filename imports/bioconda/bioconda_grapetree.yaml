about:
  dev_url: https://github.com/achtman-lab/GrapeTree
  doc_url: https://enterobase.readthedocs.io/en/latest/grapetree/grapetree-about.html
  home: https://github.com/achtman-lab/GrapeTree
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: Web interface of GrapeTree, which is a program for phylogenetic analysis.
build:
  entry_points:
  - grapetree = grapetree.cli:main
  - MSTrees.py = grapetree.module.MSTrees:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-build-isolation --no-cache-dir --no-deps
extra:
  identifiers:
  - doi:10.1101/gr.232397.117
  recipe-maintainers:
  - simonhtausch
package:
  name: grapetree
  version: 3.0.0
requirements:
  host:
  - python >=3.10
  - hatchling >=1.26
  - pip
  run:
  - python >=3.10
  - ete3
  - flask
  - networkx
  - numpy
  - pandas
  - psutil
  - requests
  - legacy-cgi
  - unidecode
source:
  sha256: 8d73dcde3a8bd5152065c428a89ca380b7a7d3affeff8dc4310fcfa8bf50733a
  url: https://pypi.org/packages/source/g/grapetree/grapetree-3.0.0.tar.gz
test:
  commands:
  - grapetree --help
  imports:
  - grapetree
