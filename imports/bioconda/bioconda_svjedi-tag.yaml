about:
  home: https://github.com/MTemperville/SVJedi-Tag
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: 'SVJedi-Tag : a tool for genotyping inversions using linked-reads data.'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . -vv'
extra:
  recipe-maintainers:
  - MTemperville
package:
  name: svjedi-tag
  version: 1.1.0
requirements:
  host:
  - python >=3.11
  - pip
  - setuptools
  run:
  - python >=3.11
  - pysam
  - vg >=1.76.1
  - biopython
  - matplotlib-base
  - networkx
  - prettytable
  - wcwidth
  - pandas
  - seaborn
source:
  sha256: 70ee5ad72f24b792d4ae42434853c0ff35457ea30d460b5894abcead05db05c7
  url: https://github.com/MTemperville/SVJedi-Tag/archive/v1.1.0.tar.gz
test:
  commands:
  - svjedi-tag -h
  - LR_STATS -h
  - svjedi-tag_likelihood-calibration -h
