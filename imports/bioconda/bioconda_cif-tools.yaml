about:
  description: 'The cif-tools suite of programs are tools you can use to examine and
    manipulate mmCIF and PDB files.

    '
  dev_url: https://github.com/PDB-REDO/cif-tools
  doc_url: https://github.com/PDB-REDO/cif-tools/tree/v2.0.1/doc
  home: https://github.com/PDB-REDO/cif-tools
  license: BSD-2-Clause "Simplified"
  license_family: BSD
  license_file: LICENSE
  summary: A suite of programs to manipulate and examine mmCIF files
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - eunos-1128
package:
  name: cif-tools
  version: 2.0.1
requirements:
  build:
  - null
  - null
  - cmake
  - ninja
  - pkg-config
  host:
  - libcifpp 10.0.*
  - libmcfp ==1.4.2
  - zlib
source:
  sha256: 23ee68083e13d58501192e486d431f2425c4e71cabe74bb164e098559b014c5a
  url: https://github.com/PDB-REDO/cif-tools/archive/refs/tags/v2.0.1.tar.gz
test:
  commands:
  - pdb2cif --version
  - cif2pdb --version
  - cif-diff --version
  - cif-merge --version
  - cif-validate --version
  - mmcql --version
  files:
  - test.cql
  source_files:
  - 1cbs_final.cif
  - 443d_final.cif
  - 6yrb_0cyc.pdb
  - 7f95-carb.cif
  - 7f95-carb.pdb
  - 7f95_flipper.pdb
