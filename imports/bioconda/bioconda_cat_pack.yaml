about:
  dev_url: https://github.com/MGXlab/CAT_pack
  home: https://github.com/MGXlab/CAT_pack
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: 'CAT/BAT: tool for taxonomic classification of contigs and metagenome-assembled
    genomes (MAGs)

    '
build:
  entry_points:
  - CAT_pack = CAT_pack.cli:app
  - cat_pack = CAT_pack.cli:app
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation -vv
package:
  name: cat_pack
  version: 7.0.0b0
requirements:
  host:
  - python 3.11.*
  - pip
  - setuptools >=77
  run:
  - python >=3.11
  - typer
  - rich
  - pyrodigal
  - numpy
  - polars ==2.0.0
  - psutil
  - diamond
  - mmseqs2
  - bwa
  - bwa-mem2
  - samtools
  run_constrained:
  - cat >=7.0.0b0
source:
  sha256: de352239fcf82e3c1cb0dc1e306c565488ba54f33f2b10fc450de3f0cbe738ad
  url: https://files.pythonhosted.org/packages/dd/77/a51272658e9363842f1233ef9e10ccfa4d98b5ed03b3c685314172232da9/cat_pack-7.0.0b0.tar.gz
test:
  commands:
  - CAT_pack --version
  - cat_pack rat --help
  - bwa-mem2 version
  - mmseqs version
  imports:
  - CAT_pack.cli
  - polars
  - pyrodigal
  requires:
  - python 3.11.*
  - pip
