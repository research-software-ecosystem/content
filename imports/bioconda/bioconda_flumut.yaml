about:
  dev_url: https://github.com/izsvenezie-virology/FluMut
  home: https://github.com/izsvenezie-virology/FluMut
  license: AGPL-3.0-or-later
  license_family: AGPL
  license_file: LICENSE
  summary: A tool to search for molecular markers with potential impact on the biological
    characteristics of Influenza A viruses of the A(H5N1) subtype.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vvv --no-deps --no-build-isolation --no-cache-dir
extra:
  recipe-maintainers:
  - EdoardoGiussani
  - AlexSartori
package:
  name: flumut
  version: 1.0.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61.2
  run:
  - python >=3.10
  - click >=8.0.0
  - flumutdb >=6.0
  - biopython >=1.87
  - openpyxl >=3.1.2
  - peewee >=3.17
  - importlib-resources >=1.3
source:
  sha256: 980e8454198ebf18865c11ea0faf41d5028f2852a84789e127f6800ae1030cb7
  url: https://pypi.io/packages/source/f/flumut/flumut-1.0.0.tar.gz
test:
  commands:
  - flumut --help
  - flumut --all-versions
  imports:
  - flumut
