about:
  description: 'FactorForge is an open-source CDS design engine for plant CDS design
    workflows,

    with an initial focus on Nicotiana benthamiana. It provides deterministic,

    constraint-aware synonymous CDS design via a dynamic-programming feasibility

    engine, profile-based rule checks, and MoClo/Golden Gate-oriented output.

    Distributed as a Python package, CLI, REST API, and Docker-deployable web app.

    '
  dev_url: https://github.com/eijex/factorforge-cds
  doc_url: https://eijex.github.io/factorforge-cds/
  home: https://factorforge.eijex.com
  license: AGPL-3.0-only
  license_family: AGPL
  license_file: LICENSE
  summary: Constraint-aware coding sequence design engine for plant CDS design workflows
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --ignore-installed -vv
extra:
  recipe-maintainers:
  - eijex
package:
  name: factorforge-cds
  version: 3.6.4
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77.0.3
  - wheel
  run:
  - python >=3.10
  - biopython >=1.81
  - requests >=2.31
  - click >=8.4.1
  - pydantic >=2.0
  - packaging >=23.0
source:
  sha256: 66f62fba0f1c87023b1d53d4af8fad35dca9c64f60de30889d5da9b2c42cf423
  url: https://pypi.io/packages/source/f/factorforge-cds/factorforge_cds-3.6.4.tar.gz
test:
  commands:
  - factorforge --help
  - factorforge-validate --help
  imports:
  - factorforge
  - factorforge.engines
  - factorforge.validation
