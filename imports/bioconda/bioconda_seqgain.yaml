about:
  dev_url: https://github.com/rki-mf1/seqgain
  home: https://github.com/rki-mf1/seqgain
  license: GPL-3.0-only
  license_file: LICENSE
  summary: K-mer discovery and reference coverage sequencing-effort scenarios
build:
  entry_points:
  - seqgain = seqgain.cli:main
  - seqgain-demo = seqgain.cli:demo_main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - simonhtausch
package:
  name: seqgain
  version: 0.3.1
requirements:
  host:
  - python >=3.11
  - setuptools >=77.0.3
  - pip
  run:
  - python >=3.11
  - numpy >=1.26,<3
  - scipy >=1.12,<2
  - pysam >=0.22,<0.25
  - plotly >=5.24,<7
source:
  sha256: d9cc92b9b1166331a5eb7a961b35fcf0cd331d6c9de107ecf01540f4dc6a7db2
  url: https://github.com/rki-mf1/seqgain/archive/refs/tags/v0.3.1.tar.gz
test:
  commands:
  - seqgain --version
  - seqgain --help
  - seqgain-demo --help
  imports:
  - seqgain.cli
  - seqgain.bam
  - seqgain.report
