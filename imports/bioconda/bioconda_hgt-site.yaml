about:
  description: 'hgt-site calls candidate horizontal gene transfer and integration
    sites from paired-end reads

    aligned to a host genome, together with Kraken2 classifications of the reads that
    did not

    align. Most foreign reads in a host sample come from contamination or from chimeric
    fragments

    formed during library preparation, so each candidate position is tested against
    the number of

    pairs chance alone would place there, given how common that taxon is across the
    sample. Reads

    that cross the junction give the insertion point to the base pair.


    Output is a table of every candidate site with the reason each one failed, plus
    optional BED,

    VCF and MultiQC files. With a Kraken2 database to hand, "hgt-site run" goes from
    a host

    alignment to called sites in one command.

    '
  dev_url: https://github.com/iraajgangavaram/hgt-site
  doc_url: https://iraajgangavaram.github.io/hgt-site/
  home: https://github.com/iraajgangavaram/hgt-site
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Find where foreign DNA has inserted into a host genome, testing each candidate
    site against chance chimeras.
build:
  entry_points:
  - hgt-site = hgt_site.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  identifiers:
  - doi:10.5281/zenodo.23842712
  - biotools:hgt-site
  recipe-maintainers:
  - iraajgangavaram
package:
  name: hgt-site
  version: 0.3.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=77
  run:
  - python >=3.10
  - pysam >=0.21
source:
  sha256: 63ad2f9884e96c3fefb6f581a802f787cd0a960897d0835f252d5a919334b99b
  url: https://github.com/iraajgangavaram/hgt-site/archive/refs/tags/0.3.0.tar.gz
test:
  commands:
  - hgt-site --help
  - hgt-site --version
  - hgt-site call --help
  imports:
  - hgt_site
