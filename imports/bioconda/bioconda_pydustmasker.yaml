about:
  dev_url: https://github.com/apcamargo/pydustmasker
  doc_url: https://apcamargo.github.io/pydustmasker
  home: https://apcamargo.github.io/pydustmasker
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Python library for identification and masking of low-complexity regions
    in nucleotide sequences.

    '
build:
  number: 0
  run_exports:
  - null
  script:
  - -m pip install . --no-deps --no-build-isolation --disable-pip-version-check -vvv
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  skip-lints:
  - version_constraints_missing_whitespace
package:
  name: pydustmasker
  version: 3.2.0
requirements:
  build:
  - python
  - cross-python_
  - crossenv
  - maturin >=1.5,<2
  - null
  - null
  - null
  - cargo-bundle-licenses
  host:
  - python
  - pip
  - maturin >=1.10,<2
  run:
  - python
source:
  sha256: be3a3680b3cd390d7106e9f03da48625a15acff98e0b633cf569d6346ef8bd91
  url: https://pypi.io/packages/source/p/pydustmasker/pydustmasker-3.2.0.tar.gz
test:
  imports:
  - pydustmasker
