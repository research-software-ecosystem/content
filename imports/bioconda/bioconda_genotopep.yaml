about:
  dev_url: https://github.com/ljunwon1114/GenoToPep
  home: https://github.com/ljunwon1114/GenoToPep
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Reproducible peptide candidate generation from genome and metagenome assemblies
    or protein FASTA files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - ljunwon1114
package:
  name: genotopep
  version: 0.1.0.1
requirements:
  host:
  - python >=3.10
  - pip
  - hatchling >=1.25
  run:
  - python >=3.10
  - pyrodigal >=3.6,<4
  - pyyaml >=6,<7
source:
  sha256: f7438775e072aeb499e01b849763d0ed6745933275c95c85c3d50b774ea0a465
  url: https://pypi.org/packages/source/g/genotopep/genotopep-0.1.0.1.tar.gz
test:
  commands:
  - genotopep --version
  - genotopep --help
  imports:
  - genotopep
