about:
  dev_url: https://github.com/ljunwon1114/GenoToPep
  home: https://github.com/ljunwon1114/GenoToPep
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: Reproducible peptide candidate generation from genome and metagenome assemblies
    or protein FASTA files.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - ljunwon1114
package:
  name: genotopep
  version: 0.2.0.1
requirements:
  host:
  - python >=3.10
  - pip
  - hatchling >=1.25
  run:
  - python >=3.10
  - pyrodigal >=3.6,<4
  - pyyaml >=6,<7
source:
  sha256: 81a35218f21a6285d4304d6ec7e4ea76a16d220e122fab8de1971e711dd609ed
  url: https://pypi.org/packages/source/g/genotopep/genotopep-0.2.0.1.tar.gz
test:
  commands:
  - genotopep --version
  - genotopep --help
  imports:
  - genotopep
