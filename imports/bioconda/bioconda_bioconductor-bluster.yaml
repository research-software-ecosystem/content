about:
  description: Wraps common clustering algorithms in an easily extended S4 framework.
    Backends are implemented for hierarchical, k-means and graph-based clustering.
    Several utilities are also provided to compare and evaluate clustering results.
  home: https://bioconductor.org/packages/3.23/bioc/html/bluster.html
  license: GPL-3
  license_file: /lib/R/share/licenses/GPL-3
  summary: Clustering Algorithms for Bioconductor
build:
  number: 0
  rpaths:
  - lib/R/lib/
  - lib/
  run_exports: ''
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - biotools:bluster
package:
  name: bioconductor-bluster
  version: 1.22.0
requirements:
  build:
  - null
  - null
  - null
  - make
  host:
  - bioconductor-assorthead >=1.6.3,<1.7.0
  - bioconductor-biocneighbors >=2.6.0,<2.7.0
  - bioconductor-biocparallel >=1.46.0,<1.47.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - r-base
  - r-cluster
  - r-igraph
  - r-matrix
  - r-rcpp
  - libblas
  - liblapack
  - zlib
  - liblzma-devel
  run:
  - bioconductor-assorthead >=1.6.3,<1.7.0
  - bioconductor-biocneighbors >=2.6.0,<2.7.0
  - bioconductor-biocparallel >=1.46.0,<1.47.0
  - bioconductor-s4vectors >=0.50.3,<0.51.0
  - r-base
  - r-cluster
  - r-igraph
  - r-matrix
  - r-rcpp
source:
  md5: 052a1dd3df9894081efae87aa43c3025
  url:
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/bluster_1.22.0.tar.gz
  - https://bioconductor.org/packages/3.23/bioc/src/contrib/Archive/bluster/bluster_1.22.0.tar.gz
  - https://bioarchive.galaxyproject.org/bluster_1.22.0.tar.gz
  - https://depot.galaxyproject.org/software/bioconductor-bluster/bioconductor-bluster_1.22.0_src_all.tar.gz
test:
  commands:
  - $R -e "library('bluster')"
