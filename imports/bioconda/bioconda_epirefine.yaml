about:
  description: 'EpiRefine refines an existing metagenome binning from a modkit pileup
    and the motifs Nanomotif found in the

    bins. It flags binned contigs whose methylation does not fit their bin and places
    unbinned contigs into the

    bin whose methylation they share, with calibrated probabilities and Nanomotif-compatible
    outputs.

    '
  dev_url: https://github.com/SorenHeidelbach/epirefine
  doc_url: https://github.com/SorenHeidelbach/epirefine/blob/main/README.md
  home: https://github.com/SorenHeidelbach/epirefine
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Refine metagenome bins from nanopore methylation: flag contaminants and
    place unbinned contigs, with calibrated probabilities.'
build:
  entry_points:
  - epirefine = epirefine.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - SorenHeidelbach
package:
  name: epirefine
  version: 0.10.0
requirements:
  host:
  - python >=3.10
  - pip
  - hatchling >=1.27
  run:
  - python >=3.10
  - numpy >=1.26
  - scipy >=1.11
  - polars >=1.2
source:
  sha256: dee39ac6c73ec0a69057869c3e09ee414f019511b69328e6e923dd5d5c62a872
  url: https://pypi.org/packages/source/e/epirefine/epirefine-0.10.0.tar.gz
test:
  commands:
  - epirefine --help
  - epirefine run --help
  imports:
  - epirefine
