  - loguru >=0.5.3
  - pandas >=1.4.2
  - pyyaml >=6.0
source:
  sha256: fb3d6039b4c7a058afd541283d77c947ba3ba891fef0d091b2f0ae608babc562
  url: https://pypi.io/packages/source/d/dnaapler/dnaapler-1.4.0.tar.gz
test:
