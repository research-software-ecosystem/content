about:
  home: https://github.com/NBISweden/vcf2cytosure
  license: MIT
  license_family: MIT
  summary: Convert VCF with structural variations to CytoSure format
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
package:
  name: vcf2cytosure
  version: 0.10.0
requirements:
  host:
  - pip
  - python
  - setuptools
  run:
  - cyvcf2
  - lxml
  - pandas
  - python
source:
  sha256: 68904421091f2544464f27c12706f05cc64d5b1f4c51886938434c0b76c920e5
  url: https://pypi.io/packages/source/v/vcf2cytosure/vcf2cytosure-0.10.0.tar.gz
test:
  commands:
  - vcf2cytosure --help
  imports:
  - tests
  - vcf2cytosure
  - vcf2cytosure.constants
