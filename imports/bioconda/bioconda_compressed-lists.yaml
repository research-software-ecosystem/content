about:
  home: https://github.com/biocpy/compressed-lists
  license: MIT
  license_file: LICENSE.txt
  summary: Memory-efficient container for list-like objects.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: compressed-lists
  version: 0.4.6
requirements:
  host:
  - python
  - setuptools >=46.1.0
  - setuptools-scm >=5
  - pip
  run:
  - python
  - numpy
  - biocutils >=0.3.3
  - biocframe >=0.7.2
source:
  sha256: e5adf479795566a1831c900458c707d5a648f5463a226cdc13c489594f3ad652
  url: https://pypi.org/packages/source/c/compressed_lists/compressed_lists-0.4.6.tar.gz
test:
  commands:
  - pip check
  imports:
  - compressed_lists
  requires:
  - pip
