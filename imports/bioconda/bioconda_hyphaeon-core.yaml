about:
  description: 'Aeon-Core provides shared model, dataset, inference, weights, stats,
    and IO

    infrastructure used by both HyphAeon (selection inference) and ChronAeon

    (molecular clock dating) packages.

    '
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Aeon-Core: Shared bioinformatics infrastructure for Aeon-family packages'
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - d-callan
package:
  name: hyphaeon-core
  version: 0.4.0
requirements:
  build:
  - null
  - null
  - null
  - make
  - cmake
  - pkg-config
  host:
  - python
  - pip
  - maturin >=1.5,<2
  run:
  - python >=3.8
  - pytorch >=2.0.0
  - biopython >=1.80
  - numpy >=1.22.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - psutil >=5.9.0
  - huggingface_hub >=0.20.0
  - safetensors >=0.4.0
source:
  sha256: 4379750ea6135000d3b031c1b6c3c5218b5af26bf9622c2b213bb933c6b74374
  url: https://github.com/veg/HyphAeon/archive/refs/tags/hyphaeon-core-v0.4.0.tar.gz
