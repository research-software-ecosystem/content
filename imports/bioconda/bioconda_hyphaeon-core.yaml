about:
  description: 'Aeon-Core provides shared model, dataset, inference, weights, stats,
    and IO

    infrastructure used by both HyphAeon (selection inference) and ChronAeon

    (molecular clock dating) packages.

    '
  dev_url: https://github.com/veg/HyphAeon
  doc_url: https://github.com/veg/HyphAeon#readme
  home: https://github.com/veg/HyphAeon
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Aeon-Core: Shared bioinformatics infrastructure for Aeon-family packages'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv
extra:
  recipe-maintainers:
  - d-callan
package:
  name: hyphaeon-core
  version: 0.1.0
requirements:
  host:
  - python >=3.8
  - pip
  - setuptools
  run:
  - python >=3.8
  - pytorch >=2.0.0
  - biopython >=1.80
  - numpy >=1.22.0
  - scipy >=1.9.0
  - pandas >=1.5.0
  - psutil >=5.9.0
  - huggingface_hub >=0.20.0
  - safetensors >=0.4.0
source:
  sha256: dc423df732b2636c158e3455a67ae098fe73fc6107aeb5882885dd6f6c2be6b4
  url: https://pypi.org/packages/source/h/hyphaeon-core/hyphaeon_core-0.1.0.tar.gz
test:
  imports:
  - aeon_core
