about:
  dev_url: https://github.com/yeeus/GCI
  doc_url: https://github.com/yeeus/GCI/blob/v1.1/README.md
  home: https://github.com/yeeus/GCI
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A program for assessing genome contiguity.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script:
  - mkdir -p ${PREFIX}/bin
  - sed -i.bak '1s|^|#!/usr/bin/env python\n\n|' GCI.py
  - chmod +x GCI.py
  - cp -f GCI.py ${PREFIX}/bin/GCI
package:
  name: gci
  version: '1.1'
requirements:
  run:
  - python >=3.10
  - pysam >=0.21.0
  - biopython
  - numpy
  - matplotlib-base
source:
  sha256: 372ccabe7b193fb1e86a0730196203d6975e8c8c4304b9aa63065f27537a416b
  url: https://github.com/yeeus/GCI/archive/refs/tags/v1.1.tar.gz
test:
  commands:
  - GCI --help
