about:
  dev_url: https://github.com/acidgenomics/py-pipette
  home: https://python.acidgenomics.com/pipette/
  license: Apache-2.0
  license_file: LICENSE
  summary: Unified import and export of data in Python.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: pipette
  version: 0.2.1
requirements:
  host:
  - python >=3.12
  - pip
  - uv-build >=0.11,<1
  run:
  - python >=3.12
  - numpy
  - pandas
source:
  sha256: f924eef0264190a4ecb0388998553d0c9087298b5f4d184a3fd2875b911b6c4c
  url: https://github.com/acidgenomics/py-pipette/archive/v0.2.1.tar.gz
test:
  imports:
  - pipette
