about:
  dev_url: https://github.com/acidgenomics/py-pipette
  home: https://python.acidgenomics.com/pipette/
  license: Apache-2.0
  license_file: LICENSE
  summary: Unified import and export of data in Python.
build:
  noarch: python
  number: 1
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: pipette
  version: 0.2.1
requirements:
  host:
  - python >=3.12
  - pip
  - uv-build >=0.11,<1
  run:
  - python >=3.12
  - numpy
  - pandas
source:
  sha256: c486926176c639815e2e79800134b3c3dc78b50deeaedfcf70d91a888a326432
  url: https://pypi.io/packages/source/a/acidgenomics-pipette/acidgenomics_pipette-0.2.1.tar.gz
test:
  imports:
  - pipette
