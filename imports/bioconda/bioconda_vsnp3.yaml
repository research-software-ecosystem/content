about:
  dev_url: https://github.com/USDA-VS/vsnp3
  home: https://github.com/USDA-VS/vsnp3
  license: GPL3
  license_file: LICENSE
  summary: Rapidly call, validate, and compare SNPs from FASTQ files in a timely manner
    utilizing large data sets.
build:
  noarch: generic
  number: 0
  run_exports:
  - null
package:
  name: vsnp3
  version: '3.36'
requirements:
  run:
  - python >=3.12, <3.14
  - bcftools
  - biopython >=1.84
  - bwa
  - minimap2 >=2.24
  - dask >=2024.6
  - freebayes >=1.3.5
  - vcflib =1.0.12
  - humanize >=3.14.0
  - numpy >=1.26.4, <3
  - pandas >=2.2.2, <3
  - openpyxl >=3.0.9
  - xlsxwriter >=3.0.2
  - parallel
  - pigz
  - regex >=2.5.110
  - samtools >=1.14
  - seqkit >=2.1.0
  - sourmash >=4.8.4
  - spades >=3.15.2, <4.2
  - py-cpuinfo
  - raxml >=8.2.12
  - plotly >=5.22, <7
  - pyyaml
  - jinja2
  - weasyprint >=66
  - matplotlib-base >=3.9, <4
  - scipy >=1.11, <2
  - seaborn >=0.13.2, <1
source:
  sha256: b4757cf716cbeb05700b2ce8841c27a2e6f45077422acc652652dd921649708e
  url: https://github.com/USDA-VS/vsnp3/archive/3.36.tar.gz
test:
  commands:
  - vsnp3_step1.py --help
  - vsnp3_step2.py --help
  - vsnp3_step1.py --version
  - vsnp3_step2.py --version
  - vsnp3_annotation.py --version
  - vsnp3_group_on_defining_snps.py --version
  - vsnp3_path_adder.py --version
  - vsnp3_version.py --check
