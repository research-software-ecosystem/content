about:
  description: "ScriptManager was built to be a lightweight and easy to use genomics\
    \ \nanalysis tool for novice bioinformaticians. It includes both a \ngraphical\
    \ interface for easy navigation of inputs and options while \nalso supporting\
    \ a command line interface for automation and integration \nwith workflow managers\
    \ like Galaxy. We describe here how a user \nunfamiliar with the command line\
    \ can leverage national supercomputing \nresources using a graphical desktop interface\
    \ like Open OnDemand to \nperform their analyses and generate publication quality\
    \ figures for \ntheir research. Widespread adoption of this tool in the genomics\
    \ \ncommunity would lower technical barriers to accessing supercomputing \nresources\
    \ and allow biochemists to prototype their own workflows that \ncan be integrated\
    \ into large scale production pipelines. Source code \nand precompiled binaries\
    \ available at \nhttps://github.com/CEGRcode/scriptmanager.\n"
  dev_url: https://github.com/CEGRcode/scriptmanager
  doc_source_url: https://github.com/CEGRcode/scriptmanager-docs
  doc_url: https://cegrcode.github.io/scriptmanager-docs
  home: https://github.com/CEGRcode/scriptmanager
  license: MIT
  license_family: MIT
  license_url: https://github.com/CEGRcode/scriptmanager/blob/master/LICENSE
  summary: genomics toolbox that supports both graphical and command-line execution
