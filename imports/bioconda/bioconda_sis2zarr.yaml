about:
  home: https://github.com/camlloyd/sis2zarr
  license: MIT OR Apache-2.0
  license_family: MIT
  license_file:
  - LICENSE-MIT
  - LICENSE-APACHE
  - THIRDPARTY.yml
  summary: Convert arivis SIS (.sis) files to OME-Zarr
build:
  number: 0
  run_exports:
  - null
  script:
  - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
