  - linux-aarch64
  - osx-arm64
  recipe-maintainers:
  - camlloyd
package:
  name: sis2zarr
  version: 0.1.2
requirements:
  build:
  - null
  - null
  - null
  - null
  - cargo-bundle-licenses
source:
  sha256: b28bddea23284309be45d05873c86f83624febe3488a157803ad03496b7ea15f
  url: https://github.com/camlloyd/sis2zarr/archive/refs/tags/v0.1.2.tar.gz
test:
  commands:
  - sis2zarr --help
