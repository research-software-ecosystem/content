about:
  home: https://github.com/MaartenLangen/metacontextify
  license: MIT
  license_file: LICENSE
  summary: Automated environmental annotation of marine metagenomic samples
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - MaartenLangen
package:
  name: metacontextify
  version: 0.2.0
requirements:
  host:
  - python >=3.8
  - setuptools >=45
  - wheel
  - setuptools-scm >=6.2
  - pip
  run:
  - python >=3.8
  - pandas >=1.3.0
  - requests >=2.25.0
  - urllib3 >=1.26.0
  - xarray >=0.20.0
  - copernicusmarine >=0.1.0
  - beautifulsoup4 >=4.9.0
  - appdirs >=1.4.4
  - duckdb
  - typer
  - netcdf4
source:
  sha256: 1c1426db033ecf74045005e65b3d221a4c14c902d1c11dd5b611587d80d86482
  url: https://pypi.org/packages/source/m/metacontextify/metacontextify-0.2.0.tar.gz
test:
  commands:
  - pip check
  - metacontextify --help
  imports:
  - metacontextify
  requires:
  - pip
