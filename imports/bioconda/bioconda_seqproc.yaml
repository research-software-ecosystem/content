about:
  dev_url: https://github.com/COMBINE-lab/seqproc
  doc_url: https://combine-lab.github.io/seqproc
  home: https://github.com/COMBINE-lab/seqproc
  license: BSD-3-Clause
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: A fast, programmable preprocessing engine for sequencing reads
build:
  number: 0
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-64
  - osx-arm64
  recipe-maintainers:
  - rob-p
package:
  name: seqproc
  version: 0.1.1
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  - pkg-config
  host:
  - xz
source:
  sha256: 538e746bc9f1882aff355ee1099d85e8a1b5c3aa9494d80c86c40c27147d956b
  url: https://github.com/COMBINE-lab/seqproc/archive/refs/tags/v0.1.1.tar.gz
test:
  commands:
  - seqproc --version
  - seqproc --version --verbose
  - 'if seqproc --version --verbose | grep -F "compiler CPU target: native"; then
    exit 1; fi'
  - 'seqproc --version --verbose | grep -F "SIMD backend: x86-sse2"'
  - 'seqproc --version --verbose | grep -F "SIMD backend: aarch64-neon"'
