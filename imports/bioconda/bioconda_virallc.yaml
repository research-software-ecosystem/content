about:
  doc_url: https://github.com/ChrispinChaguza/virallc/
  home: https://github.com/ChrispinChaguza/virallc/
  license: MIT
  license_file: LICENSE
  summary: 'ViralLC: A utility for defining and assigning viral lineages consistently'
build:
  entry_points:
  - virallc = virallc.__main__:main
  - alnPairDist = virallc.scripts.alnPairDist:main
  - alnSeqCov = virallc.scripts.alnSeqCov:main
  - virallcClusters = virallc.scripts.virallcClusters:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - chrispinchaguza
package:
  name: virallc
  version: 1.1.11
requirements:
  host:
  - python >=3.8
  - setuptools
  - pip
  run:
  - python >=3.8
  - biopython
  - networkx
  - python-build
  - pandas
  - mafft >=7.526
  - nextclade
  - blast
source:
  sha256: f70eccd71279643e7b14731255e86c652625ed24482bcc45183f83718539c236
  url: https://pypi.org/packages/source/v/virallc/virallc-1.1.11.tar.gz
test:
  commands:
  - virallc --help
  - alnPairDist --help
  - alnSeqCov --help
  - virallcClusters --help
  imports:
  - virallc
  requires:
  - pip
  - python
