about:
  home: https://github.com/vrmarcelino/CCMetagen
  license: GPL3
  license_family: GPL3
  license_file: LICENSE
  summary: 'CCMetagen: comprehensive and accurate identification of eukaryotes and
    prokaryotes in metagenomic data.'
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vvv'
extra:
  recipe-maintainers:
  - vrmarcelino
  - vinisalazar
package:
  name: ccmetagen
  version: 1.5.1
requirements:
  host:
  - pip
  - setuptools
  - python
  run:
  - python >=3.10
  - ete3
  - legacy-cgi
  - pandas
  - kma >=1.3
  - krona
source:
  sha256: e8cc42c291811dfa727e82f381220f4c1aed34b10ed547794bf9c4615b6638be
  url: https://github.com/vrmarcelino/CCMetagen/archive/v1.5.1.tar.gz
test:
  commands:
  - CCMetagen.py --help
