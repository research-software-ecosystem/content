about:
  description: "GPID prepares BLAST reference databases, calibrates alignment and\
    \ gene\nperformance thresholds, estimates confidence of identification, and \n\
    identifies samples from multiple single-sequence-per-gene FASTA files.\n"
  home: https://github.com/BenKuhnhaeuser/GPID/tags
  license: Apache-2.0
  license_file: LICENSE
  summary: GeneParliamentID pipeline for multi-gene species identification
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  notes: 'The gpid launcher runs the workflows installed under share/gpid.

    The runtime VERSION file is generated from the recipe''s package version.

    '
  recipe-maintainers:
  - BenKuhnhaeuser
package:
  name: gpid
  version: 1.2.0
requirements:
  build:
  - bash >=4.3
  - coreutils
  run:
  - bash >=4.3
  - blast >=2.16.0
  - coreutils
  - gawk
  - grep
  - sed
  - r-base >=4.3
  - r-dplyr >=1.1.0
  - r-ggplot2 >=3.4.0
  - r-ggpubr
  - r-ggtext
  - r-stringr
  - r-svglite
  - r-tidyr >=1.0.0
  - r-withr
source:
  sha256: f054c8fd6ae83c2d7bd0301b685e337deb4e7187b7f5e7488c5719b4322c6bf6
  url: https://github.com/BenKuhnhaeuser/GPID/archive/refs/tags/v1.2.0.tar.gz
test:
  commands:
  - gpid help
  - gpid reference -h
  - gpid identify -h
  - gpid calibrate -h
  - gpid calibrate prepare -h
  - gpid calibrate alignments -h
  - gpid calibrate genes -h
  - gpid calibrate parliament -h
  - gpid calibrate combine -h
  - gpid confidence -h
  - gpid confidence prepare -h
  - gpid confidence estimate -h
  - gpid confidence bins -h
  - test -f "${PREFIX}/share/gpid/VERSION"
  - test "$(cat "${PREFIX}/share/gpid/VERSION")" = "1.2.0"
  - 'gpid help | grep -F "GPID version: 1.2.0"'
  - test -f "${PREFIX}/share/gpid/CHANGELOG.md"
  - test -f "${PREFIX}/share/gpid/scripts/confidence.sh"
  - test -f "${PREFIX}/share/gpid/scripts/parliament.R"
  - test -f "${PREFIX}/share/gpid/scripts/gene_performance.awk"
  - test -f "${PREFIX}/share/gpid/scripts/filtering_thresholds.awk"
  - test -f "${PREFIX}/share/gpid/scripts/gene_performance.R"
  - test -f "${PREFIX}/share/gpid/scripts/species_groups.R"
  - test -f "${PREFIX}/share/gpid/scripts/calibration_parameters.R"
  - test -f "${PREFIX}/share/gpid/scripts/calibration_plots.R"
  - test -f "${PREFIX}/share/gpid/scripts/calibration_combine.R"
  - test -f "${PREFIX}/share/gpid/scripts/confidence_helpers.R"
  - blastn -version
  - makeblastdb -version
  - Rscript -e "packages <- c('dplyr', 'tidyr', 'ggplot2', 'ggpubr', 'ggtext', 'stringr',
    'svglite', 'withr'); missing <- packages[!vapply(packages, requireNamespace, logical(1),
    quietly = TRUE)]; stopifnot(length(missing) == 0)"
