about:
  dev_url: https://github.com/vagkaratzas/mgnifam
  home: https://github.com/vagkaratzas/mgnifam
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Iterative HMM-based protein family generation over very large sequence
    databases
build:
  entry_points:
  - mgnifam = mgnifam.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - vagkaratzas
package:
  name: mgnifam
  version: 4.1.0
requirements:
  host:
  - python >=3.13
  - hatchling
  - pip
  run:
  - python >=3.13
  - numpy >=2.5.1,<3
  - pyfamsa >=0.7.0,<0.8
  - pyhmmer >=0.12.1,<0.13
  - pytrimal >=0.8.5,<0.9
source:
  sha256: d4b54025c687167951f9e4465d1b592198c9379f0a0cbd0e2988f8cbdc4d703e
  url: https://pypi.org/packages/source/m/mgnifam/mgnifam-4.1.0.tar.gz
test:
  commands:
  - mgnifam --version
  - mgnifam generate_families --help
  imports:
  - mgnifam
