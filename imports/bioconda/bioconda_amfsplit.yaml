about:
  dev_url: https://github.com/ayobi/amfsplit
  home: https://github.com/ayobi/amfsplit
  license: MIT
  license_family: MIT
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  - crates/amfsplit-edlib/vendor/edlib/LICENSE
  summary: Name long-read AMF rDNA sequences across MaarjAM VT, UNITE SH and LSU species
    clades, with measured novelty
build:
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - ayobi
package:
  name: amfsplit
  version: 0.1.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  run:
  - blast ==2.17.0
  - mafft ==7.526
  - epa-ng ==0.3.8
  - itsxrust ==0.3.0
  - vsearch ==2.32.0
source:
  sha256: e7c54d69231e1c2af4c171ba582e61c35c0a33c4fb825edf50ac13779dc92c68
  url: https://github.com/ayobi/amfsplit/archive/refs/tags/v0.1.0.tar.gz
test:
  commands:
  - amfsplit --version
  - amfsplit name --help
  - test -d "${PREFIX}/share/amfsplit/naming/inputs/benchmark"
  - test -f "${PREFIX}/share/amfsplit/panels/amf_legacy_windows.tsv"
  - printf '>w1\nACGTTGCATGCCTAGGCTAACGTTAGCCGATCGATTACGGCATCGATCGGATCGTAGCTAGCTAGGCTTACGATCGG\n'
    > w.fa && amfsplit validate -w w.fa -r w.fa -o smoke --threads 1 && test -s smoke.hits.tsv
