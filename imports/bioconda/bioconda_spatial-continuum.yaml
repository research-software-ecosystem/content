about:
  description: A zero-dependency biophysical transport framework and bedside clinical
    decision engine solving steady-state reaction-diffusion equations across perivascular
    cords and avascular nests, evaluating pharmacological sanctuaries, and computing
    the Composite Resistance Index (CRI) in EGFR-mutant lung adenocarcinoma.
  dev_url: https://github.com/Lukecele/spatial-continuum-oncology
  home: https://github.com/Lukecele/spatial-continuum-oncology
  license: MIT
  license_family: MIT
  license_file: LICENSE-MIT
  summary: Universal biophysical reaction-diffusion transport framework and Bedside
    Composite Resistance Index (CRI) for NSCLC.
build:
  entry_points:
  - cri-calc = spatial_continuum.cri_calc:main
  - spatial-continuum-audit = spatial_continuum.audit:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-build-isolation --no-deps --no-cache-dir -vvv'
extra:
  identifiers:
  - doi:10.21203/rs.3.rs-11530312/v1
  - doi:10.5281/zenodo.23748047
  recipe-maintainers:
  - Lukecele
package:
  name: spatial-continuum
  version: 1.0.3
requirements:
  host:
  - python >=3.8
  - setuptools >=61.0
  - pip
  run:
  - python >=3.8
source:
  sha256: 512787cf134d31d6530422358d82cbd76b4aee8789ba91765c7002b8a317e196
  url: https://github.com/Lukecele/spatial-continuum-oncology/archive/refs/tags/v1.0.3.tar.gz
test:
  commands:
  - cri-calc --help
  - spatial-continuum-audit --help
  imports:
  - spatial_continuum
