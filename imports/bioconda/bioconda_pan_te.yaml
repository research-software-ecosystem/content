about:
  description: 'Pan_TE combines three de novo TE-detection tracks (Look4LTRs for LTR
    retrotransposons,

    mdl-repeat for broad-spectrum MDL repeat discovery, and TE-looker/dtr for divergent

    ''twilight-zone'' TEs), deduplicates, and classifies via RepeatClassifier + ClassifyTE.

    After install, run `pan_te-setup-data` to fetch the Dfam libraries and ClassifyTE
    models

    (not redistributable via conda).

    '
  home: https://github.com/unavailable-2374/Pan_TE
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: pan_te/LICENSE
  summary: Pan-genome transposable-element annotation pipeline (LTR + mdl-repeat +
    TE-looker).
build:
  noarch: generic
  number: 0
  run_exports:
  - null
extra:
  recipe-maintainers:
  - unavailable-2374
package:
  name: pan_te
  version: 1.2.0
requirements:
  run:
  - python >=3.10
  - perl
  - biopython
  - numpy
  - scipy
  - psutil
  - gdown
  - look4ltrs
  - mdl-repeat
  - te-looker
  - fastga
  - samtools
  - bedtools
  - cd-hit
  - mafft
  - abpoa
  - spoa
  - blast
  - rmblast
  - repeatmasker
  - repeatmodeler
  - openjdk
  - trf
  - hmmer
  - sourmash
  - iqtree
  - barrnap
  - tesorter
  - perl-parallel-forkmanager
  - perl-log-log4perl
source:
- folder: pan_te
  sha256: 661a7655ac4b5b00f6855f90e1e67eef5d88c80f4d0ea6eed1524c09e629ab71
  url: https://github.com/unavailable-2374/Pan_TE/archive/refs/tags/v1.2.0.tar.gz
test:
  commands:
  - Pan_TE --help 2>&1 | head -1
  - pan_te-setup-data --help 2>&1 | head -1
  - command -v dtr
  - command -v look4ltrs
  - command -v mdl-repeat
  - test -s "$PREFIX/share/pan_te/docx/PAN_TE_METHODS_ZH.docx"
  - test -s "$PREFIX/share/pan_te/docx/PAN_TE_METHODS_ZH.md"
