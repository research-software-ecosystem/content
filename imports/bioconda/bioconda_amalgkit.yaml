about:
  home: https://github.com/kfuku52/amalgkit
  license: MIT
  license_file: LICENSE
  summary: Tools for transcriptome amalgamation
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  notes: "Optional runtime dependencies:\n  - inmoose: required for `amalgkit finalize\
    \ --batch_effect_alg combatseq`\n  - oarfish: required for `amalgkit quant --quant_backend\
    \ oarfish`\n  - mmseqs2: required for `amalgkit getfastq --rrna_filter yes` or\
    \ `--contam_filter yes`\n  - busco: required for `amalgkit busco --tool busco`\n\
    \  - compleasm: required for `amalgkit busco --tool compleasm`, or selected `--tool\
    \ auto`\n"
  recipe-maintainers:
  - kfuku52
package:
  name: amalgkit
  version: 0.16.37
requirements:
  host:
  - python 3.11
  - pip
  - setuptools >=77.0.3
  - wheel
  run:
  - python >=3.11
  - biopython >=1.81
  - defusedxml >=0.7.1
  - matplotlib-base >=3.7.5
  - numpy >=1.24.4
  - pandas >=2.0.3
  - scikit-learn >=1.3.2
  - scipy >=1.10.1
  - statsmodels >=0.14
  - seqkit
  - sra-tools >=3
  - fastp
  - kallisto
source:
  sha256: d1efb7af4cead73a6e526c5dff537fab2df4cbcea2c735d3ecaacb92795ecccc
  url: https://github.com/kfuku52/amalgkit/archive/refs/tags/v0.16.37.tar.gz
test:
  commands:
  - amalgkit --version
  - amalgkit --help
  - amalgkit help finalize
  - amalgkit dataset --list
  imports:
  - amalgkit
