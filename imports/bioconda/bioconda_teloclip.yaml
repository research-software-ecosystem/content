about:
  dev_url: https://github.com/Adamtaranto/teloclip
  doc_url: https://github.com/Adamtaranto/teloclip/blob/0.4.0/README.md
  home: https://adamtaranto.github.io/teloclip
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: A tool for the recovery of unassembled telomeres from soft-clipped read
    alignments.
build:
  entry_points:
  - teloclip=teloclip.cli:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
extra:
  recipe-maintainers:
  - Adamtaranto
package:
  name: teloclip
  version: 0.4.0
requirements:
  host:
  - python >=3.8
  - pip
  - hatchling
  - hatch-vcs
  run:
  - python >=3.8
  - biopython
  - click
  - pyfaidx
  - pysam
  - rich
source:
  sha256: a1ca9dee7d8794dca717400d55e7ddab958417ecd727ce4ffb3086ea83075789
  url: https://pypi.io/packages/source/t/teloclip/teloclip-0.4.0.tar.gz
test:
  commands:
  - teloclip --version | grep 0.4.0
  - teloclip --help
  - teloclip filter --help
  - teloclip extract --help
  - teloclip extend --help
  imports:
  - teloclip
