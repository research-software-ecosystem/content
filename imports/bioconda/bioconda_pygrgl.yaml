about:
  dev_url: https://github.com/aprilweilab/grgl
  doc_url: https://grgl.readthedocs.io/en/stable/
  home: https://aprilweilab.github.io/
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: Genotype Representation Graph Library for efficient storage/use of huge
    genetic datasets
build:
  entry_points:
  - grg=pygrgl.cli:main
  number: 0
  run_exports:
  - null
  script: ' -m pip install --no-deps --no-build-isolation . -vv'
extra:
  recipe-maintainers:
  - dcdehaas
package:
  name: pygrgl
  version: '2.10'
requirements:
  build:
  - null
  - null
  - cmake
  - make
  host:
  - python
  - zlib
  - pip
  - tqdm
  - setuptools
  run:
  - python
  - tqdm
source:
  sha256: 61c37909b241d42ccf16ea8dff1e7f619080cd0a3751871d964b4c112e486ed4
  url: https://pypi.io/packages/source/p/pygrgl/pygrgl-2.10.tar.gz
test:
  commands:
  - grg --help
  imports:
  - pygrgl
