  - test -f "$PREFIX/lib/dotnet/tools/PeptideSpectrumMatching/ProteomIQon.PeptideSpectrumMatching.dll"
  - bash -n "$PREFIX/bin/proteomiqon-peptidespectrummatching"
  - grep -q "PeptideSpectrumMatching/ProteomIQon.PeptideSpectrumMatching.dll" "$PREFIX/bin/proteomiqon-peptidespectrummatching"
