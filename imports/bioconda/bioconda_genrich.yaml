about:
  dev_url: https://github.com/jsh58/Genrich
  doc_url: https://github.com/jsh58/Genrich/blob/v0.6.2/README.md
  home: https://github.com/jsh58/Genrich
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Detecting sites of genomic enrichment.
build:
  number: 1
  run_exports:
  - null
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - usegalaxy-eu:genrich
package:
  name: genrich
  version: 0.6.2
requirements:
  build:
  - make
  - null
  - null
  host:
  - zlib
source:
  sha256: f152e684570e3af0c84dc35b1483ad70bce8b82246d5cefd7abcf449e0cfa5fa
  url: https://github.com/jsh58/Genrich/archive/v0.6.2.tar.gz
test:
  commands:
  - which Genrich
  - Genrich -V 2>&1 | grep 'John M. Gaspar'
  - Genrich -V 2>&1 | grep '0.6.2'
  - Genrich -t in.sam -o out.np -L -1 2>&1 | grep 'Genome length must be a positive
    int'
  - Genrich -t in.sam -o out.np -L 0 2>&1 | grep 'cannot open file for reading'
