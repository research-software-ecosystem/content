about:
  doc_url: https://ftp.ncbi.nlm.nih.gov/asn1-converters/by_program/table2asn/DOCUMENTATION/table2asn_readme.txt
  home: https://www.ncbi.nlm.nih.gov/genbank/table2asn
  license: Public Domain
  summary: table2asn is a command-line program that creates sequence records for submission
    to GenBank - replaces tbl2asn.
build:
  number: 0
  run_exports:
  - null
  skip: true
extra:
  additional-platforms:
  - osx-arm64
  notes: The Linux binary requires glibc >= 2.28 at runtime.
  skip-lints:
  - should_be_noarch_generic
  - should_not_be_noarch_source
package:
  name: table2asn
  version: 1.29.324
requirements:
  host:
  - libsqlite
source:
- sha256: 348b9d5f1b05065f4e5e61b6c2350e5ff044de2d6dc14765be6ac02c00e59341
  url: https://ftp.ncbi.nlm.nih.gov/asn1-converters/versions/2025-09-16/by_program/table2asn/mac.table2asn.gz
- sha256: 785bed9880856b208ed84d9765ca094b7c7d12d2225781c2a1854b650d3984bf
  url: https://ftp.ncbi.nlm.nih.gov/asn1-converters/versions/2025-09-16/by_program/table2asn/linux64.table2asn.gz
test:
  commands:
  - test -x "${PREFIX}/bin/table2asn"
  - table2asn -help
