about:
  description: 'GenAIRR simulates immunoglobulin and T-cell receptor rearrangements
    and writes them as

    AIRR records, with the generating alleles, trimming, N regions and somatic hypermutations

    recorded per base. Reference data for human, mouse, rat, rabbit and rhesus IG
    and TR loci

    ships with the package, and the simulation kernel is a Rust extension module.

    '
  dev_url: https://github.com/MuteJester/GenAIRR
  doc_url: https://mutejester.github.io/GenAIRR/
  home: https://github.com/MuteJester/GenAIRR
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
  - LICENSE
  - THIRDPARTY.yml
  summary: Simulation of adaptive immune receptor sequences with ground-truth annotations
build:
  number: 0
  run_exports:
  - null
  script:
  - cd engine_rs
  - cargo-bundle-licenses --format yaml --output $SRC_DIR/THIRDPARTY.yml
  - cd $SRC_DIR
  - -m pip install . -vv --no-deps --no-build-isolation --no-cache-dir
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
  identifiers:
  - doi:10.1093/bib/bbae556
  recipe-maintainers:
  - MuteJester
package:
  name: genairr
  version: 2.4.0
requirements:
  build:
  - null
  - null
  - null
  - cargo-bundle-licenses
  host:
  - python
  - pip
  - maturin >=1.5,<2.0
  run:
  - python
  - numpy >=1.24
  - scipy >=1.10
source:
  sha256: 263de7fffebc2102023f3b2909c623ccdcbdd7fadcfbef19c0a72b2212f91b2e
  url: https://pypi.org/packages/source/g/genairr/genairr-2.4.0.tar.gz
test:
  commands:
  - python -c "import GenAIRR.data as d; assert type(d.HUMAN_IGH_OGRDB).__name__ ==
    'DataConfig'"
  - python -c "import GenAIRR as ga; r = ga.Experiment.on('human_igh').recombine().run_records(n=5,
    seed=42); assert len(r) == 5 and r[0]['locus'] == 'IGH'"
  imports:
  - GenAIRR
  - GenAIRR.data
