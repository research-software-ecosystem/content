about:
  description: "A Python plotting tool for Oxford Nanopore variation data.\nOne input\
    \ in, one self-contained HTML report out. molamola\npicks the visualiser from\
    \ its input:\n\n* VCF with ``##INFO=<ID=SVTYPE,...>``: an SV / cytogenetics\n\
    \  report (Sniffles2 / cuteSV / SVIM / pbsv / NanoVar) -- a\n  circos of rearrangements\
    \ and SV density, and a\n  derivative-chromosome panel with breakpoint genes and\n\
    \  fusions for each candidate balanced rearrangement.\n* Mosdepth ``regions.bed.gz``\
    \ (via ``--mosdepth``): a\n  karyotype coverage report -- genome-wide log2 relative\n\
    \  depth, with an optional BAF panel beneath when paired with\n  a small-variant\
    \ VCF, haplotype-resolved when that VCF is\n  phased.\n"
  dev_url: https://github.com/martinandclaude/molamola
  doc_url: https://martinandclaude.github.io/molamola/
  home: https://github.com/martinandclaude/molamola
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Plot Oxford Nanopore variation as self-contained HTML reports.
build:
  entry_points:
  - molamola = molamola:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - martinandclaude
package:
  name: molamola
  version: 0.7.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  - wheel
  run:
  - python >=3.10
  - matplotlib-base >=3.6
  - numpy >=1.23
  - pandas >=1.5
  - biopython >=1.80
  - pycirclize >=1.10
source:
  sha256: 110042cfd67fa5d8ede5f315a6b295888de522d40c9cbe43d815db6cad0517ed
  url: https://pypi.io/packages/source/m/molamola/molamola-0.7.0.tar.gz
test:
  commands:
  - molamola --help
  imports:
  - molamola
  requires:
  - pip
  source_files:
  - tests/
