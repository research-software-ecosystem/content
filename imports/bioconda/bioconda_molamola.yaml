about:
  description: "A Python plotting tool for Oxford Nanopore variation data.\nOne input\
    \ in, one self-contained HTML report out. molamola\npicks the visualiser from\
    \ its input:\n\n* VCF with ``##INFO=<ID=SVTYPE,...>``: a circos + linear\n  cytoband\
    \ SV report (Sniffles2 / cuteSV / SVIM / pbsv /\n  NanoVar).\n* Mosdepth ``regions.bed.gz``\
    \ (via ``--mosdepth``): a\n  karyotype coverage report -- genome-wide log2 relative\n\
    \  depth, with an optional BAF panel beneath when paired with\n  a small-variant\
    \ VCF, haplotype-resolved when that VCF is\n  phased.\n"
  dev_url: https://github.com/martinandclaude/molamola
  doc_url: https://martinandclaude.github.io/molamola/
  home: https://github.com/martinandclaude/molamola
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Plot Oxford Nanopore variation as self-contained HTML reports.
build:
  entry_points:
  - molamola = molamola:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - martinandclaude
package:
  name: molamola
  version: 0.6.0
requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=68
  - wheel
  run:
  - python >=3.10
  - matplotlib-base >=3.6
  - numpy >=1.23
  - pandas >=1.5
  - biopython >=1.80
  - pycirclize >=1.10
source:
  sha256: d67fe27266cfd3c3914488d47078f04582fa61239027fa308fb4b41ecb4a8d06
  url: https://pypi.io/packages/source/m/molamola/molamola-0.6.0.tar.gz
test:
  commands:
  - molamola --help
  imports:
  - molamola
  requires:
  - pip
  source_files:
  - tests/
